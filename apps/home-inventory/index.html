<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Inventory — photograph it before you need it</title>
<meta name="description" content="Room-by-room home inventory for insurance: photos, serials, values, and a clean PDF report. Free, no account, everything stays on your device.">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1c2733; --muted:#5b6b7b; --line:#e3e8ee;
  --accent:#0f766e; --accent-ink:#ffffff; --pos:#047857; --neg:#b91c1c;
  --chip:#eef2f6; --chip-ink:#2c3a49; --focus:#5eead4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1419; --card:#1a2129; --ink:#e6edf3; --muted:#8b98a5; --line:#2c3641;
    --accent:#2dd4bf; --accent-ink:#042f2e; --pos:#34d399; --neg:#f87171;
    --chip:#242e38; --chip-ink:#cdd6de; --focus:#0f766e;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45; padding-bottom:40px;
}
.wrap{max-width:720px; margin:0 auto; padding:0 14px}
header.app{display:flex; align-items:center; gap:10px; padding:14px 0 10px}
header.app img{width:34px; height:34px; border-radius:8px}
header.app h1{font-size:1.15rem; margin:0; letter-spacing:-.01em}
header.app h1 a{color:inherit; text-decoration:none}
header.app .spacer{flex:1}
a.tipbtn{
  text-decoration:none; font-size:.85rem; color:var(--accent);
  border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--card);
}
section.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
section.card h2{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px}
.hero{text-align:center; padding:30px 8px 10px}
.hero h2{font-size:1.5rem; margin:0 0 6px; letter-spacing:-.02em}
.hero p{color:var(--muted); margin:0 0 18px}
label.f{display:block; font-size:.85rem; color:var(--muted); margin-bottom:10px}
label.f span{display:block; margin-bottom:4px}
input[type=text],input[type=search],input[type=date],input[type=number],textarea,select{
  width:100%; padding:11px 12px; font-size:1rem; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:10px; font-family:inherit;
}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
.row{display:flex; gap:8px}
.row>*{flex:1; min-width:0}
button{font-family:inherit}
.btn{padding:11px 14px; font-size:.95rem; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.small{padding:7px 10px; font-size:.85rem}
.btn.danger{color:var(--neg)}
.btn.big{padding:20px; font-size:1.05rem; width:100%}
nav.tabs{display:flex; gap:5px; margin:0 0 12px; overflow-x:auto}
nav.tabs button{
  flex:1 0 auto; padding:9px 14px; font-size:.9rem; border:1px solid var(--line); background:var(--card);
  color:var(--muted); border-radius:10px; cursor:pointer; white-space:nowrap;
}
nav.tabs button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px;
  background:var(--chip); color:var(--chip-ink); border:1px solid var(--line); font-size:.88rem; cursor:pointer;
}
.chip.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
ul.plain{list-style:none; margin:0; padding:0}
ul.plain li{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.93rem}
ul.plain li:last-child{border-bottom:0}
ul.plain .grow{flex:1; min-width:0; overflow-wrap:anywhere}
.thumb{width:52px; height:52px; border-radius:8px; object-fit:cover; background:var(--chip); flex:0 0 auto}
.thumb.empty{display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.65rem}
.sub{color:var(--muted); font-size:.82rem}
.hint{font-size:.8rem; color:var(--muted); margin-top:8px}
.warnbanner{
  border:1px solid var(--neg); color:var(--neg); border-radius:12px; padding:10px 14px;
  margin-bottom:12px; font-size:.88rem; background:var(--card);
}
.capturephoto{
  width:100%; max-height:260px; object-fit:contain; border-radius:10px; background:var(--chip);
  display:block; margin-bottom:10px;
}
.statline{display:flex; justify-content:space-between; font-size:.9rem; padding:3px 0}
.statline b{font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); padding:18px; max-width:min(92vw,460px); width:100%; max-height:90vh; overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px; font-size:1.05rem}
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:24px;
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:.87rem;
  opacity:0; transition:opacity .25s; pointer-events:none; max-width:88vw; text-align:center; z-index:50;
}
#toast.show{opacity:1}
footer.colophon{color:var(--muted); font-size:.78rem; text-align:center; padding:20px 0 8px}
.hidden{display:none !important}
.exportcard{display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding:12px 0}
.exportcard:last-child{border-bottom:0}
.exportcard .grow{flex:1}
.exportcard .grow b{display:block; margin-bottom:2px}
.exportcard .grow span{font-size:.83rem; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <img src="icon.svg" alt="">
    <h1><a href="#/" id="brandLink">Home Inventory</a></h1>
    <span class="spacer"></span>
    <a id="tipLink" class="tipbtn hidden" target="_blank" rel="noopener">♥ Tip jar</a>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer class="colophon">
    Nothing leaves your device — which means the backup is your job. Export often.<br>
    <span id="orgLine">A free tool by Sky Wolf Studios.</span>
  </footer>
</div>

<dialog id="itemDlg">
  <h3>Edit item</h3>
  <img id="iPhoto" class="capturephoto hidden" alt="Item photo">
  <div class="row" style="margin-bottom:10px">
    <button class="btn small" id="iRephoto" type="button">Replace photo</button>
    <button class="btn small" id="iReceipt" type="button">Add receipt photo</button>
  </div>
  <img id="iReceiptImg" class="capturephoto hidden" alt="Receipt photo">
  <label class="f"><span>Name</span><input type="text" id="iName" maxlength="80"></label>
  <div class="row">
    <label class="f"><span>Room</span><select id="iRoom"></select></label>
    <label class="f"><span>Value ($)</span><input type="text" id="iValue" inputmode="decimal" placeholder="0"></label>
  </div>
  <div class="row">
    <label class="f"><span>Serial number</span><input type="text" id="iSerial" maxlength="60"></label>
    <label class="f"><span>Purchased</span><input type="date" id="iDate"></label>
  </div>
  <label class="f"><span>Notes</span><input type="text" id="iNotes" maxlength="300" placeholder="Condition, where bought…"></label>
  <div class="row">
    <button class="btn danger" id="iDelete" type="button">Delete</button>
    <button class="btn" id="iCancel" type="button">Cancel</button>
    <button class="btn primary" id="iSave" type="button">Save</button>
  </div>
</dialog>

<input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor-pdf-lib.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
