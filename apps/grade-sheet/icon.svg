  <rect x="96" y="88" width="320" height="336" rx="20" fill="#fdf4e6"/>
  <rect x="96" y="88" width="46" height="336" rx="20" fill="#1b556a"/>
  <circle cx="119" cy="150" r="9" fill="#fdf4e6" opacity=".55"/>
  <circle cx="119" cy="256" r="9" fill="#fdf4e6" opacity=".55"/>
  <circle cx="119" cy="362" r="9" fill="#fdf4e6" opacity=".55"/>
  <rect x="176" y="150" width="150" height="16" rx="8" fill="#2c728c" opacity=".38"/>
  <rect x="176" y="212" width="176" height="16" rx="8" fill="#2c728c" opacity=".28"/>
  <rect x="176" y="274" width="132" height="16" rx="8" fill="#2c728c" opacity=".28"/>
  <rect x="176" y="336" width="160" height="16" rx="8" fill="#2c728c" opacity=".28"/>
  <path d="M352 300l30 30 56-64" fill="none" stroke="#2c728c" stroke-width="34"
