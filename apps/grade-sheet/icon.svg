<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A mark book: ruled cream paper, a bound edge, and one column of marks.
       The tick is the act the whole app is built around, so it sits where the
       eye lands rather than being decoration in a corner. -->
