<script>
/* =====================================================================
   Specials Planner — single-file specials lesson planner.
   Vanilla JS, no build step. State lives in localStorage key "palette2".
   Handoff notes for Claude Code live in HANDOFF.md next to this file.
   ===================================================================== */

/* ------------------ config seams (fill these to enable) ------------- */
const CLIENT_ID = "";   // Google OAuth Web Client ID → enables Drive save/load (scope: drive.file). Empty = feature hidden.
const TIP_URL   = "https://buy.stripe.com/7sY7sM6PD91l3fn45P7EQ0l";   // Stripe Payment Link URL → shows a quiet tip-jar link in Setup. Empty = hidden.

/* ------------------ shared runtime --------------------------------- */
/* sws-ui.js (loaded in <head>) supplies SWS.toast / SWS.undo / SWS.saved and is
   in the service worker's shell list, so in a real browser it is always there.
   This fallback exists so the app degrades to "still works, still announces"
   rather than throwing if it is ever missing — a headless test rig, or a first
   paint where the file 404s. The fallback keeps the undo callback reachable
   instead of silently dropping it. */
const SWS = (window.SWS && window.SWS.toast) ? window.SWS : {
  toast(msg,opts){ announce(msg); if(opts&&opts.action) SWS._undo=opts.action.onAction; },
  undo(msg,fn){ SWS._undo=fn; announce(msg); },
  saved(o){ const el=document.getElementById('saved'); if(el){ el.textContent=(o&&o.text)||'Saved'; el.classList.add('show'); } }
};

/* ------------------ storage shim ------------------------------------
   Two rules learned the hard way:
   1. A write is only a save if you can read it back. A school Chromebook with
      storage restrictions throws QuotaExceededError, and the old shim swallowed
      it into an in-memory object that get() could never return — so the app
      said "Saved", held nothing, and dropped the whole year on the next load.
      set() now verifies and reports, and get() prefers the in-memory copy so a
      session keeps working after a failed write instead of reading back stale.
   2. Nothing here ever leaves the device.                                   */
const KEY='palette2';
const store={
  ok:(()=>{try{localStorage.setItem('__pt','1');localStorage.removeItem('__pt');return true}catch(e){return false}})(),
  mem:{},
  get(k){ if(k in this.mem) return this.mem[k]; if(this.ok){try{return localStorage.getItem(k)}catch(e){}} return null },
  set(k,v){
    if(this.ok){
      try{
        localStorage.setItem(k,v);
        if(localStorage.getItem(k)===v){ delete this.mem[k]; return true; }
      }catch(e){}
    }
    this.mem[k]=v;            // keep the session usable, but do not claim a save
    return false;
  },
  del(k){ if(this.ok){try{localStorage.removeItem(k)}catch(e){}} delete this.mem[k] }
};

/* ------------------ state ------------------------------------------- */
let S=null;           // null → welcome screen
let YEAR=[];          // [{monday, days:[{iso,dow,letter,special}]}]
let curView='week';
let curWeek=0;
let saveT=null;

function defaultConfig(){
  const y=new Date().getFullYear();
  const aug=new Date(y, 7, 1);              // Aug 1 this year
  const start=(new Date()>aug)? aug : new Date(y,7,1);
  return {
    yearStart:`${start.getFullYear()}-08-24`,
    yearEnd:`${start.getFullYear()+1}-05-28`,
    workDays:[1,2,3,4,5],
    periods:6, lunchAfter:2,
    letters:['A','B','C'],
    periodNames:[],
    teacher:'', driveFileId:'', printMode:'compact'
  };
}
const MAX_LETTERS=12, MAX_LETTER_LEN=4, MAX_PERIODS=10, MAX_WEEKS=300, MAX_PERIOD_NAME=24;
/* A hand-edited or legacy backup is the one file a teacher carries between
   devices, so every shape that arrives through it is coerced rather than
   trusted. `cells:[]` used to survive as an array and then serialise back as
   "[]" — a whole year of lessons discarded on the next write. */
const plainObj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
function normalizeConfig(c){
  const d=defaultConfig();
  for(const k in d) if(c[k]===undefined) c[k]=d[k];
  const per=Math.round(Number(c.periods));
  c.periods=Number.isFinite(per)?Math.max(1,Math.min(MAX_PERIODS,per)):6;
  /* `+c.lunchAfter??2` bound the unary plus tighter than ??, so a non-numeric
     value became NaN and survived both clamps — the lunch column vanished with
     no error at all. */
  const la=Math.round(Number(c.lunchAfter));
  c.lunchAfter=Number.isFinite(la)?Math.max(0,Math.min(c.periods,la)):Math.min(2,c.periods);
  if(!Array.isArray(c.letters)) c.letters=['A','B','C'];
  c.letters=c.letters.map(x=>String(x).trim().slice(0,MAX_LETTER_LEN)).filter(Boolean).slice(0,MAX_LETTERS);
  if(!c.letters.length) c.letters=['A'];
  /* Jessie, 2026-08-18: "many people don't call them periods" — each column can
     carry its own name. Position i names period i+1; '' means "use the default". */
  if(!Array.isArray(c.periodNames)) c.periodNames=[];
  c.periodNames=c.periodNames.slice(0,MAX_PERIODS).map(x=>String(x??'').replace(/\s+/g,' ').trim().slice(0,MAX_PERIOD_NAME));
  if(!Array.isArray(c.workDays)) c.workDays=[1,2,3,4,5];
  /* workDays holding 'Mon' instead of 1 used to dead-end the whole app on
     "No weeks yet — check your year dates", which was the wrong diagnosis. */
  c.workDays=[...new Set(c.workDays.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))];
  if(!c.workDays.length) c.workDays=[1,2,3,4,5];
  c.teacher=String(c.teacher??'').slice(0,80);
  return c;
}
function migrate(s){
  if(!s||typeof s!=='object'||!s.config||typeof s.config!=='object'||Array.isArray(s.config)) return null;
  s.cells=plainObj(s.cells); s.notes=plainObj(s.notes); s.special=plainObj(s.special);
  normalizeConfig(s.config);
  migrateCellKeys(s);
  return s;
}

/* ------------------ cycle-position keys ------------------------------
   THE central correction in this app. Lessons used to be stored against the
   calendar date ("2026-09-17|3"). Cancel one Wednesday and the rotation letters
   all slide forward correctly while the lessons stay nailed to their dates —
   Thursday becomes letter C and still holds the lesson written for D, for the
   rest of the year. The label was right and the plan underneath it was wrong.

   Lessons are now keyed to the position in the teaching cycle instead:
     c<n>|<period>   the nth teaching day of the year (the letter is derived
                     from n, so plan and letter can never drift apart)
     d<iso>|<period> a no-class day, which has no cycle position but keeps its
                     boxes ("sub covering", "field trip packing list")
   Marking a day "no school" removes it from the sequence, so every later day
   inherits the position — and therefore the plan — that used to belong to the
   day before it. That IS the bump. Notes stay keyed to the date, because
   "picture day" belongs to Thursday, not to cycle day C.                    */
function migrateCellKeys(s){
  const legacy=/^(\d{4}-\d{2}-\d{2})\|(.+)$/;
  if(!Object.keys(s.cells).some(k=>legacy.test(k))) return;
  const idxByIso=isoIndexMap(s.config,s.special);
  const out={};
  for(const k of Object.keys(s.cells)){
    const m=legacy.exec(k);
    if(!m){ out[k]=s.cells[k]; continue; }
    const iso=m[1], p=m[2], idx=idxByIso[iso];
    out[(idx===undefined||s.special[iso])?`d${iso}|${p}`:`c${idx}|${p}`]=s.cells[k];
  }
  s.cells=out;
}
function isoIndexMap(config,special){
  const map={};
  for(const w of computeYear(config,special||{})) for(const d of w.days) if(d.idx!=null) map[d.iso]=d.idx;
  return map;
}
function loadState(){ try{const r=store.get(KEY); S=r?migrate(JSON.parse(r)):null}catch(e){S=null} }

/* Saving, said honestly.
   - persist() writes, verifies, and only then shows the flag.
   - the flag carries a clock time and stays put, because "did it save?" is the
     one question a local-first planner has to be able to answer at a glance.
   - it is a role=status carrying real text, so a screen reader hears it too;
     the time only changes once a minute, so typing does not become chatter. */
let saveFailed=false;
function persist(quiet){
  const wrote=store.set(KEY,JSON.stringify(S));
  saveFailed=!wrote;
  showSaveAlert(!wrote);
  if(wrote&&!quiet) flashSaved();
  return wrote;
}
function queueSave(){ clearTimeout(saveT); saveT=setTimeout(()=>{saveT=null;persist();},400); }
/* The last 400ms of typing used to die with the tab: no pagehide, no
   visibilitychange, no beforeunload anywhere. Type a line, lock the phone,
   lose the line. */
function flushSave(){ if(saveT){ clearTimeout(saveT); saveT=null; persist(true); } }
function hhmm(d){ return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
function flashSaved(){ SWS.saved({text:`Saved ${hhmm(new Date())}`,ms:36e5}); }
function showSaveAlert(on){
  const wrap=document.getElementById('alert-wrap');
  if(!wrap) return;
  if(!on){ wrap.hidden=true; return; }
  if(!wrap.hidden) return;                       // already shouting; do not re-announce per keystroke
  document.getElementById('save-alert-text').textContent =
    'This browser refused to save. Your plans are only in this tab right now — if you close it they are gone. Download a backup, then try a different browser or ask for storage to be allowed on this device.';
  wrap.hidden=false;
  const el=document.getElementById('saved'); if(el){ el.textContent=''; el.classList.remove('show'); }
  SWS.toast('Could not save on this device — download a backup.',{assertive:true,ms:9000});
}

/* ------------------ dates ------------------------------------------- */
const DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYABBR=['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseISO(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null; const[y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return isNaN(dt)?null:dt; }
function fmtISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function niceDate(iso){ const d=parseISO(iso); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function weekLabel(w){
  const a=parseISO(w.days[0].iso), b=parseISO(w.days[w.days.length-1].iso);
  const yr=b.getFullYear();
  return a.getMonth()===b.getMonth()
    ? `${MONTHS[a.getMonth()]} ${a.getDate()}–${b.getDate()}, ${yr}`
    : `${MONTHS[a.getMonth()]} ${a.getDate()} – ${MONTHS[b.getMonth()]} ${b.getDate()}, ${yr}`;
}

/* ------------------ year builder ------------------------------------ */
/* Rotation letters cycle continuously over school days across the whole
   year. Days marked "special" (no school / work day) show a banner and do
   NOT consume a letter — so the rotation stays true after breaks.        */
let yearTruncated=false;
function computeYear(c,special){
  const out=[], start=parseISO(c.yearStart), end=parseISO(c.yearEnd);
  yearTruncated=false;
  if(!start||!end||end<start) return out;
  let li=0;
  let cur=addDays(start,-((start.getDay()+6)%7));   // back to that week's Monday
  let guard=0;
  while(cur<=end){
    /* The old cap was `guard++<80`, so a two-year span silently stopped in
       March of the second year while Setup still showed the date the teacher
       typed. The bound is the end date now; the guard is only a runaway stop
       and it says so out loud when it fires. */
    if(guard++>=MAX_WEEKS){ yearTruncated=true; break; }
    const days=[];
    for(let i=0;i<7;i++){
      const d=addDays(cur,i), dow=d.getDay();
      if(!c.workDays.includes(dow)) continue;
      if(d<start||d>end) continue;
      const iso=fmtISO(d), sp=special[iso]||null;
      let letter=null, idx=null;
      if(!sp){ idx=li; letter=c.letters[li%c.letters.length]; li++; }
      days.push({iso,dow,letter,idx,special:sp});
    }
    if(days.length) out.push({monday:fmtISO(cur),days});
    cur=addDays(cur,7);
  }
  return out;
}
function buildYear(){ YEAR = S ? computeYear(S.config,S.special) : []; }

/* Where a day's lesson lives. See migrateCellKeys for why. */
function cellKey(d,p){ return d.special?`d${d.iso}|${p}`:`c${d.idx}|${p}`; }
/* The visible name of a period. Defaults keep the old copy exactly ("Period 3"
   in headings, "period 3" mid-sentence); a custom name is used as she typed it
   in both places. Every HTML interpolation of this must go through esc() —
   custom names are user text. */
function periodName(p,lower){
  const n=(S&&S.config&&Array.isArray(S.config.periodNames)?S.config.periodNames[p-1]:'')||'';
  return n||(lower?`period ${p}`:`Period ${p}`);
}
function cellText(d,p){
  const v=S.cells[cellKey(d,p)];
  if(v!==undefined) return v;
  /* Safety net for anything a migration could not place (a lesson written on a
     date that later fell outside the year): show it on its date rather than
     lose it. */
  const legacy=S.cells[`d${d.iso}|${p}`] ?? S.cells[`${d.iso}|${p}`];
  return legacy===undefined?'':legacy;
}
function weekIndexFor(iso){
  for(let i=0;i<YEAR.length;i++){
    const w=YEAR[i], last=w.days[w.days.length-1].iso;
    if(iso<=last) return i;
  }
  return YEAR.length?YEAR.length-1:0;
}

/* ------------------ safe text --------------------------------------- */
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ------------------ focus & announcements ---------------------------
   Re-rendering replaces the whole view, so anything that re-renders must
   put keyboard focus somewhere sensible afterward; announce() feeds the
   one polite live region (the view itself must NOT be live — it would
   read the entire week table on every render).                          */
function refocus(id,fallback){
  const el=document.getElementById(id);
  if(el&&!el.disabled){ el.focus(); return; }
  if(fallback){ const f=document.getElementById(fallback); if(f&&!f.disabled) f.focus(); }
}
function announce(msg){
  const el=document.getElementById('live'); if(!el) return;
  el.textContent=''; setTimeout(()=>{ el.textContent=msg; },30);
}

/* ------------------ render root ------------------------------------- */
const view=document.getElementById('view');
function render(){
  hideBar(); closeModal();
  applyPrintMode();
  bar.hidden=true;
  const tabs=document.querySelector('.tabs');
  if(!S){ tabs.style.display='none'; renderWelcome(); return; }
  tabs.style.display='flex';
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.view===curView;t.classList.toggle('active',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
  if(curView==='week') renderWeek(); else renderSetup();
}

/* ------------------ the promise, as a stamp -------------------------
   Research finding across the portfolio: nobody believes a privacy claim
   written as grey footer prose. It has to look like a stamp on the thing, and
   it has to say what THIS app holds. Everything below is literally true of
   this file: no network call exists anywhere in it unless CLIENT_ID is filled
   in, and the state object is only config, cells, notes and special. */
const TRUST_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6.5v5c0 4.6 3.2 8.3 8 9.5 4.8-1.2 8-4.9 8-9.5v-5L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>';
function trustHTML(full){
  const drive=CLIENT_ID?' The one exception is the Google Drive button, which uploads that same backup file to your own Drive when you press it.':'';
  const body=full
    ? `<b>No account, no upload, no student names.</b> The planner only knows dates, periods and rotation letters — there is no roster in it, so there is nothing here for a district to vet. Your lessons stay in this browser, on this device, and leave only in a backup or CSV file you download yourself.${drive}`
    : `<b>Nothing leaves this device.</b> No account, no student names.`;
  return `<p class="trust">${TRUST_SVG}<span>${body}</span></p>`;
}

      }

   and no way back, so a teacher who "just looked" ended up typing over

/* ------------------ week view --------------------------------------- */
/* "No weeks yet — check your year dates" was shown whenever the year came out
   empty, including when the dates were perfect and the teaching days were the
   problem. An error that names the wrong field is the complaint this app was
   built to avoid, quoted verbatim in the research. */
function yearProblem(){
  const c=S.config, st=parseISO(c.yearStart), en=parseISO(c.yearEnd);
  if(!st) return `The first day of the year (“${c.yearStart}”) is not a date this app can read. Set it in Setup.`;
  if(!en) return `The last day of the year (“${c.yearEnd}”) is not a date this app can read. Set it in Setup.`;
  if(en<st) return `The last day (${niceDate(c.yearEnd)}) comes before the first day (${niceDate(c.yearStart)}). Swap them in Setup.`;
  if(!c.workDays.length) return 'No teaching days are selected. Pick at least one in Setup.';
  const names=c.workDays.slice().sort().map(d=>DAYNAMES[d]).join(', ');
  return `Your year runs ${niceDate(c.yearStart)} to ${niceDate(c.yearEnd)}, and no ${names} falls inside it. Widen the dates or add another teaching day in Setup.`;
}
/* ═══════════════════════════════════════════════════════════════════
   COLOUR, NAMES, MERGES — the layer that makes this Jessie's book

   Her real plan book is a Google Sheet, and the colours in it are not
   decoration: they are a language. Red means no school or a sub. Lime
   means a reward day. Orange means a drill. Pink down the left edge is
   just "this is the weekday column". Nobody else can read that book,
   because the key lives in her head.

   So every fill here carries a NAME, and the names print as a legend.
   That is the whole difference between a coloured spreadsheet and a
   plan somebody else can pick up when she is out sick — which is
   exactly the day it matters.

   Two scopes, asked every time rather than guessed:
     · this box only            — a one-off, "SUB on Tuesday"
     · every week               — the standing pattern, "period 3 is
                                  always kindergarten green"
   Stored separately so a one-off never silently becomes a rule, and
   clearing the rule does not wipe the one-offs.
   ═══════════════════════════════════════════════════════════════════ */

/* Seeded from her own book: the sixteen fills actually used across the
   41 weeks, with the meaning each one already carries. She can rename,
   recolour or delete any of them — this is a starting vocabulary, not
   a fixed set. */
const SEED_LEGEND = [
  { id: 'k1',  hex: '#FF0000', name: 'No school / sub / sick' },
  { id: 'k2',  hex: '#B8FB32', name: 'Reward day' },
  { id: 'k3',  hex: '#FF9900', name: 'Fire drill' },
  { id: 'k4',  hex: '#999999', name: 'Tornado drill' },
  { id: 'k5',  hex: '#3CF0FF', name: 'Staff meeting / school event' },
  { id: 'k6',  hex: '#FF6CC2', name: 'Meeting' },
  { id: 'k7',  hex: '#00FF00', name: 'Family / personal' },
  { id: 'k8',  hex: '#FF00FF', name: 'Prep to do' },
  { id: 'k9',  hex: '#FFF2CC', name: 'PD / work day' },
  { id: 'k10', hex: '#F3F3F3', name: 'Studio time' },
  { id: 'k11', hex: '#FFD3ED', name: 'Weekday label' },
  { id: 'k12', hex: '#FFFF00', name: 'Week heading' },
  { id: 'k13', hex: '#B0F9FF', name: 'Notes heading' },
  { id: 'k14', hex: '#FEA4A4', name: 'Baby shower' },
  { id: 'k15', hex: '#0000FF', name: 'Jury duty' },
];

/* Extra swatches offered in the picker beyond whatever is already in the
   legend, so adding a new category does not mean typing a hex code. */
const SWATCHES = ['#FF0000', '#FF9900', '#FFFF00', '#B8FB32', '#00FF00', '#3CF0FF',
  '#B0F9FF', '#0000FF', '#FF00FF', '#FF6CC2', '#FFD3ED', '#FEA4A4',
  '#FFF2CC', '#F3F3F3', '#999999', '#FFFFFF'];

/* Which line inside which box carries which colour. Kept beside the text
   rather than inside it: the text stays plain, so copy, paste, print and
   export are unaffected, and a colour can never corrupt a lesson plan. */
function boxKeyOf(b) { return b.dataset.p === 'notes' ? 'n' + b.dataset.iso : b.dataset.key; }

function lineFillsFor(key) {
  ensureColourState();
  return S.lineFill[key] || (S.lineFill[key] = {});
}

/* Paint the text of a box as one element per line, so each line can be
   coloured on its own. Never called while the box has focus — rewriting the
   DOM under a caret moves it. */
function renderBoxLines(b, text) {
  const key = boxKeyOf(b);
  const fills = (S.lineFill || {})[key] || {};
  const lines = String(text || '').split('\n');
  b.textContent = '';
  lines.forEach((ln, i) => {
    const d = document.createElement('div');
    d.className = 'ln';
    const col = colourById(fills[i]);
    if (col) {
      d.classList.add('lnf');
      d.style.setProperty('--ln-bg', col.hex);
      d.style.setProperty('--ln-ink', inkOn(col.hex));
      if (col.name) d.title = col.name;   // the meaning in words, not just hue
    }
    if (ln) d.textContent = ln; else d.appendChild(document.createElement('br'));
    b.appendChild(d);
  });
}

function ensureColourState() {
  if (!Array.isArray(S.legend) || !S.legend.length) S.legend = SEED_LEGEND.map(x => ({ ...x }));
  S.fill = S.fill || {};        // cellKey -> colour id            (one box)
  S.fillDow = S.fillDow || {};  // "dow|period" -> colour id       (every week)
  S.fillCol = S.fillCol || {};  // "period" -> colour id           (column heading)
  S.fillDay = S.fillDay || {};  // "dow" -> colour id              (weekday label)
  S.lineFill = S.lineFill || {}; // boxKey -> { lineIndex: colour id }  (one note)
  S.merge = S.merge || {};      // cellKey -> columns spanned      (one box)
  S.mergeDow = S.mergeDow || {};// "dow|period" -> columns spanned (every week)
  /* Jessie, 2026-08-18: "every Tuesday from now until Christmas". A ranged rule
     is a standing rule with a first and last date. p:0 means every period of
     that weekday. Later rules win where two overlap, so "red until break, green
     after" is just two rules. */
  if (!Array.isArray(S.fillRules)) S.fillRules = [];       // {c, dow, p(0=all), from, to}
  if (!Array.isArray(S.fillColRules)) S.fillColRules = []; // {c, col, from, to}   (column headings)
}

const colourById = (id) => (S.legend || []).find(c => c.id === id) || null;

/* A one-off beats the standing rule: if she painted this particular
   Tuesday red for a sub, that wins over "period 3 is always green".
   In between the two sit the ranged rules: dated is more specific than
   all-year, and a rule naming this period beats one covering the day. */
function rangeRuleFor(d, p) {
  const inRange = r => r.dow === d.dow && !(r.from && d.iso < r.from) && !(r.to && d.iso > r.to) && colourById(r.c);
  for (let i = S.fillRules.length - 1; i >= 0; i--) {
    const r = S.fillRules[i];
    if (+r.p === p && inRange(r)) return r;
  }
  for (let i = S.fillRules.length - 1; i >= 0; i--) {
    const r = S.fillRules[i];
    if (!+r.p && inRange(r)) return r;
  }
  return null;
}
function fillFor(d, p) {
  ensureColourState();
  const k = cellKey(d, p);
  if (k in S.fill) return colourById(S.fill[k]);
  const rr = rangeRuleFor(d, p);
  if (rr) return colourById(rr.c);
  const dk = `${d.dow}|${p}`;
  if (dk in S.fillDow) return colourById(S.fillDow[dk]);
  return null;
}
/* A column heading's colour for THIS week: a ranged rule that overlaps any
   day of the week beats the standing colour, so "period 3 is kindergarten
   until the nine weeks end, then first grade" reads true week by week. */
function colFillId(key, w) {
  ensureColourState();
  const a = w.days[0].iso, b = w.days[w.days.length - 1].iso;
  for (let i = S.fillColRules.length - 1; i >= 0; i--) {
    const r = S.fillColRules[i];
    if (String(r.col) !== String(key)) continue;
    if (r.from && b < r.from) continue;
    if (r.to && a > r.to) continue;
    if (!colourById(r.c)) continue;
    return r.c;
  }
  return S.fillCol[key];
}
function spanFor(d, p) {
  ensureColourState();
  const k = cellKey(d, p);
  if (k in S.merge) return Math.max(1, S.merge[k] | 0);
  const dk = `${d.dow}|${p}`;
  if (dk in S.mergeDow) return Math.max(1, S.mergeDow[dk] | 0);
  return 1;
}
/* A cell swallowed by a merge to its left must not be rendered at all,
   or the row grows a phantom column and every heading shifts. */
function coveredBy(d, p) {
  for (let q = 1; q < p; q++) {
    const s = spanFor(d, q);
    if (s > 1 && q + s - 1 >= p) return q;
  }
  return 0;
}

/* Readable ink for any fill, so a dark swatch does not eat the text.
   The same relative-luminance test the rest of the studio uses. */
function inkOn(hex) {
  const h = (hex || '#FFFFFF').replace('#', '');
  const c = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
    .map(v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
  const L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  return L > 0.45 ? '#1b2430' : '#ffffff';
}

/* ── the brush ──────────────────────────────────────────────────────
   The colours were the whole point of this feature and they were invisible.
   Every paint handle sat at opacity:0 until you hovered the exact cell, and
   the colour key rendered nothing at all until a colour was already in use —
   so the first thing a new teacher saw was a plain grid with no evidence that
   any of this existed. She opened it, saw a spreadsheet, and was right to.

   So the palette is now permanent chrome, and it works the way a spreadsheet
   fill tool works: pick a colour once, then click cells. That is discoverable
   because you can see it, fast because arming is a single click for a whole
   week of boxes, and it works on a touchscreen, which hover never did. */
let armedId = null;                 // the colour currently held, or null
let paintScope = 'one';             // 'one' = this box · 'all' = every week

/* One apply path, shared by the brush and the picker, so the two can never
   disagree about what "every week" means. */
function paintTarget(tok, id, scope) {
  ensureColourState();
  const days = (YEAR[curWeek] || { days: [] }).days;
  const byIso = {}; for (const d of days) byIso[d.iso] = d;
  const [kind, a, b] = tok.split(':');

  if (kind === 'col') {
    const key = (a === 'lunch' || a === 'notes') ? a : +a;
    if (id) S.fillCol[key] = id;
    else { delete S.fillCol[key]; S.fillColRules = S.fillColRules.filter(r => String(r.col) !== String(key)); }
  } else if (kind === 'day') {
    if (id) S.fillDay[+a] = id; else delete S.fillDay[+a];
  } else if (kind === 'note') {
    const d = byIso[a]; if (!d) return;
    if (scope === 'all') { if (id) S.fillDow['n' + d.dow] = id; else delete S.fillDow['n' + d.dow]; delete S.fill['n' + d.iso]; }
    else { if (id) S.fill['n' + d.iso] = id; else delete S.fill['n' + d.iso]; }
  } else if (kind === 'cell') {
    const d = byIso[a]; if (!d) return;
    const pnum = +b, k = cellKey(d, pnum), dk = d.dow + '|' + pnum;
    if (scope === 'all') {
      if (id) S.fillDow[dk] = id;
      else { delete S.fillDow[dk]; S.fillRules = S.fillRules.filter(r => !(r.dow === d.dow && +r.p === pnum)); }
      delete S.fill[k];
    }
    else { if (id) S.fill[k] = id; else delete S.fill[k]; }
  }
  persist();
}

function paletteHTML() {
  ensureColourState();
  const sw = S.legend.map(c => `
    <button type="button" class="pchip${armedId === c.id ? ' on' : ''}" data-arm="${esc(c.id)}"
      style="--c:${esc(c.hex)}" aria-pressed="${armedId === c.id}"
      title="${esc(c.name || 'unnamed')}">
      <span class="pdot"></span><span class="pname">${esc(c.name || 'unnamed')}</span>
    </button>`).join('');
  /* One line. The week is what she needs on screen — this is a tool she
     reaches for occasionally, so it gets a strip, not a panel. Everything
     lives in the same horizontally scrolling row, including the scope switch,
     which only appears once a colour is actually in hand. */
  return `<div class="palette no-print" aria-label="Colours">
    <div class="prow">
      <span class="plabel">Colour${armedId ? 'ing' : ''}</span>
      ${sw}
      <button type="button" class="pchip erase${armedId === '__erase' ? ' on' : ''}" data-arm="__erase"
        aria-pressed="${armedId === '__erase'}" title="Remove colour">
        <span class="pdot none"></span><span class="pname">Remove</span>
      </button>
      <span class="psep" aria-hidden="true"></span>
      ${armedId ? `<label class="pscope"><input type="checkbox" id="p-scope" ${paintScope === 'all' ? 'checked' : ''}>
        every week</label>` : ''}
      <button type="button" class="pmini" id="p-edit">Edit colours</button>
    </div>

}

function wirePalette() {
  view.querySelectorAll('[data-arm]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.arm;
      armedId = (armedId === id) ? null : id;      // click again to put it down

    };
  });

  if (sc) sc.onchange = (e) => { paintScope = e.target.checked ? 'all' : 'one'; };
