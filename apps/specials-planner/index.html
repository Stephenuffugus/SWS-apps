/* ── the colour editor ──────────────────────────────────────────────
   Stephen, 2026-08-17: "we need to be able to customize their own colors,
   add stuff and take stuff away… what if they're color blind?" So: any
   colour (the native picker, which is a wheel on a phone), any name, add
   and delete freely. The names are the colour-blind path — the printed
   key and every hover carries the meaning in words, so the plan survives
   any palette a teacher can actually tell apart. */
/* ── the colour wheel ───────────────────────────────────────────────
   Jessie and Stephen both hit the native Android colour input: three
   sliders, all parked at one end, no sense of where the colours live.
   This is the thing they expected: a wheel you press and drag, hue
   around, softness toward the middle, one brightness slider, and a
   swatch showing exactly the colour under your finger. */
function hsvToHex(h, s, v) {
  const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  const to = (x) => Math.round(x * 255).toString(16).padStart(2, '0');
  return '#' + to(f(5)) + to(f(3)) + to(f(1));
}
function hexToHsv(hex) {
  const h3 = String(hex || '').replace('#', '');
  const r = parseInt(h3.slice(0, 2), 16) / 255, g = parseInt(h3.slice(2, 4), 16) / 255, b = parseInt(h3.slice(4, 6), 16) / 255;
  if ([r, g, b].some(isNaN)) return { h: 90, s: .6, v: .8 };
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  return { h, s: mx ? d / mx : 0, v: mx };
}
function buildWheel(initHex, onPick) {
  const wrap = document.createElement('div');
  wrap.className = 'cwheel';
  wrap.innerHTML = `<div class="cw-top">
      <div class="cw-can"><canvas width="360" height="360"></canvas><div class="cw-dot" aria-hidden="true"></div></div>
      <div class="cw-side"><div class="cw-swatch"></div><code class="cw-hex"></code></div>
    </div>
    <div class="row"><div class="lab"><span>Brightness</span><span class="cw-vlab"></span></div>
      <input type="range" class="cw-v" min="25" max="100" step="1" aria-label="Brightness"></div>`;
  const cv = wrap.querySelector('canvas'), dot = wrap.querySelector('.cw-dot'),
        sw = wrap.querySelector('.cw-swatch'), hexEl = wrap.querySelector('.cw-hex'),
        vin = wrap.querySelector('.cw-v'), vlab = wrap.querySelector('.cw-vlab');
  const g = cv.getContext ? cv.getContext('2d') : null;   // absent in the test jsdom
  let { h, s, v } = hexToHsv(initHex);
  v = Math.max(.25, v || .8);
  const R = cv.width / 2;
  let rafDraw = 0;
  function draw() {
    if (!g) return;
    const img = g.createImageData(cv.width, cv.height), d = img.data;
    for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
      const dx = x - R, dy = y - R, r = Math.hypot(dx, dy), i = (y * cv.width + x) * 4;
      if (r > R) { d[i + 3] = 0; continue; }
      const hex = hsvToHex((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360, Math.min(1, r / R), v);
      d[i] = parseInt(hex.slice(1, 3), 16); d[i + 1] = parseInt(hex.slice(3, 5), 16); d[i + 2] = parseInt(hex.slice(5, 7), 16); d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  function sync(fire) {
    const hex = hsvToHex(h, s, v);
    sw.style.background = hex; hexEl.textContent = hex.toUpperCase();
    vin.value = Math.round(v * 100); vlab.textContent = Math.round(v * 100) + '%';
    const cssR = 90;
    const a = h * Math.PI / 180, rr = s * cssR;
    dot.style.left = (cssR + Math.cos(a) * rr) + 'px';
    dot.style.top = (cssR + Math.sin(a) * rr) + 'px';
    if (fire) onPick(hex);
  }
  function pick(e) {
    const rect = cv.getBoundingClientRect(), cssR = (rect.width || 180) / 2;
    const dx = e.clientX - rect.left - cssR, dy = e.clientY - rect.top - cssR;
    h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
    s = Math.min(1, Math.hypot(dx, dy) / cssR);
    sync(true);
  }
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch {} }
    pick(e);
  });
  cv.addEventListener('pointermove', (e) => { if (e.buttons) pick(e); });
  vin.addEventListener('input', () => {
    v = vin.value / 100;
    if (!rafDraw) rafDraw = requestAnimationFrame(() => { rafDraw = 0; draw(); });
    sync(true);
  });
  draw(); sync(false);
  return wrap;
}

function colourUseCount(id) {
  ensureColourState();
  let n = 0;
  for (const v of Object.values(S.fill)) if (v === id) n++;
  for (const v of Object.values(S.fillDow)) if (v === id) n++;
  for (const v of Object.values(S.fillCol)) if (v === id) n++;
  for (const v of Object.values(S.fillDay)) if (v === id) n++;
  for (const r of S.fillRules) if (r.c === id) n++;
  for (const r of S.fillColRules) if (r.c === id) n++;
  for (const box of Object.values(S.lineFill)) for (const v of Object.values(box)) if (v === id) n++;
  return n;
}
function scrubColour(id) {
  for (const st of [S.fill, S.fillDow, S.fillCol, S.fillDay])
    for (const k of Object.keys(st)) if (st[k] === id) delete st[k];
  S.fillRules = S.fillRules.filter(r => r.c !== id);
  S.fillColRules = S.fillColRules.filter(r => r.c !== id);
  for (const bk of Object.keys(S.lineFill)) {
    const box = S.lineFill[bk];
    for (const k of Object.keys(box)) if (box[k] === id) delete box[k];
    if (!Object.keys(box).length) delete S.lineFill[bk];
  }
}
function openColourEditor() {
  ensureColourState();
  modalReturn = document.activeElement;
  const rowsHTML = () => S.legend.map(c => {
    const used = colourUseCount(c.id);
    return `<div class="crow" data-id="${esc(c.id)}">
      <button type="button" class="cswatch" style="--c:${esc(c.hex)}"
        aria-label="Change the colour for ${esc(c.name || 'this entry')}" aria-expanded="false"></button>
      <input type="text" value="${esc(c.name || '')}" maxlength="40" placeholder="What this colour means"
        aria-label="Meaning of this colour">
      <button type="button" class="btn ghost crow-del" aria-label="Delete ${esc(c.name || 'this colour')}">✕</button>
      <small class="crow-use">${used ? `${used} in use` : 'not used yet'}</small>
    </div>`;
  }).join('');
  sheet.innerHTML = `<h3 id="modal-title">Your colours</h3>
    <p class="sub">Any colour, any meaning. Tap a swatch to change it and everything already
      painted with it changes too. The <b>name</b> is what prints on the key and what a sub
      reads, so if two colours look alike to you, the words still carry the plan.</p>
    <div id="c-rows">${rowsHTML()}</div>
    <div class="opts">
      <button class="btn" id="c-add">+ Add a colour</button>
      <button class="btn primary" id="c-done">Done</button>
    </div>`;
  const wire = () => {
    sheet.querySelectorAll('.crow').forEach(row => {
      const id = row.dataset.id;
      const col = () => colourById(id);
      const swb = row.querySelector('.cswatch');
      swb.addEventListener('click', () => {
        const open = row.nextElementSibling && row.nextElementSibling.classList.contains('cwheel');
        sheet.querySelectorAll('.cwheel').forEach(x => x.remove());
        sheet.querySelectorAll('.cswatch').forEach(x => x.setAttribute('aria-expanded', 'false'));
        if (open) return;                       // second tap folds it away
        const wheel = buildWheel((col() || {}).hex, (hex) => {
          if (!col()) return;
          col().hex = hex;
          swb.style.setProperty('--c', hex);
          persist(); render();                  // the week behind repaints live
        });
        row.after(wheel);
        swb.setAttribute('aria-expanded', 'true');
      });
      row.querySelector('input[type="text"]').addEventListener('change', (e) => {
        if (col()) { col().name = e.target.value.trim(); persist(); render(); }
      });
      row.querySelector('.crow-del').onclick = () => {
        const used = colourUseCount(id), name = (col() || {}).name || 'this colour';
        if (used && !confirm(`“${name}” is painting ${used} thing${used === 1 ? '' : 's'}. Delete it and clear them?`)) return;
        scrubColour(id);
        S.legend = S.legend.filter(c => c.id !== id);
        if (armedId === id) { armedId = null; document.body.classList.remove('painting'); }
        persist(); render();
        sheet.querySelector('#c-rows').innerHTML = rowsHTML(); wire();
        announce(`${name} deleted`);
      };
    });
  };
  wire();
  sheet.querySelector('#c-add').onclick = () => {
    S.legend.push({ id: 'u' + Date.now().toString(36), hex: '#77C043', name: '' });
    persist();
    sheet.querySelector('#c-rows').innerHTML = rowsHTML(); wire();
    const rows = sheet.querySelectorAll('.crow');
    const last = rows[rows.length - 1]; if (last) last.querySelector('input[type="text"]').focus();
  };
  sheet.querySelector('#c-done').onclick = () => { closeModal(); render(); };
  modal.classList.add('show');
  const first = sheet.querySelector('button,input'); if (first) first.focus();
}

/* ── the picker ─────────────────────────────────────────────────────
   One popover for every colourable thing. `target` says what is being
   painted and therefore which scopes make sense: a single box can be
   "just here" or "every week"; a column heading or a weekday label is
   inherently every-week, so it does not ask. */
let pickerEl = null;

function closePicker() {
  if (pickerEl) { pickerEl.remove(); pickerEl = null; }
  document.removeEventListener('keydown', pickerKey, true);
}
function pickerKey(e) { if (e.key === 'Escape') { e.stopPropagation(); closePicker(); } }

function openPicker(anchor, target) {
  ensureColourState();
  closePicker();
  /* Which "Apply it to" choices exist depends on what was clicked. A period
     box offers the full set (this box / whole day / every week, with dates);
     a notes box keeps its two; headings take dates with no radio at all. */
  const scopes = target.scopes
    || (target.kind === 'cell'
      ? [{ v: 'one', label: 'Just this box' }, { v: 'all', label: target.everyLabel || 'Every week' }]
      : null);
  const asksScope = !!scopes;
  const rangeScopes = target.rangeScopes || ['all', 'dowall'];
  const current = target.currentId || '';

  const wrap = document.createElement('div');
  wrap.className = 'cpick';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-label', 'Colour and name');

  const swatchRow = (S.legend.map(c => `
      <button type="button" class="cs${c.id === current ? ' on' : ''}" data-id="${esc(c.id)}"
        style="background:${esc(c.hex)}" title="${esc(c.name)}"
        aria-label="${esc(c.name)}"></button>`).join(''))
    + SWATCHES.filter(h => !S.legend.some(c => c.hex.toLowerCase() === h.toLowerCase()))
      .map(h => `<button type="button" class="cs new" data-hex="${h}" style="background:${h}"
        aria-label="New colour ${h}"></button>`).join('')
    + `<button type="button" class="cs pick" id="cp-free" title="Any colour"
        aria-label="Pick any colour" aria-expanded="false"></button>`;

  wrap.innerHTML = `
    <p class="cpick-t">${esc(target.label)}</p>
    <div class="cpick-sw">${swatchRow}</div>
    <label class="cpick-name">What does this colour mean?
      <input type="text" id="cp-name" maxlength="40" placeholder="e.g. No school / sub">
    </label>
    ${asksScope ? `
    <fieldset class="cpick-scope">
      <legend>Apply it to</legend>
      ${scopes.map((s, i) => `<label><input type="radio" name="cp-scope" value="${esc(s.v)}" ${i === 0 ? 'checked' : ''}> ${esc(s.label)}</label>`).join('')}
    </fieldset>` : (target.range ? '' : `<p class="cpick-note">Applies to every week.</p>`)}
    ${target.range ? `
    <div class="cpick-range" id="cp-range" ${asksScope ? 'hidden' : ''}>
      <span class="cpick-range-t">Which dates?</span>
      <div class="cpick-range-row">
        <label>From <input type="date" id="cp-from" value="${esc(target.rangeFrom || '')}"></label>
        <label>Until <input type="date" id="cp-to" value="${esc(target.rangeTo || '')}"></label>
      </div>
      <span class="cpick-range-h">Leave these alone for the whole year, or pick dates so it starts or stops partway through. Handy when classes switch at the nine weeks or the semester.</span>
    </div>` : ''}
    <div class="cpick-act">
      <button type="button" class="btn ghost" id="cp-clear">Remove colour</button>
      <button type="button" class="btn primary" id="cp-ok">Apply</button>
    </div>`;

  document.body.appendChild(wrap);
  pickerEl = wrap;

  /* Keep it on screen: anchored under the thing you clicked, nudged back
     inside if that would push it off the right edge or the bottom. */
  const r = anchor.getBoundingClientRect();
  const w = wrap.getBoundingClientRect();
  let left = Math.min(r.left, window.innerWidth - w.width - 10);
  let top = r.bottom + 6;
  if (top + w.height > window.innerHeight - 8) top = Math.max(8, r.top - w.height - 6);
  wrap.style.left = Math.max(8, left) + 'px';
  wrap.style.top = top + 'px';

  let chosenId = current, chosenHex = current ? (colourById(current) || {}).hex : null;
  const nameIn = wrap.querySelector('#cp-name');
  if (current) nameIn.value = (colourById(current) || {}).name || '';

  wrap.querySelectorAll('.cs[data-id],.cs[data-hex]').forEach(b => b.addEventListener('click', () => {
    wrap.querySelectorAll('.cs').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    if (b.dataset.id) {
      chosenId = b.dataset.id; chosenHex = null;
      nameIn.value = (colourById(chosenId) || {}).name || '';
    } else {
      chosenId = null; chosenHex = b.dataset.hex;
      if (!nameIn.value) nameIn.focus();
    }
  }));
  /* the wheel: any colour she can actually tell apart, not just our presets */
  const free = wrap.querySelector('#cp-free');
  if (free) free.addEventListener('click', () => {
    const existing = wrap.querySelector('.cwheel');
    if (existing) { existing.remove(); free.setAttribute('aria-expanded', 'false'); return; }
    const wheel = buildWheel(chosenHex || '#77C043', (hex) => {
      wrap.querySelectorAll('.cs').forEach(x => x.classList.remove('on'));
      free.classList.add('on');
      free.style.background = hex;             // the rainbow button becomes the colour you chose
      chosenId = null; chosenHex = hex;
      if (!nameIn.value) { /* leave focus on the wheel while dragging */ }
    });
    wrap.querySelector('.cpick-sw').after(wheel);
    free.setAttribute('aria-expanded', 'true');
  });

  /* The calendar boxes only appear once a recurring scope is chosen — "just
     this box" has no dates to ask about. */
  const rangeEl = wrap.querySelector('#cp-range');
  const curScope = () => asksScope
    ? (wrap.querySelector('input[name="cp-scope"]:checked') || {}).value || scopes[0].v
    : 'all';
  const syncRange = () => { if (rangeEl && asksScope) rangeEl.hidden = !rangeScopes.includes(curScope()); };
  if (asksScope) wrap.querySelectorAll('input[name="cp-scope"]').forEach(r => r.addEventListener('change', syncRange));
  /* Untouched dates mean "the whole year" and land in the standing rule, the
     same place they landed before dates existed. Only an edited date makes a
     ranged rule, so old backups and new stay the same shape until she uses it. */
  const rangeOf = () => {
    if (!target.range || !rangeEl || rangeEl.hidden) return null;
    const f = (wrap.querySelector('#cp-from') || {}).value || '';
    const t = (wrap.querySelector('#cp-to') || {}).value || '';
    if ((f === (target.rangeFrom || '') || !f) && (t === (target.rangeTo || '') || !t)) return null;
    const from = f || target.rangeFrom || '', to = t || target.rangeTo || '';
    return (from && to && to < from) ? { from: to, to: from } : { from, to };
  };
  wrap.querySelector('#cp-clear').onclick = () => { target.apply(null, curScope(), rangeOf()); closePicker(); };
  wrap.querySelector('#cp-ok').onclick = () => {
    const name = nameIn.value.trim();
    let id = chosenId;
    if (!id && chosenHex) {
      /* A brand-new colour joins the legend, named. Unnamed is allowed —
         it just shows as the colour — because forcing a name before you
         can highlight one box would be the kind of friction that stops
         people using it at all. */
      id = 'u' + Date.now().toString(36);
      S.legend.push({ id, hex: chosenHex, name: name || '' });
    } else if (id && name && name !== (colourById(id) || {}).name) {
      colourById(id).name = name;      // renaming here renames it everywhere
    }
    if (!id) { closePicker(); return; }
    target.apply(id, curScope(), rangeOf());
    closePicker();
  };

  setTimeout(() => document.addEventListener('keydown', pickerKey, true), 0);
  setTimeout(() => {
    const off = (e) => {
      if (pickerEl && !pickerEl.contains(e.target)) { closePicker(); document.removeEventListener('mousedown', off, true); }
    };
    document.addEventListener('mousedown', off, true);
  }, 0);
}

/* ── merging ────────────────────────────────────────────────────────
   Her book merges constantly: "Work Day" across all six periods,
   "NO KINDERGARTEN" across 3 and 4, lunch running down the whole week.
   Merging asks the same scope question colouring does, because
   "kindergarten is always a double period" and "we merged Tuesday for
   the assembly" are different facts. */
function mergeRun(d, p, delta) {
  ensureColourState();
  const c = S.config, k = cellKey(d, p), dk = `${d.dow}|${p}`;
  const cur = spanFor(d, p);
  let next = Math.max(1, cur + delta);
  /* Never run past the last period, and never swallow a cell that is
     itself the head of another merge — that would orphan its content. */
  next = Math.min(next, c.periods - p + 1);
  for (let q = p + 1; q < p + next; q++) {
    if (spanFor(d, q) > 1) { next = q - p; break; }
  }
  return { k, dk, next, changed: next !== cur };
}

function applyMerge(d, p, span, scope) {
  ensureColourState();
  const k = cellKey(d, p), dk = `${d.dow}|${p}`;
  if (scope === 'all') {
    if (span > 1) S.mergeDow[dk] = span; else delete S.mergeDow[dk];
    delete S.merge[k];
  } else {
    if (span > 1) S.merge[k] = span; else delete S.merge[k];
  }
  persist();
  render();
}

/* ── the legend, printed ────────────────────────────────────────────
   The reason the whole feature exists: a sub picks this up and can read
   it. Only colours actually in use are listed, so the key stays short
   and honest rather than showing fifteen categories she never used. */
/* Repaint just the key. A full render would rebuild every box and throw away
   the caret, which is intolerable while she is mid-sentence. */
function renderLegendInPlace() {
  const old = view.querySelector('.legend');
  const html = legendHTML();
  if (old && html) { old.outerHTML = html; }
  else if (old && !html) { old.remove(); }
  else if (!old && html) {
    const pal = view.querySelector('.palette');
    if (pal) pal.insertAdjacentHTML('afterend', html);
  }
  const le = document.getElementById('legend-edit');
  if (le) le.onclick = () => { curView = 'setup'; render(); };
}

function usedColourIds() {
  ensureColourState();
  const used = new Set();
  for (const v of Object.values(S.fill)) used.add(v);
  for (const v of Object.values(S.fillDow)) used.add(v);
  for (const v of Object.values(S.fillCol)) used.add(v);
  for (const v of Object.values(S.fillDay)) used.add(v);
  for (const r of S.fillRules) used.add(r.c);
  for (const r of S.fillColRules) used.add(r.c);
  for (const box of Object.values(S.lineFill || {})) for (const v of Object.values(box)) used.add(v);
  return used;
}

function legendHTML() {
  const used = usedColourIds();
  const items = S.legend.filter(c => used.has(c.id));
  if (!items.length) return '';
  return `<div class="legend" aria-label="Colour key">
      <span class="legend-t">Colour key</span>
      ${items.map(c => `<span class="legend-i">
        <span class="legend-sw" style="background:${esc(c.hex)}"></span>
        <span>${esc(c.name || 'unnamed')}</span></span>`).join('')}
      <button type="button" class="btn ghost no-print" id="legend-edit">Edit key</button>
    </div>`;
}

/* ── fit to screen ──────────────────────────────────────────────────
   "I want to see it all at once." A whole week is ten columns wide and
   six rows deep, which on a laptop only fits if the chrome gets out of
   the way and the type scales down with the grid. This is a view mode,
   not a zoom: the grid keeps its own proportions and the browser keeps
   its own text-size setting for everything else.

   It is a LAPTOP feature and says so by disappearing. On a narrow screen
   the grid is not a grid at all — the responsive rules stack every row
   into its own card, so a "week" is a 3500px column. Scaling that to fit
   a phone gave 3px type: technically the whole week on one screen, and
   completely useless. The button is only offered where the answer is
   honest. */
const MIN_FIT = 0.55;   // below this it is a smear, not a plan

/* Is the grid rendering as an actual table right now? The stacked-card
   breakpoint is the thing that makes fitting meaningless, and asking the
   computed style is more honest than guessing at a pixel width. */
function gridIsTable() {
  const td = view.querySelector('table.week td');
  return !!td && getComputedStyle(td).display.startsWith('table');
}

function canFit() {
  return gridIsTable() && fitScale() >= MIN_FIT;
}

/* What scale would it take, measured without committing to the mode, so
   the button can decide whether to exist. */
function fitScale() {
  const tbl = view.querySelector('table.week');
  const box = view.querySelector('.grid-scroll');
  if (!tbl || !box) return 0;
  const root = document.documentElement;
  const inFit = document.body.classList.contains('fitscreen');
  const prev = root.style.getPropertyValue('--fit');
  root.style.setProperty('--fit', '1');
  /* When the chrome is already hidden, measure where the grid really sits.
     When it is not, assume roughly what hiding it will free up. */
  const top = inFit ? box.getBoundingClientRect().top : 96;
  const availW = (inFit ? (box.clientWidth || window.innerWidth) : window.innerWidth) - 16;
  const availH = window.innerHeight - top - 16;
  const k = Math.min(1, availW / Math.max(1, tbl.scrollWidth), availH / Math.max(1, tbl.scrollHeight));
  if (!inFit) { if (prev) root.style.setProperty('--fit', prev); else root.style.removeProperty('--fit'); }
  return k;
}

function toggleFit(force) {
  const on = force !== undefined ? force : !document.body.classList.contains('fitscreen');
  document.body.classList.toggle('fitscreen', on);
  S.fit = on;
  persist(true);
  if (on) fitGrid(); else document.documentElement.style.removeProperty('--fit');
  syncFitBtn();
}

function syncFitBtn() {
  const b = document.getElementById('wk-fit');
  if (!b) return;
  const on = document.body.classList.contains('fitscreen');
  /* Hidden rather than disabled: a control you cannot use and cannot be
     told why is worse than one that is not there. */
  b.hidden = !on && !canFit();
  b.setAttribute('aria-pressed', String(on));
  b.textContent = on ? 'Exit full screen' : 'Fit to screen';
}

function fitGrid() {
  if (!document.body.classList.contains('fitscreen')) return;
  const k = fitScale();
  /* If the honest answer is below the floor, stop pretending: keep the
     chrome hidden, because the extra room is still worth having, but
     render at a readable size and let it scroll. */
  const tooSmall = k < MIN_FIT;
  document.body.classList.toggle('fit-scroll', tooSmall);
  document.documentElement.style.setProperty('--fit', (tooSmall ? 1 : k).toFixed(3));
}


/* ── wiring the handles ─────────────────────────────────────────────
   One delegated pass over the grid. Each paint handle knows what it
   paints from its data-paint token, and hands openPicker an `apply`
   that writes to the right store — which is where the "just this box
   or every week" answer actually lands. */
function wireColourHandles(){
  ensureColourState();
  const days=(YEAR[curWeek]||{days:[]}).days;
  const byIso={}; for(const d of days) byIso[d.iso]=d;

  view.querySelectorAll('[data-paint]').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation(); ev.preventDefault();
      const tok=btn.dataset.paint, [kind,a,b]=tok.split(':');
      if(kind==='col'){
        const w=YEAR[curWeek];
        openPicker(btn,{ kind:'col', label:a==='lunch'?'Lunch column':a==='notes'?'Notes column':periodName(+a)+' column',
          currentId:(w?colFillId(a==='lunch'||a==='notes'?a:+a,w):S.fillCol[a==='lunch'||a==='notes'?a:+a])||'',
          range:true, rangeFrom:S.config.yearStart, rangeTo:S.config.yearEnd,
          apply:(id,scope,range)=>{ const key=(a==='lunch'||a==='notes')?a:+a;
            if(id&&range) S.fillColRules.push({c:id,col:key,from:range.from,to:range.to});
            else if(id) S.fillCol[key]=id;
            else { delete S.fillCol[key]; S.fillColRules=S.fillColRules.filter(r=>String(r.col)!==String(key)); }
            persist(); render(); } });
      } else if(kind==='day'){
        openPicker(btn,{ kind:'day', label:DAYNAMES[+a]+' label, every week',
          currentId:S.fillDay[+a]||'',
          apply:(id)=>{ if(id) S.fillDay[+a]=id; else delete S.fillDay[+a]; persist(); render(); } });
      } else if(kind==='note'){
        const d=byIso[a]; if(!d) return;
        openPicker(btn,{ kind:'cell', label:'Notes · '+DAYNAMES[d.dow]+' '+niceDate(d.iso),
          everyLabel:'Every '+DAYNAMES[d.dow]+'’s notes',
          currentId:S.fill['n'+d.iso]||S.fillDow['n'+d.dow]||'',
          apply:(id,scope)=>{
            if(scope==='all'){ if(id) S.fillDow['n'+d.dow]=id; else delete S.fillDow['n'+d.dow]; delete S.fill['n'+d.iso]; }
            else { if(id) S.fill['n'+d.iso]=id; else delete S.fill['n'+d.iso]; }
            persist(); render(); } });
      } else if(kind==='cell'){
        const d=byIso[a]; if(!d) return; const p=+b;
        openPicker(btn,{ kind:'cell', label:DAYNAMES[d.dow]+' '+niceDate(d.iso)+' · '+periodName(p,true),
          scopes:[
            {v:'one',   label:'Just this box'},
            {v:'day',   label:'Every period this day'},
            {v:'all',   label:'Every '+DAYNAMES[d.dow]+' '+periodName(p,true)},
            {v:'dowall',label:'Every '+DAYNAMES[d.dow]+', every period'},
          ],
          range:true, rangeFrom:S.config.yearStart, rangeTo:S.config.yearEnd,
          currentId:(()=>{const k=cellKey(d,p);return (k in S.fill)?S.fill[k]:((rangeRuleFor(d,p)||{}).c||S.fillDow[d.dow+'|'+p]||'');})(),
          apply:(id,scope,range)=>{
            const k=cellKey(d,p), dk=d.dow+'|'+p, per=S.config.periods;
            if(scope==='day'){
              /* One-offs for every period of this one day — Jessie's "so I
                 don't have to change the colour of every box on that day". */
              for(let q=1;q<=per;q++){ const qk=cellKey(d,q); if(id) S.fill[qk]=id; else delete S.fill[qk]; }
            } else if(scope==='all'||scope==='dowall'){
              if(id&&range){
                S.fillRules.push({c:id,dow:d.dow,p:scope==='all'?p:0,from:range.from,to:range.to});
                delete S.fill[k];              // a one-off here would mask what she just asked for
              } else if(id){
                if(scope==='all') S.fillDow[dk]=id;
                else for(let q=1;q<=per;q++) S.fillDow[d.dow+'|'+q]=id;
                delete S.fill[k];
              } else if(scope==='all'){
                delete S.fillDow[dk]; delete S.fill[k];
                S.fillRules=S.fillRules.filter(r=>!(r.dow===d.dow&&+r.p===p));
              } else {
                for(let q=1;q<=per;q++){ delete S.fillDow[d.dow+'|'+q]; delete S.fill[cellKey(d,q)]; }
                S.fillRules=S.fillRules.filter(r=>r.dow!==d.dow);
              }
            }
            else { if(id) S.fill[k]=id; else delete S.fill[k]; }
            persist(); render(); } });
      }
    };
  });

  /* While a colour is held, a click anywhere in a cell paints that cell. When
     nothing is held, the same click puts the caret in the box and she types —
     which is the ordinary case, so it stays completely undisturbed. */
  view.querySelectorAll('table.week td, table.week th').forEach(cell=>{
    cell.addEventListener('mousedown',(ev)=>{
      if(!armedId) return;
      if(ev.target.closest('[data-merge],[data-gear],.paint')) return;

      /* A note first, the box second. She writes several notes in one box and
         they mean different things, so a click that lands on a line colours
         that line; a click on the empty part of the cell fills the whole cell
         behind them. Both are reachable without a mode switch. */
      const line = ev.target.closest('.ln');
      if (line && line.parentElement.classList.contains('box')) {
        ev.preventDefault(); ev.stopPropagation();
        const box = line.parentElement;
        const idx = [...box.children].indexOf(line);
        const fills = lineFillsFor(boxKeyOf(box));
        if (armedId === '__erase') delete fills[idx]; else fills[idx] = armedId;
        if (!Object.keys(fills).length) delete S.lineFill[boxKeyOf(box)];
        persist();
        const col = colourById(fills[idx]);
        line.classList.toggle('lnf', !!col);
        if (col) {
          line.style.setProperty('--ln-bg', col.hex);
          line.style.setProperty('--ln-ink', inkOn(col.hex));
        } else {
          line.style.removeProperty('--ln-bg');
          line.style.removeProperty('--ln-ink');
        }
        renderLegendInPlace();
        return;
      }

      const tokEl=cell.querySelector('[data-paint]');
      if(!tokEl) return;
      ev.preventDefault(); ev.stopPropagation();
      const tok=tokEl.dataset.paint;
      /* Column and weekday headers are inherently every-week; only a single
         box has a choice to make, so only it consults the scope switch. */
      const kind=tok.split(':')[0];
      const scope=(kind==='cell'||kind==='note')?paintScope:'all';
      paintTarget(tok, armedId==='__erase'?null:armedId, scope);
      render();
    });
  });

  view.querySelectorAll('[data-merge]').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation(); ev.preventDefault();
      const [iso,ps,ds]=btn.dataset.merge.split(':');
      const d=byIso[iso]; if(!d) return;
      const p=+ps, delta=+ds;
      const r=mergeRun(d,p,delta);
      if(!r.changed){
        /* SWS.toast, not a bare toast() — there is no global by that name, so
           this threw and the arrow appeared to do nothing at all. It fires on
           the two commonest clicks there are: unmerge on a cell that is not
           merged, and merge on the last period of the row. */
        SWS.toast(delta>0?'There is no period to the right to merge into.':'This box is not merged.');
        return;
      }
      /* Ask the same question colouring asks. A standing double period
         and a one-off assembly are different facts about the year. */
      openMergeScope(btn,d,p,r.next);
    };
  });
}

/* A two-button sheet rather than a confirm(): the choice is not
   yes/no, and a confirm cannot say what either answer means. */
function openMergeScope(anchor,d,p,span){
  closePicker();
  const wrap=document.createElement('div');
  wrap.className='cpick';
  wrap.setAttribute('role','dialog');
  wrap.setAttribute('aria-label','Merge scope');
  wrap.innerHTML=`
    <p class="cpick-t">${span>1?'Merge':'Unmerge'} ${esc(DAYNAMES[d.dow])} ${esc(periodName(p,true))}</p>
    <p class="cpick-note">${span>1?'It will span '+span+' periods.':'It will go back to one period.'}</p>
    <div class="cpick-act" style="flex-direction:column;align-items:stretch;gap:6px">
      <button type="button" class="btn primary" id="mg-one">Just this week</button>
      <button type="button" class="btn" id="mg-all">Every ${esc(DAYNAMES[d.dow])}</button>
      <button type="button" class="btn ghost" id="mg-x">Cancel</button>
    </div>`;
  document.body.appendChild(wrap); pickerEl=wrap;
  const r=anchor.getBoundingClientRect(), w=wrap.getBoundingClientRect();
  wrap.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w.width-10))+'px';
  wrap.style.top=(r.bottom+w.height>window.innerHeight-8?Math.max(8,r.top-w.height-6):r.bottom+6)+'px';
  wrap.querySelector('#mg-one').onclick=()=>{ closePicker(); applyMerge(d,p,span,'one'); };
  wrap.querySelector('#mg-all').onclick=()=>{ closePicker(); applyMerge(d,p,span,'all'); };
  wrap.querySelector('#mg-x').onclick=closePicker;
  setTimeout(()=>document.addEventListener('keydown',pickerKey,true),0);
}

/* Rotating a tablet crosses the stacked-card breakpoint in both directions,
   so the mode has to be able to let go as well as take hold. */
window.addEventListener('resize',()=>{
  if(curView!=='week'||!S) return;
  if(document.body.classList.contains('fitscreen')){
    if(gridIsTable()) fitGrid();
    else document.body.classList.remove('fitscreen','fit-scroll'),
         document.documentElement.style.removeProperty('--fit');
  }
  syncFitBtn();
});

function renderWeek(){
  buildYearIfStale();
  if(!YEAR.length){
    view.innerHTML=`<div class="card"><h2>No weeks yet</h2><p class="sub">${esc(yearProblem())}</p><button class="btn primary" id="go-setup">Open Setup</button></div>`;
    document.getElementById('go-setup').onclick=()=>{curView='setup';render();};
    return;
  }
  curWeek=Math.max(0,Math.min(YEAR.length-1,curWeek));
  const w=YEAR[curWeek], c=S.config, todayISO=fmtISO(new Date());
  const preL=c.lunchAfter, teacher=c.teacher?` · ${esc(c.teacher)}`:'';

  ensureColourState();
  const hStyle=(id)=>{ const col=colourById(id); return col
      ? ` class="filled" style="--cell-fill:${col.hex};--cell-ink:${inkOn(col.hex)}"` : ''; };
  /* Labels can carry a custom column name now, which is user text — esc here
     covers every call site at once. */
  const paintBtn=(what,label)=>`<button type="button" class="paint no-print" data-paint="${what}" aria-label="Colour ${esc(label)}">◧</button>`;

  /* The heading text is editable in place — "many people don't call them
     periods". The name lives in config, so it flows to the copy bar, the CSV
     and every spoken label; emptied, it falls back to "Period n". */
  const hce=PLAINTEXT_OK?'plaintext-only':'true';
  let head=`<tr><th class="day-h" scope="col">Day</th>`;
  for(let p=1;p<=c.periods;p++){
    if(p===preL+1) head+=`<th class="lunch-h" scope="col" aria-label="Lunch"${hStyle(colFillId('lunch',w))}>🍎${paintBtn('col:lunch','the Lunch column')}</th>`;
    head+=`<th scope="col"${hStyle(colFillId(p,w))}><span class="pn-edit" contenteditable="${hce}" role="textbox" spellcheck="false" data-pn="${p}" aria-label="Column name, edit to rename it" title="Click to rename">${esc(periodName(p))}</span>${paintBtn('col:'+p,'the '+periodName(p,true)+' column')}</th>`;
  }
  if(preL===c.periods) head+=`<th class="lunch-h" scope="col" aria-label="Lunch"${hStyle(colFillId('lunch',w))}>🍎${paintBtn('col:lunch','the Lunch column')}</th>`;
  head+=`<th class="notes-h" scope="col"${hStyle(colFillId('notes',w))}>Notes${paintBtn('col:notes','the Notes column')}</th></tr>`;

  /* 'true', not 'plaintext-only'. Each line inside a box is its own element so
     it can carry its own colour — she writes several notes in one box and they
     mean different things. plaintext-only strips those elements, which is why
     colouring a single note was impossible rather than merely missing. Paste is
     still forced to plain text below, so nothing arrives with foreign styling. */
  const ce='true';
  /* Lunch is ONE cell down the whole week, not one per day. Her book merges
     E1:E6 in all 41 weeks without exception — it is a band, not five boxes,
     and five separate boxes was the most obvious way the grid did not look
     like her book. Rendered on the first row only, spanning the rest. */
  const lunchCell = (di) => di === 0
    ? `<td class="lunch" rowspan="${w.days.length}"><span aria-hidden="true">lunch</span></td>`
    : '';
  let rows='';
  for(const [di,d] of w.days.entries()){
    const li=d.letter?c.letters.indexOf(d.letter):-1;
    const chip=d.letter?`<span class="chip l${(li<0?0:li)%6}"><span class="sr-only">Rotation day </span>${esc(d.letter)}</span>`:'';
    const banner=d.special?`<span class="sp-banner">${esc(d.special)}</span>`:'';
    const dayName=`${DAYNAMES[d.dow]} ${niceDate(d.iso)}`;
    const rot=d.letter?`, rotation day ${esc(d.letter)}`:(d.special?`, ${esc(d.special)}`:'');
    rows+=`<tr class="${d.special?'sp-row':''} ${d.iso===todayISO?'today-row':''}">
      <td${(()=>{const df=colourById(S.fillDay[d.dow]);return df?` class="day-td filled" style="--cell-fill:${df.hex};--cell-ink:${inkOn(df.hex)}"`:' class="day-td"';})()}>${paintBtn('day:'+d.dow,DAYNAMES[d.dow]+' label')}<div class="day-cell">
        <div>
          <div class="day-name">${DAYNAMES[d.dow]}</div>
          <div class="day-date">${niceDate(d.iso)}${d.iso===todayISO?'<span class="sr-only">, today</span>':''}</div>
        </div>
        <div class="day-foot">${chip}<button class="day-gear no-print" data-gear="${d.iso}" aria-label="Day settings for ${dayName}">⚙</button></div>
        ${banner}
      </div></td>`;
    for(let p=1;p<=c.periods;p++){
      if(p===preL+1) rows+=lunchCell(di);
      if(coveredBy(d,p)) continue;                 // swallowed by a merge to its left
      const f=fillFor(d,p), span=spanFor(d,p);
      const fs=f?` class="filled${span>1?' merged':''}" style="--cell-fill:${f.hex};--cell-ink:${inkOn(f.hex)}"`
                :(span>1?' class="merged"':'');
      const sp=span>1?` colspan="${span}"`:'';
      const spanNote=span>1?`, spanning ${span} periods`:'';
      const pn=esc(periodName(p,true));
      rows+=`<td data-label="${esc(periodName(p))}"${sp}${fs}><div class="box" contenteditable="${ce}" role="textbox" aria-multiline="true" aria-label="${dayName}${rot}, ${pn}${spanNote}" data-iso="${d.iso}" data-p="${p}" data-letter="${esc(d.letter||'')}" data-key="${esc(cellKey(d,p))}"></div>${paintBtn('cell:'+d.iso+':'+p,dayName+' '+periodName(p,true))}<span class="mergebar no-print"><button type="button" data-merge="${d.iso}:${p}:-1" aria-label="Unmerge ${dayName} ${pn}">◀</button><button type="button" data-merge="${d.iso}:${p}:1" aria-label="Merge ${dayName} ${pn} with the next">▶</button></span></td>`;
    }
    if(preL===c.periods) rows+=lunchCell(di);
    const nf=colourById(S.fill['n'+d.iso]!==undefined?S.fill['n'+d.iso]:S.fillDow['n'+d.dow]);
    const nfs=nf?` class="filled" style="--cell-fill:${nf.hex};--cell-ink:${inkOn(nf.hex)}"`:'';
    rows+=`<td data-label="Notes"${nfs}><div class="box" contenteditable="${ce}" role="textbox" aria-multiline="true" aria-label="Notes for ${dayName}" data-iso="${d.iso}" data-p="notes"></div>${paintBtn('note:'+d.iso,'notes for '+dayName)}</td></tr>`;
  }

  const opts=YEAR.map((wk,i)=>`<option value="${i}" ${i===curWeek?'selected':''}>Wk ${i+1} · ${weekLabel(wk)}</option>`).join('');
  const sampleBar=S.sample?`<div class="sample-bar no-print"><span class="warn">You are looking at a sample week — this text is not yours.</span>
      <button class="btn" id="s-clear">Clear the sample</button><button class="btn ghost" id="s-keep">Keep it, it's mine now</button></div>`:'';
  const truncated=yearTruncated?`<p class="warn no-print">That is a very long span, so the grid stops after ${YEAR.length} weeks. Shorten the year in Setup if you need the end of it.</p>`:'';
  view.innerHTML=`
    <div class="weeknav no-print">
      <button class="btn" id="wk-prev" aria-label="Previous week" ${curWeek===0?'disabled':''}>‹</button>
      <button class="btn" id="wk-next" aria-label="Next week" ${curWeek===YEAR.length-1?'disabled':''}>›</button>
      <select id="wk-jump" aria-label="Jump to week">${opts}</select>
      <button class="btn" id="wk-today">Today</button>
      <span class="spacer"></span>
      <button class="btn" id="wk-fit" aria-pressed="false">Fit to screen</button>
      <button class="btn" id="wk-print">Print</button>
    </div>
    ${trustHTML(false)}
    ${sampleBar}${truncated}
    <h2 class="sr-only">Week ${curWeek+1} of ${YEAR.length}: ${weekLabel(w)}</h2>
    <p class="scroll-hint no-print" id="scroll-hint" hidden>The periods run off to the right — scroll the grid sideways to reach them. The day column stays put.</p>
    <div class="print-title">Specials Planner · Week of ${weekLabel(w)}${teacher}</div>
    ${paletteHTML()}
    ${legendHTML()}
    <div class="grid-scroll"><table class="week" style="--cols:${c.periods}" aria-label="Week of ${weekLabel(w)}"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="footnote no-print">Tap a box to type — Enter starts a new line. Tap a column heading to rename it. Everything saves as you go.</div>`;

  const gs=view.querySelector('.grid-scroll');
  view.insertBefore(bar,gs); bar.hidden=false;   // in the flow, above the grid
  paintCells();
  view.querySelectorAll('.box').forEach(b=>{
    b.addEventListener('input',onBoxInput);
    b.addEventListener('focus',()=>onBoxFocus(b));
    b.addEventListener('paste',plainPaste);
    b.addEventListener('keydown',onBoxKey);
    /* Rebuild the line elements when she leaves the box. Typing into an empty
       box leaves the first line as a bare text node — the browser only starts
       making elements once Enter is pressed — and a bare text node is a line
       that cannot be coloured. Doing it on blur means the caret is already
       gone, so nothing jumps while she writes. */
    b.addEventListener('blur',()=>{ if(document.activeElement!==b) renderBoxLines(b, boxValue(b)); });
  });
  /* Renaming a column: type in the heading, Enter or click away to keep it,
     Escape to put it back. Clearing it restores "Period n". */
  view.querySelectorAll('.pn-edit').forEach(el=>{
    const p=+el.dataset.pn;
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); el.blur(); }
      else if(e.key==='Escape'){ e.stopPropagation(); el.textContent=periodName(p); el.blur(); }
    });
    el.addEventListener('paste',plainPaste);
    el.addEventListener('blur',()=>{
      const v=el.textContent.replace(/\s+/g,' ').trim().slice(0,MAX_PERIOD_NAME);
      const next=(v===`Period ${p}`)?'':v;
      const names=S.config.periodNames;
      if(next===(names[p-1]||'')){ el.textContent=periodName(p); return; }
      while(names.length<p) names.push('');
      names[p-1]=next;
      while(names.length&&!names[names.length-1]) names.pop();
      persist(); render();
      announce(next?`Column renamed to ${next}`:`Column name back to Period ${p}`);
    });
  });
  view.querySelectorAll('[data-gear]').forEach(g=>g.onclick=()=>openSpecial(g.dataset.gear));
  if(S.sample){
    document.getElementById('s-clear').onclick=clearSample;
    document.getElementById('s-keep').onclick=keepSample;
  }
  document.getElementById('wk-prev').onclick=()=>{curWeek--;render();refocus('wk-prev','wk-next');};
  document.getElementById('wk-next').onclick=()=>{curWeek++;render();refocus('wk-next','wk-prev');};
  document.getElementById('wk-jump').onchange=e=>{curWeek=+e.target.value;render();refocus('wk-jump');};
  document.getElementById('wk-today').onclick=()=>{
    curWeek=weekIndexFor(todayISO); render(); refocus('wk-today');
    const row=view.querySelector('.today-row'); if(row&&row.scrollIntoView) row.scrollIntoView({block:'center'});
  };
  document.getElementById('wk-print').onclick=()=>window.print();
  const fitBtn=document.getElementById('wk-fit');
  if(fitBtn) fitBtn.onclick=()=>toggleFit();
  /* The preference is saved per browser, not per screen. Someone who left
     it on at their desk and opened the same plan on a phone should get a
     readable week, not an inherited setting the phone cannot honour. */
  if(S.fit) requestAnimationFrame(()=>{
    if(gridIsTable()){ document.body.classList.add('fitscreen'); fitGrid(); }
    else document.body.classList.remove('fitscreen');
    syncFitBtn();
  });
  else requestAnimationFrame(syncFitBtn);
  wireColourHandles();
  wirePalette();
  const le=document.getElementById('legend-edit');
  if(le) le.onclick=()=>{ curView='setup'; render(); };
  updateScrollHint();
  announce(`Week ${curWeek+1} of ${YEAR.length}: ${weekLabel(w)}`);
}
/* Saved text reaches the DOM through textContent and nothing else — this second
   pass is the app's only defence for lesson content and must never be folded
   back into the template above. */
function paintCells(){
  const byIso={};
  for(const d of (YEAR[curWeek]||{days:[]}).days) byIso[d.iso]=d;
  view.querySelectorAll('.box').forEach(b=>{
    const d=byIso[b.dataset.iso]; if(!d) return;
    renderBoxLines(b, b.dataset.p==='notes' ? (S.notes[d.iso]||'') : cellText(d,+b.dataset.p));
  });
}
/* On a phone the grid is stacked and there is nothing to scroll; between tablet
   and laptop widths it scrolls, and it used to do so with no affordance at all,
   so the app looked like it had three columns. */
function updateScrollHint(){
  const gs=view.querySelector('.grid-scroll'), hint=document.getElementById('scroll-hint');
  if(!gs||!hint) return;
  hint.hidden = gs.scrollWidth <= gs.clientWidth+2;
}
addEventListener('resize',()=>{ if(curView==='week'&&S) updateScrollHint(); });
let yearStale=true;
function buildYearIfStale(){ if(yearStale){buildYear();yearStale=false;} }
function markStale(){ yearStale=true; }

/* Enter used to build <div> children inside the contenteditable, and textContent
   glued them into one run-on string — "Warm-up: djembesCall and responseCool
   down" — which is what came back after a reload. plaintext-only makes Enter a
   real newline; the keydown fallback does the same where it is unsupported. */
const PLAINTEXT_OK=(()=>{
  try{ const d=document.createElement('div'); d.setAttribute('contenteditable','plaintext-only'); return d.contentEditable==='plaintext-only'; }
  catch(e){ return false; }
})();
function boxValue(b){
  /* Read the line elements when they exist. Relying on innerText for the
     newlines was fine while a box was one text node, but each line is now its
     own element — and textContent concatenates those with nothing between
     them, turning three lines into one word. Elements first, innerText as the
     fallback for a box mid-edit that the browser has not structured yet. */
  const lines = b.querySelectorAll(':scope > .ln');
  if (lines.length) {
    return [...lines].map((d) => d.textContent.replace(/\u00a0/g, ' '))
      .join('\n').replace(/\n+$/, '');
  }
  const raw = (typeof b.innerText==='string' && b.innerText!=='') ? b.innerText : b.textContent;
  return String(raw||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').replace(/\n$/,'');
}
function onBoxInput(e){
  const b=e.target, v=boxValue(b);
  if(b.dataset.p==='notes'){ if(v)S.notes[b.dataset.iso]=v; else delete S.notes[b.dataset.iso]; }
  else {
    const k=b.dataset.key;
    if(v)S.cells[k]=v; else delete S.cells[k];
    // any pre-migration leftover shown by cellText() is now superseded
    delete S.cells[`${b.dataset.iso}|${b.dataset.p}`];
    if(k[0]==='c') delete S.cells[`d${b.dataset.iso}|${b.dataset.p}`];
  }
  /* Lines that no longer exist must not keep a colour, or deleting a note and
     typing a new one hands the new note the old one's meaning. */
  const bk = boxKeyOf(b), fills = S.lineFill && S.lineFill[bk];
  if (fills) {
    const n = v.split('\n').length;
    for (const i of Object.keys(fills)) if (+i >= n) delete fills[i];
    if (!Object.keys(fills).length) delete S.lineFill[bk];
  }
  queueSave();
}
function plainPaste(e){
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
}
function onBoxKey(e){
  if(e.key==='Escape'){ hideBar(); return; }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&barCtx){ e.preventDefault(); document.getElementById('bar-day').focus(); return; }
  if(e.key==='Enter'&&!PLAINTEXT_OK&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    e.preventDefault();
    document.execCommand('insertText',false,'\n');
  }
}

/* ------------------ copy bar ---------------------------------------- */
const bar=document.getElementById('bar');
let barCtx=null;
const barDayBtn=document.getElementById('bar-day'), barLetterBtn=document.getElementById('bar-letter');
function onBoxFocus(b){
  if(b.dataset.p==='notes'){ hideBar(); return; }
  barCtx={iso:b.dataset.iso,p:+b.dataset.p,letter:b.dataset.letter||''};
  document.getElementById('bar-hint').textContent=`${DAYNAMES[parseISO(barCtx.iso).getDay()]} · ${periodName(barCtx.p)} — Ctrl+Enter reaches these buttons`;
  barDayBtn.disabled=false;
  /* The label is deliberately the same length armed or disarmed: this row sits
     above the grid and must not change height as you tab across the week. */
  if(barCtx.letter){ barLetterBtn.hidden=false; barLetterBtn.disabled=false; barLetterBtn.textContent=`Fill all ${barCtx.letter}-days (${periodName(barCtx.p,true)})`; }
  else { barLetterBtn.hidden=true; barLetterBtn.disabled=true; }
  bar.classList.add('show');
}
function hideBar(){
  bar.classList.remove('show'); barCtx=null;
  const h=document.getElementById('bar-hint'); if(h) h.textContent='Pick a lesson box to copy from.';
  barDayBtn.disabled=true; barLetterBtn.disabled=true; barLetterBtn.hidden=false;
  barLetterBtn.textContent='Fill matching rotation days';
}
barDayBtn.onclick=()=>doCopy('day');
barLetterBtn.onclick=()=>doCopy('letter');
/* The two fill buttons used to be the most destructive thing in the app.
   Measured before this change: "Fill all A-days" reached 11 boxes across 2
   days of the current week while its label promised the year (a real 6-letter
   year has 33-34 A-days), and it overwrote five periods on the source day that
   the teacher never selected. "Fill whole day" from a box you had just cleared
   took a Tuesday from six filled cells to zero and announced "Copied to 5
   boxes". Now: the letter fill covers the whole year and only the period you
   are standing in; an empty source copies nothing; and every write is one tap
   from being undone, which is what the research asked for instead of a confirm
   dialog. */
function copyTargets(mode){
  const out=[], c=S.config;
  if(mode==='day'){
    const d=(YEAR[curWeek]||{days:[]}).days.find(x=>x.iso===barCtx.iso);
    if(!d) return out;
    for(let p=1;p<=c.periods;p++) if(p!==barCtx.p) out.push(cellKey(d,p));
  }else{
    for(const wk of YEAR) for(const d of wk.days){
      if(d.special||d.letter!==barCtx.letter) continue;
      if(d.iso===barCtx.iso) continue;
      out.push(cellKey(d,barCtx.p));
    }
  }
  return [...new Set(out)];
}
function doCopy(mode){
  if(!barCtx) return;
  const srcKey=cellKeyForFocus();
  const src=srcKey?S.cells[srcKey]:'';
  if(!src){
    SWS.toast('This box is empty, so there is nothing to copy. Type the lesson first.');
    focusSource(); return;
  }
  const targets=copyTargets(mode);
  if(!targets.length){ SWS.toast(mode==='day'?'There is only one period on this day.':`This is the only ${barCtx.letter}-day in the year.`); focusSource(); return; }
  const before=targets.map(k=>[k,S.cells[k]]);   // a snapshot cannot forget a side effect
  for(const k of targets) S.cells[k]=src;
  persist(); paintCells();
  const n=targets.length, noun=n===1?'box':'boxes';
  const what=mode==='day'?`the rest of ${DAYNAMES[parseISO(barCtx.iso).getDay()]}`:`${periodName(barCtx.p,true)} of every ${barCtx.letter}-day this year`;
  announce(`Copied to ${n} ${noun}: ${what}`);
  SWS.undo(`Copied to ${n} ${noun} — ${what}.`,()=>{
    for(const [k,v] of before){ if(v===undefined) delete S.cells[k]; else S.cells[k]=v; }
    persist(); paintCells(); announce('Copy undone');
  });
  focusSource();
}
function cellKeyForFocus(){
  const d=(YEAR[curWeek]||{days:[]}).days.find(x=>x.iso===barCtx.iso);
  return d?cellKey(d,barCtx.p):null;
}
function focusSource(){
  const back=view.querySelector(`.box[data-iso="${barCtx.iso}"][data-p="${barCtx.p}"]`);
  if(back&&back.focus) back.focus();
}

let modalReturn=null;

    <p class="sub">Mark this a no-class day. It keeps its own boxes but takes no rotation letter — so the letter <em>and the lesson you planned for it</em> both move to your next teaching day, and the rest of the year follows. One tap, and you can undo it.</p>
    <div class="opts">

function setSpecial(iso,label){
  const before={...S.special};
  if(label) S.special[iso]=String(label).slice(0,60); else delete S.special[iso];
  markStale(); persist(); closeModal(); render();
  const g=view.querySelector(`[data-gear="${iso}"]`); if(g) g.focus();
  const when=`${DAYNAMES[parseISO(iso).getDay()]} ${niceDate(iso)}`;
  const msg=label
    ? `${when} is now “${label}”. Every lesson after it moved forward one rotation day.`
    : `${when} is a normal teaching day again. The lessons after it moved back.`;
  announce(msg);
  SWS.undo(msg,()=>{
    S.special=before; markStale(); persist(); render();
    announce('Undone');
    const g2=view.querySelector(`[data-gear="${iso}"]`); if(g2) g2.focus();
  });
}
function closeModal(){
  modal.classList.remove('show');
  if(modalReturn){ if(modalReturn.focus) modalReturn.focus(); modalReturn=null; }
}
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('show')) return;
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key!=='Tab') return;
  const f=[...sheet.querySelectorAll('button,input')].filter(x=>!x.disabled);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
  else if(!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
});

/* One text box per period so renaming works on a phone too — the grid's
   tap-to-rename heading only exists where the header row is on screen. */
function periodNameInputs(n,names){

/* Every rejection names the field it is about and puts the cursor in it. The
   research's phantom-validation complaint ("an error telling me to pick a valid
   start time, but nothing is wrong with the time I pick") is the thing to
   avoid; a generic alert about "your dates" when the teaching days are the
   problem is the same defect. */
function setupError(id,msg){
  SWS.toast(msg,{assertive:true,ms:8000});
  announce(msg);
  const el=document.getElementById(id); if(el&&el.focus) el.focus();
  return false;
}
function applySetup(){
  const startEl=document.getElementById('f-start');
  if(!startEl) return;                    // re-entrancy guard: the view is gone
  const c=S.config;
  const st=startEl.value, en=document.getElementById('f-end').value;
  if(!parseISO(st)) return setupError('f-start','Pick a first day of the school year.');
  if(!parseISO(en)) return setupError('f-end','Pick a last day of the school year.');
  if(en<st) return setupError('f-end',`The last day has to come after ${niceDate(st)}. Pick a later date.`);
  const days=[...document.querySelectorAll('#f-days .dp.on')].map(b=>+b.dataset.d);
  if(!days.length) return setupError('f-days','Pick at least one day of the week that you teach.');
  const rawLetters=document.getElementById('f-letters').value.split(',').map(x=>x.trim()).filter(Boolean);
  const letters=rawLetters.map(x=>x.slice(0,MAX_LETTER_LEN)).slice(0,MAX_LETTERS);
  /* Nine letters used to be sliced to six in silence, which generated a whole
     year on the wrong cycle length. */
  if(rawLetters.length>MAX_LETTERS) return setupError('f-letters',`That is ${rawLetters.length} rotation letters and this planner handles ${MAX_LETTERS}. Remove ${rawLetters.length-MAX_LETTERS} and apply again.`);
  const tooLong=rawLetters.find(x=>x.length>MAX_LETTER_LEN);
  if(tooLong) return setupError('f-letters',`“${tooLong}” is too long for a rotation label — keep each one to ${MAX_LETTER_LEN} characters or fewer.`);

  c.yearStart=st; c.yearEnd=en; c.workDays=days;
  const per=Math.round(Number(document.getElementById('f-periods').value));
  c.periods=Number.isFinite(per)&&per>0?Math.min(MAX_PERIODS,per):6;
  document.getElementById('f-periods').value=c.periods;
  const la=Math.round(Number(document.getElementById('f-lunch').value));
  c.lunchAfter=Number.isFinite(la)?Math.max(0,Math.min(c.periods,la)):Math.min(2,c.periods);
  c.periodNames=Array.from({length:c.periods},(_,i)=>{
    const el=document.getElementById('f-pn-'+(i+1));
    const v=(el?el.value:(c.periodNames[i]||'')).replace(/\s+/g,' ').trim().slice(0,MAX_PERIOD_NAME);
    return v===`Period ${i+1}`?'':v;      // typing the default back means "no custom name"
  });
  while(c.periodNames.length&&!c.periodNames[c.periodNames.length-1]) c.periodNames.pop();
  c.letters=letters.length?letters:['A'];
  c.teacher=document.getElementById('f-teacher').value.trim().slice(0,80);
  markStale(); persist();
  buildYearIfStale();
  if(!YEAR.length) return setupError('f-start',yearProblem());
  if(yearTruncated) SWS.toast(`That span is longer than this planner builds in one go — it stops after ${YEAR.length} weeks.`,{ms:8000});
  curWeek=weekIndexFor(fmtISO(new Date()));
  curView='week'; render(); refocus('wk-jump');
}
function applyPrintMode(){ document.body.dataset.print = (S&&S.config.printMode==='full')?'full':'compact'; }

/* ------------------ backup / csv / reset ---------------------------- */
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function backupJSON(){ return JSON.stringify({app:'palette',version:2,exported:new Date().toISOString(),state:S},null,1); }
function exportBackup(){ download(`specials-planner-backup-${fmtISO(new Date())}.json`,backupJSON(),'application/json'); }
function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ if(applyImportedText(r.result)) { curView='week'; curWeek=weekIndexFor(fmtISO(new Date())); render(); } };
    r.readAsText(f);
  };
  inp.click();
}
/* Restoring used to replace a 1,200-lesson year with one tap: no description of
   what was in the file, no confirm, no way back. It is one click from the front
   door and it is the single most destructive action in the app. */
function describeBackup(st){
  const n=Object.keys(st.cells).length, c=st.config;
  const a=parseISO(c.yearStart), b=parseISO(c.yearEnd);   // a hand-edited file can carry anything
  const span=(a&&b)?`, ${niceDate(c.yearStart)} ${a.getFullYear()} to ${niceDate(c.yearEnd)} ${b.getFullYear()}`:'';
  return `${n} ${n===1?'lesson':'lessons'}${span}`;
}
function applyImportedText(text){
  let st;
  try{
    const j=JSON.parse(text);
    st=migrate(j.state||j);                // tolerate raw-state or wrapped backups
    if(!st) throw 0;
  }catch(e){ alert("That file doesn't look like a Specials Planner backup."); return false; }
  const before=S?JSON.stringify(S):null;
  if(before){
    const mine=Object.keys(S.cells).length;
    if(!confirm(`This backup holds ${describeBackup(st)}.\n\nIt will replace the year on this device (${mine} ${mine===1?'lesson':'lessons'}). Continue?`)) return false;
  }
  S=st; markStale(); persist();
  if(before) SWS.undo(`Restored ${describeBackup(st)}.`,()=>{
    S=JSON.parse(before); markStale(); persist(); render(); announce('Restore undone');
  });
  return true;
}
/* Two things Excel does to an honest export: it mojibakes UTF-8 without a BOM
   ("Señor Nguyễn · 音楽"), and it executes any cell that starts with = + - or @.
   A lesson line pasted off a website should not become a live formula in a
   teacher's spreadsheet. */
function csvField(v){
  v=String(v??'');
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v;
  return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
}
function exportCSV(){
  buildYearIfStale();
  const c=S.config;
  const head=['Date','Weekday','Rotation',...Array.from({length:c.periods},(_,i)=>periodName(i+1)),'Notes'];
  const lines=[head.join(',')];
  for(const w of YEAR) for(const d of w.days){
    const row=[d.iso,DAYNAMES[d.dow],d.special?d.special:(d.letter||'')];
    for(let p=1;p<=c.periods;p++) row.push(cellText(d,p));
    row.push(S.notes[d.iso]||'');
    lines.push(row.map(csvField).join(','));
  }
  download(`specials-planner-${c.yearStart.slice(0,4)}.csv`,'\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
function resetAll(){
  if(!confirm('Erase everything on this device? Download a backup first if you want to keep it.')) return;
  const before=S?JSON.stringify(S):null;
  S=null; store.del(KEY); curWeek=0; markStale(); render();
  if(before) SWS.undo('Everything erased.',()=>{
    S=migrate(JSON.parse(before)); markStale(); persist();
    curWeek=weekIndexFor(fmtISO(new Date())); curView='week'; render(); announce('Restored');
  });
}

/* ------------------ GOOGLE DRIVE (optional) --------------------------
   Enabled only when CLIENT_ID is set. Uses Google Identity Services token
   flow + Drive REST with the drive.file scope (app-created files only —
   the non-sensitive scope, no restricted-scope review needed).           */
let driveToken=null, gisReady=false, tokenClient=null;
function mountDrive(){
  const slot=document.getElementById('drive-slot');
  if(!slot||!CLIENT_ID) return;
  slot.innerHTML=`<button class="btn" id="d-drive-save">Save to Google Drive</button>
                  <button class="btn" id="d-drive-load">Load from Drive</button>`;
  document.getElementById('d-drive-save').onclick=()=>withDriveToken(driveSave);
  document.getElementById('d-drive-load').onclick=()=>withDriveToken(driveLoad);
  if(!gisReady && !document.getElementById('gsi')){
    const s=document.createElement('script');
    s.id='gsi'; s.src='https://accounts.google.com/gsi/client'; s.async=true;
    s.onload=()=>{ gisReady=true; };
    document.head.appendChild(s);
  }
}
function withDriveToken(fn){
  if(driveToken){ fn(); return; }
  if(!window.google?.accounts?.oauth2){ alert('Google sign-in is still loading — try again in a second.'); return; }
  tokenClient=tokenClient||google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/drive.file',
    callback:(resp)=>{ if(resp.access_token){ driveToken=resp.access_token; fn(); } }
  });
  tokenClient.requestAccessToken();
}
async function driveSave(){
  try{
    const meta={name:'Specials Planner.json',mimeType:'application/json'};
    const boundary='paletteb'+Date.now();
    const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${backupJSON()}\r\n--${boundary}--`;
    const id=S.config.driveFileId;
    const url=id
      ? `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const res=await fetch(url,{method:id?'PATCH':'POST',
      headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':`multipart/related; boundary=${boundary}`},body});
    if(res.status===401){ driveToken=null; alert('Google session expired — tap Save again to sign back in.'); return; }
    if(!res.ok) throw new Error(res.status);
    const j=await res.json();
    if(j.id&&j.id!==S.config.driveFileId){ S.config.driveFileId=j.id; persist(); }
    alert('Saved to your Google Drive.');
  }catch(e){ alert('Drive save didn\'t go through — check your connection and try again.'); }
}
async function driveLoad(){
  try{
    let id=S.config.driveFileId;
    if(!id){
      const q=encodeURIComponent("name='Specials Planner.json' and trashed=false");
      const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=1&fields=files(id,name)`,
        {headers:{Authorization:`Bearer ${driveToken}`}});
      const j=await res.json();
      if(!j.files||!j.files.length){ alert('No Specials Planner file found in your Drive yet — save one first.'); return; }
      id=j.files[0].id;
    }
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:`Bearer ${driveToken}`}});
    if(res.status===401){ driveToken=null; alert('Google session expired — tap Load again to sign back in.'); return; }
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    if(applyImportedText(text)){ S.config.driveFileId=id; persist(); curView='week'; render(); }
  }catch(e){ alert('Couldn\'t load from Drive — check your connection and try again.'); }
}

/* ------------------ boot -------------------------------------------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{curView=t.dataset.view;render();window.scrollTo(0,0);});
document.querySelector('.tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  const tabs=[...document.querySelectorAll('.tab')];
  const i=tabs.indexOf(document.activeElement);
  if(i<0) return;
  const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];
  n.focus(); n.click();
});
document.getElementById('save-alert-backup').onclick=exportBackup;
/* The last 400ms of typing used to die with the tab. Both hooks matter: iOS
   Safari often never fires beforeunload, and a phone locking mid-sentence
   fires visibilitychange and nothing else. */
addEventListener('pagehide',flushSave);
addEventListener('beforeunload',flushSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });
loadState();
if(S){ buildYearIfStale(); curWeek=weekIndexFor(fmtISO(new Date())); }
render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
