    </div>
    <nav class="tabs" aria-label="Views">
      <button class="tab" data-view="week">This week</button>
      <button class="tab" data-view="setup">Setup</button>
    </nav>
  </div>
</header>

<!-- A failed write used to be silent while the green "Saved" pill still ran.
     This is the loud, actionable version, and it lives outside #view so a
     re-render cannot wipe it. -->
<div class="wrap" id="alert-wrap" hidden>
  <p class="warn" id="save-alert" role="alert">
    <span id="save-alert-text"></span>
    <button class="btn" id="save-alert-backup">Download a backup now</button>
  </p>
</div>

<main class="wrap" id="view"></main>
<div id="live" class="sr-only" aria-live="polite"></div>

<div id="bar" class="no-print" hidden>
  <div class="inner">
    <span class="hint" id="bar-hint">Pick a lesson box to copy from.</span>
    <button class="btn" id="bar-day" disabled>Fill whole day</button>
    <button class="btn" id="bar-letter" disabled>Fill matching rotation days</button>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet" id="modal-sheet"></div>
</div>

<script>
/* =====================================================================
   Specials Planner — single-file specials lesson planner.
   Vanilla JS, no build step. State lives in localStorage key "palette2".
   Handoff notes for Claude Code live in HANDOFF.md next to this file.
   ===================================================================== */

/* ------------------ config seams (fill these to enable) ------------- */
const CLIENT_ID = "";   // Google OAuth Web Client ID → enables Drive save/load (scope: drive.file). Empty = feature hidden.
const TIP_URL   = "https://buy.stripe.com/7sY7sM6PD91l3fn45P7EQ0l";   // Stripe Payment Link URL → shows a quiet tip-jar link in Setup. Empty = hidden.

/* ------------------ shared runtime --------------------------------- */
/* sws-ui.js (loaded in <head>) supplies SWS.toast / SWS.undo / SWS.saved and is
   in the service worker's shell list, so in a real browser it is always there.
   This fallback exists so the app degrades to "still works, still announces"
   rather than throwing if it is ever missing — a headless test rig, or a first
   paint where the file 404s. The fallback keeps the undo callback reachable
   instead of silently dropping it. */
const SWS = (window.SWS && window.SWS.toast) ? window.SWS : {
  toast(msg,opts){ announce(msg); if(opts&&opts.action) SWS._undo=opts.action.onAction; },
  undo(msg,fn){ SWS._undo=fn; announce(msg); },
  saved(o){ const el=document.getElementById('saved'); if(el){ el.textContent=(o&&o.text)||'Saved'; el.classList.add('show'); } }
};

/* ------------------ storage shim ------------------------------------
   Two rules learned the hard way:
   1. A write is only a save if you can read it back. A school Chromebook with
      storage restrictions throws QuotaExceededError, and the old shim swallowed
      it into an in-memory object that get() could never return — so the app
      said "Saved", held nothing, and dropped the whole year on the next load.
      set() now verifies and reports, and get() prefers the in-memory copy so a
      session keeps working after a failed write instead of reading back stale.
   2. Nothing here ever leaves the device.                                   */
const KEY='palette2';
const store={
  ok:(()=>{try{localStorage.setItem('__pt','1');localStorage.removeItem('__pt');return true}catch(e){return false}})(),
  mem:{},
  get(k){ if(k in this.mem) return this.mem[k]; if(this.ok){try{return localStorage.getItem(k)}catch(e){}} return null },
  set(k,v){
    if(this.ok){
      try{
        localStorage.setItem(k,v);
        if(localStorage.getItem(k)===v){ delete this.mem[k]; return true; }
      }catch(e){}
    }
    this.mem[k]=v;            // keep the session usable, but do not claim a save
    return false;
  },
  del(k){ if(this.ok){try{localStorage.removeItem(k)}catch(e){}} delete this.mem[k] }
};

/* ------------------ state ------------------------------------------- */
let S=null;           // null → welcome screen
let YEAR=[];          // [{monday, days:[{iso,dow,letter,special}]}]
let curView='week';
let curWeek=0;
let saveT=null;

function defaultConfig(){
  const y=new Date().getFullYear();
  const aug=new Date(y, 7, 1);              // Aug 1 this year
  const start=(new Date()>aug)? aug : new Date(y,7,1);
  return {
    yearStart:`${start.getFullYear()}-08-24`,
    yearEnd:`${start.getFullYear()+1}-05-28`,
    workDays:[1,2,3,4,5],
    periods:6, lunchAfter:2,
    letters:['A','B','C'],
    teacher:'', driveFileId:'', printMode:'compact'
  };
}
const MAX_LETTERS=12, MAX_LETTER_LEN=4, MAX_PERIODS=10, MAX_WEEKS=300;
/* A hand-edited or legacy backup is the one file a teacher carries between
   devices, so every shape that arrives through it is coerced rather than
   trusted. `cells:[]` used to survive as an array and then serialise back as
   "[]" — a whole year of lessons discarded on the next write. */
const plainObj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
function normalizeConfig(c){
  const d=defaultConfig();
  for(const k in d) if(c[k]===undefined) c[k]=d[k];
  const per=Math.round(Number(c.periods));
  c.periods=Number.isFinite(per)?Math.max(1,Math.min(MAX_PERIODS,per)):6;
  /* `+c.lunchAfter??2` bound the unary plus tighter than ??, so a non-numeric
     value became NaN and survived both clamps — the lunch column vanished with
     no error at all. */
  const la=Math.round(Number(c.lunchAfter));
  c.lunchAfter=Number.isFinite(la)?Math.max(0,Math.min(c.periods,la)):Math.min(2,c.periods);
  if(!Array.isArray(c.letters)) c.letters=['A','B','C'];
  c.letters=c.letters.map(x=>String(x).trim().slice(0,MAX_LETTER_LEN)).filter(Boolean).slice(0,MAX_LETTERS);
  if(!c.letters.length) c.letters=['A'];
  if(!Array.isArray(c.workDays)) c.workDays=[1,2,3,4,5];
  /* workDays holding 'Mon' instead of 1 used to dead-end the whole app on
     "No weeks yet — check your year dates", which was the wrong diagnosis. */
  c.workDays=[...new Set(c.workDays.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))];
  if(!c.workDays.length) c.workDays=[1,2,3,4,5];
  c.teacher=String(c.teacher??'').slice(0,80);
  return c;
}
function migrate(s){
  if(!s||typeof s!=='object'||!s.config||typeof s.config!=='object'||Array.isArray(s.config)) return null;
  s.cells=plainObj(s.cells); s.notes=plainObj(s.notes); s.special=plainObj(s.special);
  normalizeConfig(s.config);
  migrateCellKeys(s);
  return s;
}

/* ------------------ cycle-position keys ------------------------------
   THE central correction in this app. Lessons used to be stored against the
   calendar date ("2026-09-17|3"). Cancel one Wednesday and the rotation letters
   all slide forward correctly while the lessons stay nailed to their dates —
   Thursday becomes letter C and still holds the lesson written for D, for the
   rest of the year. The label was right and the plan underneath it was wrong.

   Lessons are now keyed to the position in the teaching cycle instead:
     c<n>|<period>   the nth teaching day of the year (the letter is derived
                     from n, so plan and letter can never drift apart)
     d<iso>|<period> a no-class day, which has no cycle position but keeps its
                     boxes ("sub covering", "field trip packing list")
   Marking a day "no school" removes it from the sequence, so every later day
   inherits the position — and therefore the plan — that used to belong to the
   day before it. That IS the bump. Notes stay keyed to the date, because
   "picture day" belongs to Thursday, not to cycle day C.                    */
function migrateCellKeys(s){
  const legacy=/^(\d{4}-\d{2}-\d{2})\|(.+)$/;
  if(!Object.keys(s.cells).some(k=>legacy.test(k))) return;
  const idxByIso=isoIndexMap(s.config,s.special);
  const out={};
  for(const k of Object.keys(s.cells)){
    const m=legacy.exec(k);
    if(!m){ out[k]=s.cells[k]; continue; }
    const iso=m[1], p=m[2], idx=idxByIso[iso];
    out[(idx===undefined||s.special[iso])?`d${iso}|${p}`:`c${idx}|${p}`]=s.cells[k];
  }
  s.cells=out;
}
function isoIndexMap(config,special){
  const map={};
  for(const w of computeYear(config,special||{})) for(const d of w.days) if(d.idx!=null) map[d.iso]=d.idx;
  return map;
}
function loadState(){ try{const r=store.get(KEY); S=r?migrate(JSON.parse(r)):null}catch(e){S=null} }

/* Saving, said honestly.
   - persist() writes, verifies, and only then shows the flag.
   - the flag carries a clock time and stays put, because "did it save?" is the
     one question a local-first planner has to be able to answer at a glance.
   - it is a role=status carrying real text, so a screen reader hears it too;
     the time only changes once a minute, so typing does not become chatter. */
let saveFailed=false;
function persist(quiet){
  const wrote=store.set(KEY,JSON.stringify(S));
  saveFailed=!wrote;
  showSaveAlert(!wrote);
  if(wrote&&!quiet) flashSaved();
  return wrote;
}
function queueSave(){ clearTimeout(saveT); saveT=setTimeout(()=>{saveT=null;persist();},400); }
/* The last 400ms of typing used to die with the tab: no pagehide, no
   visibilitychange, no beforeunload anywhere. Type a line, lock the phone,
   lose the line. */
function flushSave(){ if(saveT){ clearTimeout(saveT); saveT=null; persist(true); } }
function hhmm(d){ return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
function flashSaved(){ SWS.saved({text:`Saved ${hhmm(new Date())}`,ms:36e5}); }
function showSaveAlert(on){
  const wrap=document.getElementById('alert-wrap');
  if(!wrap) return;
  if(!on){ wrap.hidden=true; return; }
  if(!wrap.hidden) return;                       // already shouting; do not re-announce per keystroke
  document.getElementById('save-alert-text').textContent =
    'This browser refused to save. Your plans are only in this tab right now — if you close it they are gone. Download a backup, then try a different browser or ask for storage to be allowed on this device.';
  wrap.hidden=false;
  const el=document.getElementById('saved'); if(el){ el.textContent=''; el.classList.remove('show'); }
  SWS.toast('Could not save on this device — download a backup.',{assertive:true,ms:9000});
}

/* ------------------ dates ------------------------------------------- */
const DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYABBR=['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseISO(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null; const[y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return isNaN(dt)?null:dt; }
function fmtISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function niceDate(iso){ const d=parseISO(iso); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function weekLabel(w){
  const a=parseISO(w.days[0].iso), b=parseISO(w.days[w.days.length-1].iso);
  const yr=b.getFullYear();
  return a.getMonth()===b.getMonth()
    ? `${MONTHS[a.getMonth()]} ${a.getDate()}–${b.getDate()}, ${yr}`
    : `${MONTHS[a.getMonth()]} ${a.getDate()} – ${MONTHS[b.getMonth()]} ${b.getDate()}, ${yr}`;
}

/* ------------------ year builder ------------------------------------ */
/* Rotation letters cycle continuously over school days across the whole
   year. Days marked "special" (no school / work day) show a banner and do
   NOT consume a letter — so the rotation stays true after breaks.        */
let yearTruncated=false;
function computeYear(c,special){
  const out=[], start=parseISO(c.yearStart), end=parseISO(c.yearEnd);
  yearTruncated=false;
  if(!start||!end||end<start) return out;
  let li=0;
  let cur=addDays(start,-((start.getDay()+6)%7));   // back to that week's Monday
  let guard=0;
  while(cur<=end){
    /* The old cap was `guard++<80`, so a two-year span silently stopped in
       March of the second year while Setup still showed the date the teacher
       typed. The bound is the end date now; the guard is only a runaway stop
       and it says so out loud when it fires. */
    if(guard++>=MAX_WEEKS){ yearTruncated=true; break; }
    const days=[];
    for(let i=0;i<7;i++){
      const d=addDays(cur,i), dow=d.getDay();
      if(!c.workDays.includes(dow)) continue;
      if(d<start||d>end) continue;
      const iso=fmtISO(d), sp=special[iso]||null;
      let letter=null, idx=null;
      if(!sp){ idx=li; letter=c.letters[li%c.letters.length]; li++; }
      days.push({iso,dow,letter,idx,special:sp});
    }
    if(days.length) out.push({monday:fmtISO(cur),days});
    cur=addDays(cur,7);
  }
  return out;
}
function buildYear(){ YEAR = S ? computeYear(S.config,S.special) : []; }

/* Where a day's lesson lives. See migrateCellKeys for why. */
function cellKey(d,p){ return d.special?`d${d.iso}|${p}`:`c${d.idx}|${p}`; }
function cellText(d,p){
  const v=S.cells[cellKey(d,p)];
  if(v!==undefined) return v;
  /* Safety net for anything a migration could not place (a lesson written on a
     date that later fell outside the year): show it on its date rather than
     lose it. */
  const legacy=S.cells[`d${d.iso}|${p}`] ?? S.cells[`${d.iso}|${p}`];
  return legacy===undefined?'':legacy;
}
function weekIndexFor(iso){
  for(let i=0;i<YEAR.length;i++){
    const w=YEAR[i], last=w.days[w.days.length-1].iso;
    if(iso<=last) return i;
  }
  return YEAR.length?YEAR.length-1:0;
}

/* ------------------ safe text --------------------------------------- */
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ------------------ focus & announcements ---------------------------
   Re-rendering replaces the whole view, so anything that re-renders must
   put keyboard focus somewhere sensible afterward; announce() feeds the
   one polite live region (the view itself must NOT be live — it would
   read the entire week table on every render).                          */
function refocus(id,fallback){
  const el=document.getElementById(id);
  if(el&&!el.disabled){ el.focus(); return; }
  if(fallback){ const f=document.getElementById(fallback); if(f&&!f.disabled) f.focus(); }
}
function announce(msg){
  const el=document.getElementById('live'); if(!el) return;
  el.textContent=''; setTimeout(()=>{ el.textContent=msg; },30);
}

/* ------------------ render root ------------------------------------- */
const view=document.getElementById('view');
function render(){
  hideBar(); closeModal();
  applyPrintMode();
  bar.hidden=true;
  const tabs=document.querySelector('.tabs');
  if(!S){ tabs.style.display='none'; renderWelcome(); return; }
  tabs.style.display='flex';
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.view===curView;t.classList.toggle('active',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
  if(curView==='week') renderWeek(); else renderSetup();
}

/* ------------------ the promise, as a stamp -------------------------
   Research finding across the portfolio: nobody believes a privacy claim
   written as grey footer prose. It has to look like a stamp on the thing, and
   it has to say what THIS app holds. Everything below is literally true of
   this file: no network call exists anywhere in it unless CLIENT_ID is filled
   in, and the state object is only config, cells, notes and special. */
const TRUST_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6.5v5c0 4.6 3.2 8.3 8 9.5 4.8-1.2 8-4.9 8-9.5v-5L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>';
function trustHTML(full){
  const drive=CLIENT_ID?' The one exception is the Google Drive button, which uploads that same backup file to your own Drive when you press it.':'';
  const body=full
    ? `<b>No account, no upload, no student names.</b> The planner only knows dates, periods and rotation letters — there is no roster in it, so there is nothing here for a district to vet. Your lessons stay in this browser, on this device, and leave only in a backup or CSV file you download yourself.${drive}`
    : `<b>Nothing leaves this device.</b> No account, no student names.`;
  return `<p class="trust">${TRUST_SVG}<span>${body}</span></p>`;
}

/* ------------------ welcome ----------------------------------------- */
function renderWelcome(){
  view.innerHTML=`<div class="hero-w">
    <h2>Plan your whole year once.</h2>
    <p>A lesson planner built for specials teachers — art, music, PE, library. Set up your schedule one time and every week of the year is ready to fill in. Lessons follow your rotation, so a snow day moves the plans along with the letters.</p>
    ${trustHTML(true)}
    <div class="choices">
      <button class="btn primary" id="w-fresh">Start fresh →</button>
      <button class="btn" id="w-sample">See a sample first</button>
      <button class="btn ghost" id="w-import">Restore from a backup file</button>
    </div></div>
    <div class="footnote">Works on your phone or laptop · print a week for subs · export to a spreadsheet anytime.<br>A free tool by <a href="../">Sky Wolf Studios</a> · <a href="privacy.html">Privacy &amp; accessibility</a> · <a href="mailto:stephenfurpahs@gmail.com?subject=Feedback%3A%20Specials%20Planner">Feedback</a></div>`;
  document.getElementById('w-fresh').onclick=startFresh;
  document.getElementById('w-sample').onclick=loadSample;
  document.getElementById('w-import').onclick=importBackup;
}
function startFresh(){ S={config:defaultConfig(),cells:{},notes:{},special:{}}; buildYear(); persist(); curView='setup'; render(); }
function loadSample(){
  S={config:defaultConfig(),cells:{},notes:{},special:{},sample:true};
  buildYear();
  if(YEAR.length){
    const first=YEAR[0].days[0];
    S.special[first.iso]='Teacher work day';
    buildYear();                                   // rebuild so letters shift
    for(const d of YEAR[0].days){
      if(d.special) { S.notes[d.iso]='Set up room · hang welcome board'; continue; }
      for(let p=1;p<=S.config.periods;p++){
        if(p===3||p===4){ S.cells[cellKey(d,p)]='No kindergarten yet'; continue; }
        S.cells[cellKey(d,p)]='Welcome + rules\nName-tag design\nSketchbook covers';
      }
      S.notes[d.iso]='Collect supply forms';
    }
  }
  persist(); curWeek=0; curView='week'; render();
}
/* The sample used to be written straight into the real store with no banner
   and no way back, so a teacher who "just looked" ended up typing over
   somebody else's sketchbook covers all year. */
function clearSample(){
  const before=JSON.stringify(S);
  S={config:S.config,cells:{},notes:{},special:{}};
  markStale(); persist(); render();
  SWS.undo('Sample cleared — the year is empty and yours.',()=>{ S=JSON.parse(before); markStale(); persist(); render(); });
}
function keepSample(){ delete S.sample; persist(); render(); }

/* ------------------ week view --------------------------------------- */
/* "No weeks yet — check your year dates" was shown whenever the year came out
   empty, including when the dates were perfect and the teaching days were the
   problem. An error that names the wrong field is the complaint this app was
   built to avoid, quoted verbatim in the research. */
function yearProblem(){
  const c=S.config, st=parseISO(c.yearStart), en=parseISO(c.yearEnd);
  if(!st) return `The first day of the year (“${c.yearStart}”) is not a date this app can read. Set it in Setup.`;
  if(!en) return `The last day of the year (“${c.yearEnd}”) is not a date this app can read. Set it in Setup.`;
  if(en<st) return `The last day (${niceDate(c.yearEnd)}) comes before the first day (${niceDate(c.yearStart)}). Swap them in Setup.`;
  if(!c.workDays.length) return 'No teaching days are selected. Pick at least one in Setup.';
  const names=c.workDays.slice().sort().map(d=>DAYNAMES[d]).join(', ');
  return `Your year runs ${niceDate(c.yearStart)} to ${niceDate(c.yearEnd)}, and no ${names} falls inside it. Widen the dates or add another teaching day in Setup.`;
}
function renderWeek(){
  buildYearIfStale();
  if(!YEAR.length){
    view.innerHTML=`<div class="card"><h2>No weeks yet</h2><p class="sub">${esc(yearProblem())}</p><button class="btn primary" id="go-setup">Open Setup</button></div>`;
    document.getElementById('go-setup').onclick=()=>{curView='setup';render();};
    return;
  }
  curWeek=Math.max(0,Math.min(YEAR.length-1,curWeek));
  const w=YEAR[curWeek], c=S.config, todayISO=fmtISO(new Date());
  const preL=c.lunchAfter, teacher=c.teacher?` · ${esc(c.teacher)}`:'';

  let head=`<tr><th class="day-h" scope="col">Day</th>`;
  for(let p=1;p<=c.periods;p++){
    if(p===preL+1) head+=`<th class="lunch-h" scope="col" aria-label="Lunch">🍎</th>`;
    head+=`<th scope="col">Period ${p}</th>`;
  }
  if(preL===c.periods) head+=`<th class="lunch-h" scope="col" aria-label="Lunch">🍎</th>`;
  head+=`<th class="notes-h" scope="col">Notes</th></tr>`;

  const ce=PLAINTEXT_OK?'plaintext-only':'true';
  const lunchCell=`<td class="lunch"><span aria-hidden="true">lunch</span></td>`;
  let rows='';
  for(const d of w.days){
    const li=d.letter?c.letters.indexOf(d.letter):-1;
    const chip=d.letter?`<span class="chip l${(li<0?0:li)%6}"><span class="sr-only">Rotation day </span>${esc(d.letter)}</span>`:'';
    const banner=d.special?`<span class="sp-banner">${esc(d.special)}</span>`:'';
    const dayName=`${DAYNAMES[d.dow]} ${niceDate(d.iso)}`;
    const rot=d.letter?`, rotation day ${esc(d.letter)}`:(d.special?`, ${esc(d.special)}`:'');
    rows+=`<tr class="${d.special?'sp-row':''} ${d.iso===todayISO?'today-row':''}">
      <td class="day-td"><div class="day-cell">
        <div>
          <div class="day-name">${DAYNAMES[d.dow]}</div>
          <div class="day-date">${niceDate(d.iso)}${d.iso===todayISO?'<span class="sr-only">, today</span>':''}</div>
        </div>
        <div class="day-foot">${chip}<button class="day-gear no-print" data-gear="${d.iso}" aria-label="Day settings for ${dayName}">⚙</button></div>
        ${banner}
      </div></td>`;
    for(let p=1;p<=c.periods;p++){
      if(p===preL+1) rows+=lunchCell;
      rows+=`<td data-label="Period ${p}"><div class="box" contenteditable="${ce}" role="textbox" aria-multiline="true" aria-label="${dayName}${rot}, period ${p}" data-iso="${d.iso}" data-p="${p}" data-letter="${esc(d.letter||'')}" data-key="${esc(cellKey(d,p))}"></div></td>`;
    }
    if(preL===c.periods) rows+=lunchCell;
    rows+=`<td data-label="Notes"><div class="box" contenteditable="${ce}" role="textbox" aria-multiline="true" aria-label="Notes for ${dayName}" data-iso="${d.iso}" data-p="notes"></div></td></tr>`;
  }

  const opts=YEAR.map((wk,i)=>`<option value="${i}" ${i===curWeek?'selected':''}>Wk ${i+1} · ${weekLabel(wk)}</option>`).join('');
  const sampleBar=S.sample?`<div class="sample-bar no-print"><span class="warn">You are looking at a sample week — this text is not yours.</span>
      <button class="btn" id="s-clear">Clear the sample</button><button class="btn ghost" id="s-keep">Keep it, it's mine now</button></div>`:'';
  const truncated=yearTruncated?`<p class="warn no-print">That is a very long span, so the grid stops after ${YEAR.length} weeks. Shorten the year in Setup if you need the end of it.</p>`:'';
  view.innerHTML=`
    <div class="weeknav no-print">
      <button class="btn" id="wk-prev" aria-label="Previous week" ${curWeek===0?'disabled':''}>‹</button>
      <button class="btn" id="wk-next" aria-label="Next week" ${curWeek===YEAR.length-1?'disabled':''}>›</button>
      <select id="wk-jump" aria-label="Jump to week">${opts}</select>
      <button class="btn" id="wk-today">Today</button>
      <span class="spacer"></span>
      <button class="btn" id="wk-print">Print</button>
    </div>
    ${trustHTML(false)}
    ${sampleBar}${truncated}
    <h2 class="sr-only">Week ${curWeek+1} of ${YEAR.length}: ${weekLabel(w)}</h2>
    <p class="scroll-hint no-print" id="scroll-hint" hidden>The periods run off to the right — scroll the grid sideways to reach them. The day column stays put.</p>
    <div class="print-title">Specials Planner · Week of ${weekLabel(w)}${teacher}</div>
    <div class="grid-scroll"><table class="week" style="--cols:${c.periods}" aria-label="Week of ${weekLabel(w)}"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="footnote no-print">Tap a box to type — Enter starts a new line. Everything saves as you go.</div>`;

  const gs=view.querySelector('.grid-scroll');
  view.insertBefore(bar,gs); bar.hidden=false;   // in the flow, above the grid
  paintCells();
  view.querySelectorAll('.box').forEach(b=>{
    b.addEventListener('input',onBoxInput);
    b.addEventListener('focus',()=>onBoxFocus(b));
    b.addEventListener('paste',plainPaste);
    b.addEventListener('keydown',onBoxKey);
  });
  view.querySelectorAll('[data-gear]').forEach(g=>g.onclick=()=>openSpecial(g.dataset.gear));
  if(S.sample){
    document.getElementById('s-clear').onclick=clearSample;
    document.getElementById('s-keep').onclick=keepSample;
  }
  document.getElementById('wk-prev').onclick=()=>{curWeek--;render();refocus('wk-prev','wk-next');};
  document.getElementById('wk-next').onclick=()=>{curWeek++;render();refocus('wk-next','wk-prev');};
  document.getElementById('wk-jump').onchange=e=>{curWeek=+e.target.value;render();refocus('wk-jump');};
  document.getElementById('wk-today').onclick=()=>{
    curWeek=weekIndexFor(todayISO); render(); refocus('wk-today');
    const row=view.querySelector('.today-row'); if(row&&row.scrollIntoView) row.scrollIntoView({block:'center'});
  };
  document.getElementById('wk-print').onclick=()=>window.print();
  updateScrollHint();
  announce(`Week ${curWeek+1} of ${YEAR.length}: ${weekLabel(w)}`);
}
/* Saved text reaches the DOM through textContent and nothing else — this second
   pass is the app's only defence for lesson content and must never be folded
   back into the template above. */
function paintCells(){
  const byIso={};
  for(const d of (YEAR[curWeek]||{days:[]}).days) byIso[d.iso]=d;
  view.querySelectorAll('.box').forEach(b=>{
    const d=byIso[b.dataset.iso]; if(!d) return;
    b.textContent = b.dataset.p==='notes' ? (S.notes[d.iso]||'') : cellText(d,+b.dataset.p);
  });
}
/* On a phone the grid is stacked and there is nothing to scroll; between tablet
   and laptop widths it scrolls, and it used to do so with no affordance at all,
   so the app looked like it had three columns. */
function updateScrollHint(){
  const gs=view.querySelector('.grid-scroll'), hint=document.getElementById('scroll-hint');
  if(!gs||!hint) return;
  hint.hidden = gs.scrollWidth <= gs.clientWidth+2;
}
addEventListener('resize',()=>{ if(curView==='week'&&S) updateScrollHint(); });
let yearStale=true;
function buildYearIfStale(){ if(yearStale){buildYear();yearStale=false;} }
function markStale(){ yearStale=true; }

/* Enter used to build <div> children inside the contenteditable, and textContent
   glued them into one run-on string — "Warm-up: djembesCall and responseCool
   down" — which is what came back after a reload. plaintext-only makes Enter a
   real newline; the keydown fallback does the same where it is unsupported. */
const PLAINTEXT_OK=(()=>{
  try{ const d=document.createElement('div'); d.setAttribute('contenteditable','plaintext-only'); return d.contentEditable==='plaintext-only'; }
  catch(e){ return false; }
})();
function boxValue(b){
  const raw = (typeof b.innerText==='string' && b.innerText!=='') ? b.innerText : b.textContent;
  return String(raw||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').replace(/\n$/,'');
}
function onBoxInput(e){
  const b=e.target, v=boxValue(b);
  if(b.dataset.p==='notes'){ if(v)S.notes[b.dataset.iso]=v; else delete S.notes[b.dataset.iso]; }
  else {
    const k=b.dataset.key;
    if(v)S.cells[k]=v; else delete S.cells[k];
    // any pre-migration leftover shown by cellText() is now superseded
    delete S.cells[`${b.dataset.iso}|${b.dataset.p}`];
    if(k[0]==='c') delete S.cells[`d${b.dataset.iso}|${b.dataset.p}`];
  }
  queueSave();
}
function plainPaste(e){
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
}
function onBoxKey(e){
  if(e.key==='Escape'){ hideBar(); return; }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&barCtx){ e.preventDefault(); document.getElementById('bar-day').focus(); return; }
  if(e.key==='Enter'&&!PLAINTEXT_OK&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    e.preventDefault();
    document.execCommand('insertText',false,'\n');
  }
}

/* ------------------ copy bar ---------------------------------------- */
const bar=document.getElementById('bar');
let barCtx=null;
const barDayBtn=document.getElementById('bar-day'), barLetterBtn=document.getElementById('bar-letter');
function onBoxFocus(b){
  if(b.dataset.p==='notes'){ hideBar(); return; }
  barCtx={iso:b.dataset.iso,p:+b.dataset.p,letter:b.dataset.letter||''};
  document.getElementById('bar-hint').textContent=`${DAYNAMES[parseISO(barCtx.iso).getDay()]} · Period ${barCtx.p} — Ctrl+Enter reaches these buttons`;
  barDayBtn.disabled=false;
  /* The label is deliberately the same length armed or disarmed: this row sits
     above the grid and must not change height as you tab across the week. */
  if(barCtx.letter){ barLetterBtn.hidden=false; barLetterBtn.disabled=false; barLetterBtn.textContent=`Fill all ${barCtx.letter}-days (period ${barCtx.p})`; }
  else { barLetterBtn.hidden=true; barLetterBtn.disabled=true; }
  bar.classList.add('show');
}
function hideBar(){
  bar.classList.remove('show'); barCtx=null;
  const h=document.getElementById('bar-hint'); if(h) h.textContent='Pick a lesson box to copy from.';
  barDayBtn.disabled=true; barLetterBtn.disabled=true; barLetterBtn.hidden=false;
  barLetterBtn.textContent='Fill matching rotation days';
}
barDayBtn.onclick=()=>doCopy('day');
barLetterBtn.onclick=()=>doCopy('letter');
/* The two fill buttons used to be the most destructive thing in the app.
   Measured before this change: "Fill all A-days" reached 11 boxes across 2
   days of the current week while its label promised the year (a real 6-letter
   year has 33-34 A-days), and it overwrote five periods on the source day that
   the teacher never selected. "Fill whole day" from a box you had just cleared
   took a Tuesday from six filled cells to zero and announced "Copied to 5
   boxes". Now: the letter fill covers the whole year and only the period you
   are standing in; an empty source copies nothing; and every write is one tap
   from being undone, which is what the research asked for instead of a confirm
   dialog. */
function copyTargets(mode){
  const out=[], c=S.config;
  if(mode==='day'){
    const d=(YEAR[curWeek]||{days:[]}).days.find(x=>x.iso===barCtx.iso);
    if(!d) return out;
    for(let p=1;p<=c.periods;p++) if(p!==barCtx.p) out.push(cellKey(d,p));
  }else{
    for(const wk of YEAR) for(const d of wk.days){
      if(d.special||d.letter!==barCtx.letter) continue;
      if(d.iso===barCtx.iso) continue;
      out.push(cellKey(d,barCtx.p));
    }
  }
  return [...new Set(out)];
}
function doCopy(mode){
  if(!barCtx) return;
  const srcKey=cellKeyForFocus();
  const src=srcKey?S.cells[srcKey]:'';
  if(!src){
    SWS.toast('This box is empty, so there is nothing to copy. Type the lesson first.');
    focusSource(); return;
  }
  const targets=copyTargets(mode);
  if(!targets.length){ SWS.toast(mode==='day'?'There is only one period on this day.':`This is the only ${barCtx.letter}-day in the year.`); focusSource(); return; }
  const before=targets.map(k=>[k,S.cells[k]]);   // a snapshot cannot forget a side effect
  for(const k of targets) S.cells[k]=src;
  persist(); paintCells();
  const n=targets.length, noun=n===1?'box':'boxes';
  const what=mode==='day'?`the rest of ${DAYNAMES[parseISO(barCtx.iso).getDay()]}`:`period ${barCtx.p} of every ${barCtx.letter}-day this year`;
  announce(`Copied to ${n} ${noun}: ${what}`);
  SWS.undo(`Copied to ${n} ${noun} — ${what}.`,()=>{
    for(const [k,v] of before){ if(v===undefined) delete S.cells[k]; else S.cells[k]=v; }
    persist(); paintCells(); announce('Copy undone');
  });
  focusSource();
}
function cellKeyForFocus(){
  const d=(YEAR[curWeek]||{days:[]}).days.find(x=>x.iso===barCtx.iso);
  return d?cellKey(d,barCtx.p):null;
}
function focusSource(){
  const back=view.querySelector(`.box[data-iso="${barCtx.iso}"][data-p="${barCtx.p}"]`);
  if(back&&back.focus) back.focus();
}

/* ------------------ special-day modal ------------------------------- */
const modal=document.getElementById('modal'), sheet=document.getElementById('modal-sheet');
let modalReturn=null;
function openSpecial(iso){
  modalReturn=document.activeElement;
  const cur=S.special[iso]||'';
  sheet.innerHTML=`<h3 id="modal-title">${DAYNAMES[parseISO(iso).getDay()]}, ${niceDate(iso)}</h3>
    <p class="sub">Mark this a no-class day. It keeps its own boxes but takes no rotation letter — so the letter <em>and the lesson you planned for it</em> both move to your next teaching day, and the rest of the year follows. One tap, and you can undo it.</p>
    <div class="opts">
      <button class="btn" data-sp="Teacher work day">Teacher work day</button>
      <button class="btn" data-sp="No school">No school</button>
      <button class="btn" data-sp="Field trip">Field trip</button>
      <input id="sp-custom" aria-label="Custom day label" placeholder="Or type your own label…" value="${esc(cur&&!['Teacher work day','No school','Field trip'].includes(cur)?cur:'')}">
      <button class="btn primary" id="sp-save">Save label</button>
      ${cur?'<button class="btn danger" id="sp-clear">Back to a normal day</button>':''}
      <button class="btn ghost" id="sp-cancel">Cancel</button>
    </div>`;
  sheet.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>setSpecial(iso,b.dataset.sp));
  sheet.querySelector('#sp-save').onclick=()=>{
    const v=sheet.querySelector('#sp-custom').value.trim();
    if(v) setSpecial(iso,v);
  };
  const cl=sheet.querySelector('#sp-clear'); if(cl) cl.onclick=()=>setSpecial(iso,null);
  sheet.querySelector('#sp-cancel').onclick=closeModal;
  modal.classList.add('show');
  const first=sheet.querySelector('button,input'); if(first) first.focus();
}
function setSpecial(iso,label){
  const before={...S.special};
  if(label) S.special[iso]=String(label).slice(0,60); else delete S.special[iso];
  markStale(); persist(); closeModal(); render();
  const g=view.querySelector(`[data-gear="${iso}"]`); if(g) g.focus();
  const when=`${DAYNAMES[parseISO(iso).getDay()]} ${niceDate(iso)}`;
  const msg=label
    ? `${when} is now “${label}”. Every lesson after it moved forward one rotation day.`
    : `${when} is a normal teaching day again. The lessons after it moved back.`;
  announce(msg);
  SWS.undo(msg,()=>{
    S.special=before; markStale(); persist(); render();
    announce('Undone');
    const g2=view.querySelector(`[data-gear="${iso}"]`); if(g2) g2.focus();
  });
}
function closeModal(){
  modal.classList.remove('show');
  if(modalReturn){ if(modalReturn.focus) modalReturn.focus(); modalReturn=null; }
}
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('show')) return;
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key!=='Tab') return;
  const f=[...sheet.querySelectorAll('button,input')].filter(x=>!x.disabled);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
  else if(!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
});

/* Every rejection names the field it is about and puts the cursor in it. The
   research's phantom-validation complaint ("an error telling me to pick a valid
   start time, but nothing is wrong with the time I pick") is the thing to
   avoid; a generic alert about "your dates" when the teaching days are the
   problem is the same defect. */
function setupError(id,msg){
  SWS.toast(msg,{assertive:true,ms:8000});
  announce(msg);
  const el=document.getElementById(id); if(el&&el.focus) el.focus();
  return false;
}
function applySetup(){
  const startEl=document.getElementById('f-start');
  if(!startEl) return;                    // re-entrancy guard: the view is gone
  const c=S.config;
  const st=startEl.value, en=document.getElementById('f-end').value;
  if(!parseISO(st)) return setupError('f-start','Pick a first day of the school year.');
  if(!parseISO(en)) return setupError('f-end','Pick a last day of the school year.');
  if(en<st) return setupError('f-end',`The last day has to come after ${niceDate(st)}. Pick a later date.`);
  const days=[...document.querySelectorAll('#f-days .dp.on')].map(b=>+b.dataset.d);
  if(!days.length) return setupError('f-days','Pick at least one day of the week that you teach.');
  const rawLetters=document.getElementById('f-letters').value.split(',').map(x=>x.trim()).filter(Boolean);
  const letters=rawLetters.map(x=>x.slice(0,MAX_LETTER_LEN)).slice(0,MAX_LETTERS);
  /* Nine letters used to be sliced to six in silence, which generated a whole
     year on the wrong cycle length. */
  if(rawLetters.length>MAX_LETTERS) return setupError('f-letters',`That is ${rawLetters.length} rotation letters and this planner handles ${MAX_LETTERS}. Remove ${rawLetters.length-MAX_LETTERS} and apply again.`);
  const tooLong=rawLetters.find(x=>x.length>MAX_LETTER_LEN);
  if(tooLong) return setupError('f-letters',`“${tooLong}” is too long for a rotation label — keep each one to ${MAX_LETTER_LEN} characters or fewer.`);

  c.yearStart=st; c.yearEnd=en; c.workDays=days;
  const per=Math.round(Number(document.getElementById('f-periods').value));
  c.periods=Number.isFinite(per)&&per>0?Math.min(MAX_PERIODS,per):6;
  document.getElementById('f-periods').value=c.periods;
  const la=Math.round(Number(document.getElementById('f-lunch').value));
  c.lunchAfter=Number.isFinite(la)?Math.max(0,Math.min(c.periods,la)):Math.min(2,c.periods);
  c.letters=letters.length?letters:['A'];
  c.teacher=document.getElementById('f-teacher').value.trim().slice(0,80);
  markStale(); persist();
  buildYearIfStale();
  if(!YEAR.length) return setupError('f-start',yearProblem());
  if(yearTruncated) SWS.toast(`That span is longer than this planner builds in one go — it stops after ${YEAR.length} weeks.`,{ms:8000});
  curWeek=weekIndexFor(fmtISO(new Date()));
  curView='week'; render(); refocus('wk-jump');
}
function applyPrintMode(){ document.body.dataset.print = (S&&S.config.printMode==='full')?'full':'compact'; }

/* ------------------ backup / csv / reset ---------------------------- */
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function backupJSON(){ return JSON.stringify({app:'palette',version:2,exported:new Date().toISOString(),state:S},null,1); }
function exportBackup(){ download(`specials-planner-backup-${fmtISO(new Date())}.json`,backupJSON(),'application/json'); }
function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ if(applyImportedText(r.result)) { curView='week'; curWeek=weekIndexFor(fmtISO(new Date())); render(); } };
    r.readAsText(f);
  };
  inp.click();
}
/* Restoring used to replace a 1,200-lesson year with one tap: no description of
   what was in the file, no confirm, no way back. It is one click from the front
   door and it is the single most destructive action in the app. */
function describeBackup(st){
  const n=Object.keys(st.cells).length, c=st.config;
  const a=parseISO(c.yearStart), b=parseISO(c.yearEnd);   // a hand-edited file can carry anything
  const span=(a&&b)?`, ${niceDate(c.yearStart)} ${a.getFullYear()} to ${niceDate(c.yearEnd)} ${b.getFullYear()}`:'';
  return `${n} ${n===1?'lesson':'lessons'}${span}`;
}
function applyImportedText(text){
  let st;
  try{
    const j=JSON.parse(text);
    st=migrate(j.state||j);                // tolerate raw-state or wrapped backups
    if(!st) throw 0;
  }catch(e){ alert("That file doesn't look like a Specials Planner backup."); return false; }
  const before=S?JSON.stringify(S):null;
  if(before){
    const mine=Object.keys(S.cells).length;
    if(!confirm(`This backup holds ${describeBackup(st)}.\n\nIt will replace the year on this device (${mine} ${mine===1?'lesson':'lessons'}). Continue?`)) return false;
  }
  S=st; markStale(); persist();
  if(before) SWS.undo(`Restored ${describeBackup(st)}.`,()=>{
    S=JSON.parse(before); markStale(); persist(); render(); announce('Restore undone');
  });
  return true;
}
/* Two things Excel does to an honest export: it mojibakes UTF-8 without a BOM
   ("Señor Nguyễn · 音楽"), and it executes any cell that starts with = + - or @.
   A lesson line pasted off a website should not become a live formula in a
   teacher's spreadsheet. */
function csvField(v){
  v=String(v??'');
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v;
  return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
}
function exportCSV(){
  buildYearIfStale();
  const c=S.config;
  const head=['Date','Weekday','Rotation',...Array.from({length:c.periods},(_,i)=>`Period ${i+1}`),'Notes'];
  const lines=[head.join(',')];
  for(const w of YEAR) for(const d of w.days){
    const row=[d.iso,DAYNAMES[d.dow],d.special?d.special:(d.letter||'')];
    for(let p=1;p<=c.periods;p++) row.push(cellText(d,p));
    row.push(S.notes[d.iso]||'');
    lines.push(row.map(csvField).join(','));
  }
  download(`specials-planner-${c.yearStart.slice(0,4)}.csv`,'\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
function resetAll(){
  if(!confirm('Erase everything on this device? Download a backup first if you want to keep it.')) return;
  const before=S?JSON.stringify(S):null;
  S=null; store.del(KEY); curWeek=0; markStale(); render();
  if(before) SWS.undo('Everything erased.',()=>{
    S=migrate(JSON.parse(before)); markStale(); persist();
    curWeek=weekIndexFor(fmtISO(new Date())); curView='week'; render(); announce('Restored');
  });
}

/* ------------------ GOOGLE DRIVE (optional) --------------------------
   Enabled only when CLIENT_ID is set. Uses Google Identity Services token
   flow + Drive REST with the drive.file scope (app-created files only —
   the non-sensitive scope, no restricted-scope review needed).           */
let driveToken=null, gisReady=false, tokenClient=null;
function mountDrive(){
  const slot=document.getElementById('drive-slot');
  if(!slot||!CLIENT_ID) return;
  slot.innerHTML=`<button class="btn" id="d-drive-save">Save to Google Drive</button>
                  <button class="btn" id="d-drive-load">Load from Drive</button>`;
  document.getElementById('d-drive-save').onclick=()=>withDriveToken(driveSave);
  document.getElementById('d-drive-load').onclick=()=>withDriveToken(driveLoad);
  if(!gisReady && !document.getElementById('gsi')){
    const s=document.createElement('script');
    s.id='gsi'; s.src='https://accounts.google.com/gsi/client'; s.async=true;
    s.onload=()=>{ gisReady=true; };
    document.head.appendChild(s);
  }
}
function withDriveToken(fn){
  if(driveToken){ fn(); return; }
  if(!window.google?.accounts?.oauth2){ alert('Google sign-in is still loading — try again in a second.'); return; }
  tokenClient=tokenClient||google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/drive.file',
    callback:(resp)=>{ if(resp.access_token){ driveToken=resp.access_token; fn(); } }
  });
  tokenClient.requestAccessToken();
}
async function driveSave(){
  try{
    const meta={name:'Specials Planner.json',mimeType:'application/json'};
    const boundary='paletteb'+Date.now();
    const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${backupJSON()}\r\n--${boundary}--`;
    const id=S.config.driveFileId;
    const url=id
      ? `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const res=await fetch(url,{method:id?'PATCH':'POST',
      headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':`multipart/related; boundary=${boundary}`},body});
    if(res.status===401){ driveToken=null; alert('Google session expired — tap Save again to sign back in.'); return; }
    if(!res.ok) throw new Error(res.status);
    const j=await res.json();
    if(j.id&&j.id!==S.config.driveFileId){ S.config.driveFileId=j.id; persist(); }
    alert('Saved to your Google Drive.');
  }catch(e){ alert('Drive save didn\'t go through — check your connection and try again.'); }
}
async function driveLoad(){
  try{
    let id=S.config.driveFileId;
    if(!id){
      const q=encodeURIComponent("name='Specials Planner.json' and trashed=false");
      const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=1&fields=files(id,name)`,
        {headers:{Authorization:`Bearer ${driveToken}`}});
      const j=await res.json();
      if(!j.files||!j.files.length){ alert('No Specials Planner file found in your Drive yet — save one first.'); return; }
      id=j.files[0].id;
    }
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:`Bearer ${driveToken}`}});
    if(res.status===401){ driveToken=null; alert('Google session expired — tap Load again to sign back in.'); return; }
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    if(applyImportedText(text)){ S.config.driveFileId=id; persist(); curView='week'; render(); }
  }catch(e){ alert('Couldn\'t load from Drive — check your connection and try again.'); }
}

/* ------------------ boot -------------------------------------------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{curView=t.dataset.view;render();window.scrollTo(0,0);});
document.querySelector('.tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  const tabs=[...document.querySelectorAll('.tab')];
  const i=tabs.indexOf(document.activeElement);
  if(i<0) return;
  const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];
  n.focus(); n.click();
});
document.getElementById('save-alert-backup').onclick=exportBackup;
/* The last 400ms of typing used to die with the tab. Both hooks matter: iOS
   Safari often never fires beforeunload, and a phone locking mid-sentence
   fires visibilitychange and nothing else. */
addEventListener('pagehide',flushSave);
addEventListener('beforeunload',flushSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });
loadState();
if(S){ buildYearIfStale(); curWeek=weekIndexFor(fmtISO(new Date())); }
render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
