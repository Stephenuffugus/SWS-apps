/* ═══════════════════════════════════════════════════════════════════════════
   SWS STUDIO — base layer
   Sky Wolf Studios · SWS Strategic Media LLC

   This file is the shared skeleton behind all 23 apps. It contains ZERO
   colour literals: every colour arrives from the per-app skin block that
   `design/build.mjs` generates ahead of it. That split is the whole trick —
   identical bones, different skin.

   Structural tokens (space, type, radius, timing) live HERE because they are
   invariant across the portfolio. Hue, chroma, texture, font pairing and
   container width live in the skin.

   Do not hand-edit the copy of this that is spliced into an app's index.html.
   Edit this file and re-run `node design/build.mjs && node design/apply.mjs`.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1. Invariant structural tokens ─────────────────────────────────────── */
:root{
  /* Two comfort dials the user controls, declared here because everything
     below is expressed in terms of them. Defaults are the design as drawn:
     --ui-scale 1 and --density 1 reproduce the untouched layout exactly.
     Section 15 is where the user's choice actually moves them. */
  --ui-scale:1;
  --density:1;

  /* Spacing — a 4px base. Use these, never magic numbers.
     Multiplied by --density so one control retunes the whole rhythm; the
     ratios between steps never change, which is what keeps a compact layout
     looking deliberate instead of merely squashed. */
  --s1:calc(4px  * var(--density));
  --s2:calc(8px  * var(--density));
  --s3:calc(12px * var(--density));
  --s4:calc(16px * var(--density));
  --s5:calc(20px * var(--density));
  --s6:calc(24px * var(--density));
  --s7:calc(32px * var(--density));
  --s8:calc(40px * var(--density));
  --s9:calc(56px * var(--density));

  /* Type scale. Body never drops below 16px: these apps get used on phones,
     often by someone tired, and 14px body copy is the single most common
     reason a free tool feels cheap. */
  --t-micro:0.75rem;   /* uppercase labels only, never sentences */
  --t-xs:0.8125rem;
  --t-sm:0.9375rem;
  --t-base:1rem;
  --t-lg:1.0625rem;
  --t-xl:1.25rem;
  --t-2xl:1.5rem;
  --t-3xl:2rem;

  --lh-tight:1.2;
  --lh-snug:1.35;
  --lh-body:1.55;

  /* Measure — prose is capped so lines stay in the comfortable 45–75ch band. */
  --measure:64ch;

  /* Radius. Skins set --r (the card radius); everything else derives, so an
     app can read soft or crisp by changing one number. */
  --r:14px;
  --r-card:var(--r);
  --r-ctl:calc(var(--r) * 0.72);
  --r-sm:calc(var(--r) * 0.5);
  --r-pill:999px;

  /* Motion */
  --ease:cubic-bezier(.32,.72,0,1);
  --dur-1:120ms;
  --dur-2:200ms;
  --dur-3:320ms;

  /* Minimum comfortable hit area. WCAG 2.2 AA asks 24px; 44px is what a
     thumb actually wants.

     It grows with --ui-scale but is floored at 44px, never multiplied by
     --density. Someone who has turned the text up is often doing it for
     eyesight or tremor, and shrinking their targets at the same moment would
     undo the help; someone who picks a compact layout wants less air, not a
     smaller button. Density moves the space between things, never the size of
     the thing you have to hit. */
  --tap:max(44px, calc(44px * var(--ui-scale)));

  --wrap:42rem;
}

/* ── 2. Reset & document ────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}

/* Every type token, --wrap and --measure are expressed in rem, so scaling the
   root font size scales the whole layout in proportion rather than just
   swelling the body copy out of its container. It also reaches the hardcoded
   rem values still sitting in app layers, which a token-only approach would
   miss. Percentages resolve against the browser's own default, so a user who
   has already raised that in their browser settings keeps the benefit and this
   multiplies on top of it.

   rem inside a media query always means the initial font size, never this one,
   so the responsive breakpoints below stay put while the text grows — which is
   what you want: bumping the text should not flip the layout to desktop. */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scroll-behavior:smooth;
  font-size:calc(100% * var(--ui-scale));
}

body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--font-text);
  font-size:var(--t-base);
  line-height:var(--lh-body);
  font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  padding-bottom:calc(var(--s8) + env(safe-area-inset-bottom));
}

@media (min-width:30rem){ body{ font-size:var(--t-lg) } }

h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:var(--display-weight,650);
  line-height:var(--lh-tight);
  letter-spacing:var(--display-tracking,-0.018em);
  margin:0;
  text-wrap:balance;
}

p:last-child{margin-bottom:0}

a{color:var(--accent-deep); text-underline-offset:0.18em; text-decoration-thickness:from-font}
a:hover{color:var(--accent-deep); text-decoration-thickness:2px}

img,svg,canvas,video{max-width:100%}

hr{border:0; border-top:1px solid var(--line); margin:var(--s5) 0}

::selection{background:var(--accent-soft); color:var(--ink)}

/* ── 3. Layout primitives ───────────────────────────────────────────────── */
.wrap{
  max-width:var(--wrap);
  margin-inline:auto;
  padding-inline:max(var(--s4), env(safe-area-inset-left));
}

/* Vertical rhythm without margin-collapse guesswork. */
.stack > * + *{margin-top:var(--stack-gap, var(--s4))}
.stack-sm{--stack-gap:var(--s2)}
.stack-lg{--stack-gap:var(--s6)}

/* Horizontal group that wraps instead of overflowing. */
.cluster{display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center}

/* The legacy equal-columns row, kept because every app uses it — but it now
   collapses to a stack on narrow screens instead of crushing its children. */
.row{display:flex; gap:var(--s2); flex-wrap:wrap}
.row > *{flex:1 1 12rem; min-width:0}
.row.tight{gap:var(--s1)}
.row.nowrap{flex-wrap:nowrap}

/* ── 4. Studio chrome — identical in all 23 apps ────────────────────────── */
/* This block is the strongest "same studio" signal in the system. Palette and
   font change per app; the geometry, order and behaviour never do. */

header.app{
  display:flex;
  align-items:center;
  gap:var(--s3);
  /* Wraps rather than overflows. At the largest text setting the title, the
     settings button and the tip pill cannot share a 414px line, and without
     this the row silently pushes the whole page sideways — the one layout
     failure the comfort settings could introduce on their own. */
  flex-wrap:wrap;
  padding:var(--s4) 0 var(--s3);
  min-height:calc(var(--tap) + var(--s4));
}
header.app img,
header.app .mark{
  width:32px; height:32px; flex:none;
  border-radius:var(--r-sm);
}
/* Flex children default to min-width:auto, which stops long titles shrinking
   and pushes the tip jar off the edge on a narrow phone. */
header.app > *{min-width:0}
header.app h1{
  font-size:var(--t-xl);
  letter-spacing:var(--display-tracking,-0.018em);
  overflow-wrap:break-word;
}
header.app .tagline{
  display:block;
  font-family:var(--font-text);
  font-size:var(--t-xs);
  font-weight:400;
  letter-spacing:0;
  color:var(--ink-2);
  margin-top:1px;
}
header.app .spacer{flex:1}

/* Tip jar. Present in every app, always the same shape, never shouty —
   it is an offer, not a nag. */
a.tipbtn{
  display:inline-flex; align-items:center; gap:var(--s1);
  /* --tap like everything else. It was 36px on the reasoning that chrome is
     not a primary action, but the rule this system states is that anything you
     have to hit gets 44px, and an exception nobody can see is just an
     inconsistency. The header wraps, so the extra height costs no layout. */
  min-height:var(--tap); padding:0 var(--s3);
  font-family:var(--font-text);
  font-size:var(--t-xs); font-weight:550;
  color:var(--ink-2);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  text-decoration:none;
  white-space:nowrap;
  /* nowrap plus the header's min-width:0 means this can be squeezed narrower
     than its own text and spill. It is a fixed-size pill — let it wrap to the
     next line instead of being crushed. */
  flex:none;
  transition:color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
}
a.tipbtn:hover{color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft)}

.hero{padding:var(--s4) 0 var(--s5)}
.hero h2{font-size:var(--t-2xl); margin-bottom:var(--s2)}
.hero p{color:var(--ink-2); font-size:var(--t-base); max-width:var(--measure)}
.hero p:last-child{margin-bottom:0}

/* --ink-2, not --ink-3. The colophon carries the privacy promise and the
   feedback link, which are sentences a user is meant to read — and this file's
   own rule is that --ink-3 is for placeholders and disabled text only. axe
   caught it failing 4.5:1 on six apps. */
footer.colophon{
  color:var(--ink-2);
  font-size:var(--t-sm);
  line-height:var(--lh-snug);
  text-align:center;
  padding:var(--s8) var(--s4) var(--s5);
  max-width:var(--measure);
  margin-inline:auto;
}
footer.colophon a{color:var(--ink)}
footer.colophon a:hover{color:var(--accent-deep)}

/* The promise, rendered as an actual object rather than a sentence in grey.
   Research finding: users do not believe "private" as body copy — it has to
   look like a stamp on the thing. */
.trust{
  display:inline-flex; align-items:center; gap:var(--s2);
  padding:var(--s3) var(--s4);
  font-size:var(--t-sm);
  line-height:var(--lh-snug);
  color:var(--ink-2);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
}
.trust svg{width:16px; height:16px; flex:none; color:var(--accent-deep)}
.trust b{color:var(--ink); font-weight:600}

/* ── 5. Surfaces ────────────────────────────────────────────────────────── */
section.card,.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-1);
  padding:var(--s5);
  margin-bottom:var(--s4);
}
@media (min-width:30rem){ section.card,.card{ padding:var(--s6) } }

/* The uppercase micro-label that heads each card. Every app already uses
   `card h2` this way, so the selector stays — only the values improve. */
section.card > h2,.card > h2{
  font-family:var(--font-text);
  font-size:var(--t-micro);
  font-weight:650;
  letter-spacing:0.075em;
  text-transform:uppercase;
  color:var(--ink-2);
  margin:0 0 var(--s4);
}
section.card > h2 + .sub,.card > h2 + .sub{margin-top:calc(var(--s4) * -1 + var(--s1))}

.card .sub{font-size:var(--t-sm); color:var(--ink-2); margin:0 0 var(--s4)}

/* An inset well, for previews and results. */
.well{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  padding:var(--s4);
}

/* ── 6. Controls ────────────────────────────────────────────────────────── */
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}

/* 16px minimum on inputs is not a style choice — anything smaller makes iOS
   Safari zoom the page on focus, which feels broken. */
input[type=text],input[type=url],input[type=tel],input[type=email],
input[type=number],input[type=search],input[type=date],input[type=time],
input[type=password],select,textarea{
  width:100%;
  min-height:var(--tap);
  padding:var(--s3);
  font-size:max(1rem, var(--t-base));
  line-height:var(--lh-snug);
  color:var(--ink);
  background:var(--field);
  border:1px solid var(--line-2);
  border-radius:var(--r-ctl);
  transition:border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--ink-3)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:6.5rem; resize:vertical; line-height:var(--lh-body)}

::placeholder{color:var(--ink-3); opacity:1}

select{
  appearance:none;
  padding-right:var(--s7);
  background-image:var(--caret);
  background-repeat:no-repeat;
  background-position:right var(--s3) center;
  background-size:12px;
}

/* Field label. `label.f` is the portfolio's existing convention. */
label.f,.field{display:block; margin-bottom:var(--s4)}
label.f > span,.field > label{
  display:block;
  font-size:var(--t-xs);
  font-weight:600;
  color:var(--ink-2);
  margin-bottom:var(--s2);
}
label.f .hint,.field .hint{margin-top:var(--s2)}

.frow{display:flex; gap:var(--s3); flex-wrap:wrap}
.frow > *{flex:1 1 9rem; min-width:0}

/* Checkbox / radio get real size and a real hit area. */
input[type=checkbox],input[type=radio]{
  width:1.25rem; height:1.25rem;
  min-height:0;
  accent-color:var(--accent);
  flex:none;
  margin:0;
  cursor:pointer;
}
label:has(> input[type=checkbox]),label:has(> input[type=radio]){
  display:flex; align-items:center; gap:var(--s3);
  min-height:var(--tap);
  cursor:pointer;
}

/* ── 7. Buttons ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap);
  padding:0 var(--s5);
  font-size:var(--t-sm);
  font-weight:600;
  line-height:1;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--r-ctl);
  box-shadow:var(--shadow-0);
  cursor:pointer;
  text-decoration:none;
  white-space:nowrap;
  transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease),
             color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease),
             box-shadow var(--dur-1) var(--ease);
}
.btn:hover:not(:disabled){background:var(--surface-2); border-color:var(--ink-3)}
.btn:active:not(:disabled){transform:scale(.98)}

.btn.primary{
  color:var(--accent-ink);
  background:var(--accent-fill);
  border-color:var(--accent-fill);
  box-shadow:var(--shadow-1);
}
.btn.primary:hover:not(:disabled){background:var(--accent-press); border-color:var(--accent-press)}

.btn.danger{color:var(--neg); border-color:var(--neg-line); background:var(--surface)}
.btn.danger:hover:not(:disabled){background:var(--neg-soft); border-color:var(--neg)}

.btn.ghost,.btn.plain{
  background:transparent; border-color:transparent; box-shadow:none;
  color:var(--ink-2); font-weight:550;
}
.btn.ghost:hover:not(:disabled),.btn.plain:hover:not(:disabled){background:var(--surface-2); color:var(--ink)}

.btn.small{min-height:36px; padding:0 var(--s3); font-size:var(--t-xs)}
.btn.big{min-height:52px; padding:0 var(--s6); font-size:var(--t-base)}
.btn.block{width:100%}

/* Icon-only buttons still need a full hit area and an accessible name;
   the name comes from the markup, the area comes from here. */
.btn.icon{padding:0; width:var(--tap); min-width:var(--tap)}

/* Segmented control. */
.seg{
  display:flex;
  gap:var(--s1);
  padding:var(--s1);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  margin-bottom:var(--s4);
  flex-wrap:wrap;
}
.seg button,.seg .tab{
  flex:1 1 auto;
  min-height:38px;
  padding:0 var(--s4);
  font-size:var(--t-sm);
  font-weight:600;
  color:var(--ink-2);
  background:transparent;
  border:0;
  border-radius:calc(var(--r-ctl) - var(--s1));
  cursor:pointer;
  white-space:nowrap;
  transition:background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.seg button:hover:not(.active),.seg .tab:hover:not(.active){color:var(--ink)}
.seg button.active,.seg .tab.active{
  color:var(--accent-ink);
  background:var(--accent-fill);
  box-shadow:var(--shadow-0);
}

/* ── 8. Small type & status ─────────────────────────────────────────────── */
/* --t-sm (15px), not --t-xs (13px). Hints are where these apps put their
   actual instructions — "tap a name to edit it", "the schedule travels inside
   the link" — and the audits flagged 12.8px hint text as a defect on app after
   app. If it teaches the user something, it does not get to be the smallest
   thing on the page. --t-xs is for chrome: chips, tab labels, the tip pill. */
.hint,.footnote,.small{
  font-size:var(--t-sm);
  line-height:var(--lh-body);
  color:var(--ink-2);
  max-width:var(--measure);
}
.hint{margin-top:var(--s2)}
.em{color:var(--ink); font-weight:600}
.muted{color:var(--ink-2)}

.chip{
  display:inline-flex; align-items:center; gap:var(--s1);
  padding:var(--s1) var(--s3);
  font-size:var(--t-xs); font-weight:600; line-height:1.4;
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
}
.chip.on{color:var(--accent-ink); background:var(--accent-fill); border-color:var(--accent-fill)}
.chips{display:flex; flex-wrap:wrap; gap:var(--s2)}

/* "Saved" said out loud, quietly. The audits found that saving is
   fire-and-forget across the portfolio — the app only speaks when it FAILS, so
   the user's only evidence that their list survived is that nothing happened.
   SWS.saved() drives this. */
[data-saved-flag]{
  font-size:var(--t-xs);
  font-weight:600;
  color:var(--pos);
  opacity:0;
  transition:opacity var(--dur-2) var(--ease);
}
[data-saved-flag].show{opacity:1}

.warn{
  padding:var(--s3) var(--s4);
  font-size:var(--t-sm);
  color:var(--ink);
  background:var(--warn-soft);
  border:1px solid var(--warn-line);
  border-left:3px solid var(--warn);
  border-radius:var(--r-sm);
}

/* ── 8b. Row lists ──────────────────────────────────────────────────────── */
/* `ul.plain` is the portfolio's list-of-things: 15 of the 23 apps already use
   it. Rows carry a real minimum height because most of them hold a checkbox
   or a delete button that a thumb has to land on. */
ul.plain,ol.plain{list-style:none; margin:0; padding:0}
ul.plain > li,ol.plain > li{
  display:flex; align-items:center; gap:var(--s3);
  min-height:var(--tap);
  padding:var(--s2) 0;
  border-bottom:1px solid var(--line);
  font-size:var(--t-base);
}
ul.plain > li:last-child,ol.plain > li:last-child{border-bottom:0}
ul.plain .grow,ol.plain .grow{flex:1; min-width:0; overflow-wrap:anywhere}

/* Secondary line under a heading or beside a value. Often carries real status
   data ("last diaper: 2h ago"), so it does not get to be tiny. */
.sub{font-size:var(--t-sm); color:var(--ink-2)}

/* ── 9. Empty states ────────────────────────────────────────────────────── */
/* Portfolio-wide gap: most apps opened cold show an empty box and no idea
   what to do. An empty state is the cheapest onboarding there is. */
.empty{
  text-align:center;
  padding:var(--s7) var(--s5);
  color:var(--ink-2);
}
.empty .glyph{
  font-size:2rem;
  line-height:1;
  margin-bottom:var(--s3);
  opacity:.55;
}
.empty h3{
  font-size:var(--t-lg);
  color:var(--ink);
  margin-bottom:var(--s2);
}
.empty p{
  font-size:var(--t-base);
  margin-inline:auto;
  max-width:34ch;
  margin-bottom:var(--s4);
}

/* ── 10. Tables ─────────────────────────────────────────────────────────── */
/* Wide tables scroll inside their own box; the page body never scrolls
   sideways. The fade on the right edge is the affordance that tells you
   there is more. */
.tablewrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-1);
}
table{border-collapse:collapse; width:100%}
th{
  font-size:var(--t-micro);
  font-weight:650;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--ink-2);
  text-align:left;
  padding:var(--s3);
  background:var(--surface-2);
  border-bottom:1px solid var(--line-2);
}
td{padding:var(--s3); border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}

/* ── 11. Toast ──────────────────────────────────────────────────────────── */
#toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--s6) + env(safe-area-inset-bottom));
  transform:translate(-50%, 8px);
  z-index:60;
  max-width:min(90vw, 28rem);
  padding:var(--s3) var(--s5);
  font-size:var(--t-sm);
  font-weight:550;
  text-align:center;
  color:var(--toast-ink);
  background:var(--toast-bg);
  border-radius:var(--r-pill);
  box-shadow:var(--shadow-2);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease), visibility var(--dur-2);
}
#toast.show{opacity:1; visibility:visible; transform:translate(-50%, 0)}

/* An undo lives inside the toast, so the toast has to stop being decoration
   and become clickable.
 *
 * This is the portfolio's answer to the single most repeated finding in the
 * audits: destructive actions with no way back. A confirm dialog on every tap
 * is the wrong fix — it taxes the 99 correct taps to catch the one mistake,
 * and at 3am it is just another thing to dismiss. Undo taxes nothing.
 *
 * Promoted here from Pill Schedule and Caregiver Log, which had it first. */
#toast.act{
  display:flex; align-items:center; justify-content:center; gap:var(--s3);
  pointer-events:auto;
  text-align:left;
}
#toast .undo{
  flex:none;
  min-height:var(--tap);
  margin-left:var(--s1);
  padding:0 var(--s4);
  font:inherit;
  font-weight:700;
  color:var(--toast-bg);
  background:var(--toast-ink);
  border:0;
  border-radius:var(--r-pill);
  cursor:pointer;
}
#toast .undo:focus-visible{outline:2px solid var(--toast-ink); outline-offset:3px}

/* ── 12. Sticky action bar ──────────────────────────────────────────────── */
.actionbar{
  position:sticky;
  bottom:0;
  z-index:40;
  display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap;
  margin:var(--s5) calc(var(--s4) * -1) 0;
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:var(--veil);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}

/* ── 13. Focus ──────────────────────────────────────────────────────────── */
/* A two-part ring: the solid outline carries the shape, the halo guarantees
   it stays visible when the element sits on a same-hue background. */
:focus{outline:none}
:focus-visible{
  outline:2px solid var(--focus);
  outline-offset:2px;
  box-shadow:0 0 0 4px var(--focus-halo);
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline-offset:0;
  border-color:var(--focus);
}

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%);
  white-space:nowrap; border:0;
}

/* Skip link — keyboard users should not tab through the header on every app. */
.skip{
  position:absolute; left:var(--s4); top:var(--s4); z-index:100;
  padding:var(--s3) var(--s4);
  background:var(--accent-fill); color:var(--accent-ink);
  border-radius:var(--r-ctl); font-weight:600; font-size:var(--t-sm);
  text-decoration:none;
  transform:translateY(-200%);
  transition:transform var(--dur-2) var(--ease);
}
.skip:focus-visible{transform:none; color:var(--accent-ink)}

/* ── 14. Utility ────────────────────────────────────────────────────────── */
.hidden{display:none !important}
.nowrap{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* ── 15. Comfort — user preferences ─────────────────────────────────────── */
/*
 * The operating system's preference is always the default. An attribute on
 * <html> is the user overriding it *for our apps*, and it must be able to win
 * in both directions — someone whose phone is in dark mode and who asks us for
 * light is not confused, they have a reason, and a switch that only works one
 * way is not a switch.
 *
 * That is why each preference appears twice: once inside the media query
 * guarded by :not([...]) so an explicit opt-out escapes it, and once on the
 * attribute so an explicit opt-in gets it regardless of the OS.
 *
 * sws-prefs.js writes these attributes before first paint and stores them
 * under one localStorage key for the whole origin, so a choice made in Baby
 * Log at 3am is already in effect the first time Grocery List is opened.
 */

/* -- Text size. Five steps; the middle one is the design as drawn. --------- */
:root[data-text="s"]  {--ui-scale:0.9}
:root[data-text="m"]  {--ui-scale:1}
:root[data-text="l"]  {--ui-scale:1.15}
:root[data-text="xl"] {--ui-scale:1.3}
:root[data-text="xxl"]{--ui-scale:1.5}

/* -- Density. Moves the air between things, never the size of a target. ---- */
:root[data-density="compact"]{--density:0.8}
:root[data-density="cosy"]   {--density:1}
:root[data-density="roomy"]  {--density:1.25}

/* -- Motion ---------------------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  :root:not([data-motion="full"]){scroll-behavior:auto}
  :root:not([data-motion="full"]) *,
  :root:not([data-motion="full"]) *::before,
  :root:not([data-motion="full"]) *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
  :root:not([data-motion="full"]) .btn:active:not(:disabled){transform:none}
}
:root[data-motion="less"]{scroll-behavior:auto}
:root[data-motion="less"] *,
:root[data-motion="less"] *::before,
:root[data-motion="less"] *::after{
  animation-duration:0.01ms !important;
  animation-iteration-count:1 !important;
  transition-duration:0.01ms !important;
  scroll-behavior:auto !important;
}
:root[data-motion="less"] .btn:active:not(:disabled){transform:none}

/* -- Contrast --------------------------------------------------------------
   Beyond darkening the greys: the frosted action bar becomes opaque. A blurred
   translucent strip with text behind it is the single worst thing on the page
   for anyone who needed high contrast in the first place. */
/* --ink-3 is resolved on :root and --ink-2 is overridden on BODY, and the
   split is the whole point.
 *
 * Written as one block — body{--ink-2:var(--ink); --ink-3:var(--ink-2)} — the
 * second declaration reads the value the first one just set, so all three inks
 * collapsed to the same colour. Measured on Sitter Sheet: --ink, --ink-2 and
 * --ink-3 all #262013, a 1.00:1 ratio between a placeholder and real typed
 * text. High contrast made it IMPOSSIBLE to tell an empty field from a filled
 * one — worse, for the people who turn it on, than leaving it off.
 *
 * Resolving --ink-3 one element up means it picks up the ORIGINAL --ink-2, so
 * placeholders darken to full secondary strength and still read as secondary. */
@media (prefers-contrast:more){
  :root:not([data-contrast="normal"]){--line:var(--line-2); --ink-3:var(--ink-2)}
  :root:not([data-contrast="normal"]) body{--ink-2:var(--ink)}
  :root:not([data-contrast="normal"]) .btn{border-width:2px}
  :root:not([data-contrast="normal"]) :focus-visible{outline-width:3px}
  :root:not([data-contrast="normal"]) .actionbar{
    background:var(--canvas);
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    border-top-width:2px;
  }
}
:root[data-contrast="more"]{--line:var(--line-2); --ink-3:var(--ink-2)}
:root[data-contrast="more"] body{--ink-2:var(--ink)}
:root[data-contrast="more"] .btn{border-width:2px}
:root[data-contrast="more"] :focus-visible{outline-width:3px}
:root[data-contrast="more"] .actionbar{
  background:var(--canvas);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border-top-width:2px;
}

/* -- Easier reading --------------------------------------------------------
   Not a font download. The evidence for a "dyslexia font" beating a plain one
   is thin; the evidence for letter, word and line spacing is not, and spacing
   costs no bytes and works offline. This also drops the display face for the
   system stack, which is the request behind most "I find this hard to read"
   reports about a display serif, and turns off ligatures so "fi" and "ffi"
   stop fusing into shapes that have to be decoded rather than read. */
:root[data-reading="easy"]{
  --font-display:var(--font-text);
  --display-weight:700;
  --display-tracking:0;
  --lh-body:1.8;
  --lh-snug:1.55;
  --measure:58ch;
}
:root[data-reading="easy"] body{
  letter-spacing:0.048em;
  word-spacing:0.14em;
  font-variant-ligatures:none;
}
/* Tabular figures are already spaced; adding to them only breaks the columns
   they exist to keep aligned. */
:root[data-reading="easy"] .tnum,
:root[data-reading="easy"] table{letter-spacing:normal; word-spacing:normal}

/* -- Warm tint -------------------------------------------------------------
   Half of these apps get opened in a dark room at 3am — a feed at two, a dose
   at four. This is the f.lux move: a warm wash that pulls the blue down.

   It is an overlay rather than a filter on purpose. `filter` on a container
   makes it the containing block for its fixed-position descendants, which
   would tear the toast and the sticky action bar out of the viewport and
   strand them mid-page. An overlay leaves layout completely alone.

   multiply is the right blend: it attenuates the blue channel instead of
   veiling the page in beige, so it warms a light page and a dark one with the
   same declaration and never lifts the black level. */
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  pointer-events:none;
  background:var(--warm-tint);
  mix-blend-mode:multiply;
}

/* Things the tint must NOT touch.
 *
 * The overlay multiplies over the entire document, which is right for UI and
 * wrong for anything whose colour IS the content: a QR code that has to scan,
 * a photo being judged for compression artefacts, a signature pad previewing
 * the ink that will be exported. Signature Maker hit this and had to lift its
 * pad above z-index 9999 by hand, then lift the action bar, toast and skip
 * link over that in turn — a fragile local ladder that every app with a canvas
 * would have had to rebuild.
 *
 * One class instead. Put .notint on the element whose colour must be true. */
.notint{position:relative; z-index:9001}

/* Chrome that has to stay above exempted content. Kept above .notint so a
   toast is never hidden behind a canvas someone exempted. */
#toast{z-index:9002}
.skip{z-index:9003}
:root[data-warmth="1"],:root[data-warmth="2"],:root[data-warmth="3"]{
  --warm-tint:rgba(255,203,145,0.18);
}
:root[data-warmth="2"]{--warm-tint:rgba(255,184,115,0.32)}
:root[data-warmth="3"]{--warm-tint:rgba(255,166,86,0.46)}
:root[data-warmth="1"] body::after,
:root[data-warmth="2"] body::after,
:root[data-warmth="3"] body::after{display:block}

/* ── 15b. The comfort panel ─────────────────────────────────────────────── */
/*
 * Everything here is scoped to #swsPrefs / #swsPrefsBtn. Seven of the apps
 * already style a bare `dialog`, and their rules sit after this file in the
 * cascade — an ID keeps the panel looking the same in all 23 regardless.
 *
 * The options are real radio groups in a real <fieldset>. That is not
 * ceremony: it buys arrow-key navigation, "Text size, 3 of 5" from a screen
 * reader, and correct behaviour with no JavaScript running yet — none of which
 * a div-with-role reimplementation gets right for free.
 */

/* The trigger, sitting next to the tip jar. Icon-only, so the accessible name
   has to come from the markup — apply.mjs writes the aria-label. */
/* Full --tap, not the 36px pill it started as.
   Two review agents flagged this independently and both correctly refused to
   patch it locally, because it is emitted from here into all 23 apps. They
   were right: this is the one control in the portfolio specifically for people
   with access needs, and shipping it below the floor we set for everything
   else — to the user with a tremor who needs it most — could not be defended. */
#swsPrefsBtn{
  display:inline-flex; align-items:center; justify-content:center;
  width:var(--tap); height:var(--tap); flex:none;
  padding:0;
  color:var(--ink-2);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  cursor:pointer;
  transition:color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease),
             background var(--dur-1) var(--ease);
}
#swsPrefsBtn:hover{color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft)}
#swsPrefsBtn svg{width:18px; height:18px; display:block}

#swsPrefs{
  width:min(30rem, calc(100vw - 2 * var(--s4)));
  max-height:min(88dvh, 46rem);
  padding:0;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-2);
  overflow:hidden;
}
/* A dialog is display:none until it opens, so the column layout has to be
   attached to [open] — setting it on the base rule would make the panel
   permanently visible. Laying it out as a flex column is what keeps Done and
   Reset on screen: the earlier fixed max-height on the scroller guessed at the
   footer's height, and the moment the note wrapped to three lines the buttons
   were pushed out of the dialog entirely. */
#swsPrefs[open]{display:flex; flex-direction:column}
#swsPrefs .sws-head,#swsPrefs .sws-foot{flex:none}
#swsPrefs::backdrop{background:rgba(0,0,0,0.45); backdrop-filter:blur(2px)}

/* Header and footer stay put; only the options scroll. At 150% text on a
   short phone the list is taller than the screen, and a Done button that
   scrolls away is a trap. */
#swsPrefs .sws-head{
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s5) var(--s5) var(--s4);
  border-bottom:1px solid var(--line);
}
#swsPrefs .sws-head h2{
  flex:1; min-width:0;
  font-size:var(--t-xl);
  margin:0;
}
#swsPrefs .sws-body{
  flex:1 1 auto;
  min-height:0;
  padding:var(--s5);
  overflow-y:auto;
  overscroll-behavior:contain;
}
#swsPrefs .sws-foot{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s4) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--surface-2);
}
#swsPrefs .sws-foot .grow{flex:1 1 11rem; min-width:0}

#swsPrefs fieldset{
  margin:0 0 var(--s6);
  padding:0;
  border:0;
  min-width:0;
}
#swsPrefs fieldset:last-of-type{margin-bottom:0}
#swsPrefs legend{
  display:block;
  padding:0;
  margin-bottom:var(--s3);
  font-size:var(--t-xs);
  font-weight:600;
  color:var(--ink-2);
}
/* The explanation lives inside the <legend> rather than beside it, so a screen
   reader reads "Warm tint, takes the blue down for night use" as the group's
   name — and so there is no second element to space against the first. */
#swsPrefs legend .lite{
  display:block;
  margin-top:2px;
  font-weight:400;
  line-height:var(--lh-snug);
}
#swsPrefs .opt{display:flex; flex-wrap:wrap; gap:var(--s2)}

/* Beats the base's `label:has(> input[type=radio])` flex row, which is built
   for a settings list and would put each option on its own full-width line. */
#swsPrefs .opt label{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:var(--tap);
  /* Tighter than a .btn on purpose: the permanent tick slot below costs every
     chip about 14px, and at 382px of usable width that is the difference
     between three options on one line and three lines of one option. */
  padding:0 var(--s3);
  font-size:var(--t-sm);
  font-weight:600;
  color:var(--ink-2);
  background:var(--surface-2);
  border:1px solid var(--line-2);
  border-radius:var(--r-ctl);
  cursor:pointer;
  user-select:none;
  transition:background var(--dur-1) var(--ease), color var(--dur-1) var(--ease),
             border-color var(--dur-1) var(--ease);
}
#swsPrefs .opt label:hover{color:var(--ink); border-color:var(--ink-3)}

/* The radio stays in the accessibility tree and stays focusable — it is only
   painted out. display:none or visibility:hidden would make the group
   unreachable by keyboard, which is the exact defect the Pill Schedule audit
   found in the shipped app. */
#swsPrefs .opt input{
  position:absolute;
  width:1px; height:1px;
  margin:-1px; padding:0;
  overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%);
  white-space:nowrap; border:0;
  appearance:none;
}
#swsPrefs .opt label:has(input:checked){
  color:var(--accent-ink);
  background:var(--accent-fill);
  border-color:var(--accent-fill);
}
#swsPrefs .opt label:has(input:focus-visible){
  outline:2px solid var(--focus);
  outline-offset:2px;
  box-shadow:0 0 0 4px var(--focus-halo);
}

/* Selection must not rest on colour alone — that is WCAG 1.4.1, and it is also
   just the difference between "which one is on?" and knowing.

   The slot is always present and only its contents are hidden. Adding the tick
   on selection alone would widen the chip at the moment it is pressed, shoving
   every option after it sideways under the finger that just tapped. */
#swsPrefs .opt label::before{
  content:"✓";
  width:0.8em;
  margin-right:var(--s1);
  text-align:center;
  font-weight:700;
  visibility:hidden;
}
#swsPrefs .opt label:has(input:checked)::before{visibility:visible}

#swsPrefs .sws-note{
  font-size:var(--t-sm);
  line-height:var(--lh-snug);
  color:var(--ink-2);
  margin:0;
}

/* Live sample. Changing text size or spacing with the panel covering the page
   is otherwise guesswork — this gives the setting something to visibly act on
   without closing the dialog. */
#swsPrefs .sws-sample{
  padding:var(--s4);
  margin-bottom:var(--s6);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
}
#swsPrefs .sws-sample p{margin:0; font-size:var(--t-base); color:var(--ink)}
#swsPrefs .sws-sample .sub{margin-top:var(--s2)}

/* ── 16. Print ──────────────────────────────────────────────────────────── */
/* Half these apps exist to produce a piece of paper. Printing is a feature
   here, not an afterthought. */
@media print{
  :root{
    --canvas:#fff; --surface:#fff; --surface-2:#fff; --field:#fff;
    --ink:#000; --ink-2:#333; --ink-3:#555;
    --line:#bbb; --line-2:#888;
    --shadow-0:none; --shadow-1:none; --shadow-2:none;
  }
  body{
    background:#fff !important;
    background-image:none !important;
    color:#000;
    font-size:11pt;
    padding:0;
  }
  .wrap{max-width:none; padding:0}
  header.app,footer.colophon,.tipbtn,.actionbar,#toast,.seg,.skip,
  .noprint,.no-print,.screenonly,#swsPrefsBtn,#swsPrefs{display:none !important}

  /* The warm tint is for a screen at 3am, not for paper. Left on, it would
     multiply amber over every printed page. */
  body::after{display:none !important}

  /* Density and text size are screen comfort settings. Paper has its own
     constraints and a reader who set 150% on their phone did not ask for a
     six-page checklist. */
  :root{--ui-scale:1; --density:1}
  .printonly{display:revert !important}
  section.card,.card,.tablewrap{
    box-shadow:none;
    border:1px solid #bbb;
    break-inside:avoid;
    page-break-inside:avoid;
    margin-bottom:8pt;
  }

  /* Most browsers print with "background graphics" OFF by default, which drops
     every fill but keeps the text colour. Anything that relied on a coloured
     background for contrast — a primary button, a selected chip — would come
     out as near-white text on white paper. Restate them as ink-on-white with a
     border so they survive either setting. */
  .btn,.btn.primary,.chip,.chip.on,.seg button,.seg button.active{
    color:#000 !important;
    background:transparent !important;
    border:1px solid #999 !important;
    box-shadow:none !important;
  }
  .trust,.warn{
    color:#000 !important;
    background:transparent !important;
    border:1px solid #999 !important;
  }
  .trust svg{color:#000 !important}
  h1,h2,h3{break-after:avoid; page-break-after:avoid}
  tr,li{break-inside:avoid; page-break-inside:avoid}
  a{color:#000; text-decoration:none}
  @page{margin:14mm}
}


/* ── specials-planner texture — must follow the base layer to win the cascade ───── */
body{
  background-image:radial-gradient(70rem 40rem at 8% -10%, rgba(192,97,67,0.07), transparent 60%),radial-gradient(60rem 36rem at 96% 2%, rgba(0,148,142,0.06), transparent 55%);
  background-attachment:fixed;
  
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body{background-image:radial-gradient(70rem 40rem at 8% -10%, rgba(233,134,103,0.1), transparent 60%),radial-gradient(60rem 36rem at 96% 2%, rgba(68,185,179,0.09), transparent 55%)}
}
:root[data-theme="dark"] body{background-image:radial-gradient(70rem 40rem at 8% -10%, rgba(233,134,103,0.1), transparent 60%),radial-gradient(60rem 36rem at 96% 2%, rgba(68,185,179,0.09), transparent 55%)}
/* ▲▲▲ END SWS STUDIO BASE ▲▲▲ */

/* ═══ APP LAYER — rules specific to this app live below ═══ */
/* Self-hosted variable fonts (latin subset) — no third-party requests, works offline */
  @font-face{
    font-family:'Fraunces';font-style:normal;font-weight:500 700;font-display:swap;
    src:url(fonts/fraunces-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Spline Sans';font-style:normal;font-weight:400 600;font-display:swap;
    src:url(fonts/spline-sans-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  /* ── app-local colour ──────────────────────────────────────────────────
     Everything that used to be a light-mode hex literal now resolves through
     a studio token, so the theme switch reaches the grid. What stays local is
     the one thing no token can supply: six categorical rotation-letter fills.
     Those are a data encoding (which cycle day is this), not decoration, so
     they are declared once per theme and each is contrast-solved against the
     ink that sits on it — light fills clear 6.4:1 against white ink, dark
     fills clear 9.6:1 against near-black. Verified, not eyeballed. */
  :root{
    --rl-ink:#ffffff;
    --rl0:#9C4224;   /* clay    */
    --rl1:#1C605D;   /* teal    */
    --rl2:#3E6338;   /* sage    */
    --rl3:#78406A;   /* plum    */
    --rl4:#3C5A79;   /* slate   */
    --rl5:#6B5310;   /* ochre   */
    --lunch:var(--surface-2);
    --block:var(--warn-soft);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --rl-ink:#17110E;
      --rl0:#F6A88C; --rl1:#8FD3CD; --rl2:#A9D39B;
      --rl3:#E2A9D4; --rl4:#A8C6E8; --rl5:#DCBE6A;
    }
  }
  :root[data-theme="dark"]{
    --rl-ink:#17110E;
    --rl0:#F6A88C; --rl1:#8FD3CD; --rl2:#A9D39B;
    --rl3:#E2A9D4; --rl4:#A8C6E8; --rl5:#DCBE6A;
  }

  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}

  input,select,textarea{font-family:inherit;font-size:max(1rem,var(--t-base));color:var(--ink)}

  /* ---------- header ---------- */
  /* --veil, not a hardcoded cream. The literal stayed light in dark mode, so
     the sticky header kept a cream bar while the title above it turned light —
     the app name simply disappeared. --veil is the translucent canvas and
     follows the theme. */
  header{position:sticky;top:0;z-index:40;background:var(--veil);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .head-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0 var(--s2)}
  .logo{display:flex;align-items:center;gap:var(--s2);user-select:none}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--rl5));position:relative;flex:none}
  .logo .mark::before,.logo .mark::after{content:'';position:absolute;border-radius:50%}
  .logo .mark::before{width:7px;height:7px;background:#FBF6EC;top:6px;left:6px;box-shadow:11px 0 0 rgba(251,246,236,.75), 0 11px 0 rgba(251,246,236,.75), 11px 11px 0 rgba(251,246,236,.55)}
  .logo h1{font-size:var(--t-xl)}
  .logo .tag{font-size:var(--t-xs);color:var(--ink-2);margin-top:-2px}
  /* The saved flag is evidence, not decoration: it carries a clock time, it
     does not fade back out, and it is a role=status so a screen reader hears
     it. [data-saved-flag] in the base supplies the colour and the fade-in. */
  .saved{margin-left:auto;text-align:right;line-height:var(--lh-snug)}
  .tabs{display:flex;gap:var(--s1);padding-bottom:var(--s2)}
  .tab{min-height:var(--tap);padding:var(--s2) var(--s4);border-radius:var(--r-pill);font-weight:500;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
  .tab.active{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
  .tab:not(.active):hover{border-color:var(--line-2)}

  .btn.primary:hover{background:var(--accent-press)}

  /* The privacy promise as a stamp, not grey footer prose. */
  .trust{margin:var(--s2) 0 var(--s3);max-width:var(--measure)}

  /* ---------- week nav ---------- */
  .weeknav{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) 0 var(--s2);flex-wrap:wrap}
  .weeknav .btn{padding:var(--s2) var(--s3)}
  /* The select takes what is left of the row rather than a fixed 60vw, so the
     five week controls sit on one line on a phone instead of two — that row is
     a row of lessons. */
  .weeknav select{min-height:var(--tap);padding:var(--s2) var(--s3);border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--field);color:var(--ink);flex:1 1 7rem;min-width:6rem;max-width:100%}
  .weeknav .spacer{flex:1}
  .wk-h{font-family:'Fraunces',Georgia,serif;font-size:var(--t-lg);font-weight:600;margin:0 0 var(--s2)}
  .scroll-hint{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 var(--s2)}

  /* ---------- the grid ---------- */
  /* min-width is in rem and driven by the period count, so the grid grows with
     the text-size setting instead of freezing at 840px while the chrome around
     it inflates. 6 periods = 63rem, which still fits inside --wrap on a laptop. */
  .grid-scroll{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--line)}
  table.week{border-collapse:separate;border-spacing:0;width:100%;min-width:calc(19.5rem + var(--cols,6) * 7.25rem);table-layout:fixed}
  table.week th{font-size:var(--t-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:var(--s2) var(--s3);background:var(--surface-2);border-bottom:1.5px solid var(--line-2);border-right:1px solid var(--line);text-align:left}
  table.week th.day-h{width:8rem}
  table.week th.lunch-h{width:2.5rem;text-align:center;background:var(--lunch)}
  table.week th.notes-h{width:9rem}
  table.week td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:0}
  table.week tr:last-child td{border-bottom:none}
  table.week th:last-child,table.week td:last-child{border-right:none}

  /* The Day column stays put while the periods scroll under it — without this
     you scroll to Period 6 and can no longer tell which day you are reading. */
  table.week th.day-h,table.week td.day-td{position:sticky;left:0;z-index:2;background:var(--surface)}
  table.week th.day-h{z-index:3;background:var(--surface-2)}
  table.week td.day-td{box-shadow:1px 0 0 var(--line)}

  .day-cell{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
  .day-name{font-weight:600;font-size:var(--t-base)}
  .day-date{font-size:var(--t-sm);color:var(--ink-2)}
  .day-foot{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .chip.l0{background:var(--rl0)} .chip.l1{background:var(--rl1)} .chip.l2{background:var(--rl2)}
  .chip.l3{background:var(--rl3)} .chip.l4{background:var(--rl4)} .chip.l5{background:var(--rl5)}
  .chip.l0,.chip.l1,.chip.l2,.chip.l3,.chip.l4,.chip.l5{
    color:var(--rl-ink);border-color:transparent;font-size:var(--t-base);font-weight:700;
    min-width:1.9em;justify-content:center;padding:var(--s1) var(--s2)
  }
  /* The only route to the app's headline feature. It gets a real target. */
  .day-gear{margin-left:auto;min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;
    font-size:var(--t-base);border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink-2)}
  .day-gear:hover{color:var(--ink);border-color:var(--ink-2)}

  .sp-banner{display:block;font-size:var(--t-micro);font-weight:600;color:var(--ink);background:var(--block);border:1px solid var(--warn-line);border-radius:var(--r-sm);padding:var(--s1) var(--s2);letter-spacing:.03em;text-transform:uppercase}

  .box{min-height:4.6rem;padding:var(--s2) var(--s3);font-size:var(--t-base);line-height:var(--lh-snug);outline:none;white-space:pre-wrap;overflow-wrap:break-word}
  .box:empty::before{content:'—';color:var(--ink-3)}
  .box:focus{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--focus)}
  td.lunch{background:var(--lunch);text-align:center;vertical-align:middle !important}
  td.lunch span{writing-mode:vertical-rl;font-size:var(--t-micro);letter-spacing:.22em;color:var(--ink-2);text-transform:uppercase;font-weight:600}
  tr.sp-row .box{background:repeating-linear-gradient(-45deg,transparent,transparent 7px,var(--surface-2) 7px,var(--surface-2) 14px)}
  tr.today-row td.day-td{box-shadow:inset 3px 0 0 var(--accent),1px 0 0 var(--line)}

  /* ---------- the grid, stacked, on a phone ----------
     Below 52rem the week stops being an 840px desktop table read two columns
     at a time and becomes one card per day, in reading order, no sideways
     scroll at all. Same DOM, same print path — CSS only. */
  @media screen and (max-width:52rem){
    .grid-scroll{overflow-x:visible;background:transparent;border:0;box-shadow:none;border-radius:0}
    table.week,table.week tbody,table.week tr,table.week td{display:block;width:auto;min-width:0}
    table.week thead{display:none}
    table.week tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 0 var(--s4);overflow:hidden}
    /* `position:static` was blanket-applied here to cancel the sticky day
       column, but it also removed the containing block every cell control
       positions against — so in card layout all thirty merge arrows and all
       forty-eight paint handles collapsed onto a single coordinate, piled on
       top of each other, and only the topmost could ever be clicked. Cancel
       sticky where sticky was actually set, and leave the cells positioned. */
    table.week td{border-right:0;border-bottom:1px solid var(--line);position:relative;box-shadow:none!important}
    /* relative, not static — it cancels the sticky just as well and still
       gives the weekday label's own paint handle something to sit against. */
    table.week td.day-td,table.week th.day-h{position:relative!important;left:auto!important}
    table.week tr td:last-child{border-bottom:0}
    table.week td.day-td{background:var(--surface-2);border-bottom:1px solid var(--line-2)}
    table.week td[data-label]::before{
      content:attr(data-label);display:block;
      font-size:var(--t-micro);letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink-2);font-weight:600;padding:var(--s2) var(--s3) 0
    }
    table.week td[data-label] .box{padding-top:var(--s1)}
    /* Stacked, an empty box does not need a full grid cell's height — this is
       one more period on screen without touching the 44px floor (3.2rem = 51px
       at the default text size, and it scales up from there). */
    .box{min-height:3.2rem}
    td.lunch{display:flex!important;align-items:center;justify-content:center;padding:var(--s1) 0}
    td.lunch span{writing-mode:horizontal-tb}
    tr.today-row{outline:2px solid var(--accent);outline-offset:-2px}
    tr.today-row td.day-td{box-shadow:none}
  }

  /* ---------- copy bar ----------
     It used to be a 101px panel that animated up into the thumb zone, over the
     plans, on every box focus — and moving it to the top only traded that for
     covering the tabs, so the spot that said "Setup" a second ago fired "fill
     every A-day". So it is not a panel any more. It is an ordinary row above
     the grid: always in the same place, covering nothing, never animating, and
     dimmed until you pick a box. "Nothing appears over a primary surface" and
     "nothing in the thumb zone moves" are both hard invariants, and an
     in-flow toolbar is the only version of this control that keeps them. */
  #bar{margin:0 0 var(--s3);padding:var(--s2) var(--s3);background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--r-ctl);color:var(--ink)}
  #bar .inner{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  #bar .hint{font-size:var(--t-sm);color:var(--ink-2);flex:1 1 14rem;min-width:0}
  #bar .btn{flex:1 1 8rem;min-height:var(--tap);white-space:normal;font-size:var(--t-sm);
    line-height:var(--lh-snug);padding:var(--s2) var(--s3)}
  #bar .btn[disabled]{opacity:.55}
  /* On a phone the hint repeats what the box's own accessible name already
     says, and the row it costs is a row of plans. */
  @media (max-width:30rem){ #bar .hint{display:none} }

  /* ---------- welcome ---------- */
  .hero-w{text-align:center;padding:var(--s6) var(--s2) var(--s2)}
  .hero-w h2{font-size:var(--t-3xl);letter-spacing:-.02em;line-height:var(--lh-tight)}
  .hero-w p{color:var(--ink-2);font-size:var(--t-base);max-width:var(--measure);margin:var(--s3) auto var(--s6);line-height:var(--lh-body)}
  .hero-w .trust{text-align:left;margin:0 auto var(--s5);display:flex}
  .hero-w .choices{display:flex;flex-direction:column;gap:var(--s3);max-width:22rem;margin:0 auto}
  .hero-w .choices .btn{min-height:calc(var(--tap) + var(--s3))}

  /* ---------- setup ---------- */
  .frow{display:flex;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
  .field{display:flex;flex-direction:column;gap:var(--s1);flex:1;min-width:8.5rem}
  .field label{font-size:var(--t-sm);font-weight:600;color:var(--ink-2)}
  .field input,.field select{min-height:var(--tap);padding:var(--s2) var(--s3);border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--field)}
  .pn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:var(--s2)}
  .pn-grid input{min-height:var(--tap);padding:var(--s2) var(--s3);border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--field)}
  .days-pick{display:flex;gap:var(--s2);flex-wrap:wrap}
  .dp{min-width:var(--tap);min-height:var(--tap);padding:0 var(--s2);border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--field);font-weight:600;font-size:var(--t-base);color:var(--ink-2)}
  .dp.on{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
  .footnote a{color:var(--accent-deep)}
  .setup-actions{display:flex;gap:var(--s2);flex-wrap:wrap}
  .sample-bar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin:0 0 var(--s3)}
  .sample-bar .btn{min-height:var(--tap)}
  #alert-wrap{margin-top:var(--s3)}
  #save-alert{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}

  /* ---------- modal ---------- */
  /* Same scrim the base uses behind the comfort dialog: a scrim has to darken
     the page in both themes, so it is deliberately theme-independent. */
  #modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:var(--s4)}
  #modal.show{display:flex}
  #modal .sheet{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-2);max-width:24rem;width:100%;padding:var(--s5);max-height:90vh;overflow:auto}
  #modal h3{font-size:var(--t-lg);margin-bottom:var(--s1)}
  #modal .sub{font-size:var(--t-sm);color:var(--ink-2);margin:0 0 var(--s4)}
  #modal .opts{display:flex;flex-direction:column;gap:var(--s2)}
  #modal input{min-height:var(--tap);padding:var(--s2) var(--s3);border-radius:var(--r-ctl);border:1px solid var(--line-2);width:100%;background:var(--field);color:var(--ink)}

  /* The page's reading column is 42rem, which is right for the setup form and
     far too narrow for a week grid — at 1280px it hid 202px of the week. The
     grid alone breaks out of it, centred, never wider than the viewport. */
  @media screen and (min-width:52rem){
    :root{--gw:min(64rem, 100vw - 4rem)}
    /* the header rides the same column so the app name lines up with the grid
       rather than floating over the middle of it */
    header .wrap{max-width:calc(var(--gw) + 2 * var(--s4))}
    .grid-scroll,.weeknav,#bar,.scroll-hint,.sample-bar{
      width:var(--gw);
      margin-inline:calc((100% - var(--gw)) / 2);
    }
    /* the stamp sits at the grid's left edge, not centred on the narrower
       reading column, or the week view reads as two misaligned pages */
    #view > .trust{margin-left:calc((100% - var(--gw)) / 2)}
  }

  /* ---------- print ----------
     One week, one page, is the ritual this app exists to serve: the AP collects
     a printed week every Monday and a copy goes in the sub folder. Compact is
     the default and fits a realistic 6-period week on one landscape sheet;
     "Full detail" sets larger and may run over. Paper size stays the user's
     own choice in the print dialog — we only force the orientation. */
  @media print{
    @page{size:landscape;margin:9mm}
    body{background:#fff;padding:0}
    header,.weeknav,#bar,.footnote,.trust,.scroll-hint,.sample-bar,#alert-wrap,.no-print{display:none !important}
    .grid-scroll{overflow:visible;box-shadow:none;border:1px solid #999;border-radius:0}
    table.week{min-width:0;width:100%;table-layout:fixed}
    table.week th.day-h,table.week td.day-td{position:static;box-shadow:none;background:transparent}
    table.week thead{display:table-header-group}
    table.week tr{break-inside:avoid}
    table.week th{font-size:7pt;padding:2px 3px;background:transparent}
    table.week th.day-h{width:11%}
    table.week th.notes-h{width:13%}
    th.lunch-h,td.lunch{display:none}
    .day-cell{padding:3px 4px;gap:2px}
    .day-name{font-size:8.5pt}
    .day-date{font-size:7.5pt}
    .sp-banner{font-size:7pt;padding:0 2px}
    .day-gear{display:none}
    /* mid-word breaks ("Sketchboo / k covers") read as broken to a sub at
       8:05am. Hyphenate properly; break inside a word only as a last resort. */
    .box{min-height:0;font-size:7.6pt;line-height:1.2;padding:2px 4px;
      overflow-wrap:normal;word-break:normal;hyphens:auto;-webkit-hyphens:auto}
    .box:empty::before{content:''}
    .chip{font-size:8pt;font-weight:700;padding:0 3px}
    body[data-print="full"] .box{font-size:10pt;line-height:1.35;padding:4px 5px}
    body[data-print="full"] table.week th{font-size:8pt}
    .print-title{display:block !important;font-family:'Fraunces',Georgia,serif;font-size:12pt;font-weight:600;margin:0 0 4px}
  }
  .print-title{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  :root[data-motion="less"] *{transition:none !important;animation:none !important}
  @media (max-width:640px){
    .logo h1{font-size:var(--t-lg)}
  }

/* ══════════════════════════════════════════════════════════════════════
   COLOUR, MERGE, FIT — app layer, and it has to stay here.
   This lived inside the generated base block, which design/apply.mjs
   replaces wholesale on every run — so every apply silently deleted the
   entire colour system and the grid reverted to a plain spreadsheet.
   Below the APP LAYER marker it survives.
   ══════════════════════════════════════════════════════════════════════ */
/* ── colour, legend, merge, fit-to-screen ─────────────────────────── */
.week td.filled, .week th.filled{ background:var(--cell-fill) !important; color:var(--cell-ink) !important; }
.week td.filled .box{ color:var(--cell-ink) !important; }
.week td.merged{ text-align:left; }

/* The paint handle. Deliberately faint until the row is hovered or the
   cell has focus — a grid with a coloured dot in every one of sixty
   cells is noise, and she is here to write lessons, not to decorate. */
.paint{ position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:6px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .12s; cursor:pointer; padding:0; z-index:2 }
td:hover > .paint, th:hover > .paint, .paint:focus-visible, td:focus-within > .paint{ opacity:1 }
.paint:focus-visible{ outline:2px solid var(--focus); outline-offset:1px }
.week td, .week th{ position:relative }

.mergebar{ position:absolute; bottom:2px; right:2px; display:flex; gap:2px; opacity:0;
  transition:opacity .12s; z-index:2 }
td:hover > .mergebar, td:focus-within > .mergebar{ opacity:1 }
.mergebar button{ width:20px; height:20px; border-radius:5px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink-2); font-size:11px; line-height:1; padding:0; cursor:pointer }
.mergebar button:focus-visible{ outline:2px solid var(--focus); outline-offset:1px }

/* ── the key ── */
.legend{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:10px 0 4px;
  padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface) }
.legend-t{ font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); font-weight:700 }
.legend-i{ display:inline-flex; align-items:center; gap:6px; font-size:.86rem }
.legend-sw{ width:14px; height:14px; border-radius:4px; border:1px solid rgba(0,0,0,.25); flex:none }

/* ── the picker ── */
.cpick{ position:fixed; z-index:120; width:min(21rem,calc(100vw - 16px));
  background:var(--surface); border:1px solid var(--line-2); border-radius:12px;
  box-shadow:0 16px 40px rgba(0,0,0,.22); padding:14px }
.cpick-t{ margin:0 0 8px; font-weight:650; font-size:.92rem }
.cpick-sw{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:10px }

.cs.on{ outline:3px solid var(--focus); outline-offset:1px }
.cs:focus-visible{ outline:2px solid var(--focus); outline-offset:1px }

.cpick-name input{ width:100%; min-height:40px; margin-top:4px; padding:0 10px;
  border:1px solid var(--line-2); border-radius:8px; background:var(--field); color:var(--ink); font-size:.95rem }
.cpick-scope{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:0 0 10px }
.cpick-scope legend{ font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); padding:0 4px }
.cpick-scope label{ display:flex; align-items:center; gap:7px; font-size:.9rem; min-height:32px }
.cpick-note{ margin:0 0 10px; font-size:.8rem; color:var(--ink-2) }
.cpick-range{ border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:0 0 10px }
.cpick-range-t{ display:block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-bottom:6px }

.cpick-range-row input[type="date"]{ min-height:36px; padding:0 6px; border:1px solid var(--line);
  border-radius:8px; background:var(--field); color:var(--ink); font:inherit; font-size:.85rem }

/* The column heading doubles as its own rename field. The hover ring is the
   invitation; focus makes it unmistakably a text box. */
.pn-edit{ display:inline-block; min-width:3ch; max-width:100%; padding:0 3px; margin:0 -3px;
  border-radius:6px; cursor:text; outline-offset:1px }
.pn-edit:hover{ box-shadow:inset 0 0 0 1px var(--line-2) }
.pn-edit:focus{ background:var(--field); box-shadow:inset 0 0 0 1px var(--focus); outline:none; color:var(--ink) }

/* ── fit to screen ──
   Chrome out of the way, grid scaled by a factor measured in JS so the
   whole week lands inside the viewport without a scrollbar. */
body.fitscreen header.app, body.fitscreen .weeknav, body.fitscreen .trust,
body.fitscreen .footnote, body.fitscreen footer.colophon, body.fitscreen .sample-bar{ display:none }
body.fitscreen{ overflow:hidden }
/* Too narrow to fit honestly: chrome still hidden for the extra room, but
   the grid keeps a readable size and scrolls like normal. */
body.fitscreen.fit-scroll{ overflow:auto }
body.fitscreen.fit-scroll .grid-scroll{ overflow:auto }
body.fitscreen .wrap, body.fitscreen main{ max-width:none; padding:0; margin:0 }
body.fitscreen .grid-scroll{ overflow:visible }
body.fitscreen table.week{ transform:scale(var(--fit,1)); transform-origin:top left; width:max-content }
body.fitscreen .legend{ margin:4px 8px }
.fitbar{ position:fixed; top:8px; right:8px; z-index:60; display:none; gap:6px }
body.fitscreen .fitbar{ display:flex }

@media print{
  .paint, .mergebar, .cpick, .fitbar{ display:none !important }
  .legend{ break-inside:avoid; border:1px solid #999 }
  .week td.filled, .week th.filled{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
    background:var(--cell-fill) !important; color:var(--cell-ink) !important; }
}

/* ── the palette ──────────────────────────────────────────────────────
   The colours were the whole point and they were invisible: every paint
   handle sat at opacity:0 until you hovered the exact cell, and the colour
   key rendered nothing at all until a colour was already in use. The first
   thing a new teacher saw was a plain grid with no evidence any of this
   existed. She opened it, saw a spreadsheet, and was right to.

   So the palette is permanent chrome and works the way a spreadsheet fill
   tool works: pick a colour once, then click boxes. Discoverable because you
   can see it, fast because arming once covers a whole week, and it works on
   a touchscreen, which hover never did. */
.palette{ border:1px solid var(--line); border-radius:var(--r-card); background:var(--surface);
  padding:5px 8px; margin:8px 0 4px }
/* One line that scrolls sideways, not a wrapping block. Sixteen named colours
   wrapped to four rows and ate 412px of a phone screen — on an app whose whole
   job is to sit open beside her while she teaches, the week has to be what is
   on screen, not the toolbar. */
.prow{ display:flex; flex-wrap:nowrap; align-items:center; gap:5px;
  overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin;
  padding-bottom:2px }
.psep{ width:1px; align-self:stretch; background:var(--line); margin:0 4px; flex:none }
.pmini{ min-height:30px; padding:0 10px; border:1px solid var(--line-2); border-radius:999px;
  background:var(--field); color:var(--ink-2); font:inherit; font-size:.78rem; cursor:pointer; white-space:nowrap }
.pmini:hover{ border-color:var(--accent-deep); color:var(--ink) }
.pmini:focus-visible{ outline:2px solid var(--focus); outline-offset:2px }
.plabel{ position:sticky; left:0; background:var(--surface); padding-right:4px; z-index:1 }
.plabel{ font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2);
  font-weight:700; margin-right:2px }
.pstate{ font-size:.85rem; color:var(--ink-2); flex:1 1 12rem }
.pscope{ display:flex; align-items:center; gap:5px; font-size:.8rem; min-height:30px;
  white-space:nowrap; color:var(--ink-2) }

.pchip{ display:inline-flex; align-items:center; gap:5px; min-height:30px; padding:1px 9px 1px 5px;
  border:1px solid var(--line-2); border-radius:999px; background:var(--field); color:var(--ink);
  font:inherit; font-size:.8rem; cursor:pointer; line-height:1.2 }
.pchip:hover{ border-color:var(--accent-deep) }
.pchip:focus-visible{ outline:2px solid var(--focus); outline-offset:2px }
/* Armed reads as pressed three ways at once — ring, weight and the caption
   below — because colour alone cannot carry state on a palette made of colours. */
.pchip.on{ outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus);
  background:var(--accent-soft); font-weight:700 }
.pdot{ width:15px; height:15px; border-radius:4px; background:var(--c);
  border:1px solid rgba(0,0,0,.28); flex:none }
.pdot.none{ background:repeating-linear-gradient(45deg,var(--surface-2) 0 4px,var(--line) 4px 8px) }
.pname{ white-space:nowrap; max-width:11rem; overflow:hidden; text-overflow:ellipsis }

/* the colour editor rows */
.crow{ display:grid; grid-template-columns:auto 1fr auto; gap:2px 10px; align-items:center; margin:0 0 12px }
.crow .cswatch{ width:46px; height:40px; border:1px solid var(--line);
  border-radius:8px; background:var(--c); cursor:pointer }
.crow .crow-del{ min-height:40px; padding:0 12px }
.crow .crow-use{ grid-column:1/-1; color:var(--ink-2); font-size:.75rem }

/* the colour wheel: drag anywhere on it, one brightness slider, a live swatch.
   The native colour input on Android is three sliders all parked at one end,
   which confused the first real user it met. */
.cwheel{ margin:4px 0 12px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface) }
.cw-top{ display:flex; gap:16px; align-items:center; flex-wrap:wrap }
.cw-can{ position:relative; width:180px; height:180px; flex:none }
.cw-can canvas{ width:180px; height:180px; border-radius:50%; touch-action:none; cursor:crosshair; display:block }
.cw-dot{ position:absolute; width:13px; height:13px; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.6);
  border-radius:50%; transform:translate(-50%,-50%); pointer-events:none }
.cw-side{ display:flex; flex-direction:column; gap:6px; align-items:flex-start }
.cw-swatch{ width:64px; height:48px; border-radius:8px; border:1px solid var(--line) }
.cw-hex{ font-size:.8rem; color:var(--ink-2) }
.cwheel .row{ margin-top:10px }
.cwheel .lab{ display:flex; justify-content:space-between; font-size:.85rem; color:var(--ink-2); margin-bottom:4px }
.cwheel input[type="range"]{ width:100% }

/* "any colour" swatch in the quick picker */
.cs.pick{ background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00) }

/* Holding a colour changes the cursor over the grid, so the mode is obvious
   before the first click rather than after it. */
body.painting table.week td, body.painting table.week th, body.painting .box{ cursor:cell }

@media print{ .palette{ display:none !important } }


/* ── a coloured note ──────────────────────────────────────────────────
   One line, one meaning. The colour sits behind the text rather than on the
   whole cell, so several notes can live in one box and each keeps its own
   sense — which is how her book actually reads. */
.box .ln{ min-height:1.35em; border-radius:4px; padding:0 3px; margin:0 -3px }
.box .ln.lnf{ background:var(--ln-bg); color:var(--ln-ink) }
body.painting .box .ln:hover{ outline:2px dashed var(--focus); outline-offset:0 }
@media print{
  .box .ln.lnf{ -webkit-print-color-adjust:exact; print-color-adjust:exact;
    background:var(--ln-bg) !important; color:var(--ln-ink) !important }
}

<!-- A failed write used to be silent while the green "Saved" pill still ran.
     This is the loud, actionable version, and it lives outside #view so a
     re-render cannot wipe it. -->
<div class="wrap" id="alert-wrap" hidden>
  <p class="warn" id="save-alert" role="alert">
    <span id="save-alert-text"></span>
    <button class="btn" id="save-alert-backup">Download a backup now</button>

    <span class="hint" id="bar-hint">Pick a lesson box to copy from.</span>
