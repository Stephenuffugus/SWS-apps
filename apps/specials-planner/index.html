/* ═══════════════════════════════════════════════════════════════════════════
   SWS STUDIO — base layer
   Sky Wolf Studios · SWS Strategic Media LLC

   This file is the shared skeleton behind all 23 apps. It contains ZERO
   colour literals: every colour arrives from the per-app skin block that
   `design/build.mjs` generates ahead of it. That split is the whole trick —
   identical bones, different skin.

   Structural tokens (space, type, radius, timing) live HERE because they are
   invariant across the portfolio. Hue, chroma, texture, font pairing and
   container width live in the skin.

   Do not hand-edit the copy of this that is spliced into an app's index.html.
   Edit this file and re-run `node design/build.mjs && node design/apply.mjs`.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1. Invariant structural tokens ─────────────────────────────────────── */
:root{
  /* Two comfort dials the user controls, declared here because everything
     below is expressed in terms of them. Defaults are the design as drawn:
     --ui-scale 1 and --density 1 reproduce the untouched layout exactly.
     Section 15 is where the user's choice actually moves them. */
  --ui-scale:1;
  --density:1;

  /* Spacing — a 4px base. Use these, never magic numbers.
     Multiplied by --density so one control retunes the whole rhythm; the
     ratios between steps never change, which is what keeps a compact layout
     looking deliberate instead of merely squashed. */
  --s1:calc(4px  * var(--density));
  --s2:calc(8px  * var(--density));
  --s3:calc(12px * var(--density));
  --s4:calc(16px * var(--density));
  --s5:calc(20px * var(--density));
  --s6:calc(24px * var(--density));
  --s7:calc(32px * var(--density));
  --s8:calc(40px * var(--density));
  --s9:calc(56px * var(--density));

  /* Type scale. Body never drops below 16px: these apps get used on phones,
     often by someone tired, and 14px body copy is the single most common
     reason a free tool feels cheap. */
  --t-micro:0.75rem;   /* uppercase labels only, never sentences */
  --t-xs:0.8125rem;
  --t-sm:0.9375rem;
  --t-base:1rem;
  --t-lg:1.0625rem;
  --t-xl:1.25rem;
  --t-2xl:1.5rem;
  --t-3xl:2rem;

  --lh-tight:1.2;
  --lh-snug:1.35;
  --lh-body:1.55;

  /* Measure — prose is capped so lines stay in the comfortable 45–75ch band. */
  --measure:64ch;

  /* Radius. Skins set --r (the card radius); everything else derives, so an
     app can read soft or crisp by changing one number. */
  --r:14px;
  --r-card:var(--r);
  --r-ctl:calc(var(--r) * 0.72);
  --r-sm:calc(var(--r) * 0.5);
  --r-pill:999px;

  /* Motion */
  --ease:cubic-bezier(.32,.72,0,1);
  --dur-1:120ms;
  --dur-2:200ms;
  --dur-3:320ms;

  /* Minimum comfortable hit area. WCAG 2.2 AA asks 24px; 44px is what a
     thumb actually wants.

     It grows with --ui-scale but is floored at 44px, never multiplied by
     --density. Someone who has turned the text up is often doing it for
     eyesight or tremor, and shrinking their targets at the same moment would
     undo the help; someone who picks a compact layout wants less air, not a
     smaller button. Density moves the space between things, never the size of
     the thing you have to hit. */
  --tap:max(44px, calc(44px * var(--ui-scale)));

  --wrap:42rem;
}

/* ── 2. Reset & document ────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}

/* Every type token, --wrap and --measure are expressed in rem, so scaling the
   root font size scales the whole layout in proportion rather than just
   swelling the body copy out of its container. It also reaches the hardcoded
   rem values still sitting in app layers, which a token-only approach would
   miss. Percentages resolve against the browser's own default, so a user who
   has already raised that in their browser settings keeps the benefit and this
   multiplies on top of it.

   rem inside a media query always means the initial font size, never this one,
   so the responsive breakpoints below stay put while the text grows — which is
   what you want: bumping the text should not flip the layout to desktop. */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scroll-behavior:smooth;
  font-size:calc(100% * var(--ui-scale));
}

body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--font-text);
  font-size:var(--t-base);
  line-height:var(--lh-body);
  font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  padding-bottom:calc(var(--s8) + env(safe-area-inset-bottom));
}

@media (min-width:30rem){ body{ font-size:var(--t-lg) } }

h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:var(--display-weight,650);
  line-height:var(--lh-tight);
  letter-spacing:var(--display-tracking,-0.018em);
  margin:0;
  text-wrap:balance;
}

p:last-child{margin-bottom:0}

a{color:var(--accent-deep); text-underline-offset:0.18em; text-decoration-thickness:from-font}
a:hover{color:var(--accent-deep); text-decoration-thickness:2px}

img,svg,canvas,video{max-width:100%}

hr{border:0; border-top:1px solid var(--line); margin:var(--s5) 0}

::selection{background:var(--accent-soft); color:var(--ink)}

/* ── 3. Layout primitives ───────────────────────────────────────────────── */
.wrap{
  max-width:var(--wrap);
  margin-inline:auto;
  padding-inline:max(var(--s4), env(safe-area-inset-left));
}

/* Vertical rhythm without margin-collapse guesswork. */
.stack > * + *{margin-top:var(--stack-gap, var(--s4))}
.stack-sm{--stack-gap:var(--s2)}
.stack-lg{--stack-gap:var(--s6)}

/* Horizontal group that wraps instead of overflowing. */
.cluster{display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center}

/* The legacy equal-columns row, kept because every app uses it — but it now
   collapses to a stack on narrow screens instead of crushing its children. */
.row{display:flex; gap:var(--s2); flex-wrap:wrap}
.row > *{flex:1 1 12rem; min-width:0}
.row.tight{gap:var(--s1)}
.row.nowrap{flex-wrap:nowrap}

/* ── 4. Studio chrome — identical in all 23 apps ────────────────────────── */
/* This block is the strongest "same studio" signal in the system. Palette and
   font change per app; the geometry, order and behaviour never do. */

header.app{
  display:flex;
  align-items:center;
  gap:var(--s3);
  /* Wraps rather than overflows. At the largest text setting the title, the
     settings button and the tip pill cannot share a 414px line, and without
     this the row silently pushes the whole page sideways — the one layout
     failure the comfort settings could introduce on their own. */
  flex-wrap:wrap;
  padding:var(--s4) 0 var(--s3);
  min-height:calc(var(--tap) + var(--s4));
}
header.app img,
header.app .mark{
  width:32px; height:32px; flex:none;
  border-radius:var(--r-sm);
}
/* Flex children default to min-width:auto, which stops long titles shrinking
   and pushes the tip jar off the edge on a narrow phone. */
header.app > *{min-width:0}
header.app h1{
  font-size:var(--t-xl);
  letter-spacing:var(--display-tracking,-0.018em);
  overflow-wrap:break-word;
}
header.app .tagline{
  display:block;
  font-family:var(--font-text);
  font-size:var(--t-xs);
  font-weight:400;
  letter-spacing:0;
  color:var(--ink-2);
  margin-top:1px;
}
header.app .spacer{flex:1}

/* Tip jar. Present in every app, always the same shape, never shouty —
   it is an offer, not a nag. */
a.tipbtn{
  display:inline-flex; align-items:center; gap:var(--s1);
  min-height:36px; padding:0 var(--s3);
  font-family:var(--font-text);
  font-size:var(--t-xs); font-weight:550;
  color:var(--ink-2);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  text-decoration:none;
  white-space:nowrap;
  /* nowrap plus the header's min-width:0 means this can be squeezed narrower
     than its own text and spill. It is a fixed-size pill — let it wrap to the
     next line instead of being crushed. */
  flex:none;
  transition:color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
}
a.tipbtn:hover{color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft)}

.hero{padding:var(--s4) 0 var(--s5)}
.hero h2{font-size:var(--t-2xl); margin-bottom:var(--s2)}
.hero p{color:var(--ink-2); font-size:var(--t-base); max-width:var(--measure)}
.hero p:last-child{margin-bottom:0}

/* --ink-2, not --ink-3. The colophon carries the privacy promise and the
   feedback link, which are sentences a user is meant to read — and this file's
   own rule is that --ink-3 is for placeholders and disabled text only. axe
   caught it failing 4.5:1 on six apps. */
footer.colophon{
  color:var(--ink-2);
  font-size:var(--t-sm);
  line-height:var(--lh-snug);
  text-align:center;
  padding:var(--s8) var(--s4) var(--s5);
  max-width:var(--measure);
  margin-inline:auto;
}
footer.colophon a{color:var(--ink)}
footer.colophon a:hover{color:var(--accent-deep)}

/* The promise, rendered as an actual object rather than a sentence in grey.
   Research finding: users do not believe "private" as body copy — it has to
   look like a stamp on the thing. */
.trust{
  display:inline-flex; align-items:center; gap:var(--s2);
  padding:var(--s3) var(--s4);
  font-size:var(--t-sm);
  line-height:var(--lh-snug);
  color:var(--ink-2);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
}
.trust svg{width:16px; height:16px; flex:none; color:var(--accent-deep)}
.trust b{color:var(--ink); font-weight:600}

/* ── 5. Surfaces ────────────────────────────────────────────────────────── */
section.card,.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-1);
  padding:var(--s5);
  margin-bottom:var(--s4);
}
@media (min-width:30rem){ section.card,.card{ padding:var(--s6) } }

/* The uppercase micro-label that heads each card. Every app already uses
   `card h2` this way, so the selector stays — only the values improve. */
section.card > h2,.card > h2{
  font-family:var(--font-text);
  font-size:var(--t-micro);
  font-weight:650;
  letter-spacing:0.075em;
  text-transform:uppercase;
  color:var(--ink-2);
  margin:0 0 var(--s4);
}
section.card > h2 + .sub,.card > h2 + .sub{margin-top:calc(var(--s4) * -1 + var(--s1))}

.card .sub{font-size:var(--t-sm); color:var(--ink-2); margin:0 0 var(--s4)}

/* An inset well, for previews and results. */
.well{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  padding:var(--s4);
}

/* ── 6. Controls ────────────────────────────────────────────────────────── */
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}

/* 16px minimum on inputs is not a style choice — anything smaller makes iOS
   Safari zoom the page on focus, which feels broken. */
input[type=text],input[type=url],input[type=tel],input[type=email],
input[type=number],input[type=search],input[type=date],input[type=time],
input[type=password],select,textarea{
  width:100%;
  min-height:var(--tap);
  padding:var(--s3);
  font-size:max(1rem, var(--t-base));
  line-height:var(--lh-snug);
  color:var(--ink);
  background:var(--field);
  border:1px solid var(--line-2);
  border-radius:var(--r-ctl);
  transition:border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--ink-3)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:6.5rem; resize:vertical; line-height:var(--lh-body)}

::placeholder{color:var(--ink-3); opacity:1}

select{
  appearance:none;
  padding-right:var(--s7);
  background-image:var(--caret);
  background-repeat:no-repeat;
  background-position:right var(--s3) center;
  background-size:12px;
}

input:disabled,select:disabled,textarea:disabled,button:disabled{opacity:.5; cursor:not-allowed}

/* Field label. `label.f` is the portfolio's existing convention. */
label.f,.field{display:block; margin-bottom:var(--s4)}
label.f > span,.field > label{
  display:block;
  font-size:var(--t-xs);
  font-weight:600;
  color:var(--ink-2);
  margin-bottom:var(--s2);
}
label.f .hint,.field .hint{margin-top:var(--s2)}

.frow{display:flex; gap:var(--s3); flex-wrap:wrap}
.frow > *{flex:1 1 9rem; min-width:0}

/* Checkbox / radio get real size and a real hit area. */
input[type=checkbox],input[type=radio]{
  width:1.25rem; height:1.25rem;
  min-height:0;
  accent-color:var(--accent);
  flex:none;
  margin:0;
  cursor:pointer;
}
label:has(> input[type=checkbox]),label:has(> input[type=radio]){
  display:flex; align-items:center; gap:var(--s3);
  min-height:var(--tap);
  cursor:pointer;
}

/* ── 7. Buttons ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap);
  padding:0 var(--s5);
  font-size:var(--t-sm);
  font-weight:600;
  line-height:1;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--r-ctl);
  box-shadow:var(--shadow-0);
  cursor:pointer;
  text-decoration:none;
  white-space:nowrap;
  transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease),
             color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease),
             box-shadow var(--dur-1) var(--ease);
}
.btn:hover:not(:disabled){background:var(--surface-2); border-color:var(--ink-3)}
.btn:active:not(:disabled){transform:scale(.98)}

.btn.primary{
  color:var(--accent-ink);
  background:var(--accent-fill);
  border-color:var(--accent-fill);
  box-shadow:var(--shadow-1);
}
.btn.primary:hover:not(:disabled){background:var(--accent-press); border-color:var(--accent-press)}

.btn.danger{color:var(--neg); border-color:var(--neg-line); background:var(--surface)}
.btn.danger:hover:not(:disabled){background:var(--neg-soft); border-color:var(--neg)}

.btn.ghost,.btn.plain{
  background:transparent; border-color:transparent; box-shadow:none;
  color:var(--ink-2); font-weight:550;
}
.btn.ghost:hover:not(:disabled),.btn.plain:hover:not(:disabled){background:var(--surface-2); color:var(--ink)}

.btn.small{min-height:36px; padding:0 var(--s3); font-size:var(--t-xs)}
.btn.big{min-height:52px; padding:0 var(--s6); font-size:var(--t-base)}
.btn.block{width:100%}

/* Icon-only buttons still need a full hit area and an accessible name;
   the name comes from the markup, the area comes from here. */
.btn.icon{padding:0; width:var(--tap); min-width:var(--tap)}

/* Segmented control. */
.seg{
  display:flex;
  gap:var(--s1);
  padding:var(--s1);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  margin-bottom:var(--s4);
  flex-wrap:wrap;
}
.seg button,.seg .tab{
  flex:1 1 auto;
  min-height:38px;
  padding:0 var(--s4);
  font-size:var(--t-sm);
  font-weight:600;
  color:var(--ink-2);
  background:transparent;
  border:0;
  border-radius:calc(var(--r-ctl) - var(--s1));
  cursor:pointer;
  white-space:nowrap;
  transition:background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.seg button:hover:not(.active),.seg .tab:hover:not(.active){color:var(--ink)}
.seg button.active,.seg .tab.active{
  color:var(--accent-ink);
  background:var(--accent-fill);
  box-shadow:var(--shadow-0);
}

/* ── 8. Small type & status ─────────────────────────────────────────────── */
/* --t-sm (15px), not --t-xs (13px). Hints are where these apps put their
   actual instructions — "tap a name to edit it", "the schedule travels inside
   the link" — and the audits flagged 12.8px hint text as a defect on app after
   app. If it teaches the user something, it does not get to be the smallest
   thing on the page. --t-xs is for chrome: chips, tab labels, the tip pill. */
.hint,.footnote,.small{
  font-size:var(--t-sm);
  line-height:var(--lh-body);
  color:var(--ink-2);
  max-width:var(--measure);
}
.hint{margin-top:var(--s2)}
.em{color:var(--ink); font-weight:600}
.muted{color:var(--ink-2)}

.chip{
  display:inline-flex; align-items:center; gap:var(--s1);
  padding:var(--s1) var(--s3);
  font-size:var(--t-xs); font-weight:600; line-height:1.4;
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
}
.chip.on{color:var(--accent-ink); background:var(--accent-fill); border-color:var(--accent-fill)}
.chips{display:flex; flex-wrap:wrap; gap:var(--s2)}

/* "Saved" said out loud, quietly. The audits found that saving is
   fire-and-forget across the portfolio — the app only speaks when it FAILS, so
   the user's only evidence that their list survived is that nothing happened.
   SWS.saved() drives this. */
[data-saved-flag]{
  font-size:var(--t-xs);
  font-weight:600;
  color:var(--pos);
  opacity:0;
  transition:opacity var(--dur-2) var(--ease);
}
[data-saved-flag].show{opacity:1}

.warn{
  padding:var(--s3) var(--s4);
  font-size:var(--t-sm);
  color:var(--ink);
  background:var(--warn-soft);
  border:1px solid var(--warn-line);
  border-left:3px solid var(--warn);
  border-radius:var(--r-sm);
}

/* ── 8b. Row lists ──────────────────────────────────────────────────────── */
/* `ul.plain` is the portfolio's list-of-things: 15 of the 23 apps already use
   it. Rows carry a real minimum height because most of them hold a checkbox
   or a delete button that a thumb has to land on. */
ul.plain,ol.plain{list-style:none; margin:0; padding:0}
ul.plain > li,ol.plain > li{
  display:flex; align-items:center; gap:var(--s3);
  min-height:var(--tap);
  padding:var(--s2) 0;
  border-bottom:1px solid var(--line);
  font-size:var(--t-base);
}
ul.plain > li:last-child,ol.plain > li:last-child{border-bottom:0}
ul.plain .grow,ol.plain .grow{flex:1; min-width:0; overflow-wrap:anywhere}

/* Secondary line under a heading or beside a value. Often carries real status
   data ("last diaper: 2h ago"), so it does not get to be tiny. */
.sub{font-size:var(--t-sm); color:var(--ink-2)}

/* ── 9. Empty states ────────────────────────────────────────────────────── */
/* Portfolio-wide gap: most apps opened cold show an empty box and no idea
   what to do. An empty state is the cheapest onboarding there is. */
.empty{
  text-align:center;
  padding:var(--s7) var(--s5);
  color:var(--ink-2);
}
.empty .glyph{
  font-size:2rem;
  line-height:1;
  margin-bottom:var(--s3);
  opacity:.55;
}
.empty h3{
  font-size:var(--t-lg);
  color:var(--ink);
  margin-bottom:var(--s2);
}
.empty p{
  font-size:var(--t-base);
  margin-inline:auto;
  max-width:34ch;
  margin-bottom:var(--s4);
}

/* ── 10. Tables ─────────────────────────────────────────────────────────── */
/* Wide tables scroll inside their own box; the page body never scrolls
   sideways. The fade on the right edge is the affordance that tells you
   there is more. */
.tablewrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--line);
  border-radius:var(--r-card);
  background:var(--surface);
  box-shadow:var(--shadow-1);
}
table{border-collapse:collapse; width:100%}
th{
  font-size:var(--t-micro);
  font-weight:650;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--ink-2);
  text-align:left;
  padding:var(--s3);
  background:var(--surface-2);
  border-bottom:1px solid var(--line-2);
}
td{padding:var(--s3); border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}

/* ── 11. Toast ──────────────────────────────────────────────────────────── */
#toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--s6) + env(safe-area-inset-bottom));
  transform:translate(-50%, 8px);
  z-index:60;
  max-width:min(90vw, 28rem);
  padding:var(--s3) var(--s5);
  font-size:var(--t-sm);
  font-weight:550;
  text-align:center;
  color:var(--toast-ink);
  background:var(--toast-bg);
  border-radius:var(--r-pill);
  box-shadow:var(--shadow-2);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease), visibility var(--dur-2);
}
#toast.show{opacity:1; visibility:visible; transform:translate(-50%, 0)}

/* An undo lives inside the toast, so the toast has to stop being decoration
   and become clickable.
 *
 * This is the portfolio's answer to the single most repeated finding in the
 * audits: destructive actions with no way back. A confirm dialog on every tap
 * is the wrong fix — it taxes the 99 correct taps to catch the one mistake,
 * and at 3am it is just another thing to dismiss. Undo taxes nothing.
 *
 * Promoted here from Pill Schedule and Caregiver Log, which had it first. */
#toast.act{
  display:flex; align-items:center; justify-content:center; gap:var(--s3);
  pointer-events:auto;
  text-align:left;
}
#toast .undo{
  flex:none;
  min-height:var(--tap);
  margin-left:var(--s1);
  padding:0 var(--s4);
  font:inherit;
  font-weight:700;
  color:var(--toast-bg);
  background:var(--toast-ink);
  border:0;
  border-radius:var(--r-pill);
  cursor:pointer;
}
#toast .undo:focus-visible{outline:2px solid var(--toast-ink); outline-offset:3px}

/* ── 12. Sticky action bar ──────────────────────────────────────────────── */
.actionbar{
  position:sticky;
  bottom:0;
  z-index:40;
  display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap;
  margin:var(--s5) calc(var(--s4) * -1) 0;
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:var(--veil);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}

/* ── 13. Focus ──────────────────────────────────────────────────────────── */
/* A two-part ring: the solid outline carries the shape, the halo guarantees
   it stays visible when the element sits on a same-hue background. */
:focus{outline:none}
:focus-visible{
  outline:2px solid var(--focus);
  outline-offset:2px;
  box-shadow:0 0 0 4px var(--focus-halo);
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline-offset:0;
  border-color:var(--focus);
}

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%);
  white-space:nowrap; border:0;
}

/* Skip link — keyboard users should not tab through the header on every app. */
.skip{
  position:absolute; left:var(--s4); top:var(--s4); z-index:100;
  padding:var(--s3) var(--s4);
  background:var(--accent-fill); color:var(--accent-ink);
  border-radius:var(--r-ctl); font-weight:600; font-size:var(--t-sm);
  text-decoration:none;
  transform:translateY(-200%);
  transition:transform var(--dur-2) var(--ease);
}
.skip:focus-visible{transform:none; color:var(--accent-ink)}

/* ── 14. Utility ────────────────────────────────────────────────────────── */
.hidden{display:none !important}
.nowrap{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}

/* ── 15. Comfort — user preferences ─────────────────────────────────────── */
/*
 * The operating system's preference is always the default. An attribute on
 * <html> is the user overriding it *for our apps*, and it must be able to win
 * in both directions — someone whose phone is in dark mode and who asks us for
 * light is not confused, they have a reason, and a switch that only works one
 * way is not a switch.
 *
 * That is why each preference appears twice: once inside the media query
 * guarded by :not([...]) so an explicit opt-out escapes it, and once on the
 * attribute so an explicit opt-in gets it regardless of the OS.
 *
 * sws-prefs.js writes these attributes before first paint and stores them
 * under one localStorage key for the whole origin, so a choice made in Baby
 * Log at 3am is already in effect the first time Grocery List is opened.
 */

/* -- Text size. Five steps; the middle one is the design as drawn. --------- */
:root[data-text="s"]  {--ui-scale:0.9}
:root[data-text="m"]  {--ui-scale:1}
:root[data-text="l"]  {--ui-scale:1.15}
:root[data-text="xl"] {--ui-scale:1.3}
:root[data-text="xxl"]{--ui-scale:1.5}

/* -- Density. Moves the air between things, never the size of a target. ---- */
:root[data-density="compact"]{--density:0.8}
:root[data-density="cosy"]   {--density:1}
:root[data-density="roomy"]  {--density:1.25}

/* -- Motion ---------------------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  :root:not([data-motion="full"]){scroll-behavior:auto}
  :root:not([data-motion="full"]) *,
  :root:not([data-motion="full"]) *::before,
  :root:not([data-motion="full"]) *::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
  :root:not([data-motion="full"]) .btn:active:not(:disabled){transform:none}
}
:root[data-motion="less"]{scroll-behavior:auto}
:root[data-motion="less"] *,
:root[data-motion="less"] *::before,
:root[data-motion="less"] *::after{
  animation-duration:0.01ms !important;
  animation-iteration-count:1 !important;
  transition-duration:0.01ms !important;
  scroll-behavior:auto !important;
}
:root[data-motion="less"] .btn:active:not(:disabled){transform:none}

/* -- Contrast --------------------------------------------------------------
   Beyond darkening the greys: the frosted action bar becomes opaque. A blurred
   translucent strip with text behind it is the single worst thing on the page
   for anyone who needed high contrast in the first place. */
@media (prefers-contrast:more){
  :root:not([data-contrast="normal"]){--line:var(--line-2)}
  :root:not([data-contrast="normal"]) body{--ink-2:var(--ink); --ink-3:var(--ink-2)}
  :root:not([data-contrast="normal"]) .btn{border-width:2px}
  :root:not([data-contrast="normal"]) :focus-visible{outline-width:3px}
  :root:not([data-contrast="normal"]) .actionbar{
    background:var(--canvas);
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
    border-top-width:2px;
  }
}
:root[data-contrast="more"]{--line:var(--line-2)}
:root[data-contrast="more"] body{--ink-2:var(--ink); --ink-3:var(--ink-2)}
:root[data-contrast="more"] .btn{border-width:2px}
:root[data-contrast="more"] :focus-visible{outline-width:3px}
:root[data-contrast="more"] .actionbar{
  background:var(--canvas);
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border-top-width:2px;
}

/* -- Easier reading --------------------------------------------------------
   Not a font download. The evidence for a "dyslexia font" beating a plain one
   is thin; the evidence for letter, word and line spacing is not, and spacing
   costs no bytes and works offline. This also drops the display face for the
   system stack, which is the request behind most "I find this hard to read"
   reports about a display serif, and turns off ligatures so "fi" and "ffi"
   stop fusing into shapes that have to be decoded rather than read. */
:root[data-reading="easy"]{
  --font-display:var(--font-text);
  --display-weight:700;
  --display-tracking:0;
  --lh-body:1.8;
  --lh-snug:1.55;
  --measure:58ch;
}
:root[data-reading="easy"] body{
  letter-spacing:0.048em;
  word-spacing:0.14em;
  font-variant-ligatures:none;
}
/* Tabular figures are already spaced; adding to them only breaks the columns
   they exist to keep aligned. */
:root[data-reading="easy"] .tnum,
:root[data-reading="easy"] table{letter-spacing:normal; word-spacing:normal}

/* -- Warm tint -------------------------------------------------------------
   Half of these apps get opened in a dark room at 3am — a feed at two, a dose
   at four. This is the f.lux move: a warm wash that pulls the blue down.

   It is an overlay rather than a filter on purpose. `filter` on a container
   makes it the containing block for its fixed-position descendants, which
   would tear the toast and the sticky action bar out of the viewport and
   strand them mid-page. An overlay leaves layout completely alone.

   multiply is the right blend: it attenuates the blue channel instead of
   veiling the page in beige, so it warms a light page and a dark one with the
   same declaration and never lifts the black level. */
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  pointer-events:none;
  background:var(--warm-tint);
  mix-blend-mode:multiply;
}
:root[data-warmth="1"],:root[data-warmth="2"],:root[data-warmth="3"]{
  --warm-tint:rgba(255,203,145,0.18);
}
:root[data-warmth="2"]{--warm-tint:rgba(255,184,115,0.32)}
:root[data-warmth="3"]{--warm-tint:rgba(255,166,86,0.46)}
:root[data-warmth="1"] body::after,
:root[data-warmth="2"] body::after,
:root[data-warmth="3"] body::after{display:block}

/* ── 15b. The comfort panel ─────────────────────────────────────────────── */
/*
 * Everything here is scoped to #swsPrefs / #swsPrefsBtn. Seven of the apps
 * already style a bare `dialog`, and their rules sit after this file in the
 * cascade — an ID keeps the panel looking the same in all 23 regardless.
 *
 * The options are real radio groups in a real <fieldset>. That is not
 * ceremony: it buys arrow-key navigation, "Text size, 3 of 5" from a screen
 * reader, and correct behaviour with no JavaScript running yet — none of which
 * a div-with-role reimplementation gets right for free.
 */

/* The trigger, sitting next to the tip jar. Icon-only, so the accessible name
   has to come from the markup — apply.mjs writes the aria-label. */
#swsPrefsBtn{
  display:inline-flex; align-items:center; justify-content:center;
  width:36px; height:36px; flex:none;
  padding:0;
  color:var(--ink-2);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  cursor:pointer;
  transition:color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease),
             background var(--dur-1) var(--ease);
}
#swsPrefsBtn:hover{color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft)}
#swsPrefsBtn svg{width:18px; height:18px; display:block}

#swsPrefs{
  width:min(30rem, calc(100vw - 2 * var(--s4)));
  max-height:min(88dvh, 46rem);
  padding:0;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-2);
  overflow:hidden;
}
/* A dialog is display:none until it opens, so the column layout has to be
   attached to [open] — setting it on the base rule would make the panel
   permanently visible. Laying it out as a flex column is what keeps Done and
   Reset on screen: the earlier fixed max-height on the scroller guessed at the
   footer's height, and the moment the note wrapped to three lines the buttons
   were pushed out of the dialog entirely. */
#swsPrefs[open]{display:flex; flex-direction:column}
#swsPrefs .sws-head,#swsPrefs .sws-foot{flex:none}
#swsPrefs::backdrop{background:rgba(0,0,0,0.45); backdrop-filter:blur(2px)}

/* Header and footer stay put; only the options scroll. At 150% text on a
   short phone the list is taller than the screen, and a Done button that
   scrolls away is a trap. */
#swsPrefs .sws-head{
  display:flex; align-items:center; gap:var(--s3);
  padding:var(--s5) var(--s5) var(--s4);
  border-bottom:1px solid var(--line);
}
#swsPrefs .sws-head h2{
  flex:1; min-width:0;
  font-size:var(--t-xl);
  margin:0;
}
#swsPrefs .sws-body{
  flex:1 1 auto;
  min-height:0;
  padding:var(--s5);
  overflow-y:auto;
  overscroll-behavior:contain;
}
#swsPrefs .sws-foot{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:var(--s4) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--surface-2);
}
#swsPrefs .sws-foot .grow{flex:1 1 11rem; min-width:0}

#swsPrefs fieldset{
  margin:0 0 var(--s6);
  padding:0;
  border:0;
  min-width:0;
}
#swsPrefs fieldset:last-of-type{margin-bottom:0}
#swsPrefs legend{
  display:block;
  padding:0;
  margin-bottom:var(--s3);
  font-size:var(--t-xs);
  font-weight:600;
  color:var(--ink-2);
}
/* The explanation lives inside the <legend> rather than beside it, so a screen
   reader reads "Warm tint, takes the blue down for night use" as the group's
   name — and so there is no second element to space against the first. */
#swsPrefs legend .lite{
  display:block;
  margin-top:2px;
  font-weight:400;
  line-height:var(--lh-snug);
}
#swsPrefs .opt{display:flex; flex-wrap:wrap; gap:var(--s2)}

/* Beats the base's `label:has(> input[type=radio])` flex row, which is built
   for a settings list and would put each option on its own full-width line. */
#swsPrefs .opt label{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:var(--tap);
  /* Tighter than a .btn on purpose: the permanent tick slot below costs every
     chip about 14px, and at 382px of usable width that is the difference
     between three options on one line and three lines of one option. */
  padding:0 var(--s3);
  font-size:var(--t-sm);
  font-weight:600;
  color:var(--ink-2);
  background:var(--surface-2);
  border:1px solid var(--line-2);
  border-radius:var(--r-ctl);
  cursor:pointer;
  user-select:none;
  transition:background var(--dur-1) var(--ease), color var(--dur-1) var(--ease),
             border-color var(--dur-1) var(--ease);
}
#swsPrefs .opt label:hover{color:var(--ink); border-color:var(--ink-3)}

/* The radio stays in the accessibility tree and stays focusable — it is only
   painted out. display:none or visibility:hidden would make the group
   unreachable by keyboard, which is the exact defect the Pill Schedule audit
   found in the shipped app. */
#swsPrefs .opt input{
  position:absolute;
  width:1px; height:1px;
  margin:-1px; padding:0;
  overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%);
  white-space:nowrap; border:0;
  appearance:none;
}
#swsPrefs .opt label:has(input:checked){
  color:var(--accent-ink);
  background:var(--accent-fill);
  border-color:var(--accent-fill);
}
#swsPrefs .opt label:has(input:focus-visible){
  outline:2px solid var(--focus);
  outline-offset:2px;
  box-shadow:0 0 0 4px var(--focus-halo);
}

/* Selection must not rest on colour alone — that is WCAG 1.4.1, and it is also
   just the difference between "which one is on?" and knowing.

   The slot is always present and only its contents are hidden. Adding the tick
   on selection alone would widen the chip at the moment it is pressed, shoving
   every option after it sideways under the finger that just tapped. */
#swsPrefs .opt label::before{
  content:"✓";
  width:0.8em;
  margin-right:var(--s1);
  text-align:center;
  font-weight:700;
  visibility:hidden;
}
#swsPrefs .opt label:has(input:checked)::before{visibility:visible}

#swsPrefs .sws-note{
  font-size:var(--t-sm);
  line-height:var(--lh-snug);
  color:var(--ink-2);
  margin:0;
}

/* Live sample. Changing text size or spacing with the panel covering the page
   is otherwise guesswork — this gives the setting something to visibly act on
   without closing the dialog. */
#swsPrefs .sws-sample{
  padding:var(--s4);
  margin-bottom:var(--s6);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
}
#swsPrefs .sws-sample p{margin:0; font-size:var(--t-base); color:var(--ink)}
#swsPrefs .sws-sample .sub{margin-top:var(--s2)}

/* ── 16. Print ──────────────────────────────────────────────────────────── */
/* Half these apps exist to produce a piece of paper. Printing is a feature
   here, not an afterthought. */
@media print{

    --canvas:#fff; --surface:#fff; --surface-2:#fff; --field:#fff;
    --ink:#000; --ink-2:#333; --ink-3:#555;
    --line:#bbb; --line-2:#888;

  /* The warm tint is for a screen at 3am, not for paper. Left on, it would
     multiply amber over every printed page. */
  body::after{display:none !important}

  /* Density and text size are screen comfort settings. Paper has its own
     constraints and a reader who set 150% on their phone did not ask for a
     six-page checklist. */
  :root{--ui-scale:1; --density:1}
  .printonly{display:revert !important}

    border:1px solid #bbb;

    page-break-inside:avoid;

  }

  /* Most browsers print with "background graphics" OFF by default, which drops
     every fill but keeps the text colour. Anything that relied on a coloured
     background for contrast — a primary button, a selected chip — would come
     out as near-white text on white paper. Restate them as ink-on-white with a
     border so they survive either setting. */
  .btn,.btn.primary,.chip,.chip.on,.seg button,.seg button.active{

  tr,li{break-inside:avoid; page-break-inside:avoid}

}

<script>
/* =====================================================================
   Specials Planner — single-file specials lesson planner.
   Vanilla JS, no build step. State lives in localStorage key "palette2".
   Handoff notes for Claude Code live in HANDOFF.md next to this file.
   ===================================================================== */

/* ------------------ config seams (fill these to enable) ------------- */
const CLIENT_ID = "";   // Google OAuth Web Client ID → enables Drive save/load (scope: drive.file). Empty = feature hidden.
const TIP_URL   = "https://buy.stripe.com/7sY7sM6PD91l3fn45P7EQ0l";   // Stripe Payment Link URL → shows a quiet tip-jar link in Setup. Empty = hidden.

/* ------------------ storage shim ------------------------------------ */
const KEY='palette2';
const store={
  ok:(()=>{try{localStorage.setItem('__pt','1');localStorage.removeItem('__pt');return true}catch(e){return false}})(),
  mem:{},
  get(k){ if(this.ok){try{return localStorage.getItem(k)}catch(e){}} return (k in this.mem)?this.mem[k]:null },
  set(k,v){ if(this.ok){try{localStorage.setItem(k,v);return}catch(e){}} this.mem[k]=v },
  del(k){ if(this.ok){try{localStorage.removeItem(k)}catch(e){}} delete this.mem[k] }
};

/* ------------------ state ------------------------------------------- */
let S=null;           // null → welcome screen
let YEAR=[];          // [{monday, days:[{iso,dow,letter,special}]}]
let curView='week';
let curWeek=0;
let saveT=null;

function defaultConfig(){
  const y=new Date().getFullYear();
  const aug=new Date(y, 7, 1);              // Aug 1 this year
  const start=(new Date()>aug)? aug : new Date(y,7,1);
  return {
    yearStart:`${start.getFullYear()}-08-24`,
    yearEnd:`${start.getFullYear()+1}-05-28`,
    workDays:[1,2,3,4,5],
    periods:6, lunchAfter:2,
    letters:['A','B','C'],
    teacher:'', driveFileId:''
  };
}
function migrate(s){
  if(!s||typeof s!=='object'||!s.config) return null;
  s.cells=s.cells||{}; s.notes=s.notes||{}; s.special=s.special||{};
  const d=defaultConfig(), c=s.config;
  for(const k in d) if(c[k]===undefined) c[k]=d[k];
  c.periods=Math.max(1,Math.min(10,+c.periods||6));
  c.lunchAfter=Math.max(0,Math.min(c.periods,+c.lunchAfter??2));
  if(!Array.isArray(c.letters)||!c.letters.length) c.letters=['A','B','C'];
  c.letters=c.letters.map(x=>String(x).trim()).filter(Boolean).slice(0,6);
  if(!c.letters.length) c.letters=['A'];
  if(!Array.isArray(c.workDays)||!c.workDays.length) c.workDays=[1,2,3,4,5];
  return s;
}
function loadState(){ try{const r=store.get(KEY); S=r?migrate(JSON.parse(r)):null}catch(e){S=null} }
function persist(){ store.set(KEY,JSON.stringify(S)); flashSaved(); }
function queueSave(){ clearTimeout(saveT); saveT=setTimeout(persist,400); }
function flashSaved(){ const el=document.getElementById('saved'); el.classList.add('show'); clearTimeout(flashSaved.t); flashSaved.t=setTimeout(()=>el.classList.remove('show'),1200); }

/* ------------------ dates ------------------------------------------- */
const DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYABBR=['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseISO(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null; const[y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return isNaN(dt)?null:dt; }
function fmtISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function niceDate(iso){ const d=parseISO(iso); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function weekLabel(w){
  const a=parseISO(w.days[0].iso), b=parseISO(w.days[w.days.length-1].iso);
  const yr=b.getFullYear();
  return a.getMonth()===b.getMonth()
    ? `${MONTHS[a.getMonth()]} ${a.getDate()}–${b.getDate()}, ${yr}`
    : `${MONTHS[a.getMonth()]} ${a.getDate()} – ${MONTHS[b.getMonth()]} ${b.getDate()}, ${yr}`;
}

/* ------------------ year builder ------------------------------------ */
/* Rotation letters cycle continuously over school days across the whole
   year. Days marked "special" (no school / work day) show a banner and do
   NOT consume a letter — so the rotation stays true after breaks.        */
function buildYear(){
  YEAR=[]; if(!S) return;
  const c=S.config, start=parseISO(c.yearStart), end=parseISO(c.yearEnd);
  if(!start||!end||end<start) return;
  let li=0;
  let cur=addDays(start,-((start.getDay()+6)%7));   // back to that week's Monday
  let guard=0;
  while(cur<=end && guard++<80){
    const days=[];
    for(let i=0;i<7;i++){
      const d=addDays(cur,i), dow=d.getDay();
      if(!c.workDays.includes(dow)) continue;
      if(d<start||d>end) continue;
      const iso=fmtISO(d), sp=S.special[iso]||null;
      let letter=null;
      if(!sp){ letter=c.letters[li%c.letters.length]; li++; }
      days.push({iso,dow,letter,special:sp});
    }
    if(days.length) YEAR.push({monday:fmtISO(cur),days});
    cur=addDays(cur,7);
  }
}
function weekIndexFor(iso){
  for(let i=0;i<YEAR.length;i++){
    const w=YEAR[i], last=w.days[w.days.length-1].iso;
    if(iso<=last) return i;
  }
  return YEAR.length?YEAR.length-1:0;
}

/* ------------------ safe text --------------------------------------- */
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ------------------ focus & announcements ---------------------------
   Re-rendering replaces the whole view, so anything that re-renders must
   put keyboard focus somewhere sensible afterward; announce() feeds the
   one polite live region (the view itself must NOT be live — it would
   read the entire week table on every render).                          */
function refocus(id,fallback){
  const el=document.getElementById(id);
  if(el&&!el.disabled){ el.focus(); return; }
  if(fallback){ const f=document.getElementById(fallback); if(f&&!f.disabled) f.focus(); }
}
function announce(msg){
  const el=document.getElementById('live'); if(!el) return;
  el.textContent=''; setTimeout(()=>{ el.textContent=msg; },30);
}

/* ------------------ render root ------------------------------------- */
const view=document.getElementById('view');
function render(){
  hideBar(); closeModal();
  const tabs=document.querySelector('.tabs');
  if(!S){ tabs.style.display='none'; renderWelcome(); return; }
  tabs.style.display='flex';
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.view===curView;t.classList.toggle('active',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
  if(curView==='week') renderWeek(); else renderSetup();
}

/* ------------------ welcome ----------------------------------------- */
function renderWelcome(){
  view.innerHTML=`<div style="text-align:center;padding:30px 6px 8px">
    <h2 style="font-size:30px;letter-spacing:-.02em;line-height:1.12">Plan your whole year once.</h2>

    <div style="display:flex;flex-direction:column;gap:11px;max-width:340px;margin:0 auto">
      <button class="btn primary" id="w-fresh" style="padding:15px">Start fresh →</button>
      <button class="btn" id="w-sample" style="padding:15px">See a sample first</button>
      <button class="btn ghost" id="w-import" style="font-size:13px">Restore from a backup file</button>
    </div></div>
    <div class="footnote">Works on your phone or laptop · print a week for subs · export to a spreadsheet anytime.<br>A free tool by <a href="../">Sky Wolf Studios</a> · <a href="privacy.html">Privacy &amp; accessibility</a> · <a href="mailto:stephenfurpahs@gmail.com?subject=Feedback%3A%20Specials%20Planner">Feedback</a></div>`;
  document.getElementById('w-fresh').onclick=startFresh;
  document.getElementById('w-sample').onclick=loadSample;

}
function startFresh(){ S={config:defaultConfig(),cells:{},notes:{},special:{}}; buildYear(); persist(); curView='setup'; render(); }
function loadSample(){
  S={config:defaultConfig(),cells:{},notes:{},special:{}};
  buildYear();
  if(YEAR.length){
    const w=YEAR[0];
    const first=w.days[0];
    S.special[first.iso]='Teacher work day';
    buildYear();                                   // rebuild so letters shift
    const wk=YEAR[0];
    for(const d of wk.days){
      if(d.special) { S.notes[d.iso]='Set up room · hang welcome board'; continue; }
      for(let p=1;p<=S.config.periods;p++){
        if(p===3||p===4){ S.cells[`${d.iso}|${p}`]='No kindergarten yet'; continue; }
        S.cells[`${d.iso}|${p}`]='Welcome + rules\nName-tag design\nSketchbook covers';
      }
      S.notes[d.iso]='Collect supply forms';
    }
  }
  persist(); curWeek=0; curView='week'; render();
}

/* ------------------ week view --------------------------------------- */
function renderWeek(){
  buildYearIfStale();
  if(!YEAR.length){
    view.innerHTML=`<div class="card"><h2>No weeks yet</h2><p class="sub">Check your year dates in Setup — the end date has to come after the start date, and at least one weekday has to be selected.</p><button class="btn primary" id="go-setup">Open Setup</button></div>`;
    document.getElementById('go-setup').onclick=()=>{curView='setup';render();};
    return;
  }
  curWeek=Math.max(0,Math.min(YEAR.length-1,curWeek));
  const w=YEAR[curWeek], c=S.config, todayISO=fmtISO(new Date());
  const preL=c.lunchAfter, teacher=c.teacher?` · ${esc(c.teacher)}`:'';

  let head=`<tr><th class="day-h" scope="col">Day</th>`;
  for(let p=1;p<=c.periods;p++){
    if(p===preL+1) head+=`<th class="lunch-h" scope="col" aria-label="Lunch">🍎</th>`;
    head+=`<th scope="col">Period ${p}</th>`;
  }
  if(preL===c.periods) head+=`<th class="lunch-h" scope="col" aria-label="Lunch">🍎</th>`;
  head+=`<th class="notes-h" scope="col">Notes</th></tr>`;

  let rows='';
  for(const d of w.days){
    const li=d.letter?c.letters.indexOf(d.letter):-1;
    const chip=d.letter?`<span class="chip l${li%6}">${esc(d.letter)}</span>`:'';
    const banner=d.special?`<span class="sp-banner">${esc(d.special)}</span>`:'';
    rows+=`<tr class="${d.special?'sp-row':''} ${d.iso===todayISO?'today-row':''}">
      <td><div class="day-cell">
        <button class="day-gear no-print" data-gear="${d.iso}" aria-label="Day settings for ${DAYNAMES[d.dow]} ${niceDate(d.iso)}">⚙</button>
        <div class="day-name">${DAYNAMES[d.dow]}</div>
        <div class="day-date">${niceDate(d.iso)}${d.iso===todayISO?'<span class="sr-only">, today</span>':''}</div>
        ${chip}${banner}
      </div></td>`;
    for(let p=1;p<=c.periods;p++){
      if(p===preL+1) rows+=`<td class="lunch"><span>lunch</span></td>`;
      rows+=`<td><div class="box" contenteditable="true" role="textbox" aria-multiline="true" aria-label="${DAYNAMES[d.dow]} ${niceDate(d.iso)}, period ${p}" data-iso="${d.iso}" data-p="${p}" data-letter="${esc(d.letter||'')}"></div></td>`;
    }
    if(preL===c.periods) rows+=`<td class="lunch"><span>lunch</span></td>`;
    rows+=`<td><div class="box" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Notes for ${DAYNAMES[d.dow]} ${niceDate(d.iso)}" data-iso="${d.iso}" data-p="notes"></div></td></tr>`;
  }

  const opts=YEAR.map((wk,i)=>`<option value="${i}" ${i===curWeek?'selected':''}>Wk ${i+1} · ${weekLabel(wk)}</option>`).join('');
  view.innerHTML=`
    <div class="weeknav no-print">
      <button class="btn" id="wk-prev" aria-label="Previous week" ${curWeek===0?'disabled':''}>‹</button>
      <button class="btn" id="wk-next" aria-label="Next week" ${curWeek===YEAR.length-1?'disabled':''}>›</button>
      <select id="wk-jump" aria-label="Jump to week">${opts}</select>
      <button class="btn" id="wk-today">Today</button>
      <span class="spacer"></span>
      <button class="btn" id="wk-print">Print</button>
    </div>
    <div class="print-title">Specials Planner · Week of ${weekLabel(w)}${teacher}</div>
    <div class="grid-scroll"><table class="week" aria-label="Week of ${weekLabel(w)}"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="footnote no-print">Tap a box to type. While a box is selected, the bar below can copy it across the day or across matching rotation days.</div>`;

  // fill saved text via textContent (never innerHTML) — user text stays inert
  view.querySelectorAll('.box').forEach(b=>{
    const k=b.dataset.p==='notes'?null:`${b.dataset.iso}|${b.dataset.p}`;
    b.textContent = k ? (S.cells[k]||'') : (S.notes[b.dataset.iso]||'');
    b.addEventListener('input',onBoxInput);
    b.addEventListener('focus',()=>onBoxFocus(b));
    b.addEventListener('paste',plainPaste);
    b.addEventListener('keydown',onBoxKey);
  });
  view.querySelectorAll('[data-gear]').forEach(g=>g.onclick=()=>openSpecial(g.dataset.gear));
  document.getElementById('wk-prev').onclick=()=>{curWeek--;render();refocus('wk-prev','wk-next');};
  document.getElementById('wk-next').onclick=()=>{curWeek++;render();refocus('wk-next','wk-prev');};
  document.getElementById('wk-jump').onchange=e=>{curWeek=+e.target.value;render();refocus('wk-jump');};
  document.getElementById('wk-today').onclick=()=>{curWeek=weekIndexFor(todayISO);render();refocus('wk-today');};
  document.getElementById('wk-print').onclick=()=>window.print();
  announce(`Week ${curWeek+1} of ${YEAR.length}: ${weekLabel(w)}`);
}
let yearStale=true;
function buildYearIfStale(){ if(yearStale){buildYear();yearStale=false;} }
function markStale(){ yearStale=true; }

function onBoxInput(e){
  const b=e.target, v=b.textContent;
  if(b.dataset.p==='notes'){ if(v)S.notes[b.dataset.iso]=v; else delete S.notes[b.dataset.iso]; }
  else { const k=`${b.dataset.iso}|${b.dataset.p}`; if(v)S.cells[k]=v; else delete S.cells[k]; }
  queueSave();
}
function plainPaste(e){
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
}
function onBoxKey(e){
  if(e.key==='Escape'){ hideBar(); return; }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&barCtx){ e.preventDefault(); document.getElementById('bar-day').focus(); }
}

/* ------------------ copy bar ---------------------------------------- */
const bar=document.getElementById('bar');
let barCtx=null;
function onBoxFocus(b){
  if(b.dataset.p==='notes'){ hideBar(); return; }
  barCtx={iso:b.dataset.iso,p:+b.dataset.p,letter:b.dataset.letter||''};
  document.getElementById('bar-hint').textContent=`${DAYNAMES[parseISO(barCtx.iso).getDay()]} · Period ${barCtx.p} — Ctrl+Enter for these buttons`;
  const lb=document.getElementById('bar-letter');
  if(barCtx.letter){ lb.style.display=''; lb.textContent=`Fill all ${barCtx.letter}-days`; }
  else lb.style.display='none';
  bar.classList.add('show'); bar.setAttribute('aria-hidden','false');
}
function hideBar(){ bar.classList.remove('show'); bar.setAttribute('aria-hidden','true'); barCtx=null; }
document.getElementById('bar-close').onclick=hideBar;
document.getElementById('bar-day').onclick=()=>doCopy('day');
document.getElementById('bar-letter').onclick=()=>doCopy('letter');
function doCopy(mode){
  if(!barCtx) return;
  const src=S.cells[`${barCtx.iso}|${barCtx.p}`]||'';
  const w=YEAR[curWeek], c=S.config;
  const targets=[];
  if(mode==='day'){
    for(let p=1;p<=c.periods;p++) if(p!==barCtx.p) targets.push([barCtx.iso,p]);
  } else {
    for(const d of w.days){
      if(d.special||d.letter!==barCtx.letter) continue;
      for(let p=1;p<=c.periods;p++){
        if(d.iso===barCtx.iso&&p===barCtx.p) continue;
        targets.push([d.iso,p]);
      }
    }
  }
  for(const [iso,p] of targets){
    const k=`${iso}|${p}`;
    if(src) S.cells[k]=src; else delete S.cells[k];
    const el=view.querySelector(`.box[data-iso="${iso}"][data-p="${p}"]`);
    if(el) el.textContent=src;
  }
  persist();
  announce(`Copied to ${targets.length} boxes`);
  const back=view.querySelector(`.box[data-iso="${barCtx.iso}"][data-p="${barCtx.p}"]`);
  if(back&&back.focus) back.focus();
}

/* ------------------ special-day modal ------------------------------- */
const modal=document.getElementById('modal'), sheet=document.getElementById('modal-sheet');
let modalReturn=null;
function openSpecial(iso){
  modalReturn=document.activeElement;
  const cur=S.special[iso]||'';
  sheet.innerHTML=`<h3 id="modal-title">${DAYNAMES[parseISO(iso).getDay()]}, ${niceDate(iso)}</h3>
    <p class="sub">Mark this a no-class day. It keeps its boxes but skips the rotation letter, so the cycle stays correct after breaks.</p>
    <div class="opts">
      <button class="btn" data-sp="Teacher work day">Teacher work day</button>
      <button class="btn" data-sp="No school">No school</button>
      <button class="btn" data-sp="Field trip">Field trip</button>
      <input id="sp-custom" aria-label="Custom day label" placeholder="Or type your own label…" value="${esc(cur&&!['Teacher work day','No school','Field trip'].includes(cur)?cur:'')}">
      <button class="btn primary" id="sp-save">Save label</button>
      ${cur?'<button class="btn danger" id="sp-clear">Back to a normal day</button>':''}
      <button class="btn ghost" id="sp-cancel">Cancel</button>
    </div>`;
  sheet.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>setSpecial(iso,b.dataset.sp));
  sheet.querySelector('#sp-save').onclick=()=>{
    const v=sheet.querySelector('#sp-custom').value.trim();
    if(v) setSpecial(iso,v);
  };
  const cl=sheet.querySelector('#sp-clear'); if(cl) cl.onclick=()=>setSpecial(iso,null);
  sheet.querySelector('#sp-cancel').onclick=closeModal;
  modal.classList.add('show');
  const first=sheet.querySelector('button,input'); if(first) first.focus();
}
function setSpecial(iso,label){
  if(label) S.special[iso]=label; else delete S.special[iso];
  markStale(); persist(); closeModal(); render();
  const g=view.querySelector(`[data-gear="${iso}"]`); if(g) g.focus();
}
function closeModal(){
  modal.classList.remove('show');
  if(modalReturn){ if(modalReturn.focus) modalReturn.focus(); modalReturn=null; }
}
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('show')) return;
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key!=='Tab') return;
  const f=[...sheet.querySelectorAll('button,input')].filter(x=>!x.disabled);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
  else if(!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
});

function applySetup(){
  const c=S.config;
  const st=document.getElementById('f-start').value, en=document.getElementById('f-end').value;
  if(!parseISO(st)||!parseISO(en)||en<st){ alert('Check your dates — the last day has to come after the first day.'); return; }
  c.yearStart=st; c.yearEnd=en;
  c.workDays=[...document.querySelectorAll('#f-days .dp.on')].map(b=>+b.dataset.d);
  if(!c.workDays.length){ alert('Pick at least one teaching day.'); return; }
  c.periods=Math.max(1,Math.min(10,+document.getElementById('f-periods').value||6));
  c.lunchAfter=Math.max(0,Math.min(c.periods,+document.getElementById('f-lunch').value));
  const letters=document.getElementById('f-letters').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,6);
  c.letters=letters.length?letters:['A'];
  c.teacher=document.getElementById('f-teacher').value.trim();
  markStale(); persist();
  buildYearIfStale();
  curWeek=weekIndexFor(fmtISO(new Date()));
  curView='week'; render(); refocus('wk-jump');
}

/* ------------------ backup / csv / reset ---------------------------- */
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function backupJSON(){ return JSON.stringify({app:'palette',version:2,exported:new Date().toISOString(),state:S},null,1); }
function exportBackup(){ download(`specials-planner-backup-${fmtISO(new Date())}.json`,backupJSON(),'application/json'); }
function importBackup(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ if(applyImportedText(r.result)) { curView='week'; curWeek=weekIndexFor(fmtISO(new Date())); render(); } };
    r.readAsText(f);
  };
  inp.click();
}
function applyImportedText(text){
  try{
    const j=JSON.parse(text);
    const st=migrate(j.state||j);          // tolerate raw-state or wrapped backups
    if(!st) throw 0;
    S=st; markStale(); persist(); return true;
  }catch(e){ alert("That file doesn't look like a Specials Planner backup."); return false; }
}
function csvField(v){ v=String(v??''); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; }
function exportCSV(){
  buildYearIfStale();
  const c=S.config;
  const head=['Date','Weekday','Rotation',...Array.from({length:c.periods},(_,i)=>`Period ${i+1}`),'Notes'];
  const lines=[head.join(',')];
  for(const w of YEAR) for(const d of w.days){
    const row=[d.iso,DAYNAMES[d.dow],d.special?d.special:(d.letter||'')];
    for(let p=1;p<=c.periods;p++) row.push(S.cells[`${d.iso}|${p}`]||'');
    row.push(S.notes[d.iso]||'');
    lines.push(row.map(csvField).join(','));
  }
  download(`specials-planner-${c.yearStart.slice(0,4)}.csv`,lines.join('\n'),'text/csv');
}
function resetAll(){
  if(!confirm('Erase everything on this device? Download a backup first if you want to keep it.')) return;
  S=null; store.del(KEY); curWeek=0; render();
}

/* ------------------ GOOGLE DRIVE (optional) --------------------------
   Enabled only when CLIENT_ID is set. Uses Google Identity Services token
   flow + Drive REST with the drive.file scope (app-created files only —
   the non-sensitive scope, no restricted-scope review needed).           */
let driveToken=null, gisReady=false, tokenClient=null;
function mountDrive(){
  const slot=document.getElementById('drive-slot');
  if(!slot||!CLIENT_ID) return;
  slot.innerHTML=`<button class="btn" id="d-drive-save">Save to Google Drive</button>
                  <button class="btn" id="d-drive-load">Load from Drive</button>`;
  document.getElementById('d-drive-save').onclick=()=>withDriveToken(driveSave);
  document.getElementById('d-drive-load').onclick=()=>withDriveToken(driveLoad);
  if(!gisReady && !document.getElementById('gsi')){
    const s=document.createElement('script');
    s.id='gsi'; s.src='https://accounts.google.com/gsi/client'; s.async=true;
    s.onload=()=>{ gisReady=true; };
    document.head.appendChild(s);
  }
}
function withDriveToken(fn){
  if(driveToken){ fn(); return; }
  if(!window.google?.accounts?.oauth2){ alert('Google sign-in is still loading — try again in a second.'); return; }
  tokenClient=tokenClient||google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:'https://www.googleapis.com/auth/drive.file',
    callback:(resp)=>{ if(resp.access_token){ driveToken=resp.access_token; fn(); } }
  });
  tokenClient.requestAccessToken();
}
async function driveSave(){
  try{
    const meta={name:'Specials Planner.json',mimeType:'application/json'};
    const boundary='paletteb'+Date.now();
    const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${backupJSON()}\r\n--${boundary}--`;
    const id=S.config.driveFileId;
    const url=id
      ? `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    const res=await fetch(url,{method:id?'PATCH':'POST',
      headers:{Authorization:`Bearer ${driveToken}`,'Content-Type':`multipart/related; boundary=${boundary}`},body});
    if(res.status===401){ driveToken=null; alert('Google session expired — tap Save again to sign back in.'); return; }
    if(!res.ok) throw new Error(res.status);
    const j=await res.json();
    if(j.id&&j.id!==S.config.driveFileId){ S.config.driveFileId=j.id; persist(); }
    alert('Saved to your Google Drive.');
  }catch(e){ alert('Drive save didn\'t go through — check your connection and try again.'); }
}
async function driveLoad(){
  try{
    let id=S.config.driveFileId;
    if(!id){
      const q=encodeURIComponent("name='Specials Planner.json' and trashed=false");
      const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=1&fields=files(id,name)`,
        {headers:{Authorization:`Bearer ${driveToken}`}});
      const j=await res.json();
      if(!j.files||!j.files.length){ alert('No Specials Planner file found in your Drive yet — save one first.'); return; }
      id=j.files[0].id;
    }
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:`Bearer ${driveToken}`}});
    if(res.status===401){ driveToken=null; alert('Google session expired — tap Load again to sign back in.'); return; }
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    if(applyImportedText(text)){ S.config.driveFileId=id; persist(); curView='week'; render(); }
  }catch(e){ alert('Couldn\'t load from Drive — check your connection and try again.'); }
}

/* ------------------ boot -------------------------------------------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{curView=t.dataset.view;render();window.scrollTo(0,0);});
document.querySelector('.tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  const tabs=[...document.querySelectorAll('.tab')];
  const i=tabs.indexOf(document.activeElement);
  if(i<0) return;
  const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];
  n.focus(); n.click();
});
loadState();
if(S){ buildYearIfStale(); curWeek=weekIndexFor(fmtISO(new Date())); }
render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
