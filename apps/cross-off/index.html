<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cross Off</title>
<meta name="theme-color" content="#EFE9DC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cross Off">
<meta name="description" content="A paper to-do list you cross off with real highlighters. Race your own records. Free, no ads, everything stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Handwriting faces ship with the app, so the paper looks right on a plane,
     in a basement, and on the very first offline open. */
  @font-face{
    font-family:'Caveat';font-style:normal;font-weight:700;font-display:swap;
    src:url(fonts/caveat-700-latin.woff2) format('woff2');
  }
  @font-face{
    font-family:'Patrick Hand';font-style:normal;font-weight:400;font-display:swap;
    src:url(fonts/patrick-hand-latin.woff2) format('woff2');
  }
  :root{
    --desk:#EFE9DC;
    --desk-edge:#D8D0BF;
    --tab-idle:#F2EDE1;
    --paper:#FBF9F2;
    --rule:#C9DFF0;
    --margin:#F0B0AC;
    --ink:#26323F;
    --ink-soft:#7A8794;
    --ink-faint:#B9C3CC;
    --urgent:#D62F2F;
    --hl-yellow:#F9E547;
    --hl-pink:#FA86C4;
    --hl-green:#8CE55C;
    --hl-blue:#63D4F5;
    --hl-orange:#FFAE45;
    --row:46px;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --hand:'Patrick Hand','Comic Sans MS',cursive;
  }
  /* The paper stays paper after dark: highlighter ink only reads on a light
     page (the strokes multiply-blend). What dims is the desk around it. */
  @media (prefers-color-scheme: dark){
    :root{
      --desk:#1d1f24;
      --desk-edge:#3a3d45;
      --tab-idle:#26292f;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--desk);
    overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  /* One notebook, centered. On a phone it IS the screen; on a laptop it sits
     on the desk instead of stretching into a ruled football field. */
  #book{
    width:100%;max-width:44rem;height:100%;
    display:flex;flex-direction:column;
  }
  @media (min-width:44rem){
    #book{padding:0 8px}
    #page{border:2px solid var(--desk-edge);border-bottom:none;border-radius:12px 12px 0 0;
      box-shadow:0 10px 40px rgba(20,20,20,.18)}
  }

  /* ---------- header ---------- */
  header{
    padding:calc(12px + env(safe-area-inset-top)) 16px 6px;
    display:flex;align-items:center;justify-content:space-between;
    z-index:5;width:100%;
  }
  header h1{font-family:'Caveat',cursive;font-weight:700;font-size:30px;line-height:1}
  header h1 .underline{
    background:linear-gradient(transparent 62%, var(--hl-yellow) 62%, var(--hl-yellow) 96%, transparent 96%);
    padding:0 4px;color:#26323F;
  }
  @media (prefers-color-scheme: dark){
    header h1{color:#EAE6DC}
    /* after dark the swipe covers the whole word, so the ink stays on yellow */
    header h1 .underline{background:linear-gradient(transparent 6%, var(--hl-yellow) 6%, var(--hl-yellow) 96%, transparent 96%);border-radius:4px}
    .daycount{color:#9aa0ab}
    .daycount b{color:#EAE6DC}
  }
  .hright{display:flex;align-items:center;gap:10px}
  .daycount{font-size:12.5px;color:var(--ink-soft)}
  .daycount b{color:var(--ink);font-size:16px}
  #soundBtn{
    border:none;background:transparent;font-size:18px;cursor:pointer;
    opacity:.8;padding:6px;min-width:32px;min-height:32px;border-radius:8px;
  }
  #soundBtn:focus-visible{outline:2px solid var(--urgent);outline-offset:2px}

  /* ---------- tabs ---------- */
  #tabs{
    display:flex;gap:4px;align-items:flex-end;
    padding:0 12px;overflow-x:auto;scrollbar-width:none;z-index:4;width:100%;
  }
  #tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    font-family:var(--hand);
    font-size:16px;line-height:1;
    padding:8px 14px 10px;
    border:2px solid var(--desk-edge);border-bottom:none;
    border-radius:10px 10px 0 0;
    background:var(--tab-idle);color:var(--ink-soft);
    display:flex;align-items:center;gap:7px;
    cursor:pointer;white-space:nowrap;
    transform:translateY(2px);max-width:44vw;min-height:34px;
  }
  @media (prefers-color-scheme: dark){ .tab{color:#9aa0ab} }
  .tab .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(38,50,63,.5);flex:0 0 auto}
  .tab.active{
    background:var(--paper);color:var(--ink);
    transform:translateY(0);padding-bottom:12px;font-size:17px;
  }
  .tab.add{padding:8px 12px 10px;font-size:18px;color:var(--ink-soft);min-width:34px;justify-content:center}
  .tab .name{overflow:hidden;text-overflow:ellipsis}
  .tab:focus-visible{outline:2px solid var(--urgent);outline-offset:-2px}

  /* ---------- page ---------- */
  #page{
    flex:1;overflow-y:auto;overflow-x:hidden;
    background:
      linear-gradient(to right, transparent 52px, var(--margin) 52px, var(--margin) 54px, transparent 54px),
      repeating-linear-gradient(to bottom, transparent, transparent calc(var(--row) - 1px), var(--rule) calc(var(--row) - 1px), var(--rule) var(--row)),
      var(--paper);
    /* the rules travel with the words, so mid-scroll the writing never floats
       between lines */
    background-attachment:local,local,local;
    border-top:2px solid var(--desk-edge);
    padding-bottom:170px;
    overscroll-behavior:contain;
  }
  .seclabel{
    height:var(--row);display:flex;align-items:flex-end;
    padding:0 16px 4px 64px;
    font-size:10.5px;font-weight:700;letter-spacing:1.6px;
    color:var(--ink-faint);
  }
  .seclabel.urg{color:rgba(214,47,47,.55)}
  .empty{
    padding:0 20px 0 64px;font-size:15px;color:var(--ink-faint);
    height:var(--row);display:flex;align-items:center;
  }

  /* ---------- morning bar (the anti-graveyard) ---------- */
  .morning{
    margin:10px 12px 0 60px;
    background:var(--paper);
    border:2px dashed var(--rule);border-radius:12px;
    padding:10px 12px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    font-family:var(--hand);font-size:16px;color:var(--ink);
  }
  .morning .mbtns{display:flex;gap:8px;margin-left:auto}
  .mbtn{
    font-family:var(--sans);font-size:13px;font-weight:700;
    border:2px solid var(--ink);border-radius:10px;
    background:var(--ink);color:var(--paper);
    padding:8px 13px;cursor:pointer;min-height:32px;
  }
  .mbtn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--ink-faint)}

  /* ---------- rows ---------- */
  .task{
    position:relative;height:var(--row);
    display:flex;align-items:center;
    padding-left:64px;padding-right:8px;
  }
  .task .txt{
    font-size:16.5px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;position:relative;z-index:1;
    transition:color .4s;
  }
  .task .txt .noteflag{font-size:11px;color:var(--ink-faint);vertical-align:super;margin-left:3px}
  .task .txt .choreflag{font-size:12px;color:var(--ink-faint);margin-left:5px}
  .task .txt .stepflag{
    font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.4px;
    color:var(--ink-faint);margin-left:7px;vertical-align:1px;
    border:1.5px solid var(--ink-faint);border-radius:999px;padding:1px 7px;
  }
  .task .txt .stepflag.all{color:#2E7D48;border-color:#2E7D48}
  /* every step done: the row glows, waiting for its stroke */
  .task.ready::after{
    content:'';position:absolute;inset:5px 4px;border-radius:10px;z-index:3;
    pointer-events:none;
    box-shadow:0 0 0 2px rgba(201,164,0,.5);
    animation:readyPulse 1.5s ease-in-out infinite;
  }
  @keyframes readyPulse{50%{box-shadow:0 0 0 6px rgba(201,164,0,.14)}}
  @media (prefers-reduced-motion: reduce){ .task.ready::after{animation:none} }
  .task.p1 .txt{font-weight:800;color:var(--urgent);animation:urgentPulse 1.1s ease-in-out infinite}
  @keyframes urgentPulse{
    0%,100%{opacity:1;text-shadow:0 0 0 rgba(214,47,47,0)}
    50%{opacity:.6;text-shadow:0 0 9px rgba(214,47,47,.4)}
  }
  .task.p2 .txt{font-weight:500;color:var(--ink)}
  .task.p3 .txt{font-weight:400;color:var(--ink-soft)}
  .task.done .txt{color:#9AA6B1 !important;font-weight:400;animation:none;text-shadow:none}
  @media (prefers-reduced-motion: reduce){
    .task.p1 .txt,.chip{animation:none !important}
  }

  .task canvas{
    position:absolute;inset:0;width:100%;height:100%;
    z-index:2;touch-action:pan-y;  /* vertical = scroll, horizontal = highlighter */
  }
  .task .actions{position:relative;z-index:3;display:flex;align-items:center;gap:4px;padding-left:8px}
  .editbtn{
    border:none;background:transparent;color:var(--ink-faint);
    font-size:15px;cursor:pointer;padding:5px;min-width:28px;min-height:28px;border-radius:8px;
  }
  .editbtn:focus-visible{outline:2px solid var(--urgent);outline-offset:1px}

  /* ---------- timer chip ---------- */
  .chip{
    font-family:var(--sans);font-size:13px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;
    border:2px solid var(--ink);border-radius:999px;
    background:var(--paper);padding:6px 11px;color:var(--ink);
    display:flex;align-items:center;gap:5px;cursor:pointer;min-height:28px;
  }
  .chip .pr{color:var(--ink-soft);font-size:11px;font-weight:500}
  .chip.running{background:#2E7D48;border-color:#2E7D48;color:#fff}
  .chip.running .pr{color:#CBE9D5}
  .chip.warn{background:#B36607;border-color:#B36607;color:#fff}
  .chip.panic{background:var(--urgent);border-color:var(--urgent);color:#fff;animation:panic .5s steps(2) infinite}
  .chip.over{background:#6B4A3A;border-color:#6B4A3A;color:#fff}
  @keyframes panic{50%{transform:scale(1.07)}}
  .task.done .chip{opacity:.55;pointer-events:none;animation:none}
  .chip:focus-visible,.mbtn:focus-visible{outline:2px solid var(--urgent);outline-offset:2px}

  .newpr{
    position:absolute;right:10px;top:-6px;z-index:4;
    font-family:'Caveat',cursive;font-size:20px;font-weight:700;
    color:#D6336C;transform:rotate(-6deg);
    animation:stamp .45s cubic-bezier(.2,2.4,.4,1) both;
    pointer-events:none;
  }
  @keyframes stamp{from{transform:rotate(-6deg) scale(2.4);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}

  /* ---------- add row ---------- */
  .addrow{
    position:relative;min-height:var(--row);
    display:flex;align-items:center;gap:8px;
    padding-left:64px;padding-right:12px;
  }
  .addrow input{
    flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-family:var(--sans);font-size:16px;color:var(--ink);min-height:34px;
  }
  .addrow input::placeholder{color:var(--ink-faint)}
  .addrow input:focus-visible{box-shadow:0 2px 0 var(--rule)}
  .prisel{display:flex;gap:4px;align-items:center;flex:0 0 auto}
  .pri{
    font-family:var(--sans);font-size:10.5px;font-weight:700;line-height:1;
    border:2px solid transparent;border-radius:999px;
    padding:7px 9px;cursor:pointer;background:transparent;letter-spacing:.3px;
    min-height:28px;min-width:28px;
  }
  .pri[data-p="1"]{color:var(--urgent)}
  .pri[data-p="2"]{color:var(--ink)}
  .pri[data-p="3"]{color:var(--ink-soft)}
  .pri.sel[data-p="1"]{border-color:var(--urgent);background:rgba(214,47,47,.08)}
  .pri.sel[data-p="2"]{border-color:var(--ink);background:rgba(38,50,63,.06)}
  .pri.sel[data-p="3"]{border-color:#B9C3CC;background:rgba(122,135,148,.08)}
  .pri:focus-visible{outline:2px solid var(--urgent);outline-offset:1px}

  /* ---------- footer ---------- */
  .footnote{
    padding:26px 20px 10px 64px;font-size:12px;color:var(--ink-faint);line-height:1.7;
  }
  .footnote a{color:var(--ink-soft)}

  /* ---------- highlighter tray ---------- */
  #tray{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;justify-content:center;align-items:flex-end;gap:14px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--desk) 78%, transparent);
    pointer-events:none;
    transition:transform .25s;
  }
  body.sheet-open #tray,body.flipping #tray{transform:translateY(120%)}
  .marker{
    pointer-events:auto;width:42px;height:82px;position:relative;
    transform:translateY(26px);
    transition:transform .22s cubic-bezier(.3,1.6,.5,1);
    cursor:pointer;filter:drop-shadow(0 3px 3px rgba(38,50,63,.25));
    border:none;background:transparent;padding:0;
  }
  .marker.sel{transform:translateY(0)}
  .marker:focus-visible{outline:2px solid var(--urgent);outline-offset:3px;border-radius:8px}
  .marker .tip{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:15px;height:17px;
    clip-path:polygon(20% 100%, 80% 100%, 100% 20%, 55% 0);
    opacity:0;transition:opacity .18s;
  }
  .marker.sel .tip{opacity:1}
  .marker .body{
    position:absolute;top:13px;left:0;right:0;bottom:0;
    border-radius:7px 7px 9px 9px;border:2.5px solid rgba(38,50,63,.85);
  }
  .marker .band{position:absolute;top:32px;left:0;right:0;height:11px;background:rgba(255,255,255,.55)}
  .marker .cap{
    position:absolute;top:5px;left:6px;right:6px;height:19px;
    border-radius:5px 5px 0 0;border:2.5px solid rgba(38,50,63,.85);
    background:rgba(255,255,255,.25);
    transition:opacity .18s, transform .18s;
  }
  .marker.sel .cap{opacity:0;transform:translateY(-14px)}

  /* ---------- bottom sheet (edit / page / duration) ---------- */
  #backdrop{
    position:fixed;inset:0;background:rgba(38,50,63,.35);
    opacity:0;pointer-events:none;transition:opacity .22s;z-index:30;
  }
  #backdrop.show{opacity:1;pointer-events:auto}
  #sheet{
    position:fixed;left:50%;transform:translate(-50%,105%);
    bottom:0;z-index:31;width:100%;max-width:44rem;
    background:var(--paper);
    border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(38,50,63,.25);
    padding:14px 18px calc(20px + env(safe-area-inset-bottom));
    transition:transform .26s cubic-bezier(.3,1,.4,1);
  }
  #sheet.show{transform:translate(-50%,0)}
  #sheet .grab{width:38px;height:4px;border-radius:2px;background:#D8D0BF;margin:0 auto 14px}
  #sheet h3{
    font-family:var(--hand);font-weight:400;
    font-size:19px;margin-bottom:12px;color:var(--ink);
  }
  #sheet .field{
    width:100%;font-family:var(--sans);font-size:17px;color:var(--ink);
    border:none;border-bottom:2px dashed var(--ink-soft);
    outline:none;background:transparent;padding:6px 0 8px;margin-bottom:14px;
    user-select:text;-webkit-user-select:text;
  }
  #sheet textarea.field{
    font-size:14.5px;resize:none;line-height:1.45;min-height:44px;
    border-bottom-style:dotted;
  }
  #sheet .field:focus-visible{border-bottom-color:var(--urgent)}
  #sheet .sheetrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  #sheet .sheetrow.last{margin-bottom:0;justify-content:space-between}
  .sbtn{
    font-family:var(--sans);font-size:14px;font-weight:600;
    border:2px solid var(--ink);border-radius:12px;
    background:var(--ink);color:var(--paper);
    padding:11px 18px;cursor:pointer;min-height:40px;
  }
  .sbtn.line{background:var(--paper);color:var(--ink)}
  .sbtn.danger{background:var(--paper);border-color:#C94A4A;color:#C94A4A}
  .sbtn.ghost{background:var(--paper);border-color:#B9C3CC;color:var(--ink-soft)}
  .sbtn:focus-visible,.dur:focus-visible,.stepbtn:focus-visible{outline:2px solid var(--urgent);outline-offset:2px}
  /* steps inside the edit sheet: a little checklist within the checklist */
  .steplist{max-height:30vh;overflow-y:auto;margin:0 0 4px}
  .steprow{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dotted var(--rule)}
  .stepchk{
    width:28px;height:28px;flex:0 0 auto;border-radius:50%;
    border:2px solid var(--ink-soft);background:transparent;cursor:pointer;
    font-size:15px;line-height:1;color:#2E7D48;font-weight:800;padding:0;
  }
  .stepchk.on{border-color:#2E7D48;background:rgba(46,125,72,.08)}
  .stepchk:focus-visible,.stepdel:focus-visible{outline:2px solid var(--urgent);outline-offset:2px}
  .steptxt{flex:1;font-family:var(--hand);font-size:17px;color:var(--ink);position:relative}
  .steptxt.done{color:#9AA6B1}
  .steptxt.done::after{
    content:'';position:absolute;left:-2px;right:-2px;top:55%;height:3px;border-radius:2px;
    background:var(--hl-yellow);opacity:.85;mix-blend-mode:multiply;
    transform-origin:left center;animation:strike .28s ease-out both;
  }
  @media (prefers-reduced-motion: reduce){ .steptxt.done::after{animation:none} }
  @keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .stepdel{
    border:none;background:transparent;color:var(--ink-faint);
    font-size:14px;cursor:pointer;padding:5px;min-width:28px;min-height:28px;border-radius:8px;flex:0 0 auto;
  }
  #shStepAdd{margin-bottom:16px}
  /* the chore toggle reads like a rubber stamp: pressed in when it is on */
  .chorebtn{
    font-family:var(--sans);font-size:12.5px;font-weight:700;
    border:2px dashed var(--ink-faint);border-radius:10px;
    background:transparent;color:var(--ink-soft);
    padding:9px 13px;cursor:pointer;min-height:36px;
  }
  .chorebtn.on{border-style:solid;border-color:#2E7D48;color:#2E7D48;background:rgba(46,125,72,.07)}
  #sheet .prisel .pri{font-size:12px;padding:8px 12px}
  .durgrid{display:flex;gap:8px;flex-wrap:wrap}
  .dur{
    font-family:var(--sans);font-size:15px;font-weight:700;
    border:2px solid var(--ink);border-radius:12px;
    background:var(--paper);color:var(--ink);
    padding:12px 16px;cursor:pointer;min-width:62px;text-align:center;
  }
  .customdur{
    display:flex;align-items:center;gap:10px;margin-top:4px;
  }
  .stepbtn{
    font-family:var(--sans);font-size:20px;font-weight:700;line-height:1;
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    cursor:pointer;
  }
  .custval{
    font-family:var(--sans);font-size:19px;font-weight:800;
    font-variant-numeric:tabular-nums;min-width:64px;text-align:center;
  }
  .custlabel{font-size:12px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:1px;font-weight:700}
  .pastlist{display:flex;flex-direction:column;gap:2px;max-height:40vh;overflow-y:auto;margin-bottom:12px}
  .pastday{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-family:var(--hand);font-size:17px;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid var(--rule);
    padding:10px 4px;cursor:pointer;text-align:left;min-height:40px;
  }
  .pastday small{font-family:var(--sans);font-size:12px;color:var(--ink-soft)}

  /* ---------- past-days viewer: the flip-back pile ---------- */
  #past{
    position:fixed;inset:0;z-index:35;display:none;flex-direction:column;align-items:center;
    background:var(--desk);
  }
  #past.show{display:flex}
  #past .pwrap{width:100%;max-width:44rem;height:100%;display:flex;flex-direction:column}
  #past .phead{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 8px;
  }
  #past .pdate{font-family:'Caveat',cursive;font-size:26px;font-weight:700;color:var(--ink)}
  @media (prefers-color-scheme: dark){ #past .pdate{color:#EAE6DC} }
  #past .pnav{display:flex;gap:6px;align-items:center}
  #past .pbtn{
    font-family:var(--sans);font-size:16px;font-weight:700;
    border:2px solid var(--desk-edge);border-radius:10px;background:var(--tab-idle);color:var(--ink-soft);
    padding:6px 14px;cursor:pointer;min-height:34px;min-width:40px;
  }
  #past .pbtn:disabled{opacity:.35;cursor:default}
  #past .psub{padding:0 16px 6px;font-size:12.5px;color:var(--ink-soft)}
  #past .psheet{
    flex:1;overflow-y:auto;width:100%;
    background:
      linear-gradient(to right, transparent 52px, var(--margin) 52px, var(--margin) 54px, transparent 54px),
      repeating-linear-gradient(to bottom, transparent, transparent calc(var(--row) - 1px), var(--rule) calc(var(--row) - 1px), var(--rule) var(--row)),
      var(--paper);
    background-attachment:local,local,local;
    border-top:2px solid var(--desk-edge);
    padding-bottom:40px;
  }
  #past .task{pointer-events:none}

  /* ---------- focus mode ---------- */
  #focus{
    position:fixed;inset:0;z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:24px;
    background:#2E7D48;color:#fff;text-align:center;
    transform:translateY(105%);transition:transform .3s cubic-bezier(.3,1,.4,1), background .6s;
  }
  #focus.show{transform:translateY(0)}
  #focus.warn{background:#B36607}
  #focus.panic{background:#C22B2B}
  #focus.panic #fTime{animation:panic .5s steps(2) infinite}
  #focus.over{background:#4A3A33}
  #focus .flabel{font-size:12px;font-weight:700;letter-spacing:2px;opacity:.8}
  #fTask{
    font-size:clamp(22px,6vw,34px);font-weight:700;line-height:1.15;
    max-width:520px;overflow-wrap:break-word;
  }
  #fNote{font-size:14.5px;opacity:.85;max-width:460px;line-height:1.5;overflow-wrap:break-word}
  #fTime{
    font-size:clamp(64px,22vw,120px);font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-2px;margin:6px 0;
  }
  #fPR{font-size:15px;opacity:.9;min-height:20px}
  #fSteps{display:flex;flex-direction:column;gap:8px;max-height:26vh;overflow-y:auto;
    margin-top:10px;width:min(86vw,340px)}
  .fstep{
    border:2px solid rgba(255,255,255,.75);border-radius:12px;background:transparent;color:#fff;
    font-family:var(--sans);font-size:15px;font-weight:600;padding:10px 14px;cursor:pointer;
    text-align:left;min-height:40px;
  }
  .fstep.done{opacity:.55;text-decoration:line-through 3px}
  .fstep:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #focus .fbtns{display:flex;gap:12px;margin-top:22px}
  .fbtn{
    font-family:var(--sans);font-size:17px;font-weight:700;
    border:3px solid #fff;border-radius:16px;
    background:#fff;color:var(--ink);
    padding:16px 30px;cursor:pointer;
  }
  .fbtn.line{background:transparent;color:#fff}
  .fbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #fMin{
    position:absolute;top:calc(14px + env(safe-area-inset-top));right:18px;
    border:none;background:transparent;color:#fff;font-size:26px;
    cursor:pointer;opacity:.85;padding:6px;min-width:38px;min-height:38px;
  }

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  #hint{
    position:fixed;left:50%;bottom:114px;transform:translateX(-50%);
    z-index:9;font-size:12.5px;color:var(--ink-soft);
    background:var(--paper);border:2px dashed var(--rule);border-radius:10px;
    padding:6px 14px;white-space:nowrap;transition:opacity .5s;
  }
  #hint.hide{opacity:0;pointer-events:none}

  /* ---------- toast (SWS.toast / SWS.undo live here) ---------- */
  #toast{
    position:fixed;left:50%;transform:translate(-50%,20px);
    bottom:calc(112px + env(safe-area-inset-bottom));z-index:60;
    max-width:min(92vw,26rem);
    background:var(--ink);color:var(--paper);
    border-radius:12px;padding:11px 16px;
    font-size:14px;line-height:1.45;
    opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 6px 24px rgba(38,50,63,.35);
  }
  #toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #toast .undo{
    border:none;background:transparent;color:var(--hl-yellow);
    font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;
    padding:6px;min-height:28px;flex:0 0 auto;
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

    A free tool by <a href="../">Sky Wolf Studios</a> · <a href="privacy.html">Privacy</a> · <a href="mailto:stephenfurpahs@gmail.com?subject=Feedback%3A%20Cross%20Off">Feedback</a></div>

  <button class="marker sel" data-c="#F9E547" aria-label="Yellow highlighter" aria-pressed="true"><span class="tip" style="background:#F9E547"></span><span class="body" style="background:#F9E547"><span class="band"></span></span><span class="cap"></span></button>
  <button class="marker" data-c="#FA86C4" aria-label="Pink highlighter" aria-pressed="false"><span class="tip" style="background:#FA86C4"></span><span class="body" style="background:#FA86C4"><span class="band"></span></span><span class="cap"></span></button>
  <button class="marker" data-c="#8CE55C" aria-label="Green highlighter" aria-pressed="false"><span class="tip" style="background:#8CE55C"></span><span class="body" style="background:#8CE55C"><span class="band"></span></span><span class="cap"></span></button>
  <button class="marker" data-c="#63D4F5" aria-label="Blue highlighter" aria-pressed="false"><span class="tip" style="background:#63D4F5"></span><span class="body" style="background:#63D4F5"><span class="band"></span></span><span class="cap"></span></button>
  <button class="marker" data-c="#FFAE45" aria-label="Orange highlighter" aria-pressed="false"><span class="tip" style="background:#FFAE45"></span><span class="body" style="background:#FFAE45"><span class="band"></span></span><span class="cap"></span></button>
</div>

<div id="past" aria-label="Past days">
  <div class="pwrap">
    <div class="phead">
      <div class="pdate" id="pastDate"></div>
      <div class="pnav">
        <button class="pbtn" id="pastPrev" aria-label="Older day">‹</button>
        <button class="pbtn" id="pastNext" aria-label="Newer day">›</button>

    <div class="psub" id="pastSub"></div>

  </div>
</div>

<div id="focus">
  <button id="fMin" aria-label="Minimize the timer">⌄</button>
  <div class="flabel">RIGHT NOW</div>
  <div id="fTask"></div>
  <div id="fNote"></div>
  <div id="fTime">00:00</div>
  <div id="fPR"></div>
  <div id="fSteps"></div>
  <div class="fbtns">
    <button class="fbtn" id="fDone">✓ I did it</button>
    <button class="fbtn line" id="fStop">give up timer</button>
  </div>
</div>

<canvas id="confetti"></canvas>
<div id="live" class="sr-only" aria-live="polite"></div>

<script src="sws-ui.js"></script>
<script>
/* =========================================================
   CROSS OFF — Sky Wolf Studios · SWS Strategic Media LLC
   A paper to-do list you cross off with real highlighters.
   Priorities (NOW/TODAY/SOON) · beat-the-clock countdowns ·
   personal records · focus mode · multi-page notebook ·
   the morning page-flip (unfinished carries forward quietly,
   chores rewrite themselves, and no overdue label exists).
   Single-file vanilla PWA. Persists to localStorage
   (guarded: runs in-memory where storage is unavailable).

   HARD-WON INVARIANTS (three shipped bugs live behind these):
   1. Never re-render on resize. Height-only changes are the
      phone keyboard; the handler resizes canvases only, on
      width change, debounced, never while an input has focus.
   2. Canvas gestures direction-lock (touch-action:pan-y plus a
      pending→draw/scroll machine). touch-action:none would
      kill list scrolling because canvases cover every row.
   3. Sheets guard against the ghost click that follows the
      pointerup that opened them.
   ========================================================= */

const PAGE_COLORS=['#F9E547','#FA86C4','#8CE55C','#63D4F5','#FFAE45'];
const DURATIONS=[2,5,10,15,25];
const SEC_LABELS={1:'DO IT NOW',2:'TODAY',3:'NEXT FEW DAYS'};
const MAX_PAST_DAYS=120;      // per page; a school year of mornings
const REDUCED=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const state={
  pages:[],activePage:null,
  records:{},doneToday:0,
  color:'#F9E547',addPri:2,
  sound:true,hintShown:true,
  focusTaskId:null,
  lastFlip:null,flipSnooze:null
};
let uid=0;

/* ---------- persistence (guarded: falls back to in-memory) ---------- */
const STORE_KEY='crossoff.v1';
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function save(){
  try{
    const data={
      uid,activePage:state.activePage,
      pages:state.pages.map(p=>({id:p.id,name:p.name,color:p.color,
        past:p.past||[],
        tasks:p.tasks.map(t=>({id:t.id,text:t.text,note:t.note||'',done:t.done,pri:t.pri||2,
          chore:!!t.chore,steps:(t.steps||[]).map(s=>({text:s.text,done:!!s.done})),
          strokes:t.strokes,result:t.result||null,
          /* a running countdown survives a reload: the deadline is wall-clock */
          timer:t.timer?{duration:t.timer.duration,deadline:t.timer.deadline,buzzed:t.timer.buzzed}:null}))})),
      records:state.records,doneToday:state.doneToday,doneDate:todayStr(),
      color:state.color,addPri:state.addPri,sound:state.sound,
      lastCustom:state.lastCustom||null,hintShown:state.hintShown,
      lastFlip:state.lastFlip,flipSnooze:state.flipSnooze
    };
    localStorage.setItem(STORE_KEY,JSON.stringify(data));
  }catch(e){/* no storage available: session runs in-memory */}
}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    uid=d.uid||0;
    state.pages=(Array.isArray(d.pages)?d.pages:[]).map(p=>({id:p.id,name:p.name,color:p.color,
      past:Array.isArray(p.past)?p.past:[],
      tasks:(Array.isArray(p.tasks)?p.tasks:[]).map(t=>({id:t.id,text:String(t.text||''),note:String(t.note||''),
        done:!!t.done,pri:t.pri||2,chore:!!t.chore,
        steps:(Array.isArray(t.steps)?t.steps:[]).filter(s=>s&&s.text).map(s=>({text:String(s.text).slice(0,120),done:!!s.done})),
        strokes:Array.isArray(t.strokes)?t.strokes:[],result:t.result||null,
        timer:(t.timer&&typeof t.timer.deadline==='number')?{duration:t.timer.duration,deadline:t.timer.deadline,
          /* a deadline that passed while the app was closed does not get to
             scream on open; it arrives already calm */
          buzzed:t.timer.buzzed||t.timer.deadline<=Date.now()}:null}))}));
    state.activePage=d.activePage;
    state.records=d.records||{};
    state.doneToday=(d.doneDate===todayStr())?(d.doneToday||0):0;   // count resets daily
    state.color=d.color||state.color;
    state.addPri=d.addPri||2;
    state.sound=d.sound!==false;
    state.lastCustom=d.lastCustom||null;
    state.hintShown=d.hintShown!==false;
    state.lastFlip=d.lastFlip||null;
    state.flipSnooze=d.flipSnooze||null;
    return state.pages.length>0;
  }catch(e){return false;}
}

const tabsEl=document.getElementById('tabs');
const listEl=document.getElementById('list');
const addInput=document.getElementById('addInput');
const doneCountEl=document.getElementById('doneCount');
const hint=document.getElementById('hint');
const backdrop=document.getElementById('backdrop');
const sheet=document.getElementById('sheet');
const focusEl=document.getElementById('focus');
const liveEl=document.getElementById('live');
const ticks={};
const announce=m=>{liveEl.textContent='';setTimeout(()=>{liveEl.textContent=m;},30);};

/* ---------- audio + haptics ---------- */
let AC=null;
function ac(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume().catch(()=>{});
  return AC;
}
function tone(type,f0,f1,dur,gain){
  if(!state.sound)return;
  try{
    const c=ac(),t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
function squeak(){
  if(!state.sound)return;
  try{
    const c=ac(),t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(900,t);
    o.frequency.exponentialRampToValueAtTime(1400,t+.08);
    f.type='bandpass';f.frequency.value=1800;f.Q.value=8;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+.14);
    o.connect(f).connect(g).connect(c.destination);o.start(t);o.stop(t+.16);
  }catch(e){}
}
const pop =()=>tone('triangle',520,260,.18,.12);
const tickSnd=()=>tone('square',1100,null,.05,.04);
const buzz=()=>{tone('sawtooth',180,120,.5,.13);setTimeout(()=>tone('sawtooth',180,120,.5,.13),550);vib(200);};
function vib(ms){ if(state.sound&&navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}} }
document.getElementById('soundBtn').addEventListener('click',e=>{
  state.sound=!state.sound;
  const b=e.currentTarget;
  b.textContent=state.sound?'🔊':'🔇';
  b.setAttribute('aria-pressed',state.sound);
  save();
});

/* ---------- helpers ---------- */
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ');
const fmt=ms=>{
  const s=Math.max(0,Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
};
const page=()=>state.pages.find(p=>p.id===state.activePage);
const findTask=id=>{for(const p of state.pages){const t=p.tasks.find(t=>t.id===id);if(t)return t;}return null;};
const niceDate=iso=>{
  const [y,m,d]=String(iso).split('-').map(Number);
  const dt=new Date(y,(m||1)-1,d||1);
  return isNaN(dt)?String(iso):dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
};

/* ---------- pages ---------- */
function addPage(name){
  const p={id:++uid,name:name||('Page '+(state.pages.length+1)),
           color:PAGE_COLORS[state.pages.length%PAGE_COLORS.length],tasks:[],past:[]};
  state.pages.push(p);state.activePage=p.id;
  render();save();
  return p;
}
function renderTabs(){
  tabsEl.innerHTML='';
  for(const p of state.pages){
    const t=document.createElement('button');
    t.className='tab'+(p.id===state.activePage?' active':'');
    t.setAttribute('role','tab');
    t.setAttribute('aria-selected',p.id===state.activePage);
    const dot=document.createElement('span');
    dot.className='dot';dot.style.background=p.color;
    const nm=document.createElement('span');
    nm.className='name';nm.textContent=p.name;
    t.appendChild(dot);t.appendChild(nm);
    t.addEventListener('click',()=>{
      if(p.id===state.activePage){openPageSheet(p);}
      else{state.activePage=p.id;render();save();}
    });
    tabsEl.appendChild(t);
  }
  const add=document.createElement('button');
  add.className='tab add';add.textContent='+';add.setAttribute('aria-label','New page');
  add.addEventListener('click',()=>addPage());
  tabsEl.appendChild(add);
}

/* ---------- the morning page-flip (the anti-graveyard) ------------
   Yesterday's marked-up page goes to the flip-back pile with its ink
   intact. Unfinished tasks carry forward without a word said about
   it: no overdue label, no red counter, nothing to be ashamed of.
   Chores rewrite themselves onto the fresh page, undone. */
function freshPage(p){
  p.past=p.past||[];
  p.past.push({date:todayStr(),tasks:JSON.parse(JSON.stringify(p.tasks))});
  while(p.past.length>MAX_PAST_DAYS)p.past.shift();
  const carried=p.tasks.filter(t=>!t.done);
  const chores=p.tasks.filter(t=>t.done&&t.chore).map(t=>({
    id:++uid,text:t.text,note:t.note||'',done:false,pri:t.pri||2,chore:true,
    steps:(t.steps||[]).map(s=>({text:s.text,done:false})),   // the steps start over too
    strokes:[],timer:null,result:null
  }));
  const snapshotJson=JSON.stringify({tasks:p.tasks,pastLen:p.past.length});
  p.tasks=[...carried,...chores];
  state.lastFlip=todayStr();
  render();save();
  announce('Fresh page');
  if(window.SWS&&SWS.toast)SWS.toast('Fresh page. Yesterday is in the flip-back pile, ink and all.',{
    ms:7000,action:{label:'Undo',onAction:()=>{
      const snap=JSON.parse(snapshotJson);
      p.past.pop();
      p.tasks=snap.tasks;
      render();save();
    }}});
}
function morningBarHTML(){
  const p=page();
  if(!p)return '';
  const today=todayStr();
  if(state.lastFlip===today||state.flipSnooze===today)return '';
  if(!p.tasks.some(t=>t.done))return '';
  /* only once the day has actually changed since the last save with
     crossed-off work on the page: doneToday resetting handles "today" */
  if(state.doneToday>0)return '';
  return `<div class="morning" id="morning">New day.
    <span>Flip to a fresh page when you're ready.</span>
    <span class="mbtns">
      <button class="mbtn" id="mFlip">Flip the page</button>
      <button class="mbtn ghost" id="mLater">not yet</button>
    </span></div>`;
}

/* ---------- list ---------- */
function render(){
  renderTabs();
  listEl.innerHTML='';
  doneCountEl.textContent=state.doneToday;
  const p=page();
  const slot=document.getElementById('morningSlot');
  slot.innerHTML=morningBarHTML();
  const mf=document.getElementById('mFlip');
  if(mf)mf.addEventListener('click',()=>freshPage(page()));
  const ml=document.getElementById('mLater');
  if(ml)ml.addEventListener('click',()=>{state.flipSnooze=todayStr();slot.innerHTML='';save();});
  if(!p)return;
  if(!p.tasks.length){
    const e=document.createElement('div');
    e.className='empty';e.textContent='blank page. write a task below';
    listEl.appendChild(e);
    return;
  }
  for(const pri of [1,2,3]){
    const group=p.tasks.filter(t=>(t.pri||2)===pri);
    if(!group.length)continue;
    const lbl=document.createElement('div');
    lbl.className='seclabel'+(pri===1?' urg':'');
    lbl.textContent=SEC_LABELS[pri];
    listEl.appendChild(lbl);
    for(const task of group) listEl.appendChild(buildRow(task));
  }
}

const stepsDone=t=>(t.steps||[]).filter(s=>s.done).length;
const stepsReady=t=>!t.done&&t.steps&&t.steps.length>0&&t.steps.every(s=>s.done);
function taskLabel(task){
  const bits=[task.text];
  if(task.done)bits.push('crossed off');
  if(task.chore)bits.push('daily chore');
  if(task.note)bits.push('has a note');
  if(task.steps&&task.steps.length)bits.push(stepsDone(task)+' of '+task.steps.length+' steps done');
  return bits.join(', ');
}
function buildRow(task){
  const row=document.createElement('div');
  row.className='task p'+(task.pri||2)+(task.done?' done':'')+(stepsReady(task)?' ready':'');
  row.dataset.id=task.id;

  const txt=document.createElement('div');
  txt.className='txt';txt.textContent=task.text;
  if(task.note){const f=document.createElement('span');f.className='noteflag';f.textContent='✳';txt.appendChild(f);}
  if(task.chore){const f=document.createElement('span');f.className='choreflag';f.textContent='↻';f.title='comes back every day';txt.appendChild(f);}
  if(task.steps&&task.steps.length){
    const n=stepsDone(task);
    const f=document.createElement('span');
    f.className='stepflag'+(n===task.steps.length?' all':'');
    f.textContent=n+'/'+task.steps.length;
    f.title=n===task.steps.length?'every step done, ready to cross off':'steps done';
    txt.appendChild(f);
  }

  const cv=document.createElement('canvas');

  const actions=document.createElement('div');
  actions.className='actions';
  const edit=document.createElement('button');
  edit.className='editbtn';edit.textContent='✎';
  edit.setAttribute('aria-label','Edit: '+taskLabel(task));
  edit.addEventListener('click',e=>{e.stopPropagation();openEditSheet(task);});
  const chip=document.createElement('button');
  chip.className='chip';
  chip.setAttribute('aria-label','Timer for '+task.text);
  refreshChip(task,chip);
  chip.addEventListener('click',e=>{
    e.stopPropagation();
    if(task.timer){openFocus(task);}       // running → jump into focus
    else{openDurationSheet(task);}
  });
  actions.appendChild(edit);actions.appendChild(chip);

  row.appendChild(txt);row.appendChild(cv);row.appendChild(actions);
  requestAnimationFrame(()=>{sizeCanvas(cv,row);redrawStrokes(cv,task);});
  bindStroke(cv,row,task);
  if(task.timer)startTick(task,chip,row);
  return row;
}
function rowFor(task){return listEl.querySelector('.task[data-id="'+task.id+'"]');}
function chipFor(task){const r=rowFor(task);return r?r.querySelector('.chip'):null;}

function refreshChip(task,chip){
  if(!chip)return;
  const pr=state.records[norm(task.text)];
  chip.classList.remove('running','warn','panic','over');
  if(task.timer){chip.classList.add('running');}
  else if(task.done&&task.result){
    chip.textContent=task.result.beatClock?'🏁 '+fmt(task.result.elapsed):'✓ done';
  } else {
    chip.textContent='⏱';
    if(pr){const s=document.createElement('span');s.className='pr';s.textContent='PR '+fmt(pr);chip.appendChild(s);}
  }
}

/* ---------- countdown + focus mode ----------
   Deadlines are wall-clock (Date.now), so a locked phone or a reload
   cannot silently stretch a countdown, and a running timer survives
   closing the app entirely. */
function startCountdown(task,durationMs){
  task.timer={duration:durationMs,deadline:Date.now()+durationMs,buzzed:false};
  const chip=chipFor(task);
  if(chip){refreshChip(task,chip);startTick(task,chip,rowFor(task));}
  openFocus(task);
  save();
}
function startTick(task,chip){
  stopTick(task);
  const pr=state.records[norm(task.text)];
  const update=()=>{
    if(!task.timer)return;
    const rem=task.timer.deadline-Date.now();
    const st=rem<=0?'over':(rem<=60000?'panic':(rem<=task.timer.duration*.25?'warn':'running'));
    // chip
    if(chip&&chip.isConnected){
      chip.classList.remove('running','warn','panic','over');
      chip.classList.add(st);
      chip.textContent=rem<=0?'⏰ +'+fmt(-rem):'⏱ '+fmt(rem);
      if(rem>0&&pr){const s=document.createElement('span');s.className='pr';s.textContent='PR '+fmt(pr);chip.appendChild(s);}
    }
    // focus screen
    if(state.focusTaskId===task.id){
      focusEl.classList.remove('warn','panic','over');
      if(st!=='running')focusEl.classList.add(st);
      document.getElementById('fTime').textContent=rem<=0?'+'+fmt(-rem):fmt(rem);
      document.getElementById('fPR').textContent=
        rem<=0?'still counts. cross it off when you land it'
              :(pr?'record to beat: '+fmt(pr):'set your first record');
    }
    if(rem<=0&&!task.timer.buzzed){task.timer.buzzed=true;buzz();save();}
    else if(rem>0&&rem<=10500)tickSnd();
  };
  update();
  ticks[task.id]=setInterval(update,1000);
}
function stopTick(task){
  if(ticks[task.id]){clearInterval(ticks[task.id]);delete ticks[task.id];}
}
function cancelCountdown(task){
  stopTick(task);task.timer=null;
  refreshChip(task,chipFor(task));
  save();
}
function finishCountdown(task){
  if(!task.timer)return null;
  const rem=task.timer.deadline-Date.now();
  const dur=task.timer.duration;
  stopTick(task);task.timer=null;
  if(rem>0){
    const elapsed=dur-rem;
    const key=norm(task.text),pr=state.records[key];
    let newPR=false;
    if(!pr||elapsed<pr){state.records[key]=elapsed;newPR=!!pr;}
    task.result={beatClock:true,elapsed,overtime:0,newPR};
  }else{
    task.result={beatClock:false,elapsed:dur-rem,overtime:-rem,newPR:false};
  }
  return task.result;
}

/* ---------- steps: the checklist within the checklist ----------
   The last step landing is a real win, so it celebrates — and then leaves
   the big line glowing on the page for HER to cross off. The app never
   steals the stroke. */
function toggleStep(task,i,rerender){
  const s=(task.steps||[])[i]; if(!s)return;
  s.done=!s.done;
  if(s.done){pop();vib(10);}
  save();
  if(rerender)rerender();
  render();                          // row counter + the ready glow
  if(state.focusTaskId===task.id)renderFocusSteps(task);
  if(s.done&&stepsReady(task))stepCelebration(task);
}
function stepCelebration(task){
  confetti(80);vib(60);
  announce('All the steps are done. '+task.text+' is ready to cross off.');
  if(window.SWS&&SWS.toast)SWS.toast('Every step of "'+task.text.slice(0,32)+'" is done. Go cross it off.');
  /* clear the sheet away so the glowing line and the highlighters are right
     there — the crossing off is hers */
  if(sheet.classList.contains('show'))setTimeout(closeSheet,650);
}
function renderFocusSteps(task){
  const fs=document.getElementById('fSteps');
  fs.innerHTML='';
  if(!task.steps||!task.steps.length)return;
  task.steps.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='fstep'+(s.done?' done':'');
    b.textContent=s.text;
    b.setAttribute('aria-pressed',s.done);
    b.addEventListener('click',()=>toggleStep(task,i,null));
    fs.appendChild(b);
  });
}
function openFocus(task){
  state.focusTaskId=task.id;
  document.getElementById('fTask').textContent=task.text;
  document.getElementById('fNote').textContent=task.note||'';
  renderFocusSteps(task);
  focusEl.classList.add('show');
}
function closeFocus(){

  focusEl.classList.remove('show','warn','panic','over');
}

/* ---------- strokes ---------- */
function sizeCanvas(cv,row){
  const r=row.getBoundingClientRect();
  const d=window.devicePixelRatio||1;
  cv.width=r.width*d;cv.height=r.height*d;
  const g=cv.getContext&&cv.getContext('2d');
  if(g)g.scale(d,d);
  cv._w=r.width;cv._h=r.height;
}
function strokePass(ctx,points,color,alpha){
  if(!ctx||points.length<2)return;
  ctx.save();
  ctx.globalCompositeOperation='multiply';
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=color;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const [w,dy] of [[20,0],[12,-4],[9,5]]){
    ctx.lineWidth=w;ctx.beginPath();
    ctx.moveTo(points[0].x,points[0].y+dy);
    for(let i=1;i<points.length;i++){
      const p=points[i];
      ctx.lineTo(p.x,p.y+dy+Math.sin(p.x*.15)*1.2);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function redrawStrokes(cv,task,live,liveColor,liveAlpha){
  if(!cv._w)return;
  const ctx=cv.getContext&&cv.getContext('2d');
  if(!ctx)return;
  ctx.clearRect(0,0,cv._w,cv._h);
  for(const s of task.strokes)strokePass(ctx,s.pts,s.color,.5);
  if(live&&live.length)strokePass(ctx,live,liveColor,liveAlpha??.5);
}
function bindStroke(cv,row,task){
  // gesture: 'idle' → 'pending' (deciding) → 'draw' | 'scroll'
  let mode='idle',pts=[],sx=0,sy=0,raf=null;
  const scheduleDraw=()=>{
    if(raf)return;
    raf=requestAnimationFrame(()=>{raf=null;redrawStrokes(cv,task,pts,state.color);});
  };
  cv.addEventListener('pointerdown',e=>{
    mode='pending';pts=[];sx=e.offsetX;sy=e.offsetY;
    pts.push({x:e.offsetX,y:e.offsetY});
  });
  cv.addEventListener('pointermove',e=>{
    if(mode==='idle'||mode==='scroll')return;
    const dx=Math.abs(e.offsetX-sx),dy=Math.abs(e.offsetY-sy);
    if(mode==='pending'){
      if(dy>10&&dy>dx){mode='scroll';pts=[];return;}      // vertical intent → let the page scroll
      if(dx>6&&dx>=dy){mode='draw';cv.setPointerCapture(e.pointerId);squeak();}
      else return;                                        // not decided yet
    }
    pts.push({x:e.offsetX,y:e.offsetY});
    if(pts.length%16===0)squeak();
    scheduleDraw();
  });
  cv.addEventListener('pointerup',e=>{
    if(mode==='idle')return;
    const wasPending=(mode==='pending'),wasDraw=(mode==='draw');
    mode='idle';
    const dx=Math.abs(e.offsetX-sx),dy=Math.abs(e.offsetY-sy);
    if(wasPending&&dx<8&&dy<8){pts=[];redrawStrokes(cv,task);openEditSheet(task);return;}
    if(!wasDraw){pts=[];return;}
    if(dx>cv._w*0.35){
      task.strokes.push({color:state.color,pts:pts.slice()});
      pts=[];redrawStrokes(cv,task);
      pop();vib(10);
      if(!task.done)completeTask(task);
      save();
    }else{
      let a=.5;const savedPts=pts.slice();pts=[];
      const fade=setInterval(()=>{
        a-=.1;
        if(a>0)redrawStrokes(cv,task,savedPts,state.color,a);
        else{clearInterval(fade);redrawStrokes(cv,task);}
      },40);
    }
  });
  cv.addEventListener('pointercancel',()=>{mode='idle';pts=[];redrawStrokes(cv,task);});
}

/* auto-stroke: the app draws the highlighter for you ("I did it",
   and the keyboard path in the edit sheet) */
function autoStroke(task,done){
  const row=rowFor(task);
  if(!row){task.strokes.push({color:state.color,pts:[{x:8,y:23},{x:200,y:23}]});done&&done();return;}
  const cv=row.querySelector('canvas');
  if(!cv||!cv._w){task.strokes.push({color:state.color,pts:[{x:8,y:cv?cv._h/2||23:23},{x:200,y:23}]});done&&done();return;}
  const y=cv._h/2+ (Math.random()*4-2);
  const endX=cv._w-96, startX=10;
  const pts=[];let x=startX;
  const step=()=>{
    x+=Math.max(14,(endX-startX)/14);
    pts.push({x,y:y+Math.sin(x*.1)*1.5});
    redrawStrokes(cv,task,pts,state.color);
    if(x<endX)requestAnimationFrame(step);
    else{
      task.strokes.push({color:state.color,pts:pts.slice()});
      redrawStrokes(cv,task);
      done&&done();
    }
  };
  pts.push({x:startX,y});
  squeak();requestAnimationFrame(step);
}

function completeTask(task,opts={}){
  const finish=()=>{
    task.done=true;
    const row=rowFor(task);
    if(row){row.classList.remove('p1');row.classList.add('done');}
    state.doneToday++;
    doneCountEl.textContent=state.doneToday;
    if(state.hintShown){hint.classList.add('hide');state.hintShown=false;}
    const res=finishCountdown(task);
    refreshChip(task,chipFor(task));
    announce('Crossed off. '+state.doneToday+' today.');
    if(res&&res.beatClock){
      pop();
      if(res.newPR){
        const r=rowFor(task);
        if(r){
          const stamp=document.createElement('div');
          stamp.className='newpr';stamp.textContent='NEW RECORD!';
          r.appendChild(stamp);
        }
        announce('New record!');
        confetti();
      }else confetti(40);
    }
    save();
  };
  if(opts.autoStroke)autoStroke(task,finish);
  else finish();
}

/* ---------- confetti ---------- */
const cCv=document.getElementById('confetti');
const cCtx=cCv.getContext?cCv.getContext('2d'):null;
function sizeConfetti(){cCv.width=innerWidth;cCv.height=innerHeight;}
sizeConfetti();
let particles=[],cRAF=null;
function confetti(n=90){
  if(!cCtx||REDUCED)return;          // the stamp still lands; the shower can rest
  for(let i=0;i<n;i++){
    particles.push({
      x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,
      vx:(Math.random()-.5)*9,vy:-Math.random()*10-3,
      w:5+Math.random()*5,h:8+Math.random()*6,
      r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,
      c:PAGE_COLORS[i%PAGE_COLORS.length],life:1
    });
  }
  if(!cRAF)loop();
  function loop(){
    cCtx.clearRect(0,0,cCv.width,cCv.height);
    particles=particles.filter(p=>p.life>0);
    for(const p of particles){
      p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=p.vr;p.life-=.008;
      cCtx.save();cCtx.translate(p.x,p.y);cCtx.rotate(p.r);
      cCtx.globalAlpha=Math.max(p.life,0);cCtx.fillStyle=p.c;
      cCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cCtx.restore();
    }
    if(particles.length)cRAF=requestAnimationFrame(loop);
    else{cRAF=null;cCtx.clearRect(0,0,cCv.width,cCv.height);}
  }
}

/* ---------- tray ---------- */
document.querySelectorAll('.marker').forEach(m=>{
  m.addEventListener('click',()=>{
    document.querySelectorAll('.marker').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-pressed','false');});
    m.classList.add('sel');m.setAttribute('aria-pressed','true');
    state.color=m.dataset.c;
    save();
  });
});

/* ---------- add ---------- */
function parseLine(raw){
  let text=raw.trim(),pri=state.addPri;
  if(text.startsWith('!')){pri=1;text=text.slice(1).trim();}
  else if(text.startsWith('~')){pri=3;text=text.slice(1).trim();}
  return text?{text,pri}:null;
}
function addTask(text,pri){
  const p=page()||addPage();
  p.tasks.push({id:++uid,text,note:'',done:false,strokes:[],pri,chore:false,steps:[],timer:null,result:null});
}
document.getElementById('addPri').addEventListener('click',e=>{
  const b=e.target.closest('.pri');
  if(!b)return;
  state.addPri=+b.dataset.p;
  document.querySelectorAll('#addPri .pri').forEach(x=>x.classList.toggle('sel',x===b));
});
addInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&addInput.value.trim()){
    const t=parseLine(addInput.value);
    if(!t)return;
    addTask(t.text,t.pri);
    addInput.value='';
    render();save();
  }
});
/* paste a whole braindump: every line becomes its own task */
addInput.addEventListener('paste',e=>{
  const clip=(e.clipboardData||window.clipboardData);
  if(!clip)return;
  const text=clip.getData('text/plain');
  if(!text||!text.includes('\n'))return;    // single line pastes normally
  e.preventDefault();
  const lines=text.split(/\r?\n/).map(parseLine).filter(Boolean);
  if(!lines.length)return;
  for(const l of lines)addTask(l.text,l.pri);
  addInput.value='';
  render();save();
  announce(lines.length+' tasks added');
  if(window.SWS&&SWS.toast)SWS.toast(lines.length+' tasks added, one per line.');
});

/* ---------- resize: canvases only, never re-render, skip while typing ----------
   INVARIANT. Height-only changes are the phone keyboard. Re-rendering here
   recreates the keyboard→resize→render→blur→keyboard flash loop that shipped
   once already. */
let lastW=innerWidth;
let resizeT=null;
addEventListener('resize',()=>{
  sizeConfetti();
  if(innerWidth===lastW)return;              // height-only change = keyboard; ignore
  lastW=innerWidth;
  if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    document.querySelectorAll('.task').forEach(row=>{
      const t=findTask(+row.dataset.id);
      const cv=row.querySelector('canvas');
      if(t&&cv){sizeCanvas(cv,row);redrawStrokes(cv,t);}
    });
  },160);
});

/* ---------- boot: load saved notebook, seed only on first run ---------- */
if(!load()){
  const home=addPage('Home');
  home.tasks.push(
    {id:++uid,text:'call the pharmacy before it closes',note:'',done:false,strokes:[],pri:1,chore:false,steps:[],timer:null,result:null},
    {id:++uid,text:'the dishwasher',note:'',done:false,strokes:[],pri:2,chore:true,
      steps:[{text:'load it',done:false},{text:'run it',done:false},{text:'empty it',done:false}],timer:null,result:null},
    {id:++uid,text:'fold the laundry',note:'',done:false,strokes:[],pri:2,chore:false,steps:[],timer:null,result:null},
    {id:++uid,text:'sort the junk drawer',note:'someday is a real day',done:false,strokes:[],pri:3,chore:false,steps:[],timer:null,result:null}
  );
  const errands=addPage('Errands');
  errands.tasks.push({id:++uid,text:'pick up prescription',note:'',done:false,strokes:[],pri:2,chore:false,steps:[],timer:null,result:null});
  state.activePage=home.id;
  save();
}else{
  if(!state.pages.find(p=>p.id===state.activePage))state.activePage=state.pages[0].id;
}
document.getElementById('soundBtn').textContent=state.sound?'🔊':'🔇';
document.getElementById('soundBtn').setAttribute('aria-pressed',state.sound);
document.querySelectorAll('.marker').forEach(m=>{
  const on=m.dataset.c===state.color;
  m.classList.toggle('sel',on);m.setAttribute('aria-pressed',on);
});
if(!state.hintShown)hint.classList.add('hide');
render();

/* a timer that was running when the app closed picks itself back up */
for(const p of state.pages)for(const t of p.tasks){
  if(t.timer&&p.id===state.activePage){
    const chip=chipFor(t);
    if(chip)startTick(t,chip);
  }
}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
