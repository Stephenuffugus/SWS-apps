<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="An inked character with a blue armature showing through, inside a comic panel">
  <!-- Inkbones app icon.

       Bristol board, a comic panel border, one inked character, and the
       fifteen joint armature showing through it in non photo blue. That is
       the whole app in one picture: the blue skeleton is there first, the
       ink goes over the top.

       Two groups are load bearing. To cut icon-maskable-512.png the
       renderer hides #frame and insets the viewBox to about 71 percent, so
       every inked pixel lands inside the middle 80 percent that a maskable
       icon is allowed to rely on. Measured: the furthest ink sits 196px from
       the centre of a 512 tile, and the safe radius is 205. Keep both ids and
       re measure if you redraw this.

       Palette, fixed: bristol F2F1EC, ink 14120F, non photo blue 6FB7DC,
       process magenta E0218A. No text: it would not be legible at 48px.

       To rasterise, render this in chromium at each size and screenshot it.
       Pillow cannot read SVG and ImageMagick has no rsvg delegate here. -->
  <rect width="512" height="512" fill="#F2F1EC"/>
  <g id="frame">
    <rect x="24" y="24" width="464" height="464" rx="22" fill="none" stroke="#14120F" stroke-width="14"/>
  </g>
  <g id="art" transform="translate(256 252) scale(1.09) translate(-256 -258)">
    <g fill="none" stroke="#E0218A" stroke-width="11" stroke-linecap="round">
      <circle cx="408" cy="104" r="25"/>
      <path d="M408 67 L408 141 M371 104 L445 104"/>
    </g>
    <g fill="#14120F" stroke="#14120F" stroke-linecap="round" stroke-linejoin="round">
      <path d="M182 262 C182 230 210 212 256 212 C302 212 330 230 330 262 L318 340 C318 366 292 378 256 378 C220 378 194 366 194 340 Z"/>
      <circle cx="256" cy="130" r="64"/>
      <g fill="none" stroke-width="46">
        <path d="M206 262 L154 216 L132 158"/>
        <path d="M306 262 L362 314 L378 372"/>
      </g>
      <g fill="none" stroke-width="52">
        <path d="M226 346 L212 392 L196 436"/>
        <path d="M286 346 L300 392 L316 438"/>
      </g>
    </g>
    <g fill="none" stroke="#6FB7DC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M256 206 L256 346"/>
      <path d="M206 262 L306 262"/>
      <path d="M226 346 L286 346"/>
      <path d="M206 262 L154 216 L132 158"/>
      <path d="M306 262 L362 314 L378 372"/>
      <path d="M226 346 L212 392 L196 436"/>
      <path d="M286 346 L300 392 L316 438"/>
      <path d="M256 70 C240 98 240 162 256 190" stroke-width="15"/>
      <path d="M200 122 C228 140 284 140 312 122" stroke-width="15"/>
    </g>
    <g fill="#6FB7DC">
      <circle cx="256" cy="206" r="12"/>
      <circle cx="206" cy="262" r="12"/>
      <circle cx="306" cy="262" r="12"/>
      <circle cx="154" cy="216" r="12"/>
      <circle cx="362" cy="314" r="12"/>
      <circle cx="132" cy="158" r="12"/>
      <circle cx="378" cy="372" r="12"/>
      <circle cx="256" cy="346" r="12"/>
      <circle cx="226" cy="346" r="12"/>
      <circle cx="286" cy="346" r="12"/>
      <circle cx="212" cy="392" r="12"/>
      <circle cx="300" cy="392" r="12"/>
      <circle cx="196" cy="436" r="12"/>
      <circle cx="316" cy="438" r="12"/>
    </g>
  </g>
</svg>
