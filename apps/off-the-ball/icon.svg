<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Off the Ball">
  <!-- A DRAWN PLACEHOLDER, not Stephen's art. The mark is the app's whole
       idea in two objects: the ball stays put and the run goes somewhere
       else. Replace this the day his artwork is filed, the way Coverage was
       replaced, and recut the PNGs from that instead. -->
  <rect width="512" height="512" rx="112" fill="#0B1B1A"/>
  <!-- chalk box, the corner of a pitch -->
  <path d="M64 384 H448" stroke="#E8E4D9" stroke-opacity=".22" stroke-width="7" stroke-linecap="round"/>
  <path d="M168 384 V300 H344 V384" fill="none" stroke="#E8E4D9" stroke-opacity=".22" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- the run: away from the ball, curving into space -->
  <path d="M170 356 C 196 250, 268 208, 356 176" fill="none" stroke="#6FD8B4" stroke-width="17"
        stroke-linecap="round" stroke-dasharray="3 44"/>
  <!-- the runner, gold, already gone -->
  <circle cx="356" cy="176" r="30" fill="#F4B740"/>
  <!-- the ball, still back there -->
  <circle cx="158" cy="366" r="26" fill="#E8E4D9"/>
  <path d="M158 344 L171 356 L166 372 H150 L145 356 Z" fill="#0B1B1A"/>
</svg>
