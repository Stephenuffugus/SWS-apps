<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2419"/><stop offset="1" stop-color="#26160f"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fffdf6"/><stop offset="0.6" stop-color="#efe9da"/><stop offset="1" stop-color="#c5bca9"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f6dc9c"/><stop offset="0.6" stop-color="#dca753"/><stop offset="1" stop-color="#a8742a"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#17100d"/>
  <!-- the neck, seen straight on -->
  <rect x="10" y="4" width="44" height="60" fill="url(#wood)"/>
  <!-- nut -->
  <rect x="10" y="8" width="44" height="4.5" rx="1.5" fill="#e9e0c8"/>
  <!-- frets -->
  <rect x="10" y="24" width="44" height="2.4" rx="1.2" fill="#b99f6f"/>
  <rect x="10" y="39" width="44" height="2.4" rx="1.2" fill="#b99f6f"/>
  <rect x="10" y="54" width="44" height="2.4" rx="1.2" fill="#b99f6f"/>
  <!-- pearl inlay behind the strings -->
  <circle cx="32" cy="47.5" r="4" fill="#f0e6d2" opacity="0.35"/>
  <!-- strings: wound low side thicker, plain high side thinner -->
  <rect x="15.4" y="12.5" width="2.6" height="51.5" fill="#b7a98e"/>
  <rect x="23.6" y="12.5" width="2.2" height="51.5" fill="#b7a98e"/>
  <rect x="31.6" y="12.5" width="1.8" height="51.5" fill="#c9bfa9"/>
  <rect x="39.6" y="12.5" width="1.5" height="51.5" fill="#cfd2d6"/>
  <rect x="47.6" y="12.5" width="1.2" height="51.5" fill="#cfd2d6"/>
  <!-- the found note, gold on the string -->
  <circle cx="24.7" cy="32" r="7.2" fill="url(#gold)"/>
  <circle cx="24.7" cy="32" r="7.2" fill="none" stroke="#17100d" stroke-width="1" opacity="0.35"/>
</svg>
