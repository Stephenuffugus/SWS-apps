<html lang="en">
<head>
<meta charset="utf-8">

     failure and also the thing the coach asked for when he said "maybe you

<style>
@font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;
  src:url(fonts/anton.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;font-display:swap;
  src:url(fonts/nunito.woff2) format('woff2')}
:root{
  --sky:#6FC3EA; --grass:#3FA35C;
  --dirt:#E0955B; --dirt-lt:#EDB183;
  --chalk:#FFF9EE; --ink:#1C3529;
  --sun:#FFCE3B; --safe:#2FBF66; --out:#F45B5B; --backup:#2F7FB5;
  --glass:rgba(255,255,255,.92);
  --shadow:0 3px 0 rgba(28,53,41,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:800}

/* ---------- full-bleed field ---------- */
#dia{position:fixed;inset:0;width:100vw;height:100dvh;display:block}
.base{cursor:pointer;pointer-events:auto}
.base rect{transition:fill .15s,stroke .15s;transform-box:fill-box;transform-origin:center}
.base.hit rect{fill:var(--safe);stroke:var(--safe)}
.base.miss rect{fill:var(--out);stroke:var(--out)}
.base:focus-visible rect{stroke:var(--ink);stroke-width:5}
.pulse rect{animation:pulse 1.1s ease-in-out infinite}
/* sonar ping: the "you can tap this" cue kids actually notice */
.ping{fill:none;stroke:var(--chalk);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.base.pulse .ping,.fielder.pulse .ping,.circleTgt.pulse .ping{animation:ping 1.1s ease-out infinite}
/* the pitcher's circle, borrowed from the field itself so a kid taps the
   dirt she already sees rather than a new invented widget */
.circleTgt{cursor:pointer;pointer-events:auto}
.circleTgt .ring{transition:stroke .15s,fill .15s}
.circleTgt.hit .ring{fill:var(--safe);stroke:var(--safe)}
.circleTgt.miss .ring{fill:var(--out);stroke:var(--out)}
.circleTgt:focus-visible .ring{stroke:var(--ink);stroke-width:5}
@keyframes ping{0%{opacity:.85;transform:scale(.75)}70%{opacity:0;transform:scale(1.8)}100%{opacity:0}}
.fielder .body{transition:fill .15s,stroke .15s;transform-box:fill-box;transform-origin:center}
.fielder.tappable{cursor:pointer}
.fielder.hit .body{fill:var(--safe)}
.fielder.miss .body{fill:var(--out)}
.fielder:focus-visible .body{stroke:#fff;stroke-width:4}
.fielder.pulse .body{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
/* Every decorative layer on the field is untappable, so the only things
   that can take a tap are the answers. The ball rests at 200,352, which is
   dead centre of the pitcher's circle, so without this it sat on top of the
   circle target and ate the tap. Same class of bug as the pitcher's marker
   covering it, found the same way: by clicking it in a browser. */
.ball,#runners,#clouds{pointer-events:none}
.ball{transition:transform .55s cubic-bezier(.34,.9,.4,1)}
#ballSkin{transform-box:fill-box;transform-origin:center}
#ballSkin.thump{animation:thump .32s ease-out}
@keyframes thump{0%{transform:scale(1)}45%{transform:scale(1.4)}100%{transform:scale(1)}}
.runnerbob{animation:bob 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
#clouds{animation:cdrift 46s ease-in-out infinite alternate}
@keyframes cdrift{from{transform:translateX(0)}to{transform:translateX(26px)}}
@media (prefers-reduced-motion:reduce){
  .ball{transition:none}
  .pulse rect,.fielder.pulse .body,.base.pulse .ping,.fielder.pulse .ping,.circleTgt.pulse .ping{animation:none}
  #ballSkin.thump,.runnerbob,#clouds,.holdchip.pulse::before,.streak.pop{animation:none}
}
.poslbl{font-family:'Anton',sans-serif;font-size:12px;fill:#fff;pointer-events:none}
.baselbl{font-family:'Anton',sans-serif;font-size:13px;fill:#fff;letter-spacing:.06em;
  paint-order:stroke;stroke:rgba(28,53,41,.45);stroke-width:3px;pointer-events:none}

/* ---------- floating UI ---------- */
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);}
.ui > *{pointer-events:auto}

.topstack{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:520px;width:100%;margin:0 auto}
.getpill{appearance:none;border:0;background:var(--ink);color:#fff;font-family:'Nunito',sans-serif;
  font-weight:900;font-size:15px;padding:11px 20px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer}
.getpill:active{transform:translateY(2px);box-shadow:none}
.pill{background:var(--glass);border-radius:999px;box-shadow:var(--shadow);padding:6px 12px;
  display:flex;align-items:center;gap:8px}
.streak{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.05em}
.streak.pop{animation:stpop .35s ease-out}
@keyframes stpop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
.gear{appearance:none;border:0;background:var(--glass);border-radius:999px;width:38px;height:38px;
  font-size:17px;cursor:pointer;box-shadow:var(--shadow);flex:0 0 auto}
.gear:active{transform:translateY(2px);box-shadow:none}
.lbl{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.08em;color:#7C9488}
.bulbs{display:flex;gap:4px}
.bulb{width:13px;height:13px;border-radius:50%;background:#DCE8E0;transition:background .18s,box-shadow .18s}
.bulb.on{background:var(--sun);box-shadow:0 0 7px rgba(255,206,59,.9)}
.bulb.on.red{background:var(--out);box-shadow:0 0 7px rgba(244,91,91,.8)}

.bottom{display:flex;flex-direction:column;gap:8px;max-width:480px;width:100%;margin:0 auto;pointer-events:none}
.bottom > *{pointer-events:auto}

/* holding the ball is a play you make ON the field, so it lives there:
   a fifth base that pulses with the real four */
.holdchip{appearance:none;border:0;background:none;cursor:pointer;align-self:flex-start;
  position:relative;width:84px;height:88px;margin-left:4px;padding:0;font-family:'Anton',sans-serif}
.holdchip::before{content:"";position:absolute;left:17px;top:8px;width:50px;height:50px;
  background:var(--chalk);border:3px solid #1C3529;border-radius:10px;transform:rotate(45deg);
  box-shadow:var(--shadow)}
.holdchip.pulse::before{animation:holdpulse 1.1s ease-in-out infinite}
@keyframes holdpulse{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.16)}}
.holdchip.miss::before{background:var(--out);border-color:var(--out)}
.holdchip.hit::before{background:var(--safe);border-color:var(--safe)}
.holdchip .hand{position:relative;display:block;font-size:24px;line-height:1;margin-top:20px}
.holdchip .hlbl{position:relative;display:block;font-size:12px;letter-spacing:.06em;color:#fff;margin-top:16px;
  text-shadow:-1px -1px 0 rgba(28,53,41,.45),1px -1px 0 rgba(28,53,41,.45),-1px 1px 0 rgba(28,53,41,.45),1px 1px 0 rgba(28,53,41,.45)}
.holdchip:focus-visible::before{outline:3px solid var(--sun);outline-offset:2px}
.holdchip:active{transform:translateY(2px)}
.bubble{background:var(--glass);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px;
  max-height:44dvh;overflow-y:auto}
.ask{margin:0 0 10px;font-size:18px;font-weight:900;line-height:1.35}
.ask b{color:#D9702B}
.ask .tag{color:#E58A3C;font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.06em;
  text-transform:uppercase;font-size:14px;margin-right:6px}
.answers{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.answers.one{grid-template-columns:1fr}
.answers:empty{display:none}
.btn{appearance:none;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;
  padding:12px 10px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;
  min-height:52px;box-shadow:var(--shadow);transition:background .15s,color .15s,opacity .15s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn.right{background:var(--safe);border-color:var(--safe);color:#fff}
.btn.wrong{background:var(--out);border-color:var(--out);color:#fff}
.btn.dim{opacity:.35}
.btn.fill{background:var(--sun);border-color:var(--sun)}
.btn.ghost{border-color:#C9D8CE;color:#5E7568;box-shadow:none;background:rgba(255,255,255,.75)}
.hint{font-size:13px;color:#5E7568;margin:8px 0 0}
.hint.no{color:#C2312B;font-weight:900}
.hint:empty{display:none}
.btn.mini{min-height:40px;font-size:14px;padding:8px;width:100%;margin-top:8px}

.tabs{display:flex;justify-content:center;align-items:flex-start;gap:6px}
.tabwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.tab{appearance:none;border:0;background:var(--glass);border-radius:999px;width:48px;height:48px;
  cursor:pointer;box-shadow:var(--shadow);font-size:21px;display:flex;align-items:center;justify-content:center}
.tab.util{width:44px;height:44px;font-size:19px;margin-top:2px}
.tab[aria-pressed="true"]{background:var(--sun);outline:3px solid rgba(28,53,41,.25)}
.tab:active{transform:translateY(2px);box-shadow:none}
.tab:focus-visible{outline:3px solid var(--ink)}
.tlbl{font-family:'Anton',sans-serif;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#fff;
  text-shadow:-1px -1px 0 rgba(28,53,41,.5),1px -1px 0 rgba(28,53,41,.5),-1px 1px 0 rgba(28,53,41,.5),1px 1px 0 rgba(28,53,41,.5)}
/* ---------- Everybody moves: the sandbox ----------
   The coach: "it needs to be done in a slow simple animation without
   overwording everything." So the words are two short lines and the teaching
   is carried by colour and by geometry. Gold means I am going to the BALL,
   green means I am covering a BASE, blue means I am BACKING UP. That is the
   whole published system, Ball then Base then Back-up, painted rather than
   written. Source: Baseball Positive, "each player on defense has one of
   three responsibilities: handle the BALL, cover a BASE, or BACK-UP a
   throw." */
#hitPad{display:none}
body.movemode #hitPad{display:block;pointer-events:auto;cursor:crosshair}
/* the fielders are already placed by a transform, so the walk is one
   transition on the group. Scoped to this room so the five quiz rooms keep
   snapping instantly. */
body.movemode .fielder{transition:transform var(--walk,2200ms) cubic-bezier(.4,0,.2,1)}
body.movemode .fielder .body{transition:fill .5s}
body.movemode .fielder.r-ball .body{fill:var(--sun);opacity:1}
body.movemode .fielder.r-cover .body{fill:var(--safe);opacity:1}
body.movemode .fielder.r-back .body{fill:var(--backup);opacity:1}
body.movemode .poslbl{paint-order:stroke;stroke:rgba(28,53,41,.55);stroke-width:2.5px}
/* the chalk trail draws itself under her feet, which is what makes a third
   baseman's honest two step shuffle to her own bag readable at all */
.trail{fill:none;stroke-width:3.5;stroke-linecap:round;opacity:.5;
  transition:stroke-dashoffset var(--walk,2200ms) cubic-bezier(.4,0,.2,1)}
.trail.back{opacity:.3;stroke-width:3}
/* ball, through the cut girl, to the bag: how a cut reads even when the cut
   girl only takes two steps */
.throwline{fill:none;stroke:var(--chalk);stroke-width:3;stroke-dasharray:9 7;
  opacity:0;transition:opacity .4s}
.throwline.on{opacity:.8}
/* a bag lights when its coverer actually arrives. Deliberately NOT the green
   that means "correct" elsewhere: nothing in this room is right or wrong. */
.cov{fill:none;stroke:var(--chalk);stroke-width:4;opacity:0;transition:opacity .45s}
.cov.on{opacity:.95}
.ghost{opacity:.34}
/* fitView runs on a ResizeObserver watching .bubble, so the second caption
   line reserves its height or the field rescales under the walking players */
body.movemode .hint{min-height:34px}
@media (prefers-reduced-motion:reduce){
  /* the movement still happens. It just happens now. */
  body.movemode .fielder{transition:none}
  .trail,.throwline,.cov{transition:none}
}

/* the tab row carries eight items now. The row's width is set by the LABELS
   rather than the buttons, and html is overflow:hidden, so an overflow would
   silently clip the Feedback tab. It scrolls instead. */
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:470px){
  .tabs{gap:3px}
  .tab{width:42px;height:42px;font-size:18px}
  .tab.util{width:38px;height:38px;font-size:16px}
}
@media (max-width:380px){
  .tabs{gap:2px}
  .tab{width:38px;height:38px;font-size:17px}
  .tab.util{width:34px;height:34px;font-size:15px}
  .tlbl{font-size:8px;letter-spacing:.03em}
}
@media (max-width:340px){
  .tab{width:34px;height:34px;font-size:15px}
  .tab.util{width:30px;height:30px;font-size:14px}
}

/* mode title, pops when you land in a room */
.modetoast{position:fixed;top:16%;left:0;right:0;text-align:center;pointer-events:none;z-index:15;
  font-family:'Anton',sans-serif;font-size:36px;letter-spacing:.05em;text-transform:uppercase;color:#fff;
  text-shadow:0 3px 0 rgba(28,53,41,.4),-2px -2px 0 rgba(28,53,41,.35),2px -2px 0 rgba(28,53,41,.35),-2px 2px 0 rgba(28,53,41,.35),2px 2px 0 rgba(28,53,41,.35);
  opacity:0;transition:opacity .3s}
.modetoast.show{opacity:1}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(28,53,41,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.hidden{display:none !important}
.vcard{background:#fff;border-radius:22px;padding:20px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.2);animation:popin .25s cubic-bezier(.34,1.4,.5,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.vcard{animation:none}}
.bigword{font-family:'Anton',sans-serif;font-size:46px;letter-spacing:.03em;line-height:1;
  margin:0 0 10px;text-transform:uppercase}
.bigword.good{color:var(--safe)} .bigword.bad{color:var(--out)} .bigword.mid{color:#C77F06}
.rulechip{display:inline-block;font-family:'Anton',sans-serif;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;background:var(--ink);border-radius:20px;padding:4px 12px;margin-bottom:10px}
.vbody{margin:0 0 16px;font-size:16px;font-weight:800;line-height:1.45;text-align:left}
.vbody b{color:#D9702B}
.tipline{margin:-6px 0 16px;font-size:13px;font-weight:800;line-height:1.4;text-align:left;
  background:#FFF6DC;border-radius:12px;padding:8px 10px;color:#6B5410}
.tipline:empty{display:none}
.roundline{font-family:'Anton',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:#7C9488;margin:0 0 10px}
.roundline:empty{display:none}
.rdscore{font-family:'Anton',sans-serif;font-size:44px;margin:0 0 8px;color:var(--ink)}
.rdstars{font-size:21px;letter-spacing:2px;margin:0 0 16px;line-height:1.5}
.dimst{opacity:.22}
.btn.big{width:100%;font-size:18px;min-height:56px}
.scard{background:#fff;border-radius:22px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.2);
  max-height:calc(100dvh - 40px);overflow-y:auto}
.scard h2{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.05em;text-transform:uppercase;margin:0 0 14px;font-size:22px}
.setrow{margin-bottom:16px}
.setlbl{font-family:'Anton',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7C9488;margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .btn{min-height:56px}
.seg .btn.sel{background:var(--sun);border-color:var(--ink)}
.setnote{font-size:13px;color:#6E8578;margin:8px 0 0;font-weight:800}
.foot{font-size:15px;color:#5E7568;margin:14px 0 0;font-weight:800;text-align:center}
.foot a{color:#33664B}
.btn.tip{background:#E4574F;border-color:#E4574F;color:#fff;display:flex;align-items:center;
  justify-content:center;text-decoration:none;margin-top:8px}
.buildtag{font-family:'Anton',sans-serif;font-size:10px;letter-spacing:.12em;color:#A9BDB1;
  text-align:center;margin:6px 0 0;text-transform:uppercase}

/* ---------- feedback box ---------- */
.fbcard{background:#fff;border-radius:22px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.fbcard h2{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;font-size:20px}
.fbcard textarea{width:100%;min-height:110px;border:3px solid var(--ink);border-radius:14px;padding:10px;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;resize:vertical;user-select:text;-webkit-user-select:text}
.fbctx{margin:6px 0 0;font-size:13px;line-height:1.4;opacity:.75}
.fbstatus{font-size:13px;color:#6E8578;min-height:18px;margin:8px 0;font-weight:800}
.fbrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.cf{position:fixed;top:-16px;width:12px;height:12px;border-radius:3px;z-index:30;pointer-events:none;
  animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
</style>
</head>
<body>

<!-- ============ the field fills the whole screen ============ -->
<svg id="dia" viewBox="0 -104 400 869" preserveAspectRatio="none" role="group" aria-label="Ball field">
  <!-- sky -->
  <rect x="-800" y="-800" width="2000" height="2400" fill="#7CC9EE"/>
  <circle cx="52" cy="14" r="30" fill="#FFE27A"/>
  <circle cx="52" cy="14" r="42" fill="#FFE27A" opacity=".3"/>
  <g id="clouds" fill="#fff" opacity=".9">
    <ellipse cx="310" cy="26" rx="42" ry="15"/><ellipse cx="342" cy="16" rx="30" ry="12"/>
    <ellipse cx="120" cy="70" rx="34" ry="12" opacity=".7"/>
  </g>
  <!-- outfield grass beyond the fence curve -->
  <path d="M-800 214 Q200 52 1200 214 L1200 2000 L-800 2000 Z" fill="var(--grass)"/>
  <!-- fence -->
  <path d="M-800 214 Q200 52 1200 214" fill="none" stroke="#2E7D46" stroke-width="8"/>
  <!-- mow rings -->
  <circle cx="200" cy="330" r="210" fill="#57B571" opacity=".18"/>
  <circle cx="200" cy="330" r="140" fill="#57B571" opacity=".18"/>
  <!-- infield dirt -->
  <path d="M200 498 L56 342 Q200 176 344 342 Z" fill="var(--dirt)"/>
  <circle cx="200" cy="352" r="26" fill="var(--dirt-lt)"/>
  <circle cx="200" cy="460" r="34" fill="var(--dirt-lt)"/>
  <!-- chalk -->
  <path d="M200 460 L318 342 L200 224 L82 342 Z" fill="none" stroke="var(--chalk)" stroke-width="4"/>
  <path d="M200 460 L1000 -340" stroke="var(--chalk)" stroke-width="4"/>
  <path d="M200 460 L-600 -340" stroke="var(--chalk)" stroke-width="4"/>
  <!-- the whole field is the answer surface in the Move room, so the hit pad
       is a real filled shape. It sits UNDER the bases and the players on
       purpose: a tap on a bag means "put a runner here", a tap on a girl
       means "hit it right at her", and only the leftovers are hits. -->
  <rect id="hitPad" x="-800" y="-800" width="2000" height="2400" fill="transparent"/>
  <!-- where each mover has been, plus the throw line. Under the players, so
       they ride on top of their own chalk. -->
  <g id="trails" pointer-events="none"></g>
  <!-- a halo that lights when a bag's coverer actually arrives -->
  <g id="covers" pointer-events="none"></g>
  <g id="fielders"></g>
  <g id="bases"></g>
  <!-- the circle target paints ABOVE the fielders on purpose. The pitcher
       marker sits on the very same spot, and in Mix the fielders are left
       tappable for the whole mode because a positioning question can come
       up at any time, so underneath here the pitcher's disc swallowed every
       tap meant for the circle. It is only ever drawn when the circle is a
       legal answer, so being on top costs nothing. -->
  <g id="circleT"></g>
  <g id="runners" pointer-events="none"></g>
  <g id="ballG" class="ball" style="transform:translate(200px,352px)">
    <g id="ballSkin">

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   DIAMOND RULES, the rules little leagues skip, on a live field.
   One file, no build, no server, no account.
   ══════════════════════════════════════════════════════════════ */

var BUILD="diamond-v18";
/* config seam, fleet pattern: an empty string hides the tip jar link */
var TIP_URL="https://buy.stripe.com/7sYfZi0rfb9tbLT1XH7EQ0v";
/* a Discord webhook turns the Feedback link into an in app report that
   lands in Stephen's server. Empty string keeps the plain email link. */
var FEEDBACK_WEBHOOK="https://discord.com/api/webhooks/1542619447804567572/WWTb3lcZl_oNp0Ul8JFX2TJ9B1H5ZeR1yq3HHdtGqvZ-_GgCTWoIzk4x217OdDMzGgha";

/* ================= league config =================
   League rules are data, not code, straight from Stephen's league:
   8U is coach pitch, 4 strikes, no steals or leadoffs, no dropped third
   strike, and NO INFIELD FLY. Stephen, 2026-08-28: "there's no infield fly
   rule in 8U cuz the girls can hardly catch." That is the whole point of
   the rule and the reason it does not belong there: it exists to stop a
   fielder dropping an easy pop on purpose to get a cheap double play, and
   at 8U an easy pop is not easy and nobody is dropping it on purpose.
   10U is kid pitch, 3 strikes, steals and leadoffs ON, dropped third
   strike live, and Stephen does not believe 10U plays the infield fly
   either, so it is off there too. Baseball keeps it. If his league proves
   otherwise it is one word: infieldFly:true on softball10.
   `circle` is the LOOK BACK RULE, and it is fast pitch only. Stephen's
   coach, 2026-08-28: "in 8u on a ball hit to the outfield the runner can
   keep running until the pitcher has the ball in the circle." Transcribed
   from the USA Softball 2023 Rule Book, Rule 8 Section 7T, rather than
   recalled: the Look Back rule is in effect when the ball is live, the
   batter-runner has reached first or been declared out, and the pitcher has
   possession and control of the ball within the eight foot circle. A runner
   legitimately off base may stop once, then must immediately return to her
   base or attempt to advance. Failing to do so, she is out. BASEBALL HAS NO
   SUCH RULE, so `circle` is false there and the circle is not even tappable,
   because teaching a baseball kid to expect runners to freeze would be
   teaching her something false.

   `steals` gates the runner IQ scenarios; `infieldFly` and `circle` gate
   any scenario that declares needs:"infieldFly" or needs:"circle". */
const SPORTS = {
  softball8:{label:"Softball 8U",icon:"🥎",strikesForOut:4,ballsForWalk:4,steals:false,infieldFly:false,circle:true,
    ballFill:"#FFE93B",ballStroke:"#D9B400",
    note:"8U coach pitch: 4 strikes = out · no steals, no leadoffs, no infield fly"},
  softball10:{label:"Softball 10U",icon:"🥎",strikesForOut:3,ballsForWalk:4,steals:true,infieldFly:false,circle:true,
    ballFill:"#FFE93B",ballStroke:"#D9B400",
    note:"10U kid pitch: 3 strikes = out · steals and leadoffs are ON"},
  baseball:{label:"Baseball",icon:"⚾",strikesForOut:3,ballsForWalk:4,steals:false,infieldFly:true,circle:false,
    ballFill:"#FFF9EE",ballStroke:"#E0955B",note:"3 strikes = out · 4 balls = walk"}
};

/* ================= geometry (viewBox units) ================= */
const CX=200, CY=310;          /* scene center the camera locks onto */
const SAFE_W=400, SAFE_H=440;  /* box that must always be visible    */
const BASE_XY = {
  HOME:{x:200,y:460,label:"HOME"},
  B1:{x:318,y:342,label:"1ST"},
  B2:{x:200,y:224,label:"2ND"},
  B3:{x:82,y:342,label:"3RD"}
};
/* corner infielders stand OFF the baseline, inside and near their bag, and
   the center fielder stands inside the fence, not in the sky. Both were
   Stephen's field notes: draw where players really stand. */
const POS = {
  1:{n:"pitcher",s:"P",x:200,y:352},
  2:{n:"catcher",s:"C",x:200,y:496},
  3:{n:"first baseman",s:"1B",x:282,y:360},
  4:{n:"second baseman",s:"2B",x:252,y:288},
  5:{n:"third baseman",s:"3B",x:118,y:360},
  6:{n:"shortstop",s:"SS",x:148,y:288},
  7:{n:"left fielder",s:"LF",x:92,y:172},
  8:{n:"center fielder",s:"CF",x:200,y:160},
  9:{n:"right fielder",s:"RF",x:308,y:172}
};

/* camera: the field fills the whole screen edge to edge, but the safe box
   (every base, fielder and label) must land in the strip of screen the
   floating UI does NOT cover, so the question bubble can never sit on home
   plate. Measured live because the bubble grows and shrinks with its words. */
function fitView(){
  const w=innerWidth,h=innerHeight;
  const topEl=document.querySelector(".topstack"),botEl=document.querySelector(".bottom");
  const topH=topEl?topEl.getBoundingClientRect().bottom+6:0;
  const botT=botEl?botEl.getBoundingClientRect().top-6:h;
  let visH=botT-topH;
  if(!(visH>h*.32))visH=h*.32;   /* floor: a huge bubble may overlap, never swallow */
  const s=Math.min(w/SAFE_W,visH/SAFE_H);
  const W=w/s,H=h/s;
  const midPix=Math.min(topH+visH/2,h-visH/2);
  document.getElementById("dia").setAttribute("viewBox",
    `${CX-W/2} ${CY-midPix*H/h} ${W} ${H}`);
}
addEventListener("resize",fitView);

/* ================= state + persistence ================= */
const S = {mode:"count",sport:"softball8",sound:true,
  balls:0,strikes:0,outs:0,streak:0,best:0,scenario:null,answered:false,
  round:null,missedThis:false};
const KEY="diamond1";
try{
  const d=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(SPORTS[d.sport])S.sport=d.sport;
  else if(d.sport==="softball")S.sport="softball8";  /* pre-level saves */
  if(d.sound===false)S.sound=false;
  S.best=d.best|0;
}catch(e){}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({sport:S.sport,sound:S.sound,best:S.best}))}catch(e){}
}
const cfg=()=>SPORTS[S.sport];
const el=id=>document.getElementById(id);

/* ================= audio ================= */
let AC=null;
function tone(f,when,dur,type="triangle",gain=.12){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(gain,AC.currentTime+when);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+dur);
  o.connect(g).connect(AC.destination);
  o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+.05);
}
function sfx(kind){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    if(kind==="good"){tone(523,0,.14);tone(659,.1,.14);tone(784,.2,.24);}
    else if(kind==="bad"){tone(196,0,.22,"sawtooth",.08);tone(155,.12,.3,"sawtooth",.08);}
    else tone(660,0,.08,"square",.06);
  }catch(e){}
}

/* ================= ballpark organ =================
   Take Me Out to the Ball Game (Von Tilzer/Norworth, 1908, public domain),
   one chiptune voice, sequenced live in WebAudio so the app stays one file.
   Notes are [semitones above middle C, beats] in 3/4; -1 is a rest. The full
   32 bar chorus, note values read bar by bar from the ORIGINAL 1908
   engraving (Teller, Sons & Dorner; Levy Collection scan, transposed D to
   C). The lilt is the song: long short openings (Taaake me), quick walking
   quarters, full bar holds on ball / game / home / old, and Let me / For
   it's as quick pickups. */
const SONG=[
  /* Take me out to the ball game */
  [0,2],[12,1], [9,1],[7,1],[4,1], [7,3], [2,3],
  /* Take me out with the crowd (held, then breathe) */
  [0,2],[12,1], [9,1],[7,1],[4,1], [7,5],[-1,1],
  /* Buy me some peanuts and Cracker Jack (the G sharp is real) */
  [9,1],[8,1],[9,1], [4,1],[5,1],[7,1], [9,2],[5,1], [2,3],
  /* I don't care if I never get back, let me */
  [9,2],[9,1], [9,1],[11,1],[12,1], [14,1],[11,1],[9,1], [7,2],[4,.5],[2,.5],
  /* root, root, root for the home team (the opening leap again) */
  [0,2],[12,1], [9,1],[7,1],[4,1], [7,3], [2,2],
  /* If they don't win it's a shame. For it's */
  [2,1], [0,2],[2,1], [4,1],[5,1],[7,1], [9,5],[9,.5],[11,.5],
  /* one, two, three strikes you're out at the old ball game */
  [12,3],[12,3], [12,1],[11,1],[9,1], [7,1],[6,1],[7,1], [9,3],[11,3],[12,5],[-1,1]
];
const BEAT=.4;
let musicOn=false,musicT=null,musicOsc=[];
function playSong(){
  if(!musicOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    let t=AC.currentTime+.08,total=0;
    musicOsc=[];
    SONG.forEach(n=>{
      const dur=n[1]*BEAT;
      if(n[0]>=0){
        const o=AC.createOscillator(),g=AC.createGain();
        o.type="triangle";
        o.frequency.value=261.63*Math.pow(2,n[0]/12);
        g.gain.setValueAtTime(.09,t+total);
        g.gain.exponentialRampToValueAtTime(.001,t+total+dur*.9);
        o.connect(g).connect(AC.destination);
        o.start(t+total);o.stop(t+total+dur*.92);
        musicOsc.push(o);
      }
      total+=dur;
    });
    musicT=setTimeout(playSong,(total+.8)*1000);
  }catch(e){}
}
function setMusic(on){
  musicOn=on;
  el("musicBtn").setAttribute("aria-pressed",String(on));
  if(on)playSong();
  else{
    clearTimeout(musicT);
    musicOsc.forEach(o=>{try{o.stop()}catch(e){}});
    musicOsc=[];
  }
}

/* ================= drawing ================= */
function drawFielders(tappable){
  const g=el("fielders");g.innerHTML="";
  for(const k in POS){
    const p=POS[k];
    g.insertAdjacentHTML("beforeend",
      /* Every fielder is drawn at the origin and PLACED by a transform, so
         moving one is a transform change a CSS transition can animate. The
         ball has always worked this way; the players do now too, which is
         what lets the Where To Go mode walk them to their spots. */
      `<g class="fielder${tappable?" tappable":""}" id="pos-${k}" data-pos="${k}" style="transform:translate(${p.x}px,${p.y}px)"`+
      (tappable?` tabindex="0" role="button" aria-label="${p.n}"`:` pointer-events="none"`)+`>`+
      `<circle cx="0" cy="0" r="24" fill="transparent"/>`+
      `<circle class="ping" cx="0" cy="0" r="20"/>`+
      `<circle class="body" cx="0" cy="0" r="14" fill="var(--ink)" opacity=".85"/>`+
      `<text class="poslbl" x="0" y="4.5" text-anchor="middle">${p.s}</text></g>`);
  }
  if(tappable)g.querySelectorAll(".fielder").forEach(n=>{
    n.addEventListener("click",()=>answer(n.dataset.pos));
    n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();answer(n.dataset.pos);}});
  });
}
/* The pitcher's circle as somewhere to throw. It is already painted on the
   field at 200,352, so the target sits exactly on the dirt a kid can see,
   and it only exists where the Look Back rule does. */
function drawCircle(on){
  const g=el("circleT");g.innerHTML="";
  if(!on)return;
  g.insertAdjacentHTML("beforeend",
    `<g class="circleTgt" id="base-CIRCLE" data-base="CIRCLE" tabindex="0" role="button" aria-label="Throw it to the pitcher in the circle">`+
    /* an explicitly filled disc IS the hit area. The ring and the ping are
       both fill:none, and an SVG shape with no fill takes no taps, which is
       why the fielders carry a transparent circle too. */
    `<circle cx="200" cy="352" r="30" fill="transparent"/>`+
    `<circle class="ping" cx="200" cy="352" r="30"/>`+
    `<circle class="ring" cx="200" cy="352" r="26" fill="none" stroke="var(--chalk)" stroke-width="3"/>`+
    `<text class="baselbl" x="200" y="391" text-anchor="middle">CIRCLE</text></g>`);
  const n=g.querySelector(".circleTgt");
  n.addEventListener("click",()=>answer("CIRCLE"));
  n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();answer("CIRCLE");}});
}
function drawBases(){
  const g=el("bases");g.innerHTML="";
  for(const k in BASE_XY){
    const b=BASE_XY[k];
    g.insertAdjacentHTML("beforeend",
      `<g class="base" id="base-${k}" data-base="${k}" tabindex="0" role="button" aria-label="${b.label} base">`+
      `<circle class="ping" cx="${b.x}" cy="${b.y}" r="27"/>`+
      /* the rotation lives on a wrapper group so the pulse animation's CSS
         scale on the rect can never override it */
      `<g transform="rotate(45 ${b.x} ${b.y})"><rect x="${b.x-18}" y="${b.y-18}" width="36" height="36" rx="6" fill="var(--chalk)" stroke="#1C3529" stroke-width="3"/></g>`+
      `<text class="baselbl" x="${b.x}" y="${b.y+40}" text-anchor="middle">${b.label}</text></g>`);
  }
  g.querySelectorAll(".base").forEach(n=>{
    n.addEventListener("click",()=>answer(n.dataset.base));
    n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();answer(n.dataset.base);}});
  });
}
function setBasePulse(on){
  document.querySelectorAll(".base").forEach(b=>b.classList.toggle("pulse",on));
  const ct=document.querySelector(".circleTgt");
  if(ct)ct.classList.toggle("pulse",on);
  const hc=el("holdChip");
  hc.classList.toggle("pulse",on&&!hc.hidden);
}
function setFielderPulse(on){
  document.querySelectorAll(".fielder").forEach(f=>f.classList.toggle("pulse",on));
}
/* a runner is a little player mid stride, white jersey, gold belt, gold
   batting helmet with a brim and an ear flap, bobbing on their bag. The bob
   lives on an inner group so it can never override the outer translate. */
function runnerSprite(x,y,i){
  return `<g transform="translate(${x} ${y-26})" pointer-events="none">`+
    `<g class="runnerbob" style="animation-delay:${(i||0)*.25}s">`+
    `<path d="M-3 9 L-8 19 M3 9 L8 17" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" fill="none"/>`+
    `<path d="M-8 1 L-13 8 M8 1 L13 6" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" fill="none"/>`+
    `<rect x="-8" y="-4" width="16" height="16" rx="6" fill="var(--chalk)" stroke="var(--ink)" stroke-width="2.5"/>`+
    `<rect x="-6" y="7" width="12" height="3" rx="1.5" fill="var(--sun)"/>`+
    `<circle cx="0" cy="-12" r="8" fill="var(--ink)"/>`+
    `<path d="M-8.5 -13 A8.5 8.5 0 0 1 8.5 -13 L8.5 -10.5 L-8.5 -10.5 Z" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/>`+
    `<rect x="4" y="-13.5" width="9.5" height="4" rx="2" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/>`+
    `<circle cx="-5.5" cy="-9.5" r="2.8" fill="var(--sun)" stroke="var(--ink)" stroke-width="1.6"/>`+
  `</g></g>`;
}
function drawRunners(list){
  const g=el("runners");g.innerHTML="";
  (list||[]).forEach((r,i)=>{
    const b=BASE_XY["B"+r];
    g.insertAdjacentHTML("beforeend",runnerSprite(b.x,b.y,i));
  });
}
let thumpT=null;
function moveBall(x,y){
  el("ballG").style.transform=`translate(${x}px,${y}px)`;
  const s=el("ballSkin");
  s.classList.remove("thump");
  clearTimeout(thumpT);
  thumpT=setTimeout(()=>s.classList.add("thump"),560);
}
function paintBallSkin(){
  el("ballC").setAttribute("fill",cfg().ballFill);
  el("ballC").setAttribute("stroke",cfg().ballStroke);
  el("tabBallIco").textContent=cfg().icon;
}

/* ================= scoreboard ================= */
function bulbs(node,count,total,red){
  node.innerHTML="";
  for(let i=0;i<total;i++)
    node.insertAdjacentHTML("beforeend",`<span class="bulb ${i<count?"on":""} ${red?"red":""}"></span>`);
}
function paintBoard(){
  bulbs(el("bBalls"),S.balls,cfg().ballsForWalk-1,false);
  bulbs(el("bStrikes"),S.strikes,cfg().strikesForOut-1,false);
  bulbs(el("bOuts"),S.outs,2,true);
}
let lastStreak=0;
function paintStreak(){
  const p=el("streak");
  p.textContent=S.round?`⭐ ${S.streak} · ${S.round.n}/${S.round.total}`:`⭐ ${S.streak}`;
  if(S.streak>lastStreak){p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop");}
  lastStreak=S.streak;
}

/* ================= confetti ================= */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const colors=["#FFCE3B","#2FBF66","#6FC3EA","#F45B5B","#FFF"];
  for(let i=0;i<18;i++){

/* ================= THE COUNT ================= */
function countScreen(msg){
  S.scenario=null;S.answered=false;
  el("roundBtn").hidden=true;
  const hc=el("holdChip");hc.hidden=true;hc.classList.remove("hit","miss");
  setBasePulse(false);setFielderPulse(false);
  el("ask").innerHTML = msg || `<span class="tag">Pitch by pitch</span>Tap a pitch! <b>${cfg().strikesForOut} strikes</b> and the batter is out.`;
  drawRunners([]);moveBall(200,352);
  const a=el("answers");
  a.className="answers";
  a.innerHTML=
    `<button class="btn" data-p="ball">Ball</button>`+
    `<button class="btn" data-p="strike">Strike</button>`+
    `<button class="btn" data-p="foul">Foul ball</button>`+
    `<button class="btn ghost" data-p="reset">New batter</button>`;
  a.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>pitch(b.dataset.p)));
  el("hint").textContent="";
  el("hint").className="hint";
  paintBoard();
}
function pitch(kind){
  const c=cfg();let msg="";sfx("tap");
  if(kind==="reset"){S.balls=0;S.strikes=0;countScreen(`<span class="tag">New batter</span>Fresh count: <b>0 and 0</b>. Play ball!`);return;}
  if(kind==="ball"){
    S.balls++;
    if(S.balls>=c.ballsForWalk){
      S.balls=0;S.strikes=0;
      msg=`<b>Ball ${c.ballsForWalk}! That's a walk.</b> The batter gets first base for free. Fresh count!`;
      confetti();
    } else msg=`Ball ${S.balls}! The count is <b>${S.balls} and ${S.strikes}</b>.`+fullCountNote();
  }
  if(kind==="strike"){
    S.strikes++;
    if(S.strikes>=c.strikesForOut){
      S.balls=0;S.strikes=0;S.outs=Math.min(3,S.outs+1);
      msg=`<b>Strike ${c.strikesForOut}! The batter is out.</b>`+
        (S.outs>=3?" That's 3 outs! Inning over. Switch sides!":` That's out number ${S.outs}.`)+
        (c.steals?" Catcher dropped it? First base open, or 2 outs? <b>Run to first!</b>":"");
      if(S.outs>=3)S.outs=0;
    } else msg=`Strike ${S.strikes}! The count is <b>${S.balls} and ${S.strikes}</b>.`+fullCountNote();
  }
  if(kind==="foul"){
    if(S.strikes<c.strikesForOut-1){
      S.strikes++;
      msg=`A foul is a strike! The count is <b>${S.balls} and ${S.strikes}</b>.`;
    } else {
      msg=`<b>Foul ball! The count stays ${S.balls} and ${S.strikes}.</b> A foul is never the last strike. Keep swinging!`;
    }
  }
  paintBoard();
  el("ask").innerHTML=msg;
}
function fullCountNote(){
  return (S.balls===cfg().ballsForWalk-1&&S.strikes===cfg().strikesForOut-1)
    ?" That's a <b>full count</b>! Next pitch decides it!":"";
}

/* ================= THE PLAY (ground balls) ================= */
/* weighted toward the teachable states: runner on first, bases loaded */
const RUNNER_POOL=[[],[1],[1],[2],[3],[1,2],[1,2],[1,3],[2,3],[1,2,3],[1,2,3]];
const INFIELD=[1,3,4,5,6];
const NAMES={1:"first",2:"second",3:"third"};

function runnerWords(r){
  if(r.length===0)return"Nobody on base";
  if(r.length===3)return"Bases loaded";
  if(r.length===2)return`Runners on ${NAMES[r[0]]} and ${NAMES[r[1]]}`;
  return`Runner on ${NAMES[r[0]]}`;
}
function forces(r){
  const has=n=>r.includes(n);
  return{B1:true,B2:has(1),B3:has(1)&&has(2),HOME:has(1)&&has(2)&&has(3)};
}
/* dead ball smarts: sometimes the right play is NO play */
const SMART_BANK=[
  {kind:"base",runners:[1,3],outs:1,ballAt:POS[6],correct:"HOLD",alt:[],chip:"Smart ball",
   prompt:`<span class="tag">Base hit!</span>Runners stopped on first and third. You have the ball at <b>shortstop</b>. What now?`,
   why:"Nobody is running, so there is <b>no play</b>! Hold it.",
   tip:"Walk it in. Wild throws give free bases."},
  {kind:"base",runners:[2],outs:0,ballAt:POS[4],correct:"HOLD",alt:[],chip:"Smart ball",
   prompt:`<span class="tag">Double!</span>The runner slides into second, <b>safe</b>! The ball comes to you at the bag.`,
   why:"The runner is safe on the bag. <b>No play</b>! Hold it.",
   tip:"A wild throw here means a free run."}
];
let lastGround="";
function makeGroundBall(){
  if(Math.random()<.22){
    const s={...SMART_BANK[Math.floor(Math.random()*SMART_BANK.length)]};
    if(s.prompt!==lastGround){lastGround=s.prompt;s.ballAt={x:s.ballAt.x,y:s.ballAt.y};return s;}
  }
  let runners,outs,pos,key;
  do{
    runners=RUNNER_POOL[Math.floor(Math.random()*RUNNER_POOL.length)];
    outs=Math.floor(Math.random()*3);
    pos=INFIELD[Math.floor(Math.random()*INFIELD.length)];
    key=runners.join(",")+"|"+outs+"|"+pos;
  }while(key===lastGround);
  lastGround=key;
  const f=forces(runners);
  const lead=f.HOME?"HOME":f.B3?"B3":f.B2?"B2":"B1";
  const forcedOthers=["B1","B2","B3","HOME"].filter(b=>f[b]&&b!==lead);
  let correct=lead,alt=[],okay=null,tip="",why,chip="Force play";
  if(lead==="B1"){
    if(runners.includes(2)&&runners.includes(3)&&outs<2){
      /* Stephen's power play: nobody is forced, so eat the ball, give the
         batter first, and now every base is a force, even home */
      correct="HOLD";chip="Power play";
      why="Nobody has to run! <b>Hold it.</b> Batter gets first. Now everybody must run!";
      tip="Even home is a force!";
      okay={B1:"A real out! But <b>hold it</b>. The batter takes first, then everybody must run!"};
    } else {
      why=runners.length===0
        ?"The batter is the only runner. Throw to first. Easy out!"
        :`First base is <b>empty</b>! Nobody has to run. Take the out at first.`;
      chip=runners.length===0?"Sure out":"No force";
      if(outs===2&&runners.length)tip="That out ends the inning!";
    }
  } else if(lead==="B2"){
    why="Runner on first <b>has to run</b>! Step on second, no tag. Then first!";
    tip="";
  } else if(lead==="B3"){
    why="Someone is behind them, so they <b>have to run</b>! Touch third, no tag!";
    tip="";
  } else {
    why="Bases loaded! <b>Everybody has to run</b>, even from third. Step on home. No tag!";
    tip="";
  }
  if(lead!=="B1"){
    if(outs===2){
      alt=forcedOthers;
      why+=" <b>2 outs</b>? Any force ends the inning!";
    } else {
      /* a force out at another bag is a real out, just not the best one */
      okay={};
      forcedOthers.forEach(b=>okay[b]=lead==="HOME"
        ?"A real out! But the run scored. <b>Stop the run</b> when you can!"
        :"A real out! But the <b>lead runner</b> is the big prize. Look ahead!");
    }
  }
  const p=POS[pos];
  return{kind:"base",runners,outs,ballAt:{x:p.x,y:p.y},
    prompt:`<span class="tag">Ground ball!</span>You're the <b>${p.n}</b>! ${runnerWords(runners)}, <b>${outs} out${outs===1?"":"s"}</b>. Now what?`,
    correct,alt,okay,tip,why,chip};
}

/* Fisher-Yates. Authoring puts the right answer first because that reads
   well in the source; the child must never see that order. */
function shuffled(a){
  const c=a.slice();
  for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}
  return c;
}

/* Draw without replacement. Avoiding only the previous question meant a
   bank of six repeated inside a handful of taps, and the three question
   runner bank just alternated. A bag is dealt out in a shuffled order and
   only refilled once it is empty, so every scenario appears once before
   any appears twice. The bag is keyed by name and by league, because
   changing level changes which questions are legal to draw. */
const bags={};
function drawFrom(name,list){
  if(!list.length) return null;
  const key=name+"|"+S.sport+"|"+list.length;
  let bag=bags[key];
  if(!bag||!bag.length){
    bag=shuffled(list.map((_,i)=>i));
    /* do not open a fresh bag with the card that just closed the last one */
    if(bag.length>1&&list[bag[0]].prompt===bags[key+":last"])bag.push(bag.shift());
    bags[key]=bag;
  }
  const pick=list[bag.shift()];
  bags[key+":last"]=pick.prompt;
  return pick;
}

/* A scenario may name the league rule it depends on. Anything without a
   `needs` is universal. This is the same promise the runner IQ bank makes:
   a kid is never quizzed on a rule her league does not play. */
function allowed(s){ return !s.needs || !!cfg()[s.needs]; }
function flyBank(){ return FLY_BANK.filter(allowed); }

function makeFlyBall(){
  const s={...drawFrom("fly",flyBank())};
  s.ballAt={x:s.ballAt.x,y:s.ballAt.y};
  return s;
}

/* ================= quiz flow ================= */
function loadScenario(){
  S.answered=false;S.missedThis=false;
  el("hint").className="hint";
  el("roundBtn").hidden=!!S.round;
  el("overlay").classList.add("hidden");
  const s=S.mode==="play"?makeGroundBall()
    :S.mode==="fly"?makeFlyBall()
    :S.mode==="pos"?makePosition()
    :pick(scenarioMakers())();
  S.scenario=s;
  S.outs=s.outs;S.balls=0;S.strikes=0;
  paintBoard();drawRunners(s.runners);
  el("ask").innerHTML=s.prompt;
  moveBall(200,352);
  setTimeout(()=>moveBall(s.ballAt.x,s.ballAt.y),80);
  document.querySelectorAll(".base").forEach(b=>b.classList.remove("hit","miss"));
  document.querySelectorAll(".fielder").forEach(f=>f.classList.remove("hit","miss"));
  const a=el("answers"),hc=el("holdChip");
  hc.classList.remove("hit","miss");
  a.className="answers one";
  if(s.kind==="base"){
    hc.hidden=false;
    drawCircle(!!cfg().circle);
    setBasePulse(true);setFielderPulse(false);
    a.innerHTML="";
    el("hint").textContent=cfg().circle?"👆 Tap a base or the circle!":"👆 Tap a base, or hold the ball!";
  } else if(s.kind==="pos"){
    hc.hidden=true;
    drawCircle(false);
    setBasePulse(false);setFielderPulse(true);
    a.innerHTML="";
    el("hint").textContent="👆 Tap a player on the field!";
  } else {
    hc.hidden=true;
    drawCircle(false);
    setBasePulse(false);setFielderPulse(false);
    a.innerHTML=shuffled(s.choices).map(c=>`<button class="btn" data-c="${c[0]}">${c[1]}</button>`).join("");
    a.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.c)));
    el("hint").textContent="";
  }
}
function answer(choice){
  /* the Move room is a sandbox: it takes its own taps and never grades */
  if(S.mode==="move"){mvTap(choice);return;}
  const s=S.scenario;
  if(!s||S.answered)return;
  /* only the answer type this scenario asks for counts */
  const isBase=choice==="HOLD"||choice==="CIRCLE"||!!BASE_XY[choice];
  const isPos=!!POS[choice];
  if(s.kind==="base"&&!isBase)return;
  if(s.kind==="pos"&&!isPos)return;
  if(s.kind==="choice"&&(isBase||isPos))return;
  const ok=(choice===s.correct)||(s.alt||[]).includes(choice);
  const okayMsg=!ok&&s.okay?s.okay[choice]:null;
  if(!ok&&!okayMsg){
    /* a miss does not end the play: flash it, break the streak, try again.
       The right answer is never given away; finding it is the learning. */
    sfx("bad");S.streak=0;S.missedThis=true;paintStreak();
    if(s.kind==="choice"){
      const b=el("answers").querySelector(`[data-c="${choice}"]`);
      if(b){b.disabled=true;b.classList.add("wrong");
        setTimeout(()=>{b.classList.remove("wrong");b.classList.add("dim");},650);}
    } else {
      const n=choice==="HOLD"?el("holdChip"):el((s.kind==="pos"?"pos-":"base-")+choice);
      /* base-CIRCLE is drawn in its own layer but answers to the same id */
      if(n){n.classList.add("miss");
        setTimeout(()=>n.classList.remove("miss"),650);}
    }
    const hint=el("hint");
    hint.textContent="❌ Not quite! Try again.";
    hint.className="hint no";
    return;
  }
  S.answered=true;setBasePulse(false);setFielderPulse(false);
  if(s.kind==="base"){
    if(choice==="HOLD")el("holdChip").classList.add("hit");
    else{
      const n=el("base-"+choice),b=BASE_XY[choice]||(choice==="CIRCLE"?{x:200,y:352}:null);
      if(n)n.classList.add("hit");
      if(b)moveBall(b.x,b.y);
    }
  }
  if(s.kind==="pos"){

/* ══════════════════════════════════════════════════════════════════════════
   EVERYBODY MOVES

   Stephen's coach, 2026-08-28: "Right now we're dealing with little girls who
   think if the ball isn't hit right to them they don't have to do anything
   and it costs us plays and outs and runs." So this room is not a quiz. No
   score, no streak, no verdict, nothing right and nothing wrong. Set the
   runners, tap where the ball is hit, watch all nine walk to where they
   belong, read one short line, tap again.

   Every assignment below traces to a published coaching line, cross checked
   between two independent researchers; the sources and the disagreement
   table live in docs/DIAMOND-RULES-MOVE-SOURCES.md. Nothing here is
   remembered. Where the sources genuinely disagreed, the resolution is
   recorded in that file rather than smoothed away, and anything neither
   could source was cut rather than guessed.
   ══════════════════════════════════════════════════════════════════════════ */

/* ---- the responsibility matrix. Zone, then base state, then all nine.
   Jobs: ball   play it              crash  converge on a bunt
         middle you two call it      chase  sprint in behind the infielder
         buddy  run to your teammate behind get behind the girl fielding it
         step   one step to the ball cover  stand on the bag
         backin just behind the bag  backup 52 units beyond it, in line
         cut    on the line between the ball and the base
         halfway the fixed spot between the mound and second
   INFIELD ROWS ARE RUNNER INDEPENDENT ON PURPOSE: in every source, where the
   nine go on an infield grounder does not change with the base state. What
   changes is where the ball gets thrown, and forces() already knows that. */
const MV_TABLE = {
 P:{any:{1:["ball"],2:["cover","HOME"],3:["cover","B1"],4:["backin","B2"],5:["cover","B3"],
         6:["cover","B2"],7:["backup","B3"],8:["backup","B2"],9:["backup","B1"]}},
 /* the play the coach asked for: pitcher covers, second baseman runs to
    first and backs her up, shortstop takes second. His own sentence. */
 "1B":{any:{3:["ball"],1:["cover","B1"],4:["backin","B1"],6:["cover","B2"],5:["cover","B3"],
            2:["cover","HOME"],9:["chase"],8:["backup","B2"],7:["backup","B3"]}},
 "2B":{any:{4:["ball"],3:["cover","B1"],1:["backin","B1"],6:["cover","B2"],5:["cover","B3"],
            2:["cover","HOME"],9:["chase"],8:["backup","B2"],7:["backup","B3"]}},
 MIDDLE:{any:{6:["middle"],4:["middle"],1:["step"],3:["cover","B1"],5:["cover","B3"],
              2:["cover","HOME"],8:["chase"],7:["backup","B3"],9:["backup","B1"]}},
 SS:{any:{6:["ball"],4:["cover","B2"],3:["cover","B1"],5:["cover","B3"],1:["backin","B3"],
          2:["cover","HOME"],7:["chase"],8:["backup","B2"],9:["backup","B1"]}},
 "3B":{any:{5:["ball"],1:["cover","B3"],6:["behind"],4:["cover","B2"],3:["cover","B1"],
            2:["cover","HOME"],7:["chase"],8:["backup","B2"],9:["backup","B1"]}},
 BUNT:{
  crash:{1:["crash"],2:["crash"],3:["crash"],5:["crash"],4:["cover","B1"],6:["cover","B2"],
         7:["cover","B3"],8:["backup","B2"],9:["backup","B1"]},
  hold3:{1:["crash"],2:["crash"],3:["crash"],5:["cover","B3"],4:["cover","B1"],6:["cover","B2"],
         7:["backup","B3"],8:["backup","B2"],9:["backup","B1"]},
  home: {1:["crash"],3:["crash"],5:["crash"],2:["cover","HOME"],4:["cover","B1"],6:["cover","B3"],
         8:["cover","B2"],7:["backup","B3"],9:["backup","B1"]}},
 LF:{
  empty:  {7:["ball"],8:["buddy"],6:["cut","B2"],4:["cover","B2"],3:["cover","B1"],
           5:["cover","B3"],9:["backup","B2"],1:["halfway"],2:["cover","HOME"]},
  r1:     {7:["ball"],8:["buddy"],6:["cut","B3"],5:["cover","B3"],4:["cover","B2"],
           3:["cover","B1"],9:["backup","B2"],1:["backup","B3"],2:["cover","HOME"]},
  scoring:{7:["ball"],8:["buddy"],5:["cut","HOME"],6:["cover","B3"],4:["cover","B2"],
           3:["cover","B1"],9:["backup","B1"],1:["backup","HOME"],2:["cover","HOME"]}},
 CF:{
  empty:  {8:["ball"],7:["buddy"],9:["buddy"],6:["cut","B2"],4:["cover","B2"],
           3:["cover","B1"],5:["cover","B3"],1:["halfway"],2:["cover","HOME"]},
  r1:     {8:["ball"],7:["buddy"],9:["buddy"],6:["cut","B3"],5:["cover","B3"],
           4:["cover","B2"],3:["cover","B1"],1:["backup","B3"],2:["cover","HOME"]},
  scoring:{8:["ball"],7:["buddy"],9:["buddy"],3:["cut","HOME"],4:["cover","B1"],
           6:["cover","B2"],5:["cover","B3"],1:["backup","HOME"],2:["cover","HOME"]}},
 RF:{
  empty:  {9:["ball"],8:["buddy"],4:["cut","B2"],6:["cover","B2"],3:["cover","B1"],
           5:["cover","B3"],7:["backup","B2"],1:["halfway"],2:["cover","HOME"]},
  r1:     {9:["ball"],8:["buddy"],6:["cut","B3"],5:["cover","B3"],4:["cover","B2"],
           3:["cover","B1"],7:["backup","B3"],1:["backup","B3"],2:["cover","HOME"]},
  scoring:{9:["ball"],8:["buddy"],3:["cut","HOME"],4:["cover","B1"],6:["cover","B2"],
           5:["cover","B3"],7:["backup","B3"],1:["backup","HOME"],2:["cover","HOME"]}}
};
/* the outfield sheets group the base states exactly this way: "Runner at 1st
   OR 1st & 3rd" is one page, "2nd, 1st and 2nd, or Bases Loaded" is another */
const mvOfState  = r => r.indexOf(2)>=0 ? "scoring"
                      : r.indexOf(1)>=0 ? "r1"
                      : r.indexOf(3)>=0 ? "scoring" : "empty";
/* the bunt sheet's own three headings */
const mvBuntState= r => r.indexOf(3)>=0 ? "home"
                      : r.indexOf(2)>=0 ? "hold3" : "crash";

/* ---- the geometry. Home to first is 118*sqrt(2) = 166.88 units and 60 real
   feet, so a unit is 0.36 ft in the infield. The OUTFIELD is drawn about 1.4
   times short, so never turn an outfield length back into feet. */
const MV_HALFWAY={x:200,y:288};
const MV_COVER=30,MV_BACKIN=30,
      MV_BACKOUT=52,  /* 18.7 ft beyond the bag. The only distance here
                         anchored to a source: Baseball Positive wants 20 to
                         25 feet, and 52 is the most this drawing holds. */
      MV_CHASE=78,MV_BUDDY=46,MV_BEHIND=38,MV_CRASH=40,MV_STEP=40,
      MV_CUTF=.45,MV_ATBALL=14,MV_SEP=34;
const MV_BOX={x0:26,x1:374,y0:140,y1:512};
const mvD=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
const mvU=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;return{x:dx/d,y:dy/d};};
const mvGo=(p,v,n)=>({x:p.x+v.x*n,y:p.y+v.y*n});
/* the chalk lines are exactly x+y=660 and y-x=260. A tap in the stands is
   projected onto the nearer line so the ball lands ON the foul line instead
   of nothing happening, which teaches the lines by feel. */
function mvFair(x,y){
  if(x+y>660){const k=(x-y+660)/2;x=k;y=660-k;}
  if(y-x>260){const k=(x+y-260)/2;x=k;y=k+260;}
  y=Math.max(145,Math.min(500,y));x=Math.max(30,Math.min(370,x));
  if(x+y>660){const k=(x-y+660)/2;x=k;y=660-k;}
  if(y-x>260){const k=(x+y-260)/2;x=k;y=k+260;}
  return{x:x,y:y};
}
/* the dirt arc Q200 176 fits a circle at (200,425) r 163.5 to within 2.71
   units, one real foot, so use the circle and skip isPointInPath */
const mvOnDirt=p=>((p.x-200)*(p.x-200)+(p.y-425)*(p.y-425))<26732.25;
const MV_IN=["1","3","5","6","4"],MV_OUT=["7","8","9"];
function mvNearest(p,ids){let k=ids[0],d=Infinity;
  for(let i=0;i<ids.length;i++){const t=mvD(p,POS[ids[i]]);if(t<d){d=t;k=ids[i];}}return k;}
function mvZone(rawX,rawY,forced){
  const ball=mvFair(rawX,rawY);
  let by,where,bunt;
  if(forced){ by=forced; where=MV_OUT.indexOf(forced)>=0?"grass":"dirt";
              bunt=where==="dirt"&&mvD(ball,BASE_XY.HOME)<90; }
  else{ const dirt=mvOnDirt(ball);
        where=dirt?"dirt":"grass";
        bunt=dirt&&mvD(ball,BASE_XY.HOME)<90;
        by=dirt?mvNearest(ball,bunt?["1","2","3","5"]:MV_IN):mvNearest(ball,MV_OUT); }
  const key=bunt?"BUNT":where==="grass"?(by==="7"?"LF":by==="8"?"CF":"RF")
    :((by==="4"||by==="6")&&Math.abs(ball.x-200)<30)?"MIDDLE"
    :by==="1"?"P":by==="3"?"1B":by==="4"?"2B":by==="5"?"3B":"SS";
  return{ball:ball,by:by,where:where,bunt:bunt,key:key};
}
function mvStateFor(key,r){
  return key==="BUNT"?mvBuntState(r)
    :(key==="LF"||key==="CF"||key==="RF")?mvOfState(r):"any";
}
function mvPlan(z,runners){
  const st=mvStateFor(z.key,runners),row=MV_TABLE[z.key][st],b=z.ball,B=BASE_XY,J={};
  let F=z.by;
  /* the bunt crew shrinks as runners advance, so the girl nearest the ball
     may no longer be charging. Whoever is closest AND still charging has it. */
  if(z.key==="BUNT"){
    const crew=Object.keys(row).filter(k=>row[k][0]==="crash");
    if(crew.indexOf(F)<0)F=mvNearest(b,crew);
  }
  for(const k in row){
    const a=row[k][0],t=row[k][1],T=t?B[t]:null;let p,role=a,tgt=t||null;
    if(a==="middle"){
      if(k===F){p=mvGo(b,mvU(b,POS[k]),MV_ATBALL);role="ball";}
      else{p=mvGo(B.B2,mvU(B.B2,b),MV_COVER);role="cover";tgt="B2";}
    }
    else if(a==="crash"&&k===F){p=mvGo(b,mvU(b,POS[k]),MV_ATBALL);role="ball";}
    else if(a==="crash")p=mvGo(b,mvU(b,POS[k]),MV_CRASH);
    else if(a==="ball")  p=mvGo(b,mvU(b,POS[k]),MV_ATBALL);
    else if(a==="cover") p=mvGo(T,mvU(T,b),MV_COVER);
    else if(a==="backup")p=mvGo(T,mvU(b,T),MV_BACKOUT);
    else if(a==="backin")p=mvGo(T,mvU(b,T),MV_BACKIN);
    else if(a==="cut")   p={x:b.x+(T.x-b.x)*MV_CUTF,y:b.y+(T.y-b.y)*MV_CUTF};
    else if(a==="chase") p=mvGo(b,mvU(BASE_XY.HOME,b),MV_CHASE);
    else if(a==="buddy") p=mvGo(b,mvU(b,POS[k]),MV_BUDDY);
    else if(a==="behind")p=mvGo(b,mvU(BASE_XY.HOME,b),MV_BEHIND);
    else if(a==="step")  p=mvGo(POS[1],mvU(POS[1],b),MV_STEP);
    else { p={x:MV_HALFWAY.x,y:MV_HALFWAY.y}; tgt="B2"; role="backup"; }
    J[k]={role:role,x:p.x,y:p.y,target:tgt};
  }
  z.by=F;z.state=st;
  return mvSeparate(J,F);
}
/* Three girls converge on first base and their discs stack, because on this
   drawing the bag, the first baseman's spot and the ball are all inside 50
   units. Push them apart, pin whoever is playing the ball, clamp back into
   the camera box. Eight passes settles it. */
function mvSeparate(J,pinned){
  const ks=Object.keys(J);
  for(let pass=0;pass<8;pass++){
    for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){
      const a=J[ks[i]],c=J[ks[j]];
      let dx=c.x-a.x,dy=c.y-a.y,L=Math.hypot(dx,dy);
      if(L>=MV_SEP)continue;
      if(L<.01){dx=(i%2)?1:.5;dy=(i%2)?.5:-1;L=Math.hypot(dx,dy);}
      const push=(MV_SEP-L)/L+.001;
      const wa=ks[i]===pinned?0:(ks[j]===pinned?1:.5),
            wb=ks[j]===pinned?0:(ks[i]===pinned?1:.5);
      a.x-=dx*push*wa;a.y-=dy*push*wa;c.x+=dx*push*wb;c.y+=dy*push*wb;
    }
    for(const k of ks){J[k].x=Math.min(MV_BOX.x1,Math.max(MV_BOX.x0,J[k].x));
                       J[k].y=Math.min(MV_BOX.y1,Math.max(MV_BOX.y0,J[k].y));}
  }
  return J;
}

/* ---- the words. One line naming who has it, one naming the two jobs an
   eight year old actually misses. Nothing else gets words. */
const MV_SHORT={1:"Pitcher",2:"Catcher",3:"First base",4:"Second base",5:"Third base",
                6:"Shortstop",7:"Left field",8:"Center field",9:"Right field"};
const MV_LINE2={
 "P.any":      "Shortstop takes second. Second base backs her up.",
 "1B.any":     "Pitcher covers first! Second base backs her up.",
 "2B.any":     "Pitcher runs to first. Shortstop takes second.",
 "MIDDLE.any": "Both middles go. The other one takes second.",
 "SS.any":     "Second base takes second. Pitcher backs up third.",
 "3B.any":     "Pitcher covers third. Shortstop gets behind her.",
 "BUNT.crash": "Second base covers first. Left field takes third!",
 "BUNT.hold3": "Third base stays on the bag. Force is there.",
 "BUNT.home":  "Catcher stays home. Center field covers second!",
 "LF.empty":   "Shortstop is the cutoff. Pitcher heads toward second.",
 "LF.r1":      "Shortstop is the cutoff to third. Pitcher backs it up.",
 "LF.scoring": "Third base is the cutoff home. Shortstop takes third.",
 "CF.empty":   "Shortstop is the cutoff. Left and right run over.",
 "CF.r1":      "Shortstop is the cutoff to third. Pitcher backs it up.",
 "CF.scoring": "First base is the cutoff home. Second base takes first.",
 "RF.empty":   "Second base is the cutoff. Shortstop takes second.",
 "RF.r1":      "Shortstop is the cutoff to third. Pitcher backs it up.",
 "RF.scoring": "First base is the cutoff home. Second base takes first."
};
const MV_BAG={B1:"first base",B2:"second base",B3:"third base",HOME:"home"};
const MV_SAY={ball:"Go get it!",crash:"Charge it! Call it!",chase:"Sprint in behind her.",
  buddy:"Run behind your teammate.",behind:"Get behind her.",step:"Step toward the ball.",
  cut:"Line up the cut!",
  cover:t=>"Cover "+MV_BAG[t]+".", backin:t=>"Back up "+MV_BAG[t]+".",
  backup:t=>"Back up "+MV_BAG[t]+"."};

const MV={runners:[],last:null,busy:false,plan:null,zone:null};
const MV_WALK=2200;                       /* the coach's "very slow"       */
const MV_W={ball:150,cover:400,back:650}; /* Ball, then Base, then Back-up */
const mvReduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const MV_ROLECLASS={ball:"r-ball",crash:"r-ball",cover:"r-cover",cut:"r-cover",
  chase:"r-ball",buddy:"r-back",behind:"r-back",step:"r-ball",backup:"r-back",backin:"r-back"};
const MV_WAVE={ball:"ball",crash:"ball",chase:"ball",step:"ball",
  cover:"cover",cut:"cover",backup:"back",backin:"back",buddy:"back",behind:"back"};

function mvPoint(ev){
  const svg=el("dia"),pt=svg.createSVGPoint();
  pt.x=ev.clientX;pt.y=ev.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  return{x:p.x,y:p.y};
}
/* an empty bag wears a faded runner. That is the entire runner control. */
function mvDrawRunners(){
  let h="";
  [1,2,3].forEach((n,i)=>{
    const b=BASE_XY["B"+n];
    h+=MV.runners.indexOf(n)>=0?runnerSprite(b.x,b.y,i)
      :`<g class="ghost">${runnerSprite(b.x,b.y,i)}</g>`;
  });
  el("runners").innerHTML=h;
}
function mvTrail(from,to,role,delay){
  const len=Math.hypot(to.x-from.x,to.y-from.y);
  if(len<8)return;
  const col=role==="ball"?"var(--sun)":role==="cover"?"var(--safe)":"var(--backup)";
  el("trails").insertAdjacentHTML("beforeend",
    `<line class="trail${role==="back"?" back":""}" x1="${from.x}" y1="${from.y}" `+
    `x2="${to.x.toFixed(1)}" y2="${to.y.toFixed(1)}" stroke="${col}" `+
    `stroke-dasharray="${len.toFixed(1)}" stroke-dashoffset="${len.toFixed(1)}" `+
    `style="transition-delay:${delay}ms"/>`);
  const n=el("trails").lastElementChild;
  n.getBoundingClientRect();
  n.style.strokeDashoffset="0";
}
function mvThrowLine(ball,cut,base,delay){
  el("trails").insertAdjacentHTML("beforeend",
    `<polyline class="throwline" points="${ball.x.toFixed(0)},${ball.y.toFixed(0)} `+
    `${cut.x.toFixed(0)},${cut.y.toFixed(0)} ${base.x},${base.y}"/>`);
  const n=el("trails").lastElementChild;
  setTimeout(()=>n.classList.add("on"),delay);
}
function mvCovers(on){
  document.querySelectorAll(".cov").forEach(c=>{
    c.classList.toggle("on",!!on);if(!on)c.style.transitionDelay="0ms";});
}
/* everybody back to her real spot. anim=false snaps and forces a reflow so
   Again walks from the true positions instead of teleporting. */
function mvHome(anim){
  for(const k in POS){
    const g=el("pos-"+k);if(!g)continue;
    if(!anim)g.style.transition="none";
    g.style.transitionDelay="0ms";
    g.classList.remove("r-ball","r-cover","r-back");
    g.style.transform=`translate(${POS[k].x}px,${POS[k].y}px)`;
  }
  if(anim)return;
  el("dia").getBoundingClientRect();
  for(const k in POS){const g=el("pos-"+k);if(g)g.style.transition="";}
}
function mvChips(){
  const a=el("answers");
  if(a.querySelector("#mvAgain"))return;
  a.className="answers";
  a.innerHTML=`<button class="btn ghost" id="mvAgain">&#8635; Again</button>`+
              `<button class="btn ghost" id="mvClear">&#10006; Start over</button>`;
  el("mvAgain").addEventListener("click",()=>{if(MV.last&&!MV.busy)mvRun(MV.last);});
  el("mvClear").addEventListener("click",mvStart);
}
function mvRun(raw,forced){
  if(MV.busy)return;
  const fast=mvReduced(),dur=fast?0:MV_WALK;
  document.documentElement.style.setProperty("--walk",dur+"ms");
  const z=mvZone(raw.x,raw.y,forced),J=mvPlan(z,MV.runners);
  MV.busy=true;MV.last=raw;MV.zone=z;MV.plan=J;
  [1,2,3].forEach(n=>el("base-B"+n).classList.remove("pulse"));
  mvHome(false);
  el("trails").innerHTML="";mvCovers(false);
  moveBall(z.ball.x,z.ball.y);sfx("tap");
  for(const k in J){
    const j=J[k],g=el("pos-"+k);if(!g)continue;
    const wave=MV_WAVE[j.role],delay=fast?0:MV_W[wave];
    g.classList.add(MV_ROLECLASS[j.role]);
    g.style.transitionDelay=delay+"ms";
    g.style.transform=`translate(${j.x.toFixed(1)}px,${j.y.toFixed(1)}px)`;
    mvTrail(POS[k],j,wave,delay);
    if(j.role==="cover"){const c=el("cov-"+j.target);
      if(c){c.style.transitionDelay=(delay+dur)+"ms";c.classList.add("on");}}
    if(j.role==="cut")mvThrowLine(z.ball,j,BASE_XY[j.target],delay+dur);
  }
  el("ask").innerHTML=`${cfg().icon} <b>${MV_SHORT[z.by]}</b> gets it!`;
  el("hint").className="hint";
  el("hint").innerHTML="&nbsp;";
  setTimeout(()=>{el("hint").textContent=MV_LINE2[z.key+"."+z.state]||"";},fast?0:MV_W.cover+250);
  setTimeout(()=>{MV.busy=false;mvChips();},fast?0:MV_W.back+dur+150);
}
/* the tap means something different in every room, so this room takes its
   taps before the grader ever sees them. A bag is a runner switch. A girl is
   "hit it right at her", and after the play she shows her own job. */
function mvTap(choice){
  if(MV.busy)return;
  if(POS[choice]){
    if(MV.plan&&MV.plan[choice]){
      const j=MV.plan[choice],s=MV_SAY[j.role];
      el("hint").textContent=MV_SHORT[choice]+": "+(typeof s==="function"?s(j.target):s);
      sfx("tap");return;
    }
    mvRun({x:POS[choice].x,y:POS[choice].y},choice);return;
  }
  if(choice==="B1"||choice==="B2"||choice==="B3"){
    const n=+choice[1];
    MV.runners=MV.runners.indexOf(n)>=0?MV.runners.filter(r=>r!==n)
                                       :MV.runners.concat(n).sort();
    sfx("tap");mvDrawRunners();
    if(MV.last)mvRun(MV.last);
  }
  /* HOME and CIRCLE are inert here: the batter is always running to first,
     which is why first base is always a force. */
}
function mvStart(){
  S.scenario=null;S.answered=false;
  S.balls=0;S.strikes=0;S.outs=0;paintBoard();
  el("roundBtn").hidden=true;
  const hc=el("holdChip");hc.hidden=true;hc.classList.remove("hit","miss");
  drawCircle(false);setFielderPulse(false);setBasePulse(false);
  document.querySelectorAll(".base,.fielder").forEach(n=>n.classList.remove("hit","miss"));
  MV.runners=[];MV.last=null;MV.busy=false;MV.plan=null;MV.zone=null;
  el("trails").innerHTML="";mvCovers(false);
  mvLayer(true);
  mvHome(true);
  mvDrawRunners();moveBall(200,352);
  el("ask").innerHTML=`<span class="tag">Everybody moves</span>Tap where the ball is hit!`;
  el("hint").className="hint";
  el("hint").textContent="Tap a base to add a runner.";
  el("answers").className="answers";el("answers").innerHTML="";
  [1,2,3].forEach(n=>el("base-B"+n).classList.add("pulse"));
}
/* The bases paint above the fielders everywhere else, which is right: nobody
   stands on a bag in the other five rooms. Here they do, constantly, and the
   whole point is watching WHO arrives at the bag, so in this room only the
   players ride on top. Put back on the way out. */
function mvLayer(up){
  const f=el("fielders"),dia=f.parentNode;
  if(up)dia.appendChild(f); else dia.insertBefore(f,el("bases"));
}
function mvExit(){
  mvLayer(false);
  el("trails").innerHTML="";mvCovers(false);
  [1,2,3].forEach(n=>{const b=el("base-B"+n);if(b)b.classList.remove("pulse");});
  MV.busy=false;MV.plan=null;
}
/* the halos, built once: three bags and the plate */
(function(){let h="";for(const k in BASE_XY){const b=BASE_XY[k];
  h+=`<circle class="cov" id="cov-${k}" cx="${b.x}" cy="${b.y}" r="26"/>`;}
  el("covers").innerHTML=h;})();
el("hitPad").addEventListener("click",ev=>{
  if(S.mode!=="move"||MV.busy)return;
  mvRun(mvPoint(ev));
});

/* What the report carries besides the words: the league, the room, and the
   exact question on screen. Plain app state, no personal anything, and the
   dialog says so before they send it. */
function playContext(){
  const sc=S.scenario;
  if(!sc)return null;
  const strip=t=>String(t||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  return {
    league:cfg().label,
    room:MODE_NAMES[S.mode]||S.mode,
    chip:sc.chip||"",
    asked:strip(sc.prompt).slice(0,220),
    correct:Array.isArray(sc.choices)
      ?strip((sc.choices.find(c=>c[0]===sc.correct)||[])[1])
      :String(sc.correct||""),
    answered:S.answered?"yes":"not yet",
    missedFirst:S.missedThis?"yes":"no"
  };
}
function paintFbContext(){
  const c=playContext(),n=el("fbCtx");
  if(!c){n.hidden=true;return;}
  n.hidden=false;
  n.textContent="This play comes with your note: "+c.room+" · "+c.league+
    (c.chip?" · "+c.chip:"");
}
el("fbSend").addEventListener("click",()=>{
  const txt=el("fbText").value.trim();
  if(!txt){el("fbStatus").textContent="Say something first.";return;}
  const ctx=playContext();
  const btn=el("fbSend");
  btn.disabled=true;
  el("fbStatus").textContent="Sending...";
  /* wait=true makes Discord answer with the created message, so a sent
     report is provably sent, and reading the body keeps the network tidy */
  fetch(FEEDBACK_WEBHOOK+"?wait=true",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content:"**Diamond Rules feedback**\n"+txt.slice(0,1500)+
      (ctx?"\n**On this play**\n> "+ctx.room+" · "+ctx.league+(ctx.chip?" · "+ctx.chip:"")+
        "\n> "+ctx.asked+
        "\n> right answer: "+ctx.correct+" · answered: "+ctx.answered+" · missed first: "+ctx.missedFirst:
        "\n_(not on a play)_")+
      "\n`"+BUILD+" · "+navigator.userAgent.slice(0,110)+"`"})
  }).then(r=>{
    btn.disabled=false;
    if(!(r.ok||r.status===204))throw new Error("bad status");
    r.text().catch(()=>{});
    el("fbStatus").textContent="Sent. It goes straight to Stephen. Thank you.";
    el("fbText").value="";
    setTimeout(()=>el("fbWrap").classList.add("hidden"),1500);
  }).catch(()=>{
    btn.disabled=false;
    el("fbStatus").innerHTML='Could not send from here. Email still works: <a href="mailto:stephenfurpahs@gmail.com?subject=Feedback%3A%20Diamond%20Rules">tap to open it</a>.';
  });
});

/* ================= add to home screen =================
   Fleet affordance: Chrome hands over a real install prompt and iPhone gets
   directions. Inside an installed app window (the studio hub installed, or
   this app itself) the phone cannot add an icon from here, so the button
   stays visible but hands out the way that works: open the address in the
   real browser first. Arriving from the hub's install link raises a banner. */
(function(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  let evt=null;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const btn=el("swsInstall");
  function go(){
    if(evt){evt.prompt();return;}
    alert(standalone
      ?"You are inside the installed studio app, and phones can only add icons from the browser. Open skywolfstudio.com/diamond-rules in "+(ios?"Safari, tap the Share button, then \"Add to Home Screen\".":"Chrome, then pick \"Add to Home Screen\" from the menu.")
      :ios
      ?'To add it: tap the Share button, then "Add to Home Screen".'
      :'In your browser menu, choose "Add to Home Screen" or "Install app".');
  }
  const pill=el("getPill");
  let installed=false;
  try{installed=localStorage.getItem("diamond-installed")==="1";}catch(e){}
  if(standalone){
    btn.textContent="⤓ Give this game its own icon";
    pill.textContent="⤓ Give this game its own icon";
  }
  btn.hidden=false;
  pill.hidden=installed;
  btn.addEventListener("click",go);
  pill.addEventListener("click",go);
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();evt=e;});
  addEventListener("appinstalled",()=>{
    pill.hidden=true;
    try{localStorage.setItem("diamond-installed","1");}catch(e){}
  });
  if(/[?&]sws-install/.test(location.search)){
    const b=document.createElement("button");
    b.type="button";b.id="installBanner";b.textContent="⤓ Add to home screen";
    b.style.cssText="position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 62px);transform:translateX(-50%);z-index:40;font:900 15px Nunito,sans-serif;padding:12px 22px;border-radius:999px;background:var(--ink);color:#fff;border:0;box-shadow:0 8px 26px rgba(0,0,0,.35);cursor:pointer";
    document.body.appendChild(b);
    b.addEventListener("click",()=>{go();b.remove();});
    setTimeout(()=>b.remove(),15000);
  }
})();
