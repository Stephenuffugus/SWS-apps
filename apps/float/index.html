<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Float — field log</title>
<meta name="description" content="A private field log for rockhounding, fossils and sea glass. Local-first — no account, no server.">
<meta name="theme-color" content="#161B19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20512%20512%27%3E%3Crect%20width%3D%27512%27%20height%3D%27512%27%20fill%3D%27%23161B19%27/%3E%3Ccircle%20cx%3D%27256%27%20cy%3D%27290%27%20r%3D%27140%27%20fill%3D%27%233E7A6B%27/%3E%3Ccircle%20cx%3D%27210%27%20cy%3D%27245%27%20r%3D%2740%27%20fill%3D%27%23EDEEEA%27/%3E%3C/svg%3E">
<style>
/* ═══ Float — design tokens ═══
   limestone #EDEEEA · basalt #161B19 · basalt-2 #232B28
   serpentine #3E7A6B · agate #C9873B · iron #A64B3C
   display: system serif (field journal) · data: monospace */
:root{
  --limestone:#EDEEEA; --paper:#F5F5F2; --basalt:#161B19; --basalt2:#232B28;
  --serpentine:#3E7A6B; --serp-deep:#2E5C51; --agate:#C9873B; --iron:#A64B3C;
  --ink:#22271F; --mist:#656E66; --line:#D8DAD3;
  --ff-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --ff-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --tap:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ff-body);background:var(--limestone);color:var(--ink);
  min-height:100dvh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
a{color:var(--serp-deep)}
:focus-visible{outline:2px solid var(--serpentine);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.display{font-family:var(--ff-display);font-weight:600;letter-spacing:-.01em;font-size:1.7rem;line-height:1.15}
.mono{font-family:var(--ff-mono);font-size:.78rem;letter-spacing:.01em}
.eyebrow{display:block;font-family:var(--ff-mono);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.14em;color:var(--mist);margin:20px 0 8px}
.dim-t{color:var(--mist)} .small{font-size:.8rem} .amber{color:var(--agate)}
.warn{color:var(--iron)}

/* views */
.view{padding:14px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
/* --mist is solved against limestone (4.53:1). On the dark surfaces it would
   invert to 3.9:1, so those scopes re-solve it upward against basalt2, the
   lighter of the two dark grounds — 5.41:1 on basalt, 4.50:1 on basalt2.
   One grey cannot clear 4.5:1 against both ends; that is why there are two. */
.view.dark,#tabbar{--mist:#889289}
.view.dark{background:var(--basalt);color:var(--limestone);max-width:none;margin:0;
  min-height:calc(100dvh - 64px);display:flex;flex-direction:column;padding:10px 14px 8px}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* ── field mode ── */
.field-top{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding-top:env(safe-area-inset-top)}
.trip-chip{font-family:var(--ff-mono);font-size:.78rem;color:var(--limestone);
  background:var(--basalt2);border-radius:99px;padding:8px 14px;min-height:var(--tap)}
.trip-chip.dim{color:var(--mist)}
.pill{border-radius:99px;padding:6px 12px}
.pill-good{background:var(--serp-deep);color:var(--limestone)}
.pill-warn{background:var(--basalt2);color:var(--agate)}
.cam-stage{position:relative;flex:1;min-height:44vh;border-radius:var(--r);overflow:hidden;
  background:var(--basalt2);margin:10px 0;display:flex;align-items:center;justify-content:center}
#cam{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.guide{position:absolute;top:50%;left:50%;width:min(82vw,82%);aspect-ratio:1;transform:translate(-50%,-50%);
  border:1.5px solid rgba(237,238,234,.8);border-radius:8px;pointer-events:none;
  box-shadow:0 0 0 200vmax rgba(22,27,25,.28)}
.cam-fallback{position:relative;text-align:center;display:flex;flex-direction:column;gap:10px;padding:24px;color:var(--mist)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--ff-mono);font-size:.78rem;padding:9px 14px;border-radius:99px;
  background:var(--basalt2);color:var(--limestone);min-height:38px}
.view.light .chip{background:#fff;color:var(--ink);border:1px solid var(--line)}
.chip.sel{background:var(--serpentine);color:#fff;border-color:var(--serpentine)}
.chip-amber{border:1px solid var(--agate)!important;color:var(--agate)}
.chip-amber.sel{background:var(--agate);color:#fff}
.field-bottom{padding-bottom:6px}
.sess-wrap{display:flex;align-items:center;gap:10px;min-height:26px;margin:6px 0}
.sess-strip{display:flex;gap:4px}
.sess-cell{width:22px;height:22px;border-radius:5px;border:1px solid rgba(237,238,234,.25)}
.shutter-row{display:flex;align-items:center;justify-content:center;gap:34px;padding:6px 0 2px}
.shutter{width:74px;height:74px;border-radius:50%;background:var(--limestone);
  border:5px solid var(--serpentine);transition:transform .12s}
.shutter.snap{transform:scale(.86)}
.round-btn{width:50px;height:50px;border-radius:50%;background:var(--basalt2);color:var(--limestone);font-size:1.15rem}
.round-btn.on{background:var(--agate)}

/* ── shared controls ── */
.text-input,.select{width:100%;font:inherit;padding:12px 14px;margin:8px 0;border:1px solid var(--line);
  border-radius:var(--r);background:#fff;color:var(--ink);min-height:var(--tap)}
textarea.text-input{resize:vertical}
.display-input{font-family:var(--ff-display);font-size:1.35rem;font-weight:600;border-color:transparent;background:transparent;padding-left:2px}
.display-input:focus{background:#fff;border-color:var(--line)}
.btn{border-radius:var(--r);padding:12px 18px;font-weight:600;min-height:var(--tap)}
.btn-primary{background:var(--serpentine);color:#fff}
.btn-primary:active{background:var(--serp-deep)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.view.dark .btn-ghost{color:var(--limestone);border-color:var(--basalt2)}
.btn-danger{background:transparent;border:1px solid var(--iron);color:var(--iron)}
.btn.full{width:100%;margin-top:14px}

/* ── strata: the signature ── */
.strata{height:7px;border-radius:4px;margin:2px 0 6px}
.strata.tall{height:16px;border-radius:6px;margin:6px 0 10px}
.mini-strata{width:52px;height:10px;border-radius:4px;flex:0 0 auto}

/* ── queue ── */
.q-head{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}
.q-photo{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
.q-photo img{width:100%;aspect-ratio:1;object-fit:cover}
.suggest{margin:12px 0 2px}
.q-actions{display:flex;gap:10px;margin-top:14px}
.q-actions .btn{flex:1}
.q-meta{margin-top:14px;text-align:center}

/* ── collection ── */
.coll-head{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;padding:0 0 10px}
.card-img{aspect-ratio:1;background:var(--paper)}
.card-img img{width:100%;height:100%;object-fit:cover}
.card .strata{margin:0 0 8px;border-radius:0}
.card-body{padding:0 10px;display:flex;flex-direction:column;gap:3px}
.card-title{font-family:var(--ff-display);font-weight:600;font-size:.95rem;line-height:1.2}
.card-sub{font-size:.68rem;color:var(--mist)}

/* ── detail ── */
.photo-pager{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);scrollbar-width:none}
.photo-pager::-webkit-scrollbar{display:none}
.photo-slide{flex:0 0 100%;scroll-snap-align:center;border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
.photo-slide img{width:100%;aspect-ratio:1;object-fit:cover;transition:object-fit .1s}
.photo-slide img.zoom{object-fit:contain;background:var(--basalt)}
.photo-slide.none{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--mist)}
.meta-block{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  margin:12px 0;display:flex;flex-direction:column;gap:6px;white-space:pre;font-size:.78rem}
.meta-block a{display:block}
.sim-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.sim-row::-webkit-scrollbar{display:none}
.sim-cell{flex:0 0 96px;display:flex;flex-direction:column;gap:5px;text-align:left}
.sim-cell img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.sim-label{font-size:.66rem;color:var(--mist)}

/* ── lists (sites/trips/more) ── */
.list{display:flex;flex-direction:column;gap:8px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;
  border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:left;width:100%}
.list-main{display:flex;flex-direction:column;gap:3px}
.list-row.tap:active{background:var(--paper)}
.add-row{justify-content:center;color:var(--serp-deep);border-style:dashed}
.active-trip{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--serp-deep);color:#fff;border-radius:var(--r);padding:13px 14px;margin:6px 0 4px}
.active-trip .dim-t{color:rgba(255,255,255,.75)}

/* ── stats ── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font-size:1.3rem}
.stat span{font-size:.66rem;color:var(--mist);text-transform:uppercase;letter-spacing:.1em}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:92px 1fr 28px;align-items:center;gap:10px;font-size:.8rem}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--serpentine);border-radius:6px}

/* ── tab bar ── */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--basalt);
  padding-bottom:env(safe-area-inset-bottom);z-index:50;border-top:1px solid var(--basalt2)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;
  color:var(--mist);font-size:.66rem;font-family:var(--ff-mono);position:relative;min-height:56px}
.tab.active{color:var(--limestone)}
.tab.active::after{content:"";position:absolute;top:0;width:34px;height:2px;background:var(--agate);border-radius:2px}
.tab-icon{font-size:1.15rem;line-height:1}
.badge{position:absolute;top:5px;right:calc(50% - 24px);background:var(--agate);color:#fff;
  font-size:.62rem;border-radius:99px;padding:1px 6px;font-family:var(--ff-mono)}

/* ── map ── */
.map-wrap{position:relative;margin:0 0 12px;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:#F3F4F0}
.map-cv{display:block;width:100%;height:56vh;min-height:300px;touch-action:none;cursor:grab}
.map-cv:active{cursor:grabbing}
.map-ctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.map-btn{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.94);
  color:var(--ink);font-size:1.2rem;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.map-btn:focus-visible{outline:2px solid var(--serpentine);outline-offset:2px}
.map-scale{position:absolute;left:12px;bottom:12px;height:22px;border:1px solid var(--ink);
  border-top:none;background:rgba(237,238,234,.86);font-family:var(--ff-mono);font-size:.66rem;
  color:var(--ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:1px;min-width:40px}
.map-sheet{display:none;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:12px}
.map-sheet.open{display:block}
.sheet-title{font-family:var(--ff-display);font-size:1.25rem;margin:2px 0 4px;color:var(--ink)}
.sheet-sub{font-size:.78rem;color:var(--mist);margin:0 0 10px}
.sheet-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.sheet-cell{flex:0 0 auto;width:60px;height:60px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--limestone)}
.sheet-cell img{width:100%;height:100%;object-fit:cover;display:block}
.sheet-blank{color:var(--mist)}
.map-note{font-size:.76rem;line-height:1.5;color:var(--mist);margin:0 0 8px}
.site-notes{font-size:.9rem;line-height:1.55;color:var(--ink);margin:6px 0 12px}
.back{margin-bottom:6px}
.from-site{display:block;font-family:var(--ff-mono);font-size:.62rem;color:var(--agate);
  letter-spacing:.03em;margin-top:1px}

/* ── trip timeline ── */
.timeline{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.tl-row{display:flex;align-items:center;gap:10px;padding:8px 4px;background:none;border:none;
  text-align:left;width:100%;min-height:56px;border-bottom:1px solid var(--line)}
.tl-row:focus-visible{outline:2px solid var(--serpentine);outline-offset:-2px}
.tl-time{flex:0 0 auto;width:58px;font-size:.72rem;color:var(--mist)}
.tl-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--serpentine)}
.tl-thumb{flex:0 0 auto;width:44px;height:44px;border-radius:8px;overflow:hidden;
  background:var(--limestone);border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;color:var(--mist)}
.tl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tl-main{display:flex;flex-direction:column;min-width:0}
.tl-main strong{color:var(--ink)}
.tl-main .mono{font-size:.72rem}

/* ── collection paging ── */
.grid-more{grid-column:1/-1;text-align:center;padding:18px 0;color:var(--mist);font-size:.78rem;
  letter-spacing:.06em}

/* ── zones & coordinates ── */
.coord-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.coord-in{flex:1;min-width:0}
.zone-chips{gap:6px;margin-bottom:8px}
.chip-zone{display:inline-flex;align-items:center;gap:6px;background:var(--limestone);
  border:1px solid var(--line);color:var(--ink)}
.chip-x{background:none;border:none;color:var(--mist);font-size:1.05rem;line-height:1;
  padding:0 2px;min-width:24px;min-height:24px}
.chip-x:focus-visible{outline:2px solid var(--serpentine);outline-offset:2px}
.zone-row{align-items:center;gap:6px;padding:0 12px 6px}
.zone-lead{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);flex:0 0 auto}
.chip-zone-pick{background:var(--basalt2);border:1px solid #33403a;color:var(--limestone)}
.chip-zone-pick.sel{background:var(--agate);border-color:var(--agate);color:#fff}

/* ── first run ── */
body.welcoming{overflow:hidden}
.wc{position:fixed;inset:0;z-index:120;background:var(--limestone);overflow-y:auto;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wc-inner{max-width:30rem;margin:0 auto;padding:8vh 22px 40px;display:flex;
  flex-direction:column;align-items:center;text-align:center;gap:8px}
.wc-steps{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;
  gap:16px;text-align:left;width:100%}
.wc-step{display:flex;gap:12px;align-items:flex-start}
.wc-n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--serpentine);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;margin-top:1px}
.wc-step strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:2px}
.wc-body{display:block;font-size:.88rem;line-height:1.5;color:var(--mist)}
.wc-promise{margin:26px 0 0;font-size:.84rem;line-height:1.55;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left}
.wc-actions{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:24px}
.full{width:100%}

/* ── development gate ── */
body.gated #tabbar{display:none}
.gate{max-width:26rem;margin:0 auto;padding:14vh 22px 40px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.gate-mark{font-size:2.4rem;color:var(--serpentine);line-height:1}
.gate-title{font-family:var(--ff-display);font-size:2.1rem;letter-spacing:.04em;margin:2px 0 0;color:var(--ink)}
.gate-sub{font-family:var(--ff-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mist);margin:0 0 18px}
.gate-label{align-self:flex-start;font-family:var(--ff-mono);font-size:.7rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mist)}
#devpass{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);font-size:1.05rem;font-family:var(--ff-mono);letter-spacing:.06em}
#devpass:focus-visible{outline:2px solid var(--serpentine);outline-offset:2px;border-color:var(--serpentine)}
.gate-go{width:100%;min-height:48px;margin-top:4px}
.gate-err{min-height:1.2em;margin:2px 0 0;color:var(--iron);font-size:.85rem}
.gate-note{margin:20px 0 0;font-size:.8rem;line-height:1.5;color:var(--mist);text-align:left}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:var(--basalt);color:var(--limestone);padding:10px 18px;border-radius:99px;
  font-size:.85rem;opacity:0;pointer-events:none;transition:.2s;z-index:99;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="main" class="view"></main>
<nav id="tabbar" aria-label="Sections"></nav>
<script>
/* ═══════════════════════════════════════════════════════════════════
   FLOAT — rockhounding field log · v2
   Single-file PWA. Local-first. No account, no server, no tracking.
   Every record lives in IndexedDB on this device.
   ═══════════════════════════════════════════════════════════════════ */
/* ── core: utils, bus, router ─────────────────────────────────── */
'use strict';
const FLOAT_VERSION = '2.0.0';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k === null || k === undefined || k === false) continue;
    n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k);
  }
  return n;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const uid = () => {
  const t = Date.now().toString(36);
  const r = crypto.getRandomValues(new Uint32Array(2));
  return t + '-' + r[0].toString(36) + r[1].toString(36);
};
const nowISO = () => new Date().toISOString();

const fmtDate = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
};
const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtCoord = (lat, lon) => (lat === null || lat === undefined || lon === null || lon === undefined)
  ? null

/* tiny event bus */
const bus = (() => {
  const m = new Map();
  return {
    on(ev, fn) { (m.get(ev) || m.set(ev, new Set()).get(ev)).add(fn); return () => m.get(ev)?.delete(fn); },
    emit(ev, data) { m.get(ev)?.forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); }
  };
})();

/* toast */
let toastTimer = null;
const toast = (msg, ms = 2200) => {
  let t = $('#toast');
  if (!t) { t = el('div', { id: 'toast' }); document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
};

/* hash router: '#/field', '#/find/abc123' */
const router = (() => {
  const routes = [];
  const parse = () => {
    const h = location.hash.replace(/^#\/?/, '');
    return h.split('/').filter(Boolean);
  };
  const go = path => { location.hash = '#/' + path; };
  const resolve = () => {
    const parts = parse();
    const name = parts[0] || 'field';
    for (const r of routes) {
      if (r.name === name) { r.fn(parts.slice(1)); return; }
    }
    routes[0]?.fn([]);
  };
  return {
    add(name, fn) { routes.push({ name, fn }); },
    start() { window.addEventListener('hashchange', resolve); resolve(); },
    go, parse
  };
})();

/* ── data layer: IndexedDB with in-memory fallback ────────────── */
const DB_NAME = 'float-db', DB_VER = 2;
const STORES = ['sites', 'trips', 'finds', 'photos', 'settings'];

const memDB = { data: Object.fromEntries(STORES.map(s => [s, new Map()])) };

let idb = null, useMem = false;

const dbOpen = () => new Promise(res => {
  if (typeof indexedDB === 'undefined') { useMem = true; return res(); }
  const req = indexedDB.open(DB_NAME, DB_VER);
  req.onupgradeneeded = e => {
    const d = e.target.result;
    for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
  };
  req.onsuccess = e => { idb = e.target.result; res(); };
  req.onerror = () => { useMem = true; console.warn('IndexedDB unavailable — using in-memory store (data will not persist)'); res(); };
});

const db = {
  async put(store, obj) {
    obj.updatedAt = nowISO();
    if (!obj.createdAt) obj.createdAt = obj.updatedAt;
    if (useMem) { memDB.data[store].set(obj.id, structuredClone(obj)); return obj; }
    return new Promise((res, rej) => {
      const tx = idb.transaction(store, 'readwrite');
      tx.objectStore(store).put(obj);
      tx.oncomplete = () => res(obj);
      tx.onerror = () => rej(tx.error);
    });
  },
  async get(store, id) {
    if (useMem) { const v = memDB.data[store].get(id); return v ? structuredClone(v) : undefined; }
    return new Promise((res, rej) => {
      const req = idb.transaction(store).objectStore(store).get(id);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  },
  async all(store) {
    if (useMem) return Array.from(memDB.data[store].values()).map(v => structuredClone(v));
    return new Promise((res, rej) => {
      const req = idb.transaction(store).objectStore(store).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  },
  async del(store, id) {
    if (useMem) { memDB.data[store].delete(id); return; }
    return new Promise((res, rej) => {
      const tx = idb.transaction(store, 'readwrite');
      tx.objectStore(store).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async clear(store) {
    if (useMem) { memDB.data[store].clear(); return; }
    return new Promise((res, rej) => {
      const tx = idb.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
};

/* settings k/v on top of the settings store */

/* ── color pipeline ───────────────────────────────────────────────
   Stage 1 of the match pipeline: Lab color histogram prefilter.
   - sRGB → CIELAB conversion (D65)
   - 8×8×8 quantized histogram over L*a*b* = 512 bins
   - sqrt-compressed to Uint8 for storage (peaked histograms from
     uniformly coloured rocks clip badly on a linear byte scale)
   - Bhattacharyya coefficient for similarity (robust for sparse hists)
   Stage 2 (DINOv2 embeddings) is a documented seam — see HANDOFF.
──────────────────────────────────────────────────────────────────── */
'use strict';
const HBINS = 8, HDIM = HBINS * HBINS * HBINS;

const srgbToLinear = c => {
  c /= 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
};

const rgbToLab = (r, g, b) => {
  const rl = srgbToLinear(r), gl = srgbToLinear(g), bl = srgbToLinear(b);
  /* linear sRGB → XYZ (D65) */
  let x = rl * 0.4124564 + gl * 0.3575761 + bl * 0.1804375;
  let y = rl * 0.2126729 + gl * 0.7151522 + bl * 0.0721750;
  let z = rl * 0.0193339 + gl * 0.1191920 + bl * 0.9503041;
  x /= 0.95047; z /= 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);
  const fx = f(x), fy = f(y), fz = f(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)]; /* L 0..100, a/b ≈ -128..127 */
};

const labToBin = (L, a, b) => {
  const li = Math.min(HBINS - 1, Math.max(0, Math.floor(L / 100 * HBINS)));
  const ai = Math.min(HBINS - 1, Math.max(0, Math.floor((a + 128) / 256 * HBINS)));
  const bi = Math.min(HBINS - 1, Math.max(0, Math.floor((b + 128) / 256 * HBINS)));
  return li * HBINS * HBINS + ai * HBINS + bi;
};

/* Build a normalized Lab histogram from RGBA pixel data.
   Center-weighted: rocks are shot centered on the guide square, so
   pixels near the middle count more than background at the edges. */
const histFromPixels = (data, w, h) => {
  const hist = new Float32Array(HDIM);
  const cx = w / 2, cy = h / 2, maxR = Math.hypot(cx, cy);
  let total = 0;
  const step = Math.max(1, Math.floor(Math.sqrt((w * h) / 20000))); /* sample ≤ ~20k px */
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const i = (y * w + x) * 4;
      if (data[i + 3] < 128) continue;
      const d = Math.hypot(x - cx, y - cy) / maxR;
      const wgt = 1.25 - d;                    /* 1.25 center → 0.25 corner */
      const [L, a, b] = rgbToLab(data[i], data[i + 1], data[i + 2]);
      hist[labToBin(L, a, b)] += wgt;
      total += wgt;
    }
  }
  if (total > 0) for (let i = 0; i < HDIM; i++) hist[i] /= total;
  return hist;
};

/* sqrt-compressed byte packing */
const packHist = h => {
  const o = new Uint8Array(HDIM);
  for (let i = 0; i < HDIM; i++) o[i] = Math.round(Math.sqrt(Math.min(1, h[i])) * 255);
  return o;
};
const unpackHist = u => {
  if (!u) return null;
  const a = u instanceof Uint8Array ? u : new Uint8Array(u);
  const o = new Float32Array(HDIM);
  let s = 0;
  for (let i = 0; i < HDIM; i++) { const t = a[i] / 255; o[i] = t * t; s += o[i]; }
  if (s > 0) for (let i = 0; i < HDIM; i++) o[i] /= s;
  return o;
};

/* Bhattacharyya coefficient: 1 = identical distributions, 0 = disjoint */
const histSimilarity = (h1, h2) => {
  let s = 0;
  for (let i = 0; i < HDIM; i++) s += Math.sqrt(h1[i] * h2[i]);
  return s;
};

/* Rank candidate finds against a query histogram.
   Returns [{find, score}] sorted desc, with a margin-based confidence:
   confident only when top clearly beats runner-up. */
const rankByColor = (queryHist, finds) => {
  const scored = [];
  for (const f of finds) {
    if (!f.hist) continue;
    const s = histSimilarity(queryHist, unpackHist(f.hist));
    scored.push({ find: f, score: s });
  }
  scored.sort((a, b) => b.score - a.score);
  const margin = scored.length >= 2 ? scored[0].score - scored[1].score : (scored.length ? scored[0].score : 0);
  return { results: scored, margin, confident: scored.length > 0 && scored[0].score > 0.55 && margin > 0.06 };
};

/* ── strata extraction: 5 dominant colors by weight ──────────────
   Simple k-means-lite in RGB on the sampled pixels; the signature
   visual for every specimen. Returns [[r,g,b,share] x ≤5] sorted by share. */
const extractStrata = (data, w, h, k = 5) => {
  /* sample */
  const pts = [];
  const step = Math.max(1, Math.floor(Math.sqrt((w * h) / 4000)));
  const cx = w / 2, cy = h / 2, maxR = Math.hypot(cx, cy);
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    const i = (y * w + x) * 4;
    if (data[i + 3] < 128) continue;
    const d = Math.hypot(x - cx, y - cy) / maxR;
    if (d > 0.85) continue;                    /* strata come from the specimen, not the background */
    pts.push([data[i], data[i + 1], data[i + 2]]);
  }
  if (!pts.length) return null;
  /* init centers spread across luminance */
  pts.sort((p, q) => (p[0] + p[1] + p[2]) - (q[0] + q[1] + q[2]));
  const centers = [];
  for (let i = 0; i < k; i++) centers.push([...pts[Math.floor((i + 0.5) * pts.length / k)]]);
  const assign = new Array(pts.length).fill(0);
  for (let iter = 0; iter < 8; iter++) {
    for (let p = 0; p < pts.length; p++) {
      let best = 0, bd = Infinity;
      for (let c = 0; c < k; c++) {
        const dr = pts[p][0] - centers[c][0], dg = pts[p][1] - centers[c][1], db = pts[p][2] - centers[c][2];
        const d = dr * dr + dg * dg + db * db;
        if (d < bd) { bd = d; best = c; }
      }
      assign[p] = best;
    }
    const sum = Array.from({ length: k }, () => [0, 0, 0, 0]);
    for (let p = 0; p < pts.length; p++) {
      const s = sum[assign[p]];
      s[0] += pts[p][0]; s[1] += pts[p][1]; s[2] += pts[p][2]; s[3]++;
    }
    for (let c = 0; c < k; c++) if (sum[c][3] > 0) {
      centers[c][0] = sum[c][0] / sum[c][3];
      centers[c][1] = sum[c][1] / sum[c][3];
      centers[c][2] = sum[c][2] / sum[c][3];
    }
  }
  const counts = new Array(k).fill(0);
  for (const a of assign) counts[a]++;
  const out = centers.map((c, i) => [Math.round(c[0]), Math.round(c[1]), Math.round(c[2]), counts[i] / pts.length])
    .filter(s => s[3] > 0.02)
    .sort((a, b) => b[3] - a[3])
    .slice(0, k);
  return out;
};

/* strata → inline gradient strip */
const strataCSS = strata => {
  if (!strata || !strata.length) return 'linear-gradient(90deg,#ccc,#ccc)';
  let acc = 0;
  const stops = [];
  for (const [r, g, b, w] of strata) {
    const from = acc * 100; acc += w / strata.reduce((s, x) => s + x[3], 0);
    const to = acc * 100;
    stops.push(`rgb(${r},${g},${b}) ${from.toFixed(1)}% ${to.toFixed(1)}%`);
  }
  return `linear-gradient(90deg, ${stops.join(', ')})`;
};

/* ── image processing (browser only) ─────────────────────────────
   Downscale to ≤2048px original + 320px thumb, extract hist + strata. */
const processImage = async (blob) => {
  const img = await createImageBitmap(blob);
  const scale = Math.min(1, 2048 / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const full = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.86));

  /* thumb */
  const ts = 320 / Math.max(w, h);
  const tw = Math.max(1, Math.round(w * ts)), th = Math.max(1, Math.round(h * ts));
  const tc = document.createElement('canvas');
  tc.width = tw; tc.height = th;
  tc.getContext('2d').drawImage(cv, 0, 0, tw, th);
  const thumb = await new Promise(r => tc.toBlob(r, 'image/jpeg', 0.8));

  /* analysis on a 256px working copy */
  const as = 256 / Math.max(w, h);
  const aw = Math.max(1, Math.round(w * as)), ah = Math.max(1, Math.round(h * as));
  const ac = document.createElement('canvas');
  ac.width = aw; ac.height = ah;
  const actx = ac.getContext('2d');
  actx.drawImage(cv, 0, 0, aw, ah);
  const px = actx.getImageData(0, 0, aw, ah);
  const hist = histFromPixels(px.data, aw, ah);
  const strata = extractStrata(px.data, aw, ah);
  img.close?.();
  return { full, thumb, hist: Array.from(packHist(hist)), strata, w, h };
};

const savePhoto = async (blob, findId) => {
  const p = await processImage(blob);
  const photo = {
    id: uid(), findId, w: p.w, h: p.h,
    full: p.full, thumb: p.thumb, deleted: false
  };
  await db.put('photos', photo);
  return { photo, hist: p.hist, strata: p.strata };
};

const photoURL = (photo, thumb = true) => URL.createObjectURL(thumb ? photo.thumb : photo.full);
/* ── field mode: dark, camera-first, one-thumb logging ─────────── */
'use strict';
const field = {
  stream: null, track: null, torch: false, wakeLock: null,
  watchId: null, pos: null, sessionFinds: [],

  async gpsStart() {
    if (!navigator.geolocation || this.watchId !== null) return;
    this.watchId = navigator.geolocation.watchPosition(
      p => { this.pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }; this.paintGPS(); },
      () => { this.pos = null; this.paintGPS(); },
      { enableHighAccuracy: true, maximumAge: 5000 }
    );
  },
  gpsStop() {
    if (this.watchId !== null) { navigator.geolocation.clearWatch(this.watchId); this.watchId = null; }
  },
  paintGPS() {
    const g = $('#gps-pill'); if (!g) return;
    if (this.pos) {
      g.textContent = `± ${Math.round(this.pos.acc)} m`;
      g.className = 'pill mono ' + (this.pos.acc <= 15 ? 'pill-good' : 'pill-warn');
    } else { g.textContent = 'no GPS'; g.className = 'pill mono pill-warn'; }
  },

  async camStart() {
    const video = $('#cam');
    if (!video || this.stream) return;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false
      });
      video.srcObject = this.stream;
      await video.play();
      this.track = this.stream.getVideoTracks()[0];
      const caps = this.track.getCapabilities?.() || {};
      $('#torch-btn').style.display = caps.torch ? '' : 'none';
      $('#cam-fallback').style.display = 'none';
      video.style.display = '';
    } catch (e) {
      /* no camera permission / desktop: fall back to file input */
      $('#cam-fallback').style.display = '';
      if (video) video.style.display = 'none';
    }
    try { this.wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  },
  camStop() {
    this.stream?.getTracks().forEach(t => t.stop());
    this.stream = null; this.track = null;
    this.wakeLock?.release().catch(() => {}); this.wakeLock = null;
  },
  async toggleTorch() {
    if (!this.track) return;
    this.torch = !this.torch;
    try { await this.track.applyConstraints({ advanced: [{ torch: this.torch }] }); } catch {}
    $('#torch-btn').classList.toggle('on', this.torch);
  },

  async capture() {
    const video = $('#cam');
    if (!video || !this.stream) { $('#file-input').click(); return; }
    const vw = video.videoWidth, vh = video.videoHeight;
    /* crop to the centered guide square (82% of the short side) */
    const side = Math.round(Math.min(vw, vh) * 0.82);
    const sx = Math.round((vw - side) / 2), sy = Math.round((vh - side) / 2);
    const cv = document.createElement('canvas');
    cv.width = side; cv.height = side;
    cv.getContext('2d').drawImage(video, sx, sy, side, side, 0, 0, side, side);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
    $('#shutter').classList.add('snap');
    setTimeout(() => $('#shutter')?.classList.remove('snap'), 220);
    await this.logFind(blob);
  },

  async fromFile(file) {
    if (!file) return;
    await this.logFind(file);
  },

  async logFind(blob) {
    const material = app.state.fieldMaterial || '';
    const trip = app.state.activeTrip;
    const find = newFind({
      tripId: trip?.id || null, siteId: trip?.siteId || null,
      zoneId: app.state.fieldZone || null,
      material,
      lat: this.pos?.lat ?? null, lon: this.pos?.lon ?? null, gpsAccuracy: this.pos?.acc ?? null
    });
    const { photo, hist, strata } = await savePhoto(blob, find.id);
    find.photoIds = [photo.id];
    find.hist = hist; find.strata = strata;
    await db.put('finds', find);
    this.sessionFinds.unshift(find);
    bus.emit('finds-changed');
    this.paintSession();
    toast(material ? `Logged — ${material}` : 'Logged');
  },

  paintSession() {
    const strip = $('#session-strip'); if (!strip) return;
    strip.innerHTML = '';
    $('#session-count').textContent = this.sessionFinds.length ? `${this.sessionFinds.length} this session` : '';
    for (const f of this.sessionFinds.slice(0, 12)) {
      const cell = el('button', { class: 'sess-cell', onclick: () => router.go('find/' + f.id) });
      cell.style.background = strataCSS(f.strata);
      strip.appendChild(cell);
    }
  },

  async render(host) {
    this.sessionFinds = [];
    const trips = (await db.all('trips')).filter(t => !t.deleted && !t.endedAt);
    app.state.activeTrip = trips.sort((a, b) => b.startedAt.localeCompare(a.startedAt))[0] || null;
    const site = app.state.activeTrip?.siteId ? await db.get('sites', app.state.activeTrip.siteId) : null;

    host.className = 'view dark';
    host.innerHTML = '';
    host.appendChild(el('div', { class: 'field-top' },
      el('div', { class: 'field-trip' },
        app.state.activeTrip
          ? el('button', { class: 'trip-chip', onclick: () => router.go('trips') }, '● ', site ? site.name : 'Trip in progress')
          : el('button', { class: 'trip-chip dim', onclick: () => field.quickTrip() }, '+ start trip')),
      el('span', { id: 'gps-pill', class: 'pill mono pill-warn' }, '…')
    ));

    const stage = el('div', { class: 'cam-stage' },
      el('video', { id: 'cam', playsinline: '', muted: '' }),
      el('div', { class: 'guide' }),
      el('div', { id: 'cam-fallback', class: 'cam-fallback', style: 'display:none' },
        el('p', {}, 'Camera unavailable here.'),
        el('button', { class: 'btn btn-ghost', onclick: () => $('#file-input').click() }, 'Add photo from library')
      )
    );
    host.appendChild(stage);

    /* material chips */
    const chips = el('div', { class: 'chips', id: 'mat-chips' });
    const recent = settings.get('recentMaterials', []);
    const ordered = [...new Set([...recent, ...MATERIALS])].slice(0, 16);
    for (const m of ordered) {
      chips.appendChild(el('button', {
        class: 'chip' + (app.state.fieldMaterial === m ? ' sel' : ''),
        onclick: e => {
          app.state.fieldMaterial = app.state.fieldMaterial === m ? '' : m;
          $$('.chip', chips).forEach(c => c.classList.remove('sel'));
          if (app.state.fieldMaterial) e.currentTarget.classList.add('sel');
        }
      }, m));
    }
    host.appendChild(chips);

    /* Zone picker — only when the active trip's site actually has zones, so
       nobody who has not set any ever sees a control that does nothing. The
       zone sticks between shots: you work one part of a site at a time, and
       re-picking it for every rock is exactly the tax that would stop anyone
       using it. */
    const trip = app.state.activeTrip;
    if (trip && trip.siteId) {
      const site = await db.get('sites', trip.siteId);
      if (site && site.zones && site.zones.length) {
        if (app.state.fieldZone && !site.zones.some(z => z.id === app.state.fieldZone)) {
          app.state.fieldZone = null;      // zone deleted since the trip started
        }
        const zchips = el('div', { class: 'chips zone-row', id: 'zone-chips' });
        zchips.appendChild(el('span', { class: 'zone-lead mono' }, 'zone'));
        for (const z of site.zones) {
          zchips.appendChild(el('button', {

            }
          }, z.name));

        host.appendChild(zchips);
      }
    }

    host.appendChild(el('div', { class: 'field-bottom' },
      el('div', { class: 'sess-wrap' },
        el('span', { id: 'session-count', class: 'mono dim-t' }),
        el('div', { id: 'session-strip', class: 'sess-strip' })),
      el('div', { class: 'shutter-row' },
        el('button', { id: 'torch-btn', class: 'round-btn', onclick: () => field.toggleTorch(), 'aria-label': 'Torch' }, '⚡'),
        el('button', { id: 'shutter', class: 'shutter', onclick: () => field.capture(), 'aria-label': 'Capture' }),
        el('button', { class: 'round-btn', onclick: () => $('#file-input').click(), 'aria-label': 'From library' }, '🖼')
      )
    ));

    const fi = el('input', { id: 'file-input', type: 'file', accept: 'image/*', capture: 'environment', style: 'display:none' });
    fi.addEventListener('change', e => { field.fromFile(e.target.files[0]); e.target.value = ''; });
    host.appendChild(fi);

    this.gpsStart(); this.paintGPS();
    this.camStart();
  },

  async quickTrip() {
    const sites = (await db.all('sites')).filter(s => !s.deleted);
    if (!sites.length) { router.go('trips'); return; }
    const t = newTrip(null);

    app.rerender();

  leave() { this.camStop(); this.gpsStop(); }

/* ── labeling queue: one specimen at a time ────────────────────── */
const queue = {
  items: [], idx: 0, lastLabel: null, lastMaterial: null,

  async render(host) {
    const finds = (await db.all('finds')).filter(f => !f.deleted && !f.label);
    finds.sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    this.items = finds; this.idx = 0;
    host.className = 'view light';
    host.innerHTML = '';
    if (!finds.length) {
      host.appendChild(el('div', { class: 'empty' },
        el('h2', { class: 'display' }, 'Queue clear'),
        el('p', {}, 'Every find has a name. Log more in Field mode.'),
        el('button', { class: 'btn btn-primary', onclick: () => router.go('field') }, 'Open Field mode')));
      return;
    }
    await this.paintCurrent(host);
  },

  async paintCurrent(host) {
    host.innerHTML = '';
    const f = this.items[this.idx];
    if (!f) { this.render(host); return; }

    const photo = f.photoIds[0] ? await db.get('photos', f.photoIds[0]) : null;
    const remaining = this.items.length - this.idx;

    host.appendChild(el('div', { class: 'q-head' },
      el('span', { class: 'eyebrow' }, 'Naming'),
      el('span', { class: 'mono dim-t' }, `${remaining} left`)));

    const imgWrap = el('div', { class: 'q-photo' });
    if (photo) {
      const img = el('img', { src: photoURL(photo, false), alt: 'Specimen' });
      imgWrap.appendChild(img);
    }
    imgWrap.appendChild(el('div', { class: 'strata', style: `background:${strataCSS(f.strata)}` }));
    host.appendChild(imgWrap);

    /* color-match suggestions from already-labeled finds.

       Stage 0: if this find carries a zone, rank inside that zone first.
       Most wrong matches are between rocks from different places that happen
       to share a colour, so narrowing the field before comparing beats any
       amount of tuning on the comparison itself — measured at 12/12 against
       9/12. Fall back to the whole collection when the zone is too thin to
       say anything, and label which pool the answer came from so a suggestion
       is never mistaken for more evidence than it is. */
    if (f.hist) {
      const labeled = (await db.all('finds')).filter(x => !x.deleted && x.label && x.id !== f.id);
      const inZone = f.zoneId ? labeled.filter(x => x.zoneId === f.zoneId) : [];
      const scoped = inZone.length >= 3;
      const pool = scoped ? inZone : labeled;
      const { results, confident } = rankByColor(unpackHist(f.hist), pool);
      const top = results.slice(0, 3).filter(r => r.score > 0.4);
      if (top.length) {
        let zoneName = '';
        if (scoped) {
          const site = f.siteId ? await db.get('sites', f.siteId) : null;
          zoneName = site?.zones?.find(z => z.id === f.zoneId)?.name || '';
        }
        const sug = el('div', { class: 'suggest' },
          el('span', { class: 'eyebrow' },
            (confident ? 'Likely match' : 'Similar colors')
            + (scoped && zoneName ? ` · in ${zoneName}` : '')));
        const row = el('div', { class: 'chips' });
        const seen = new Set();
        for (const r of top) {
          const key = r.find.label + '|' + r.find.material;
          if (seen.has(key)) continue; seen.add(key);
          row.appendChild(el('button', {
            class: 'chip chip-amber',
            onclick: () => this.commit(f, r.find.label, r.find.material)
          }, `${r.find.label} · ${(r.score * 100).toFixed(0)}%`));
        }
        sug.appendChild(row);
        host.appendChild(sug);
      }
    }

    const input = el('input', { id: 'q-label', class: 'text-input', type: 'text', placeholder: 'Name this find…', value: '' });
    host.appendChild(input);

    const chips = el('div', { class: 'chips' });
    if (this.lastLabel) chips.appendChild(el('button', { class: 'chip sel', onclick: () => this.commit(f, this.lastLabel, this.lastMaterial) }, `↺ ${this.lastLabel}`));
    for (const rl of settings.get('recentLabels', []).slice(0, 8)) {
      if (rl === this.lastLabel) continue;
      chips.appendChild(el('button', { class: 'chip', onclick: () => { input.value = rl; } }, rl));
    }
    host.appendChild(chips);

    const matSel = el('select', { id: 'q-mat', class: 'select' },
      el('option', { value: '' }, f.material ? `material: ${f.material}` : 'material…'),
      ...MATERIALS.map(m => el('option', { value: m }, m)));
    host.appendChild(matSel);

    host.appendChild(el('div', { class: 'q-actions' },
      el('button', { class: 'btn btn-ghost', onclick: () => { this.idx++; this.paintCurrent(host); } }, 'Skip'),
      el('button', {
        class: 'btn btn-primary', onclick: () => {
          const label = input.value.trim();
          if (!label) { toast('Give it a name first'); return; }
          this.commit(f, label, matSel.value || f.material);
        }
      }, 'Save & next')));

    host.appendChild(el('div', { class: 'q-meta mono dim-t' },
      fmtDate(f.createdAt) + ' · ' + (fmtCoord(f.lat, f.lon) || 'no location')));
  },

  async commit(f, label, material) {
    f.label = label;
    if (material) f.material = material;
    await db.put('finds', f);
    this.lastLabel = label; this.lastMaterial = material || f.material;
    const rl = settings.get('recentLabels', []);
    settings.set('recentLabels', [label, ...rl.filter(x => x !== label)].slice(0, 12));
    if (material) {
      const rm = settings.get('recentMaterials', []);
      settings.set('recentMaterials', [material, ...rm.filter(x => x !== material)].slice(0, 8));
    }
    bus.emit('finds-changed');
    this.idx++;
    this.paintCurrent($('#main'));
  }
};
/* ── collection: grid, filters, search ─────────────────────────── */
'use strict';
const collection = {
  filter: { q: '', material: '', siteId: '', fav: false },

  async render(host) {
    host.className = 'view light';
    host.innerHTML = '';
    const finds = (await db.all('finds')).filter(f => !f.deleted);
    finds.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    const sites = (await db.all('sites')).filter(s => !s.deleted);
    const siteName = Object.fromEntries(sites.map(s => [s.id, s.name]));

    host.appendChild(el('div', { class: 'coll-head' },
      el('h1', { class: 'display' }, 'Collection'),
      el('span', { class: 'mono dim-t' }, `${finds.length}`)));

    /* search + filters */
    const search = el('input', {
      class: 'text-input', type: 'search', placeholder: 'Search names & notes…',
      value: this.filter.q,
      oninput: e => { this.filter.q = e.target.value; this.paintGrid(finds, siteName); }
    });
    host.appendChild(search);

    const bar = el('div', { class: 'chips wrap' });
    const mats = [...new Set(finds.map(f => f.material).filter(Boolean))];
    for (const m of mats) {
      bar.appendChild(el('button', {
        class: 'chip' + (this.filter.material === m ? ' sel' : ''),
        onclick: e => {
          this.filter.material = this.filter.material === m ? '' : m;
          $$('.chip', bar).forEach(c => c.classList.remove('sel'));
          if (this.filter.material === m) e.currentTarget.classList.add('sel');
          if (this.filter.fav) $('#fav-chip')?.classList.add('sel');
          this.paintGrid(finds, siteName);
        }
      }, m));
    }
    bar.appendChild(el('button', {
      id: 'fav-chip',
      class: 'chip chip-amber' + (this.filter.fav ? ' sel' : ''),
      onclick: e => { this.filter.fav = !this.filter.fav; e.currentTarget.classList.toggle('sel'); this.paintGrid(finds, siteName); }
    }, '★ favorites'));
    host.appendChild(bar);

    host.appendChild(el('div', { id: 'grid', class: 'grid' }));
    await this.paintGrid(finds, siteName);
  },

  /* Every thumbnail is an ObjectURL, and an ObjectURL is a reference the
     browser holds until it is explicitly revoked — not when the <img> is
     removed. Re-rendering the grid on every keystroke of the search box used
     to leak one per card per render, which at 120 cards is a few hundred
     megabytes of pinned Blobs in a minute of typing. Track them and revoke
     on the next paint. */
  urls: [],
  releaseURLs() {
    for (const u of this.urls) URL.revokeObjectURL(u);
    this.urls = [];
  },

  async paintGrid(finds, siteName) {
    const grid = $('#grid'); if (!grid) return;
    this.releaseURLs();
    grid.innerHTML = '';
    if (this.io) { this.io.disconnect(); this.io = null; }

    const q = this.filter.q.trim().toLowerCase();
    const shown = finds.filter(f =>
      (!q || (f.label + ' ' + f.notes + ' ' + f.material).toLowerCase().includes(q)) &&
      (!this.filter.material || f.material === this.filter.material) &&
      (!this.filter.fav || f.favorite));
    if (!shown.length) {
      grid.appendChild(el('div', { class: 'empty' },
        el('p', {}, finds.length ? 'Nothing matches those filters.' : 'No finds yet — Field mode is where it starts.'),
        finds.length ? null
          : el('button', { class: 'btn btn-primary', onclick: () => router.go('field') }, 'Open field mode')));
      return;
    }

    /* Paged rather than capped. The old hard 120 silently hid everything past
       it, which for an app whose whole promise is "your collection" is the
       wrong failure — you would think finds had been lost. A sentinel at the
       end of the grid pulls the next page as it comes into view, so the
       collection is complete however large it gets. */
    const PAGE = 60;
    let drawn = 0;

    const drawPage = async () => {
      const slice = shown.slice(drawn, drawn + PAGE);
      for (const f of slice) {
        const card = el('button', { class: 'card', onclick: () => router.go('find/' + f.id) });
        const ph = f.photoIds[0] ? await db.get('photos', f.photoIds[0]) : null;
        const imgBox = el('div', { class: 'card-img' });
        if (ph) {
          const u = photoURL(ph, true);
          this.urls.push(u);
          imgBox.appendChild(el('img', { src: u, loading: 'lazy', alt: '' }));
        }
        card.appendChild(imgBox);
        card.appendChild(el('div', { class: 'strata', style: `background:${strataCSS(f.strata)}` }));
        card.appendChild(el('div', { class: 'card-body' },
          el('span', { class: 'card-title' }, (f.favorite ? '★ ' : '') + (f.label || 'unnamed')),
          el('span', { class: 'card-sub mono' }, [f.material, siteName[f.siteId]].filter(Boolean).join(' · ') || fmtDate(f.createdAt))));
        grid.appendChild(card);
      }
      drawn += slice.length;
      if (drawn >= shown.length && this.sentinel) {
        this.sentinel.remove();
        this.sentinel = null;
        if (this.io) { this.io.disconnect(); this.io = null; }
      }
    };

    await drawPage();

    if (drawn < shown.length) {
      this.sentinel = el('div', { class: 'grid-more mono' }, `${shown.length - drawn} more`);
      grid.appendChild(this.sentinel);
      if ('IntersectionObserver' in window) {
        this.io = new IntersectionObserver(async (entries) => {
          if (!entries.some(e => e.isIntersecting)) return;
          const remaining = shown.length - drawn;
          if (this.sentinel) this.sentinel.textContent = remaining > PAGE ? `${remaining} more` : 'loading…';
          await drawPage();
          if (this.sentinel) {
            grid.appendChild(this.sentinel);       // keep it last
            this.sentinel.textContent = `${shown.length - drawn} more`;
          }
        }, { rootMargin: '400px' });
        this.io.observe(this.sentinel);
      } else {
        /* No IntersectionObserver: a button still reaches every find. */
        this.sentinel.onclick = () => drawPage();
      }
    }
  },

  leave() { this.releaseURLs(); if (this.io) { this.io.disconnect(); this.io = null; } }
};

/* ── specimen detail ────────────────────────────────────────────── */
const detail = {
  /* Share one specimen — the photo plus what you called it. Deliberately does
     NOT include coordinates: sharing a rock with a friend should never quietly
     hand over the location it came from. That is the one piece of data this
     whole app exists to keep, and a share sheet is exactly where it would leak
     without anyone deciding to. */
  async share(f) {
    const label = f.label || 'Unnamed find';
    const text = [label, f.material, f.notes].filter(Boolean).join(' · ');
    try {
      const ph = f.photoIds && f.photoIds[0] ? await db.get('photos', f.photoIds[0]) : null;
      if (ph && navigator.canShare) {
        const file = new File([ph.full], `${label.replace(/[^\w -]/g, '') || 'find'}.jpg`,
          { type: ph.full.type || 'image/jpeg' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text });
          return;
        }
      }
      if (navigator.share) { await navigator.share({ text, title: label }); return; }
      await navigator.clipboard.writeText(text);
      toast('Copied');
    } catch (e) {
      if (e && e.name === 'AbortError') return;      // user closed the sheet; not an error
      toast('Could not share');
    }
  },
  async render(host, [id]) {
    const f = await db.get('finds', id);
    host.className = 'view light';
    host.innerHTML = '';
    if (!f || f.deleted) {
      host.appendChild(el('div', { class: 'empty' }, el('p', {}, 'Find not found.'),
        el('button', { class: 'btn btn-ghost', onclick: () => router.go('collection') }, 'Back to collection')));
      return;
    }
    const site = f.siteId ? await db.get('sites', f.siteId) : null;

    host.appendChild(el('div', { class: 'q-head' },
      el('button', { class: 'btn btn-ghost', onclick: () => history.back() }, '← Back'),
      el('button', {
        class: 'btn btn-ghost' + (f.favorite ? ' amber' : ''), onclick: async e => {
          f.favorite = !f.favorite; await db.put('finds', f);
          e.currentTarget.classList.toggle('amber', f.favorite);
          e.currentTarget.textContent = f.favorite ? '★' : '☆';
        }
      }, f.favorite ? '★' : '☆')));

    /* photos */
    const photos = [];
    for (const pid of f.photoIds) { const p = await db.get('photos', pid); if (p) photos.push(p); }
    const pv = el('div', { class: 'photo-pager' });
    if (photos.length) {
      photos.forEach((p) => {
        const img = el('img', { src: photoURL(p, false), alt: f.label || 'Specimen' });
        img.addEventListener('click', () => img.classList.toggle('zoom'));
        pv.appendChild(el('div', { class: 'photo-slide' }, img));
      });
    } else pv.appendChild(el('div', { class: 'photo-slide none' }, 'No photo'));
    host.appendChild(pv);
    host.appendChild(el('div', { class: 'strata tall', style: `background:${strataCSS(f.strata)}` }));

    /* editable fields */
    const nameIn = el('input', { class: 'text-input display-input', value: f.label, placeholder: 'unnamed' });
    nameIn.addEventListener('change', async () => { f.label = nameIn.value.trim(); await db.put('finds', f); bus.emit('finds-changed'); });
    host.appendChild(nameIn);

    const matSel = el('select', { class: 'select' },
      el('option', { value: '' }, 'material…'),
      ...MATERIALS.map(m => el('option', { value: m, selected: f.material === m ? '' : null }, m)));
    matSel.addEventListener('change', async () => { f.material = matSel.value; await db.put('finds', f); });
    host.appendChild(matSel);

    const notes = el('textarea', { class: 'text-input', rows: 3, placeholder: 'Notes — texture, weight, where in the creek…' }, f.notes || '');
    notes.addEventListener('change', async () => { f.notes = notes.value; await db.put('finds', f); });
    host.appendChild(notes);

    /* meta */
    const coord = fmtCoord(f.lat, f.lon);
    host.appendChild(el('div', { class: 'meta-block mono' },
      el('div', {}, 'logged  ' + fmtDate(f.createdAt) + ' ' + fmtTime(f.createdAt)),
      site ? el('div', {}, 'site    ' + site.name) : null,
      coord ? el('a', { href: `https://maps.google.com/?q=${f.lat},${f.lon}`, target: '_blank', rel: 'noopener' }, 'gps     ' + coord + ' ↗') : el('div', {}, 'gps     —')));

    /* similar finds */
    if (f.hist) {
      const all = (await db.all('finds')).filter(x => !x.deleted && x.id !== f.id && x.hist);
      const { results } = rankByColor(unpackHist(f.hist), all);
      const top = results.slice(0, 4).filter(r => r.score > 0.35);
      if (top.length) {
        host.appendChild(el('h3', { class: 'eyebrow' }, 'Similar colors in your collection'));
        const row = el('div', { class: 'sim-row' });
        /* Name the SITE on each match, not just the specimen. This is the
           whole point of the feature: you are holding a rock out of the
           garden and the question is not "which of my photos does this look
           like", it is "where did I pick this up". A match that cannot answer
           that is trivia. Sites are fetched once and shared across the row. */
        const siteName = {};
        for (const s of await db.all('sites')) siteName[s.id] = s.name;
        for (const r of top) {
          const ph = r.find.photoIds[0] ? await db.get('photos', r.find.photoIds[0]) : null;
          const where = r.find.siteId ? siteName[r.find.siteId] : null;
          const cell = el('button', { class: 'sim-cell', onclick: () => router.go('find/' + r.find.id) },
            ph ? el('img', { src: photoURL(ph, true), alt: '' }) : el('span', {}, '·'),
            el('span', { class: 'sim-label mono' }, `${r.find.label || 'unnamed'} ${(r.score * 100).toFixed(0)}%`),
            el('span', { class: 'from-site' }, where ? where : (r.find.lat != null ? 'no site named' : '')));
          row.appendChild(cell);
        }
        host.appendChild(row);
      }
    }

    /* actions */
    const addPhoto = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    addPhoto.addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      const { photo, hist, strata } = await savePhoto(file, f.id);
      f.photoIds.push(photo.id);
      if (!f.hist) { f.hist = hist; f.strata = strata; }
      await db.put('finds', f);
      toast('Photo added');
      this.render(host, [f.id]);
    });
    host.appendChild(addPhoto);

    host.appendChild(el('div', { class: 'q-actions' },
      el('button', { class: 'btn btn-ghost', onclick: () => addPhoto.click() }, '+ Photo'),
      el('button', { class: 'btn btn-ghost', onclick: () => detail.share(f) }, 'Share'),
      el('button', {
        class: 'btn btn-danger', onclick: async () => {
          if (!confirm('Delete this find?')) return;
          f.deleted = true; await db.put('finds', f);
          bus.emit('finds-changed');
          toast('Deleted');
          router.go('collection');
        }
      }, 'Delete')));
  }
};
/* ── sites & trips ──────────────────────────────────────────────── */
'use strict';
const trips = {
  async render(host) {
    host.className = 'view light';
    host.innerHTML = '';
    const allSites = (await db.all('sites')).filter(s => !s.deleted);
    const allTrips = (await db.all('trips')).filter(t => !t.deleted);
    allTrips.sort((a, b) => b.startedAt.localeCompare(a.startedAt));
    const finds = (await db.all('finds')).filter(f => !f.deleted);
    const perTrip = {};
    for (const f of finds) if (f.tripId) (perTrip[f.tripId] = perTrip[f.tripId] || []).push(f);
    const siteName = Object.fromEntries(allSites.map(s => [s.id, s.name]));

    host.appendChild(el('div', { class: 'coll-head' },
      el('h1', { class: 'display' }, 'Sites & trips'),
      el('button', { class: 'btn btn-primary', onclick: () => this.startTrip(allSites) }, 'Start trip')));

    /* active trip banner */
    const active = allTrips.find(t => !t.endedAt);
    if (active) {
      host.appendChild(el('div', { class: 'active-trip' },
        el('div', {},
          el('strong', {}, siteName[active.siteId] || 'Trip in progress'),
          el('div', { class: 'mono dim-t' }, `since ${fmtTime(active.startedAt)} · ${(perTrip[active.id] || []).length} finds`)),
        el('button', {
          class: 'btn btn-ghost', onclick: async () => {
            active.endedAt = nowISO(); await db.put('trips', active);
            app.state.activeTrip = null;
            toast('Trip ended'); this.render(host);
          }
        }, 'End')));
    }

    /* sites */
    host.appendChild(el('h3', { class: 'eyebrow' }, 'Sites'));
    const siteList = el('div', { class: 'list' });
    for (const s of allSites) {
      const count = finds.filter(f => f.siteId === s.id).length;
      siteList.appendChild(el('div', { class: 'list-row' },
        el('div', { class: 'list-main' },
          el('strong', {}, s.name),
          el('span', { class: 'mono dim-t' }, `${s.landType} · ${s.collectStatus} · ${count} finds`)),
        el('button', { class: 'btn btn-ghost', onclick: () => this.editSite(s, host) }, 'Edit')));
    }
    siteList.appendChild(el('button', { class: 'btn btn-ghost add-row', onclick: () => this.editSite(null, host) }, '+ Add site'));
    host.appendChild(siteList);

    /* trip history */
    host.appendChild(el('h3', { class: 'eyebrow' }, 'Trip log'));
    const tl = el('div', { class: 'list' });
    for (const t of allTrips.slice(0, 30)) {
      const tf = perTrip[t.id] || [];
      const row = el('button', { class: 'list-row tap', onclick: () => router.go('trip/' + t.id) },
        el('div', { class: 'list-main' },
          el('strong', {}, siteName[t.siteId] || 'No site'),
          el('span', { class: 'mono dim-t' }, `${fmtDate(t.startedAt)} · ${tf.length} finds${t.endedAt ? '' : ' · active'}`)),
        tf.length ? el('div', { class: 'mini-strata', style: `background:${strataCSS(tf.flatMap(f => f.strata || []).slice(0, 6))}` }) : null);
      tl.appendChild(row);
    }
    if (!allTrips.length) tl.appendChild(el('p', { class: 'dim-t' }, 'No trips yet. Start one, then log finds in Field mode.'));
    host.appendChild(tl);
