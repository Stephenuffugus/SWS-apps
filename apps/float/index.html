const backup = {
  blobToB64: blob => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  }),
  b64ToBlob: (b64, type = 'image/jpeg') => {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type });
  },

  async serialize() {
    const out = { app: 'float', version: FLOAT_VERSION, exportedAt: nowISO(), sites: [], trips: [], finds: [], photos: [] };
    out.sites = await db.all('sites');
    out.trips = await db.all('trips');
    out.finds = await db.all('finds');
    const photos = await db.all('photos');
    for (const p of photos) {
      out.photos.push({
        id: p.id, findId: p.findId, w: p.w, h: p.h,
        createdAt: p.createdAt, updatedAt: p.updatedAt, deleted: p.deleted,
        fullB64: p.full ? await this.blobToB64(p.full) : null,
        thumbB64: p.thumb ? await this.blobToB64(p.thumb) : null
      });
    }
    return out;
  },

  /* CSV of the catalogue, no photos. Deliberately a separate thing from the
     JSON backup: the backup is for restoring this app, the CSV is for leaving
     it — a copy of the record that outlives the format and opens anywhere. */
  async exportCSV() {
    const [finds, sites] = await Promise.all([db.all('finds'), db.all('sites')]);
    const live = finds.filter(f => !f.deleted)
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    if (!live.length) { toast('Nothing to export yet'); return; }

    const siteById = Object.fromEntries(sites.map(s => [s.id, s]));
    /* Excel and Sheets both treat a leading = + - @ as a formula, so a note
       beginning with one becomes executable on open. Prefix with an apostrophe
       — the same defence home-inventory uses on its CSV. */
    const cell = (v) => {
      let s = v == null ? '' : String(v);
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const head = ['label', 'material', 'site', 'zone', 'found', 'latitude', 'longitude',
      'gps_accuracy_m', 'favorite', 'notes'];
    const rows = live.map(f => {
      const site = f.siteId ? siteById[f.siteId] : null;
      const zone = site && f.zoneId ? (site.zones || []).find(z => z.id === f.zoneId) : null;
      return [f.label, f.material, site ? site.name : '', zone ? zone.name : '',
        f.createdAt, f.lat ?? '', f.lon ?? '', f.gpsAccuracy != null ? Math.round(f.gpsAccuracy) : '',
        f.favorite ? 'yes' : '', f.notes].map(cell).join(',');
    });
    /* BOM so Excel reads the degree signs and any non-ASCII place name as UTF-8. */
    const blob = new Blob(['﻿' + head.join(',') + '\n' + rows.join('\n')],
      { type: 'text/csv;charset=utf-8' });
    const a = el('a', {
      href: URL.createObjectURL(blob),
      download: `float-catalogue-${new Date().toISOString().slice(0, 10)}.csv`
    });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`${live.length} finds exported`);
  },

  async exportAll() {
    toast('Building backup…');
    const data = await this.serialize();
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = el('a', {
      href: URL.createObjectURL(blob),
      download: `float-backup-${new Date().toISOString().slice(0, 10)}.json`
    });
    document.body.appendChild(a); a.click(); a.remove();
    toast('Backup exported');
  },

  async deserialize(data, mode = 'merge') {
    if (data.app !== 'float') throw new Error('Not a Float backup');
    if (mode === 'replace') for (const s of STORES) if (s !== 'settings') await db.clear(s);
    for (const s of data.sites || []) await db.put('sites', s);
    for (const t of data.trips || []) await db.put('trips', t);
    for (const f of data.finds || []) await db.put('finds', f);
    for (const p of data.photos || []) {
      await db.put('photos', {
        id: p.id, findId: p.findId, w: p.w, h: p.h,
        createdAt: p.createdAt, updatedAt: p.updatedAt, deleted: p.deleted,
        full: p.fullB64 ? this.b64ToBlob(p.fullB64) : null,
        thumb: p.thumbB64 ? this.b64ToBlob(p.thumbB64) : null
      });
    }
    return { sites: (data.sites || []).length, finds: (data.finds || []).length, photos: (data.photos || []).length };
  },

  async importAll(file) {
    try {
      const data = JSON.parse(await file.text());
      const n = await this.deserialize(data, 'merge');
      bus.emit('finds-changed');
      toast(`Restored ${n.finds} finds, ${n.photos} photos`);
      app.rerender();
    } catch (e) {
      toast('That file is not a Float backup');
    }
  }
};

/* ── map ──────────────────────────────────────────────────────────
   WHY THERE ARE NO MAP TILES HERE, AND WHY THAT IS THE POINT.

   The obvious way to build this is Leaflet over OpenStreetMap tiles.
   It is also the one thing this app must not do. A tile map works by
   requesting images for the exact rectangle you are looking at — so
   the moment you open your map, a third-party server receives your IP
   alongside the precise coordinates of every spot you have found
   anything at. Rockhounding locations are the thing people guard most
   closely, and "your spots never leave your device" would become false
   at the exact moment you looked at them. It would also break the
   file's own rule: no network calls without a flag the user turned on.

   So the map is drawn here, from your own points, in a real Web
   Mercator projection with a true scale bar. What you lose is the
   basemap — no roads, no rivers, no terrain. What you keep is that the
   map of your spots exists only on your phone.

   If a basemap is ever wanted, the honest shape is an explicit opt-in
   that says plainly what it sends and to whom, defaulting off — never
   a silent tile fetch.
   ─────────────────────────────────────────────────────────────────── */
const R_EARTH = 6378137;

const geo = {
  /* Web Mercator, metres. Equal-angle so a rotated compass still reads true;
     latitude clamped to the Mercator limit so a pole cannot produce Infinity. */
  merc(lat, lon) {
    const la = Math.max(-85.05112878, Math.min(85.05112878, lat));
    return {
      x: R_EARTH * (lon * Math.PI / 180),
      y: R_EARTH * Math.log(Math.tan(Math.PI / 4 + (la * Math.PI / 180) / 2))
    };
  },
  /* Great-circle metres — used for the scale bar and "how far away am I". */
  dist(a, b) {
    const t = Math.PI / 180;
    const dLat = (b.lat - a.lat) * t, dLon = (b.lon - a.lon) * t;
    const s = Math.sin(dLat / 2) ** 2
      + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLon / 2) ** 2;
    return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(s)));
  },
  fmtDist(m) {
    if (m < 1000) return Math.round(m) + ' m';
    if (m < 100000) return (m / 1000).toFixed(1) + ' km';
    return Math.round(m / 1000) + ' km';
  }
};

/* A site's position on the map. Sites are created without coordinates — you
   name the place before you know where the middle of it is — so fall back to
   the centroid of everything found there. That is usually a truer centre than
   the point where you happened to park. */
const siteCoord = (site, finds) => {
  if (site.lat != null && site.lon != null) return { lat: site.lat, lon: site.lon, derived: false };
  const pts = finds.filter(f => f.siteId === site.id && f.lat != null && f.lon != null);
  if (!pts.length) return null;
  return {
    lat: pts.reduce((s, f) => s + f.lat, 0) / pts.length,
    lon: pts.reduce((s, f) => s + f.lon, 0) / pts.length,
    derived: true
  };
};

const mapview = {
  view: null,          // {cx, cy, mpp}  centre in mercator metres, metres-per-pixel
  pins: [],
  here: null,
  watchId: null,

  async render(host) {
    host.className = 'view light';
    host.innerHTML = '';
    host.appendChild(el('h2', { class: 'view-title' }, 'Map'));

    const [sites, finds] = await Promise.all([db.all('sites'), db.all('finds')]);
    const live = finds.filter(f => !f.deleted);

    this.pins = sites.filter(s => !s.deleted).map(s => {
      const c = siteCoord(s, live);
      if (!c) return null;
      const mine = live.filter(f => f.siteId === s.id);
      return { kind: 'site', site: s, ...c, count: mine.length, finds: mine };
    }).filter(Boolean);

    /* Finds logged with no site still deserve to appear — they are the
       "I found this somewhere and never named the place" case, and seeing
       them on the map is usually how a place ends up getting named. */
    const loose = live.filter(f => !f.siteId && f.lat != null && f.lon != null)
      .map(f => ({ kind: 'find', find: f, lat: f.lat, lon: f.lon, count: 1 }));
    this.pins = this.pins.concat(loose);

    if (!this.pins.length) {
      host.appendChild(el('div', { class: 'empty' },
        el('p', {}, 'No coordinates yet.'),
        el('p', { class: 'sub' },
          'Log a find in Field mode with GPS on, or set a site’s coordinates on the '
          + 'Sites screen, and it appears here. Nothing you pin is ever uploaded — the '
          + 'map is drawn on this device from your own points.'),
        el('button', { class: 'btn btn-primary', onclick: () => router.go('field') }, 'Open field mode')));
      return;
    }

    const wrap = el('div', { class: 'map-wrap' });
    const cv = el('canvas', { class: 'map-cv', id: 'mapcv' });
    wrap.appendChild(cv);

    const zin  = el('button', { class: 'map-btn', 'aria-label': 'Zoom in',  onclick: () => this.zoom(0.6) }, '+');
    const zout = el('button', { class: 'map-btn', 'aria-label': 'Zoom out', onclick: () => this.zoom(1 / 0.6) }, '−');
    const fit  = el('button', { class: 'map-btn', 'aria-label': 'Fit all pins', onclick: () => { this.fit(); this.draw(); } }, '⬚');
    wrap.appendChild(el('div', { class: 'map-ctl' }, zin, zout, fit));
    wrap.appendChild(el('div', { class: 'map-scale', id: 'mapscale' }));
    host.appendChild(wrap);

    const sheet = el('div', { class: 'map-sheet', id: 'mapsheet' });
    host.appendChild(sheet);
    host.appendChild(el('p', { class: 'map-note' },
      'Drawn on this device from your own coordinates. There is no basemap because '
      + 'fetching one would send these locations to a tile server.'));

    this.cv = cv;
    this.sheet = sheet;
    this.fit();
    this.bind(cv);
    requestAnimationFrame(() => { this.resize(); this.draw(); });

    this._onResize = () => { this.resize(); this.draw(); };
    window.addEventListener('resize', this._onResize);
  },

  leave() {
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this.watchId != null && navigator.geolocation) {
      navigator.geolocation.clearWatch(this.watchId);
      this.watchId = null;
    }
  },

  resize() {
    const cv = this.cv; if (!cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    this.dpr = dpr;
  },

  fit() {
    const ms = this.pins.map(p => geo.merc(p.lat, p.lon));
    const xs = ms.map(m => m.x), ys = ms.map(m => m.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const cv = this.cv;
    const w = (cv?.clientWidth || 360), h = (cv?.clientHeight || 340);
    /* A single pin has no extent, so give it a sensible neighbourhood
       (about 400m across) rather than dividing by zero. */
    const spanX = Math.max(maxX - minX, 1), spanY = Math.max(maxY - minY, 1);
    const mpp = this.pins.length === 1 ? 1.6 : Math.max(spanX / (w * 0.72), spanY / (h * 0.72));
    this.view = { cx, cy, mpp: Math.max(mpp, 0.15) };
  },

  zoom(factor, anchor) {
    const v = this.view; if (!v) return;
    const next = Math.max(0.15, Math.min(v.mpp * factor, 40000));
    if (anchor) {
      /* Keep the point under the fingers fixed while the scale changes. */
      const before = this.toWorld(anchor.x, anchor.y);
      v.mpp = next;
      const after = this.toWorld(anchor.x, anchor.y);
      v.cx += before.x - after.x;
      v.cy += before.y - after.y;
    } else {
      v.mpp = next;
    }
    this.draw();
  },

  toScreen(x, y) {
    const v = this.view, cv = this.cv;
    return {
      sx: (x - v.cx) / v.mpp + cv.clientWidth / 2,
      sy: cv.clientHeight / 2 - (y - v.cy) / v.mpp     // mercator y grows north, screen y grows down
    };
  },
  toWorld(sx, sy) {
    const v = this.view, cv = this.cv;
    return {
      x: v.cx + (sx - cv.clientWidth / 2) * v.mpp,
      y: v.cy - (sy - cv.clientHeight / 2) * v.mpp
    };
  },

  bind(cv) {
    let drag = null, pinch = null;

    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, x: e.offsetX, y: e.offsetY, moved: 0 };
    });
    cv.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId || pinch) return;
      const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      this.view.cx -= dx * this.view.mpp;
      this.view.cy += dy * this.view.mpp;
      drag.x = e.offsetX; drag.y = e.offsetY;
      this.draw();
    });
    const end = (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      /* A tap is a press that did not travel. 8px of slop, because a thumb on
         a phone in a gravel pit is not a mouse. */
      if (drag.moved < 8) this.hit(e.offsetX, e.offsetY);
      drag = null;
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', () => { drag = null; });

    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoom(e.deltaY > 0 ? 1.18 : 1 / 1.18, { x: e.offsetX, y: e.offsetY });
    }, { passive: false });

    /* Two-finger pinch. touch-action:none on the canvas keeps the page from
       scrolling out from under the gesture. */
    let lastGap = 0;
    cv.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const [a, b] = e.touches;
      const gap = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (lastGap) {
        const r = cv.getBoundingClientRect();
        this.zoom(lastGap / gap, {
          x: (a.clientX + b.clientX) / 2 - r.left,
          y: (a.clientY + b.clientY) / 2 - r.top
        });
      }
      lastGap = gap;
      pinch = true;
    }, { passive: false });
    cv.addEventListener('touchend', () => { lastGap = 0; pinch = null; });
  },

  hit(sx, sy) {
    let best = null, bestD = 30;
    for (const p of this.pins) {
      const m = geo.merc(p.lat, p.lon);
      const s = this.toScreen(m.x, m.y);
      const d = Math.hypot(s.sx - sx, s.sy - sy);
      if (d < bestD) { bestD = d; best = p; }
    }
    this.selected = best;
    this.draw();
    this.showSheet(best);
  },

  async showSheet(p) {
    const sheet = this.sheet;
    sheet.innerHTML = '';
    if (!p) { sheet.classList.remove('open'); return; }
    sheet.classList.add('open');

    if (p.kind === 'find') {
      sheet.appendChild(el('p', { class: 'eyebrow' }, 'Find with no site'));
      sheet.appendChild(el('h3', { class: 'sheet-title' }, p.find.label || 'Unnamed find'));
      sheet.appendChild(el('button', {
        class: 'btn btn-primary full', onclick: () => router.go('find/' + p.find.id)
      }, 'Open this find'));
      return;
    }

    sheet.appendChild(el('p', { class: 'eyebrow' },
      p.derived ? 'Site · centre from your finds' : 'Site'));
    sheet.appendChild(el('h3', { class: 'sheet-title' }, p.site.name));
    sheet.appendChild(el('p', { class: 'sheet-sub mono' },
      `${p.count} ${p.count === 1 ? 'find' : 'finds'} · ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`));

    const strip = el('div', { class: 'sheet-strip' });
    for (const f of p.finds.slice(0, 12)) {
      const ph = f.photoIds && f.photoIds[0] ? await db.get('photos', f.photoIds[0]) : null;
      strip.appendChild(el('button', {
        class: 'sheet-cell', onclick: () => router.go('find/' + f.id),
        title: f.label || 'unnamed'
      }, ph ? el('img', { src: photoURL(ph, true), alt: '' })
            : el('span', { class: 'sheet-blank' }, '·')));
    }
    if (p.finds.length) sheet.appendChild(strip);

    sheet.appendChild(el('button', {
      class: 'btn btn-primary full', onclick: () => router.go('site/' + p.site.id)
    }, `Everything from ${p.site.name}`));
  },

  draw() {
    const cv = this.cv, v = this.view;
    if (!cv || !v) return;
    const ctx = cv.getContext('2d');
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = '#F3F4F0';
    ctx.fillRect(0, 0, w, h);

    /* A graticule at a round number of metres. Without some reference the
       pins float in a void and the eye cannot judge distance at all. */
    const targetPx = 76;
    const raw = targetPx * v.mpp;
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 5, 10].map(m => m * pow).find(s => s >= raw) || pow * 10;
    const px = step / v.mpp;
    const originX = ((-v.cx / v.mpp + w / 2) % px + px) % px;
    const originY = ((v.cy / v.mpp + h / 2) % px + px) % px;
    ctx.strokeStyle = '#DFE1DA';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = originX; x < w; x += px) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, h); }
    for (let y = originY; y < h; y += px) { ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(w, Math.round(y) + .5); }
    ctx.stroke();

    if (this.here) {
      const m = geo.merc(this.here.lat, this.here.lon);
      const s = this.toScreen(m.x, m.y);
      if (this.here.acc) {
        ctx.fillStyle = 'rgba(62,122,107,.14)';
        ctx.beginPath();
        ctx.arc(s.sx, s.sy, Math.max(6, this.here.acc / v.mpp), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#3E7A6B';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(s.sx, s.sy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    for (const p of this.pins) {
      const m = geo.merc(p.lat, p.lon);
      const s = this.toScreen(m.x, m.y);
      if (s.sx < -60 || s.sx > w + 60 || s.sy < -60 || s.sy > h + 60) continue;
      const sel = this.selected === p;
      const site = p.kind === 'site';
      const r = site ? (sel ? 15 : 12) : 6;

      ctx.beginPath();
      if (site) {
        /* A teardrop, so a site reads as a place and a loose find as a dot.
           The moveTo is what makes the point: it draws the tip at the actual
           coordinate, then the arc rounds the head above it. */
        ctx.moveTo(s.sx, s.sy);
        ctx.arc(s.sx, s.sy - r, r, Math.PI * 0.15, Math.PI * 0.85, true);
        ctx.closePath();
      } else {
        /* No moveTo here — starting a circle from the centre leaves a spoke
           from the middle to the arc's start and the dot renders as a pac-man. */
        ctx.arc(s.sx, s.sy, r, 0, Math.PI * 2);
      }
      ctx.fillStyle = site ? (sel ? '#2E5C51' : '#3E7A6B') : '#C9873B';
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

      if (site && p.count) {
        ctx.fillStyle = '#fff';
        ctx.font = '600 11px ui-monospace, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(p.count), s.sx, s.sy - r);
      }
      if (site && (sel || v.mpp < 60)) {
        const label = p.site.name;
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(237,238,234,.92)';
        ctx.fillRect(s.sx - tw / 2 - 5, s.sy + 5, tw + 10, 17);
        ctx.fillStyle = '#22271F';
        ctx.fillText(label, s.sx, s.sy + 7);
      }
    }

    const bar = $('#mapscale');
    if (bar) {
      bar.style.width = Math.round(px) + 'px';
      bar.textContent = step >= 1000 ? (step / 1000) + ' km' : step + ' m';
    }
  }
};

/* ── one trip, on a timeline ────────────────────────────────────── */
const tripdetail = {
  async render(host, args) {
    const id = args && args[0];
    host.className = 'view light';
    host.innerHTML = '';
    const trip = await db.get('trips', id);
    if (!trip || trip.deleted) {
      host.appendChild(el('p', { class: 'empty' }, 'That trip is gone.'));
      return;
    }
    const site = trip.siteId ? await db.get('sites', trip.siteId) : null;
    const mine = (await db.all('finds'))
      .filter(f => !f.deleted && f.tripId === trip.id)
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt));   // the order you found them

    host.appendChild(el('button', { class: 'btn btn-ghost back', onclick: () => router.go('trips') }, '‹ Sites & trips'));
    host.appendChild(el('h2', { class: 'view-title' }, site ? site.name : 'Trip'));
    const ended = trip.endedAt ? fmtTime(trip.endedAt) : 'still open';
    host.appendChild(el('p', { class: 'sheet-sub mono' },
      `${fmtDate(trip.startedAt)} · ${fmtTime(trip.startedAt)} → ${ended} · ${mine.length} ${mine.length === 1 ? 'find' : 'finds'}`));

    if (mine.length) {
      host.appendChild(el('div', { class: 'strata', style: `background:${strataCSS(mine.flatMap(f => f.strata || []).slice(0, 8))}` }));
    }
    if (site && trip.siteId) {
      host.appendChild(el('button', { class: 'btn btn-ghost', onclick: () => router.go('site/' + site.id) },
        `Everything from ${site.name}`));
    }

    if (!mine.length) {
      host.appendChild(el('p', { class: 'empty sub' }, 'Nothing was logged on this trip.'));
      return;
    }

    /* A timeline rather than a grid: the interesting thing about a trip is the
       order and the gaps — where you slowed down is usually where the good
       material was. */
    const zoneName = {};
    for (const z of (site?.zones || [])) zoneName[z.id] = z.name;
    const line = el('div', { class: 'timeline' });
    for (const f of mine) {
      const ph = f.photoIds && f.photoIds[0] ? await db.get('photos', f.photoIds[0]) : null;
      line.appendChild(el('button', {
        class: 'tl-row', onclick: () => router.go('find/' + f.id)
      },
        el('span', { class: 'tl-time mono' }, fmtTime(f.createdAt)),
        el('span', { class: 'tl-dot' }),
        el('span', { class: 'tl-thumb' },
          ph ? el('img', { src: photoURL(ph, true), alt: '', loading: 'lazy' }) : el('span', {}, '·')),
        el('span', { class: 'tl-main' },
          el('strong', {}, f.label || 'unnamed'),
          el('span', { class: 'mono dim-t' },
            [f.material, f.zoneId ? zoneName[f.zoneId] : null].filter(Boolean).join(' · ')))));
    }
    host.appendChild(line);
  }
};

/* ── one site, and everything found there ───────────────────────── */
const sitedetail = {
  async render(host, args) {
    const id = args && args[0];
    host.className = 'view light';
    host.innerHTML = '';

    const site = await db.get('sites', id);
    if (!site || site.deleted) {
      host.appendChild(el('p', { class: 'empty' }, 'That site is gone.'));
      return;
    }

    const all = (await db.all('finds')).filter(f => !f.deleted);
    const mine = all.filter(f => f.siteId === site.id);
    const c = siteCoord(site, all);

    host.appendChild(el('button', { class: 'btn btn-ghost back', onclick: () => router.go('map') }, '‹ Map'));
    host.appendChild(el('h2', { class: 'view-title' }, site.name));
    host.appendChild(el('p', { class: 'sheet-sub mono' },
      `${mine.length} ${mine.length === 1 ? 'find' : 'finds'}`
      + (c ? ` · ${c.lat.toFixed(5)}, ${c.lon.toFixed(5)}${c.derived ? ' (from your finds)' : ''}` : '')));

    if (site.notes) host.appendChild(el('p', { class: 'site-notes' }, site.notes));

    if (!mine.length) {
      host.appendChild(el('p', { class: 'empty sub' }, 'Nothing logged here yet.'));
      return;
    }

    const grid = el('div', { class: 'grid' });
    for (const f of mine) {
      const ph = f.photoIds && f.photoIds[0] ? await db.get('photos', f.photoIds[0]) : null;
      const card = el('button', { class: 'card', onclick: () => router.go('find/' + f.id) });
      if (ph) card.appendChild(el('img', { src: photoURL(ph, true), alt: '', loading: 'lazy' }));
      if (f.strata) card.appendChild(el('div', { class: 'strata', style: strataCSS(f.strata) }));
      card.appendChild(el('span', { class: 'card-label' }, f.label || 'unnamed'));
      grid.appendChild(card);
    }
    host.appendChild(grid);
  }
};

/* ── first run ────────────────────────────────────────────────────
   The default route is Field mode, which opens straight into a camera
   viewfinder. That is right for the hundredth use and wrong for the
   first: a stranger sees a live camera, a row of rock names and a
   shutter, and has to guess what the app is for and where anything
   goes afterwards.

   Shown once, then never again. It says the loop, the promise, and
   gets out of the way — no account step, no tour, no carousel. Both
   buttons start you doing the thing; there is no "skip" because
   neither option is a commitment. */
const welcome = {
  seen() { return !!settings.get('seenWelcome'); },

  async dismiss(go) {
    await settings.set('seenWelcome', true);
    const w = $('#welcome');
    if (w) w.remove();
    document.body.classList.remove('welcoming');
    router.go(go);
  },

  show() {
    if (this.seen()) return false;
    document.body.classList.add('welcoming');
    const step = (n, title, body) => el('li', { class: 'wc-step' },
      el('span', { class: 'wc-n mono' }, n),
      el('div', {}, el('strong', {}, title), el('span', { class: 'wc-body' }, body)));

    const panel = el('div', { id: 'welcome', class: 'wc' },
      el('div', { class: 'wc-inner' },
        el('div', { class: 'gate-mark' }, '◈'),
        el('h1', { class: 'gate-title' }, 'Float'),
        el('p', { class: 'gate-sub' }, 'A field log for what you pick up'),

        el('ol', { class: 'wc-steps' },
          step('1', 'Shoot it where you find it',
            'Field mode is a camera. Tap the shutter and the find is logged with the time, '
            + 'your GPS fix and the colour of the rock itself.'),
          step('2', 'Name it later, at the table',
            'Everything unnamed waits in the Queue. It offers matches from what you have '
            + 'already labelled, so the tenth agate names itself.'),
          step('3', 'Find out where it came from',
            'Sites and trips remember the places. Hold a rock from the garden up to the '
            + 'camera and the collection tells you which spot it came out of.')),

        el('p', { class: 'wc-promise' },
          'Every photo, note and coordinate stays in this browser, on this device. '
          + 'There is no account and no server — not even the map, which is drawn '
          + 'here rather than fetched, so your spots are never sent anywhere.'),

        el('div', { class: 'wc-actions' },
          el('button', { class: 'btn btn-primary full', onclick: () => this.dismiss('trips') },
            'Name a site first'),
          el('button', { class: 'btn btn-ghost full', onclick: () => this.dismiss('field') },
            'Just start shooting'))));

    document.body.appendChild(panel);
    return true;
  }
};

/* ── development gate ─────────────────────────────────────────────
   FLOAT is unfinished and deployed alongside the public apps, so this
   curtain keeps it out of the hands of anyone who wanders in.

   Be clear about what this is and is not. It is NOT security: the
   passphrase is in the source of a file anyone can read, and a gate
   written in the page it guards can always be walked around. It does
   not need to be security — every find, photo and coordinate lives in
   IndexedDB on this device and has never been anywhere else, so there
   is nothing here for a stranger to reach even if they get past it.
   What it buys is that an unfinished app does not look shipped.

   Remove this whole block on the day FLOAT goes public. It is the only
   thing in the file that assumes a build stage.
   ─────────────────────────────────────────────────────────────────── */
const DEV_PASS = 'wolfden';
const DEV_KEY  = 'float.dev.unlocked';

const devgate = {
  get unlocked() {
    try { return localStorage.getItem(DEV_KEY) === DEV_PASS; } catch (e) { return false; }
  },

  render() {
    document.body.classList.add('gated');
    const main = $('#main');
    main.innerHTML = '';
    $('#tabbar').innerHTML = '';

    const input = el('input', {
      type: 'password', id: 'devpass', autocomplete: 'off', autocapitalize: 'none',
      autocorrect: 'off', spellcheck: 'false', placeholder: 'passphrase',
      'aria-describedby': 'devhint',
      onkeydown: (ev) => { if (ev.key === 'Enter') submit(); }
    });
    const err = el('p', { class: 'gate-err', role: 'alert' });

    const submit = () => {
      if (input.value.trim().toLowerCase() !== DEV_PASS) {
        err.textContent = 'Not that one.';
        input.value = '';
        input.focus();
        return;
      }
      try { localStorage.setItem(DEV_KEY, DEV_PASS); } catch (e) { /* private mode: gate holds for this load only */ }
      document.body.classList.remove('gated');
      app.start();
    };

    main.appendChild(el('div', { class: 'gate' },
      el('div', { class: 'gate-mark' }, '◈'),
      el('h1', { class: 'gate-title' }, 'FLOAT'),
      el('p', { class: 'gate-sub' }, 'Rockhounding field log · in development'),
      el('label', { class: 'gate-label', for: 'devpass' }, 'Passphrase'),
      input,
      el('button', { class: 'btn btn-primary gate-go', onclick: submit }, 'Enter'),
      err,
      el('p', { class: 'gate-note', id: 'devhint' },
        'Sky Wolf Studios · this one is not finished yet. Your finds, photos and '
        + 'coordinates stay in this browser on this device either way — the gate is here so an '
        + 'unfinished app does not look shipped, not to protect the data.')
    ));
    input.focus();
  }
};

/* ── app shell ──────────────────────────────────────────────────── */
const app = {
  state: { fieldMaterial: '', fieldZone: null, activeTrip: null },
  current: null,

  tabs: [
    { name: 'field', label: 'Field', icon: '◉' },
    { name: 'queue', label: 'Queue', icon: '◫' },
    { name: 'collection', label: 'Collection', icon: '▦' },
    { name: 'map', label: 'Map', icon: '⌖' },
    { name: 'more', label: 'More', icon: '≡' }
  ],

  paintTabs(active) {
    const bar = $('#tabbar');
    bar.innerHTML = '';
    for (const t of this.tabs) {
      const b = el('button', {
        class: 'tab' + (active === t.name ? ' active' : ''),
        onclick: () => router.go(t.name)
      }, el('span', { class: 'tab-icon' }, t.icon), el('span', {}, t.label));
      if (t.name === 'queue') {
        const badge = el('span', { class: 'badge', id: 'q-badge', style: 'display:none' });
        b.appendChild(badge);
      }
      bar.appendChild(b);
    }
    this.updateBadge();
  },

  async updateBadge() {
    const n = (await db.all('finds')).filter(f => !f.deleted && !f.label).length;
    const badge = $('#q-badge');
    if (badge) { badge.textContent = n; badge.style.display = n ? '' : 'none'; }
  },

  async route(name, args) {
    if (this.current === 'field' && name !== 'field') field.leave();
    if (this.current === 'map' && name !== 'map') mapview.leave();
    if (this.current === 'collection' && name !== 'collection') collection.leave();
    this.current = name;
    const main = $('#main');
    window.scrollTo(0, 0);
    const tabName = ['find', 'trips', 'stats', 'site', 'trip'].includes(name)
      ? (name === 'find' ? 'collection' : name === 'site' ? 'map' : 'more') : name;
    this.paintTabs(tabName);
    const views = { field, queue, collection, find: detail, trips, stats, more, map: mapview, site: sitedetail, trip: tripdetail };
    await (views[name] || field).render(main, args);
  },

  rerender() { router.go(router.parse().join('/') || 'field'); const p = router.parse(); this.route(p[0] || 'field', p.slice(1)); },

  /* Everything after the gate. Split out of boot() so the gate can call it
     without a reload — and so deleting the gate later is one line, not surgery. */
  /* Offline is not a nicety here — the app is used in places with no bars, and
     without a service worker some platforms need one online load per session
     before they will open an installed PWA at all. */
  registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost'
        && location.hostname !== '127.0.0.1') return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  },

  /* Ask the browser to stop treating this origin as evictable. Photos are the
     bulk of the data and the browser will clear "best effort" storage under
     pressure without asking — losing a season of finds. Asked once, on the
     first find, because a permission prompt before anything exists reads as a
     shakedown and gets denied. */
  async askPersist() {
    if (!navigator.storage || !navigator.storage.persist) return;
    if (await settings.get('persistAsked')) return;
    const finds = (await db.all('finds')).filter(f => !f.deleted);
    if (!finds.length) return;
    await settings.set('persistAsked', true);
    try {
      const already = navigator.storage.persisted && await navigator.storage.persisted();
      if (already) return;
      const ok = await navigator.storage.persist();
      if (ok) toast('This device will keep your finds');
    } catch (e) { /* not supported: nothing to do, and nothing to say about it */ }
  },

  async start() {
    await dbOpen();
    await settings.load();
    this.registerSW();
    bus.on('finds-changed', () => this.askPersist());
    for (const name of ['field', 'queue', 'collection', 'find', 'trips', 'stats', 'map', 'site', 'trip'])
      router.add(name, args => this.route(name, args));
    bus.on('finds-changed', () => this.updateBadge());
    router.add('more', args => this.route('more', args));
    router.start();
    welcome.show();
  },

  async boot() {
    if (!devgate.unlocked) { devgate.render(); return; }
    await this.start();
  }
};

if (typeof document !== 'undefined' && document.readyState !== 'loading') app.boot();
else if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', () => app.boot());

</script>
