<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stephen Furpahs · SWS Strategic Media</title>
<meta name="theme-color" content="#0a0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d10;
    --emerald:#46b98c;
    --steel:#7fa3c9;
    --gold:#d9a441;
    --ink:#f4f1ea;
    --muted:#9aa7ae;
    --faint:#7d878d;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%;}

  body{
    min-height:100dvh;
    height:100dvh;
    overflow:hidden;
    display:grid;
    place-items:center;
    padding:clamp(14px,4vw,26px);
    background:
      radial-gradient(115% 80% at 50% -8%, #101820 0%, transparent 55%),
      radial-gradient(90% 70% at 50% 112%, #0c1512 0%, transparent 55%),
      #07090b;
    font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    position:relative;
  }

  /* ---- Aurora glow behind the card ---- */
  body::before{
    content:"";
    position:fixed;
    inset:-20%;
    z-index:0;
    background:
      radial-gradient(38% 30% at 24% 22%, rgba(70,185,140,0.34), transparent 70%),
      radial-gradient(42% 34% at 82% 30%, rgba(127,163,201,0.30), transparent 72%),
      radial-gradient(46% 40% at 62% 96%, rgba(217,164,65,0.20), transparent 70%);
    filter:blur(38px) saturate(1.05);
    opacity:0.9;
    animation:auroraDrift 22s ease-in-out infinite alternate;
    pointer-events:none;
  }

  @keyframes auroraDrift{
    0%{transform:translate3d(-1.5%,1%,0) scale(1);}
    50%{transform:translate3d(2%,-2%,0) scale(1.07);}
    100%{transform:translate3d(1%,1.5%,0) scale(1.03);}
  }

  /* ---- Gradient hairline frame ---- */
  .frame{
    position:relative;
    z-index:1;
    width:100%;
    max-width:366px;
    border-radius:clamp(24px,6.5vw,30px);
    padding:1.4px;
    background:linear-gradient(150deg,
      rgba(70,185,140,0.92) 0%,
      rgba(127,163,201,0.85) 46%,
      rgba(217,164,65,0.90) 100%);
    box-shadow:
      0 34px 80px -30px rgba(0,0,0,0.85),
      0 4px 22px -8px rgba(70,185,140,0.18);
  }

  .card{
    position:relative;
    border-radius:calc(clamp(24px,6.5vw,30px) - 1.4px);
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(127,163,201,0.06), transparent 60%),
      linear-gradient(172deg,#151c22 0%,#0f151a 55%,#0b1013 100%);
    overflow:hidden;
    padding:clamp(24px,6.4vw,32px) clamp(20px,5.8vw,28px) clamp(18px,4.8vw,24px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), inset 0 0 60px rgba(0,0,0,0.35);
  }
  /* top sheen */
  .card::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:46%;
    background:linear-gradient(180deg, rgba(255,255,255,0.055), transparent);
    pointer-events:none;
  }
  .card > *{position:relative;z-index:1;}

  .eyebrow{
    font-size:clamp(10px,2.6vw,11.5px);
    font-weight:500;
    letter-spacing:0.34em;
    text-indent:0.34em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0.92;
    margin-bottom:clamp(16px,4.4vw,22px);
  }

  /* ---- Headshot ---- */
  .avatar{
    position:relative;
    width:clamp(108px,29vw,130px);
    aspect-ratio:1;
    border-radius:50%;
    margin-bottom:clamp(15px,4vw,20px);
    box-shadow:
      0 0 0 1.5px rgba(70,185,140,0.95),
      0 0 0 6px rgba(70,185,140,0.06),
      0 14px 34px -12px rgba(70,185,140,0.30);
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
    filter:contrast(1.04) saturate(0.96) brightness(1.02);
  }
  /* subtle top light + bottom depth on the photo */
  .avatar::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.10), transparent 34%, rgba(6,10,12,0.30) 100%);
    pointer-events:none;
  }

  .name{
    font-family:"Fraunces",Georgia,serif;
    font-optical-sizing:auto;
    font-variation-settings:"opsz" 120;
    font-weight:500;
    font-size:clamp(29px,8.4vw,39px);
    line-height:1.02;
    letter-spacing:-0.012em;
    color:var(--ink);
    text-shadow:0 1px 18px rgba(0,0,0,0.35);
  }

  .title{
    margin-top:clamp(6px,1.8vw,9px);
    font-size:clamp(12.5px,3.3vw,14px);
    font-weight:500;
    letter-spacing:0.015em;
    color:var(--muted);
  }

  .rule{
    width:clamp(40px,11vw,52px);
    height:1px;
    margin:clamp(15px,4vw,20px) 0;
    background:linear-gradient(90deg, transparent, rgba(217,164,65,0.7), transparent);
  }

  /* ---- Value lines ---- */
  .values{
    display:flex;
    flex-direction:column;
    gap:clamp(11px,3vw,15px);
    width:100%;
  }
  .value .label{
    font-size:clamp(14px,3.7vw,15.5px);
    font-weight:600;
    letter-spacing:0.005em;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .value .label::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:currentColor;
    box-shadow:0 0 9px currentColor;
    flex:none;
  }
  .value.ap .label{color:var(--emerald);}
  .value.sw .label{color:var(--steel);}
  .value .desc{
    margin-top:3px;
    font-size:clamp(11.5px,3vw,12.5px);
    font-weight:400;
    line-height:1.36;
    color:var(--faint);
  }

  /* ---- Footer: QR + contact ---- */
  .footer{
    width:100%;
    margin-top:clamp(17px,4.6vw,22px);
    padding-top:clamp(15px,4vw,19px);
    border-top:1px solid rgba(255,255,255,0.075);
    display:flex;
    align-items:center;
    gap:clamp(12px,3.6vw,16px);
    text-align:left;
  }
  .qr{
    flex:none;
    width:clamp(68px,18.5vw,82px);
    aspect-ratio:1;
    background:#f6f4ee;
    border-radius:14px;
    padding:6px;
    box-shadow:0 6px 18px -6px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.05);
  }
  .qr img{width:100%;height:100%;display:block;border-radius:4px;}

  .contact{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
    flex:1;
  }
  .qr-caption{
    font-size:clamp(9px,2.4vw,10px);
    font-weight:500;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--faint);
  }
  .contact a{
    font-size:clamp(12px,3.2vw,13px);
    font-weight:500;
    color:#dde5ea;
    text-decoration:none;
    letter-spacing:0.005em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:color .18s ease;
  }
  .contact a.phone{letter-spacing:0.02em;}
  .contact a:hover{color:var(--emerald);}

  @media (prefers-reduced-motion: reduce){
    body::before{animation:none;}
  }
</style>
</head>
<body>
  <main class="frame">
    <div class="card">
      <div class="eyebrow">SWS Strategic Media</div>

      <div class="avatar">
        <img src="/stephen-headshot.jpg" alt="Stephen Furpahs">
      </div>

      <h1 class="name">Stephen Furpahs</h1>
      <div class="title">Founder&nbsp; · &nbsp;Akron, Ohio</div>

      <div class="rule"></div>

      <div class="values">
        <div class="value ap">
          <div class="label">SWS Attention Protocol</div>
          <div class="desc">Receipts that prove a real person did the activity</div>
        </div>
        <div class="value sw">
          <div class="label">Sky Wolf Studio</div>
          <div class="desc">Apps and browser games</div>
        </div>
      </div>

      <div class="footer">
        <div class="qr">
          <img src="/qr-code.png" alt="QR code linking to full card and contact">
        </div>
        <div class="contact">
          <div class="qr-caption">Scan for full card and contact</div>
          <a class="phone" href="tel:+12342579376">234-257-9376</a>
          <a class="email" href="mailto:stephenfurpahs@gmail.com">stephenfurpahs@gmail.com</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Optional: keep screen awake while showing the card (best-effort, no-op if unsupported).
    (async () => {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (_) {}
    })();
  </script>
</body>
</html>
