<style>
  :root {
    --bg:#0c0f11; --ink:#f1f2ee; --sub:#9aa39d; --faint:#6d766f;
    --gold:#d9a441; --emerald:#46b98c; --steel:#7fa3c9;
    --display:"Bricolage Grotesque", Georgia, serif;
    --mono:"Space Mono", ui-monospace, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:
      radial-gradient(560px 340px at 12% 6%, rgba(70,185,140,.14), transparent 60%),
      radial-gradient(520px 360px at 92% 26%, rgba(127,163,201,.12), transparent 60%),
      radial-gradient(600px 460px at 50% 108%, rgba(217,164,65,.10), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:var(--display);
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; overflow:hidden;
    padding:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  }
  .card {
    width:100%; max-width:384px; margin:auto;
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.10); border-radius:30px;
    backdrop-filter:blur(18px) saturate(120%); -webkit-backdrop-filter:blur(18px) saturate(120%);
    box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10);
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:clamp(18px,3vh,28px) clamp(18px,5vw,26px) clamp(16px,2.6vh,24px);
    gap:clamp(9px,1.7vh,16px); position:relative;
  }
  .card::before { content:""; position:absolute; inset:6px; border-radius:24px; border:1px solid rgba(217,164,65,.20); pointer-events:none; }
  .eyebrow { font-family:var(--mono); font-size:clamp(9px,1.4vh,10.5px); letter-spacing:3px; text-transform:uppercase; color:var(--gold); }
  .logo { width:clamp(56px,9vh,78px); height:clamp(56px,9vh,78px); display:flex; align-items:center; justify-content:center; }
  .logo img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
  h1 { font-family:var(--display); font-size:clamp(26px,4.6vh,38px); line-height:.96; letter-spacing:-1px; font-weight:300; }
  h1 b { font-weight:800; }
  .title { font-family:var(--mono); font-size:clamp(9.5px,1.5vh,11.5px); letter-spacing:1.4px; color:var(--sub); text-transform:uppercase; }
  .ventures { display:flex; flex-direction:column; gap:clamp(3px,.7vh,7px); margin-top:clamp(2px,.6vh,5px); }
  .venture .vname { font-family:var(--display); font-weight:700; font-size:clamp(13px,2vh,16px); }
  .venture .vname .n { font-family:var(--mono); font-weight:400; color:var(--gold); font-size:.72em; margin-right:6px; }
  .venture .vdesc { color:var(--sub); font-size:clamp(10.5px,1.55vh,12.5px); font-weight:300; margin-top:0; }
  .qr-wrap { display:flex; flex-direction:column; align-items:center; gap:clamp(6px,1.1vh,10px); }
  .qr { background:#fff; padding:clamp(9px,1.5vh,14px); border-radius:clamp(16px,2.6vh,22px);
        width:clamp(180px,34vh,250px); box-shadow:0 20px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(217,164,65,.35); }
  .qr svg { width:100%; height:auto; display:block; }
  .scan { font-family:var(--mono); font-size:clamp(9px,1.4vh,11px); letter-spacing:2px; text-transform:uppercase; color:var(--faint); }
  .contact { margin-top:clamp(6px,1.1vh,10px); padding-top:clamp(8px,1.4vh,13px); border-top:1px solid rgba(255,255,255,.08); width:100%; }
  .contact a { text-decoration:none; }
  .contact .tel { display:block; color:var(--ink); font-size:clamp(15px,2.3vh,19px); font-weight:700; letter-spacing:.3px; }
  .contact .mail { display:block; color:var(--sub); font-size:clamp(11px,1.65vh,13px); font-weight:300; margin-top:2px; }
</style>

<script>
  // Never scroll: if the screen is shorter than the card, scale the card to fit.
  (function () {
    var card = document.querySelector('.card');
    function fit() {
      card.style.transform = '';
      var free = document.documentElement.clientHeight - 28;
      var s = Math.min(1, free / card.offsetHeight);
      if (s < 1) card.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    window.addEventListener('load', fit);
    fit();
  })();
  if ('wakeLock' in navigator) { const g=()=>navigator.wakeLock.request('screen').catch(()=>{}); g(); document.addEventListener('visibilitychange',()=>{if(!document.hidden)g();}); }
</script>
